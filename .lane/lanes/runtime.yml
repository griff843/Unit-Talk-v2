schema_version: 1
lane_id: runtime
lane_type: runtime
allowed_path_globs:
  - apps/api/**
  - apps/alert-agent/**
  - apps/ingestor/**
  - apps/worker/**
  - packages/alert-runtime/**
  - packages/config/**
  - packages/events/**
  - packages/intelligence/**
  - packages/observability/**
  - scripts/**
  - .env.example
  - .env.container.example
  - docs/05_operations/PROVIDER_KNOWLEDGE_BASE.md
  - docs/05_operations/QUEUE_READINESS_SEMANTICS.md
  # UTV2-1796: a runtime lane that adds a credentialed live-DB test MUST also
  # register it in db-writer-classification.json -- `Require live-DB proof for
  # runtime changes` fails the PR otherwise. That file sits under
  # docs/05_operations/**, which only the governance lane admits, so no lane
  # type could legally carry a new live-DB test at all. Admitted as one exact
  # file, in the same narrow form as promotion.ts and smart-form.ts above:
  # an admission correction, not a taxonomy change, and deliberately NOT a
  # docs/05_operations/** glob.
  - docs/05_operations/db-writer-classification.json
  - .ops/sync/**
  - docs/06_status/lanes/**
  - packages/db/src/**
  - packages/contracts/src/promotion.ts
  # UTV2-1671: the Smart Form Track Only contract module and the barrel that
  # re-exports it are consumed by apps/api runtime code, but appeared in no
  # lane type's allowlist, so every lane carrying the runtime change failed
  # Lane Authority with `outside_allowed_paths` and no lane type could legally
  # carry it. Admitted as two exact files, in the same narrow form as
  # `promotion.ts` above. Admission correction only -- no taxonomy change, no
  # executor-policy change, and deliberately NOT a `packages/contracts/src/**`
  # glob: every other contract module stays outside this lane.
  - packages/contracts/src/smart-form.ts
  - packages/contracts/src/index.ts
  - .lane/lanes/**
  - .github/workflows/**
  - deploy/production/**
  - docs/06_status/proof/**
  - docs/06_status/readiness/**
  - package.json
forbidden_path_globs:
  - supabase/migrations/**
  - database/migrations/**
  - packages/**/database.types.ts
  - packages/domain/src/**
required_proof_artifacts:
  - diff-summary.md
  - verification.md
  - runtime-health.json
ci_requirements:
  - pnpm verify
merge_policy: Requires green verify and no active overlapping lane manifest.
concurrency_notes: May run beside non-overlapping UI, verification, and hygiene lanes.
codex_guidance: |
  Use this lane type for any change to apps/api/src/** (including test files).
  Proof files must be .md (not .log) — runtime-verifier-gate ignores non-.md files.
  Proof file must contain a ## Verification section header (not ## Commands).
  Proof file must explicitly mention "pnpm type-check" and "pnpm test".
