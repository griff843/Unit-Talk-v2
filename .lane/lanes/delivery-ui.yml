schema_version: 1
lane_id: delivery-ui
lane_type: delivery-ui
allowed_path_globs:
  - apps/command-center/**
  - apps/discord-bot/**
  - apps/smart-form/**
  - apps/qa-agent/**
  # UTV2-1715: apps/web is the public member-facing site and lives on `main`,
  # but it appeared in no lane type's allowlist at all, so every lane touching
  # it failed Lane Authority with `outside_allowed_paths` and no lane type
  # could legally carry the change. It is a delivery surface like the others
  # above. Admission correction only -- no taxonomy change, and `max_per_app`
  # still caps concurrency at one lane per app.
  - apps/web/**
  - scripts/**
  - .ops/sync/**
  - docs/06_status/lanes/**
  - docs/06_status/proof/**
forbidden_path_globs:
  - supabase/migrations/**
  - database/migrations/**
  - packages/**/database.types.ts
  - apps/worker/**
required_proof_artifacts:
  - diff-summary.md
  - verification.md
  - screenshot-desktop.png
  - screenshot-mobile.png
ci_requirements:
  - pnpm verify
  - pnpm --filter @unit-talk/smart-form verify
merge_policy: Requires UI verification evidence for user-visible changes.
concurrency_notes: May run beside backend lanes when shared contracts are untouched.
