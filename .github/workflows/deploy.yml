name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Container image tag to deploy. Defaults to the workflow SHA.'
        required: false
        type: string
      rollback_tag:
        description: 'Optional previous image tag to restore if deployment fails.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/griff843/unit-talk-v2
  DEPLOY_HOST: ${{ secrets.UNIT_TALK_DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.UNIT_TALK_DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.UNIT_TALK_DEPLOY_PATH }}
  DEPLOY_HEALTH_URL: ${{ secrets.UNIT_TALK_DEPLOY_HEALTH_URL }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      syndicate_machine_mode: ${{ steps.syndicate-mode.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production secret inventory
        id: syndicate-mode
        env:
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SECRET_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SECRET_DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SECRET_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          SECRET_UNIT_TALK_BOT_API_KEY: ${{ secrets.UNIT_TALK_BOT_API_KEY }}
          SECRET_UNIT_TALK_INGESTOR_API_KEY: ${{ secrets.UNIT_TALK_INGESTOR_API_KEY }}
          SECRET_SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          SECRET_UNIT_TALK_DEPLOY_HOST: ${{ secrets.UNIT_TALK_DEPLOY_HOST }}
          SECRET_UNIT_TALK_DEPLOY_SSH_KEY: ${{ secrets.UNIT_TALK_DEPLOY_SSH_KEY }}
          SECRET_SYNDICATE_MACHINE_ENABLED: ${{ secrets.SYNDICATE_MACHINE_ENABLED }}
          SECRET_CADDY_DOMAIN: ${{ secrets.CADDY_DOMAIN }}
          SECRET_UNIT_TALK_WEB_DOMAIN: ${{ secrets.UNIT_TALK_WEB_DOMAIN }}
          SECRET_UNIT_TALK_SMART_FORM_DOMAIN: ${{ secrets.UNIT_TALK_SMART_FORM_DOMAIN }}
          SECRET_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          SECRET_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SECRET_NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          SECRET_ALLOWED_CAPPER_EMAILS: ${{ secrets.ALLOWED_CAPPER_EMAILS }}
        run: |
          missing=()
          test -n "$SECRET_SUPABASE_URL"              || missing+=(SUPABASE_URL)
          test -n "$SECRET_SUPABASE_ANON_KEY"         || missing+=(SUPABASE_ANON_KEY)
          test -n "$SECRET_SUPABASE_SERVICE_ROLE_KEY" || missing+=(SUPABASE_SERVICE_ROLE_KEY)
          test -n "$SECRET_DISCORD_BOT_TOKEN"         || missing+=(DISCORD_BOT_TOKEN)
          test -n "$SECRET_DISCORD_CLIENT_ID"         || missing+=(DISCORD_CLIENT_ID)
          test -n "$SECRET_UNIT_TALK_BOT_API_KEY"     || missing+=(UNIT_TALK_BOT_API_KEY)
          test -n "$SECRET_UNIT_TALK_INGESTOR_API_KEY" || missing+=(UNIT_TALK_INGESTOR_API_KEY)
          test -n "$SECRET_SGO_API_KEY"              || missing+=(SGO_API_KEY)
          test -n "$SECRET_UNIT_TALK_DEPLOY_HOST"    || missing+=(UNIT_TALK_DEPLOY_HOST)
          test -n "$SECRET_UNIT_TALK_DEPLOY_SSH_KEY" || missing+=(UNIT_TALK_DEPLOY_SSH_KEY)
          test -n "$SECRET_SYNDICATE_MACHINE_ENABLED" || missing+=(SYNDICATE_MACHINE_ENABLED)
          # UTV2-1795: the Next.js surfaces fail closed on absent server-side
          # configuration. A deploy that cannot name its own hostnames, cannot
          # complete a Google sign-in, or has no capper allow-list must not
          # reach the server at all -- shipping it would either crash-loop the
          # edge or, worse, stand up an intake surface nobody can be admitted to
          # while looking healthy.
          test -n "$SECRET_CADDY_DOMAIN"                  || missing+=(CADDY_DOMAIN)
          test -n "$SECRET_UNIT_TALK_WEB_DOMAIN"          || missing+=(UNIT_TALK_WEB_DOMAIN)
          test -n "$SECRET_UNIT_TALK_SMART_FORM_DOMAIN"   || missing+=(UNIT_TALK_SMART_FORM_DOMAIN)
          test -n "$SECRET_GOOGLE_CLIENT_ID"              || missing+=(GOOGLE_CLIENT_ID)
          test -n "$SECRET_GOOGLE_CLIENT_SECRET"          || missing+=(GOOGLE_CLIENT_SECRET)
          test -n "$SECRET_NEXTAUTH_SECRET"               || missing+=(NEXTAUTH_SECRET)
          test -n "$SECRET_ALLOWED_CAPPER_EMAILS"         || missing+=(ALLOWED_CAPPER_EMAILS)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Required production secrets are not configured: ${missing[*]}"
            exit 1
          fi
          case "$SECRET_SYNDICATE_MACHINE_ENABLED" in
            true) syndicate_machine_mode=active ;;
            false) syndicate_machine_mode=parked ;;
            *)
              echo "::error::SYNDICATE_MACHINE_ENABLED must be exactly 'true' (active) or 'false' (parked)."
              exit 1
              ;;
          esac
          echo "mode=$syndicate_machine_mode" >> "$GITHUB_OUTPUT"
          echo "{\"service\":\"deploy\",\"event\":\"syndicate_machine_mode.validated\",\"mode\":\"$syndicate_machine_mode\"}"
          echo "All required production secrets are present."

      - name: Create CI local.env (dev defaults + Supabase — required for t1-proof tests)
        run: |
          cat .env.example > local.env
          cat <<'EOF' >> local.env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EOF

      # UTV2-1288 deploy hotfix (PM-approved 2026-06-22): pre-deploy gate validates
      # STATIC correctness/buildability only. Live-DB T1 proof is enforced pre-merge by
      # the T1 Proof Gate (fail-closed for tier:T1); re-running the full live-DB suite
      # here is redundant and amplifies an active Supabase write-path degradation
      # (see UTV2-1290/1291/1292). This does NOT weaken T1: nothing merges to main
      # without live proof; the deploy gate is post-merge operational validation.
      - name: Run test suite (dev env — static correctness gate before gate env is written)
        run: pnpm verify:static

      - name: Write deploy gate env
        run: |
          cat <<'EOF' > local.env
          NODE_ENV=production
          UNIT_TALK_APP_ENV=production
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UNIT_TALK_API_RUNTIME_MODE=fail_closed
          UNIT_TALK_INGESTOR_RUNTIME_MODE=fail_closed
          UNIT_TALK_WORKER_RUNTIME_MODE=fail_closed
          UNIT_TALK_DISCORD_BOT_RUNTIME_MODE=fail_closed
          UNIT_TALK_INGESTOR_AUTORUN=true
          UNIT_TALK_INGESTOR_MAX_CYCLES=0
          UNIT_TALK_WORKER_AUTORUN=true
          UNIT_TALK_WORKER_MAX_CYCLES=0
          UNIT_TALK_WORKER_ADAPTER=discord
          UNIT_TALK_WORKER_DRY_RUN=false
          DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
          UNIT_TALK_BOT_API_KEY=${{ secrets.UNIT_TALK_BOT_API_KEY }}
          UNIT_TALK_INGESTOR_API_KEY=${{ secrets.UNIT_TALK_INGESTOR_API_KEY }}
          SGO_API_KEY=${{ secrets.SGO_API_KEY }}
          SYNDICATE_MACHINE_ENABLED=${{ steps.syndicate-mode.outputs.mode == 'active' && 'true' || 'false' }}
          EOF

      - name: Validate progressive delivery contract
        run: npx tsx scripts/deploy-check.ts --skip-verify

  rollback-dry-run:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate rollback dry-run
        run: bash deploy/rollback.sh --dry-run --tag "${{ inputs.rollback_tag || github.sha }}"

  build:
    needs: [verify, rollback-dry-run]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, ingestor, discord-bot]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ inputs.image_tag || github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            UNIT_TALK_GIT_SHA=${{ github.sha }}
            UNIT_TALK_BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp }}

  # UTV2-1795: the Next.js surfaces build from their own shared Dockerfile
  # rather than a target in the root Dockerfile. They are a separate job, not
  # extra entries in the `build` matrix, because they use a different context
  # file and a different build-arg shape -- folding them in would have meant
  # branching inside the matrix step.
  build-nextjs:
    needs: [verify, rollback-dry-run]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            app_dir: apps/web
            app_package: '@unit-talk/web'
            app_port: '4200'
          - service: smart-form
            app_dir: apps/smart-form
            app_package: '@unit-talk/smart-form'
            app_port: '4400'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require a public API origin at build time
        env:
          CADDY_DOMAIN: ${{ secrets.CADDY_DOMAIN }}
        run: |
          set -euo pipefail
          # Next.js substitutes NEXT_PUBLIC_* during `next build`, so an absent
          # value here is not a runtime problem to fix later -- it is permanently
          # compiled into the browser bundle as the 127.0.0.1 fallback.
          if [ -z "${CADDY_DOMAIN:-}" ]; then
            echo "::error title=Missing API origin::CADDY_DOMAIN is required to build the Next.js images; without it the browser bundle would ship its http://127.0.0.1:4000 fallback." >&2
            exit 1
          fi
          echo "API origin resolved for build."

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/production/Dockerfile.nextjs
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ inputs.image_tag || github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            APP_DIR=${{ matrix.app_dir }}
            APP_PACKAGE=${{ matrix.app_package }}
            APP_PORT=${{ matrix.app_port }}
            NEXT_PUBLIC_API_BASE_URL=https://${{ secrets.CADDY_DOMAIN }}
            UNIT_TALK_GIT_SHA=${{ github.sha }}
            UNIT_TALK_BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp }}

  canary:
    name: Canary deploy
    needs: [build, build-nextjs, verify]
    runs-on: ubuntu-latest
    environment: canary
    # UTV2-1648: this job only ever needs to pull images build already pushed
    # -- never write/push. Overrides the workflow-level packages:write default.
    permissions:
      contents: read
      packages: read
    outputs:
      syndicate_machine_mode: ${{ needs.verify.outputs.syndicate_machine_mode }}
    env:
      SYNDICATE_MACHINE_MODE: ${{ needs.verify.outputs.syndicate_machine_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_HEALTH_URL"

      - name: Install SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.UNIT_TALK_DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Write .env.production to server
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_CAPPER_ROLE_ID: ${{ secrets.DISCORD_CAPPER_ROLE_ID }}
          DISCORD_VIP_ROLE_ID: ${{ secrets.DISCORD_VIP_ROLE_ID }}
          DISCORD_VIP_PLUS_ROLE_ID: ${{ secrets.DISCORD_VIP_PLUS_ROLE_ID }}
          DISCORD_CAPPER_CHANNEL_ID: ${{ secrets.DISCORD_CAPPER_CHANNEL_ID }}
          DISCORD_OPERATOR_ROLE_ID: ${{ secrets.DISCORD_OPERATOR_ROLE_ID }}
          UNIT_TALK_BOT_API_KEY: ${{ secrets.UNIT_TALK_BOT_API_KEY }}
          UNIT_TALK_INGESTOR_API_KEY: ${{ secrets.UNIT_TALK_INGESTOR_API_KEY }}
          UNIT_TALK_DISTRIBUTION_TARGETS: ${{ secrets.UNIT_TALK_DISTRIBUTION_TARGETS }}
          UNIT_TALK_DISCORD_TARGET_MAP: ${{ secrets.UNIT_TALK_DISCORD_TARGET_MAP }}
          UNIT_TALK_ENABLED_TARGETS: ${{ secrets.UNIT_TALK_ENABLED_TARGETS }}
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          SGO_API_KEY_FALLBACK: ${{ secrets.SGO_API_KEY_FALLBACK }}
          CADDY_DOMAIN: ${{ secrets.CADDY_DOMAIN }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          UNIT_TALK_OPS_ALERT_WEBHOOK_URL: ${{ secrets.UNIT_TALK_OPS_ALERT_WEBHOOK_URL }}
          BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          # UTV2-1646: parked mode must fully stop provider-derived producers and
          # public delivery, not just the API's own schedulers (SYNDICATE_MACHINE_ENABLED).
          # These four vars used to be hardcoded literals regardless of mode; a parked
          # deploy still left the ingestor polling live SGO/Odds APIs and the worker
          # able to claim/deliver any outbox row not separately kill-switched.
          case "$SYNDICATE_MACHINE_MODE" in
            active)
              SYNDICATE_MACHINE_ENABLED=true
              _ingestor_autorun=true
              _ingestor_scheduling_enabled=true
              _worker_autorun=true
              ;;
            parked)
              SYNDICATE_MACHINE_ENABLED=false
              _ingestor_autorun=false
              _ingestor_scheduling_enabled=false
              _worker_autorun=false
              ;;
            *)
              echo "::error::Validated syndicate-machine mode is missing or invalid for canary deploy."
              exit 1
              ;;
          esac
          # Resolve worker distribution target and promotion target coverage.
          # The worker must cover all *enabled* promotion targets (default: best-bets,
          # trader-insights). When channel secrets aren't configured we disable all
          # promotion targets so coverage check passes and the worker starts cleanly.
          _dist_targets="${UNIT_TALK_DISTRIBUTION_TARGETS:-}"
          _enabled_targets="${UNIT_TALK_ENABLED_TARGETS:-}"
          if [ -z "$_dist_targets" ] && [ -n "${DISCORD_CAPPER_CHANNEL_ID:-}" ]; then
            _dist_targets="discord:${DISCORD_CAPPER_CHANNEL_ID}"
          elif [ -z "$_dist_targets" ]; then
            # No channel IDs configured: use a valid-format placeholder and disable
            # all promotion targets so the target-coverage check doesn't block startup.
            _dist_targets="discord:0"
            [ -z "$_enabled_targets" ] && _enabled_targets="none"
          fi
          # UTV2-1646: parked mode must never resolve to a real target (public delivery
          # must remain impossible), regardless of what UNIT_TALK_ENABLED_TARGETS holds.
          # Active mode keeps its prior fallback semantics unchanged (best-bets when unset).
          if [ "$SYNDICATE_MACHINE_MODE" = "parked" ]; then
            _enabled_targets="none"
          elif [ -z "$_enabled_targets" ]; then
            _enabled_targets="best-bets"
          fi
          _target_map="${UNIT_TALK_DISCORD_TARGET_MAP:-}"
          [ -z "$_target_map" ] && _target_map='{}'
          # Discord bot requires non-empty strings for guild/role/channel IDs.
          # Use "0" as a placeholder when secrets aren't configured so the bot starts
          # instead of crash-looping; deliveries to placeholder IDs will fail gracefully.
          # apps/smart-form/auth.ts signs the capper bearer with NEXTAUTH_SECRET and
          # apps/api/src/auth.ts verifies it with UNIT_TALK_JWT_SECRET. They are the
          # same key by construction here; if it is absent the API would accept no
          # capper token at all, so refuse to write a half-configured environment.
          if [ -z "${NEXTAUTH_SECRET:-}" ]; then
            echo "::error title=Missing capper signing key::NEXTAUTH_SECRET is required; it is also written as UNIT_TALK_JWT_SECRET so the API can verify Smart Form session bearers." >&2
            exit 1
          fi
          _guild_id="${DISCORD_GUILD_ID:-0}"
          _capper_role="${DISCORD_CAPPER_ROLE_ID:-0}"
          _vip_role="${DISCORD_VIP_ROLE_ID:-0}"
          _vip_plus_role="${DISCORD_VIP_PLUS_ROLE_ID:-0}"
          _capper_channel="${DISCORD_CAPPER_CHANNEL_ID:-0}"
          printf '%s\n' \
            "NODE_ENV=production" \
            "UNIT_TALK_APP_ENV=production" \
            "UNIT_TALK_API_URL=http://api:4000" \
            "SUPABASE_URL=$SUPABASE_URL" \
            "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" \
            "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" \
            "UNIT_TALK_API_RUNTIME_MODE=fail_closed" \
            "UNIT_TALK_INGESTOR_RUNTIME_MODE=fail_closed" \
            "UNIT_TALK_WORKER_RUNTIME_MODE=fail_closed" \
            "UNIT_TALK_DISCORD_BOT_RUNTIME_MODE=fail_closed" \
            "UNIT_TALK_API_RATE_LIMIT_STORE=supabase_rpc" \
            "UNIT_TALK_API_RATE_LIMIT_KEY_STRATEGY=authenticated_identity" \
            "UNIT_TALK_INGESTOR_AUTORUN=$_ingestor_autorun" \
            "UNIT_TALK_INGESTOR_MAX_CYCLES=0" \
            "UNIT_TALK_INGESTOR_SCHEDULING_ENABLED=$_ingestor_scheduling_enabled" \
            "UNIT_TALK_INGESTOR_PEAK_POLL_MS=30000" \
            "UNIT_TALK_INGESTOR_OFFPEAK_POLL_MS=300000" \
            "UNIT_TALK_INGESTOR_PEAK_START_HOUR_ET=12" \
            "UNIT_TALK_INGESTOR_PEAK_END_HOUR_ET=24" \
            "UNIT_TALK_INGESTOR_PINNACLE_ONLY_PEAK=true" \
            "UNIT_TALK_WORKER_ID=worker-prod" \
            "UNIT_TALK_WORKER_AUTORUN=$_worker_autorun" \
            "UNIT_TALK_WORKER_MAX_CYCLES=0" \
            "UNIT_TALK_WORKER_ADAPTER=discord" \
            "UNIT_TALK_WORKER_DRY_RUN=false" \
            "UNIT_TALK_DISTRIBUTION_TARGETS=$_dist_targets" \
            "UNIT_TALK_DISCORD_TARGET_MAP=$_target_map" \
            "UNIT_TALK_ENABLED_TARGETS=$_enabled_targets" \
            "DISCORD_BOT_TOKEN=$DISCORD_BOT_TOKEN" \
            "DISCORD_CLIENT_ID=$DISCORD_CLIENT_ID" \
            "DISCORD_GUILD_ID=$_guild_id" \
            "DISCORD_CAPPER_ROLE_ID=$_capper_role" \
            "DISCORD_VIP_ROLE_ID=$_vip_role" \
            "DISCORD_VIP_PLUS_ROLE_ID=$_vip_plus_role" \
            "DISCORD_CAPPER_CHANNEL_ID=$_capper_channel" \
            "DISCORD_OPERATOR_ROLE_ID=${DISCORD_OPERATOR_ROLE_ID:-0}" \
            "UNIT_TALK_BOT_API_KEY=$UNIT_TALK_BOT_API_KEY" \
            "UNIT_TALK_INGESTOR_API_KEY=$UNIT_TALK_INGESTOR_API_KEY" \
            "SGO_API_KEY=$SGO_API_KEY" \
            "SGO_API_KEY_FALLBACK=${SGO_API_KEY_FALLBACK:-}" \
            "SYNDICATE_MACHINE_ENABLED=$SYNDICATE_MACHINE_ENABLED" \
            "UNIT_TALK_GRADING_CRON_AUTORUN=true" \
            "UNIT_TALK_OPS_ALERT_WEBHOOK_URL=${UNIT_TALK_OPS_ALERT_WEBHOOK_URL:-}" \
            "CADDY_DOMAIN=${CADDY_DOMAIN:-}" \
            "UNIT_TALK_JWT_SECRET=$NEXTAUTH_SECRET" \
            "UNIT_TALK_BUILD_TIMESTAMP=${BUILD_TIMESTAMP:-}" \
            "UNIT_TALK_DEPLOYMENT_ID=${IMAGE_TAG:-}" \
            | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
                "cat > '$DEPLOY_PATH/.env.production' && chmod 600 '$DEPLOY_PATH/.env.production' && echo 'env.production written'"

      - name: Upload compose manifest and config files
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp deploy/production/docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"
          scp deploy/production/loki-config.yaml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/loki-config.yaml"
          scp deploy/production/Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/Caddyfile"

      # UTV2-1795: the Next.js surfaces get their own narrow env files instead of
      # sharing .env.production. The public website holds no secret at all, the
      # TLS edge holds only hostnames, and the Google/Auth.js credentials reach
      # exactly one container. Before this, everything with `env_file:
      # .env.production` -- including the public edge -- held the Supabase
      # service-role key, the Discord bot token and the SGO keys.
      #
      # Every value is written from a secret to a 0600 file over ssh. Nothing is
      # echoed, and no value appears in a build arg or an image layer.
      - name: Write Next.js service env files to server
        env:
          CADDY_DOMAIN: ${{ secrets.CADDY_DOMAIN }}
          WEB_DOMAIN: ${{ secrets.UNIT_TALK_WEB_DOMAIN }}
          SMART_FORM_DOMAIN: ${{ secrets.UNIT_TALK_SMART_FORM_DOMAIN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          ALLOWED_CAPPER_EMAILS: ${{ secrets.ALLOWED_CAPPER_EMAILS }}
        run: |
          set -eu
          # Fail closed a second time at the point of use. The verify job checked
          # these, but verify and this job are separated by the whole build, and
          # an env file that is silently short is worse than a refused deploy:
          # an empty ALLOWED_CAPPER_EMAILS admits nobody while the container
          # still reports healthy, and an empty hostname crash-loops Caddy.
          for name in CADDY_DOMAIN WEB_DOMAIN SMART_FORM_DOMAIN \
                      GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET NEXTAUTH_SECRET \
                      ALLOWED_CAPPER_EMAILS; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "::error::$name is empty at deploy time. Refusing to write a partial Next.js configuration."
              exit 1
            fi
          done

          # Hostnames are the single source of truth for the derived URLs, so the
          # Google callback URI cannot drift from the hostname Caddy serves.
          printf '%s\n' \
            "CADDY_DOMAIN=$CADDY_DOMAIN" \
            "UNIT_TALK_WEB_DOMAIN=$WEB_DOMAIN" \
            "UNIT_TALK_SMART_FORM_DOMAIN=$SMART_FORM_DOMAIN" \
            | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
                "cat > '$DEPLOY_PATH/.env.edge' && chmod 600 '$DEPLOY_PATH/.env.edge' && echo 'env.edge written'"

          printf '%s\n' \
            "NODE_ENV=production" \
            "PORT=4200" \
            "NEXT_PUBLIC_API_BASE_URL=https://$CADDY_DOMAIN" \
            "NEXT_PUBLIC_SITE_URL=https://$WEB_DOMAIN" \
            | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
                "cat > '$DEPLOY_PATH/.env.web' && chmod 600 '$DEPLOY_PATH/.env.web' && echo 'env.web written'"

          printf '%s\n' \
            "NODE_ENV=production" \
            "PORT=4400" \
            "NEXTAUTH_URL=https://$SMART_FORM_DOMAIN" \
            "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" \
            "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" \
            "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" \
            "ALLOWED_CAPPER_EMAILS=$ALLOWED_CAPPER_EMAILS" \
            "UNIT_TALK_API_URL=http://api:4000" \
            "NEXT_PUBLIC_API_BASE_URL=https://$CADDY_DOMAIN" \
            | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
                "cat > '$DEPLOY_PATH/.env.smart-form' && chmod 600 '$DEPLOY_PATH/.env.smart-form' && echo 'env.smart-form written'"

          # The QA authentication bypass is never enabled in production. Assert it
          # rather than assume it: a bypass name reaching the server would make the
          # allow-list decorative.
          if ssh "$DEPLOY_USER@$DEPLOY_HOST" \
               "grep -qE '^(NEXT_PUBLIC_)?SMART_FORM_QA_AUTH_BYPASS=' '$DEPLOY_PATH/.env.smart-form'"; then
            echo "::error::A QA auth bypass variable reached the production Smart Form env file."
            exit 1
          fi
          echo "Next.js env files written; QA auth bypass absent."

      # UTV2-1648: replaces the long-lived GHCR_PAT secret. github.token is the
      # same ephemeral, repository-scoped credential `build` already uses to
      # PUSH these exact images -- canary/promote only need to pull, so the
      # same token (read-only via this job's own `permissions:` above) is
      # sufficient and leaves no standing credential to leak or expire.
      - name: Authenticate GHCR on remote
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      # UTV2-1648: verify the remote host can actually resolve every image
      # this stage (and the later promote stage) will need, at the exact
      # requested tag, BEFORE touching any running container. A stale/invalid
      # token or a tag that never got pushed must fail here, not mid-mutation.
      - name: Preflight — verify registry auth and resolve all 6 image tags
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          failed=""
          for svc in api worker ingestor discord-bot web smart-form; do
            if ! ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker pull '$IMAGE_NAMESPACE/$svc:$IMAGE_TAG' >/dev/null 2>&1"; then
              failed="$failed $svc"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Registry preflight failed for tag $IMAGE_TAG -- could not authenticate or resolve:$failed. Aborting before any container mutation."
            exit 1
          fi
          echo "Registry preflight passed: all 6 images resolved for tag $IMAGE_TAG."

      - name: Release API canary
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu && cd '$DEPLOY_PATH' && \
             if [ -f .unit-talk-release ]; then cp .unit-talk-release .unit-talk-release.previous; fi && \
             printf '%s\n' '$IMAGE_TAG' > .unit-talk-release && \
             UNIT_TALK_IMAGE_TAG='$IMAGE_TAG' docker compose pull && \
             UNIT_TALK_IMAGE_TAG='$IMAGE_TAG' docker compose up -d --no-deps api"
          for attempt in $(seq 1 30); do
            if ssh "$DEPLOY_USER@$DEPLOY_HOST" "curl -fsS http://localhost:4000/health >/dev/null 2>&1"; then
              exit 0
            fi
            sleep 10
          done
          if [ -n "$ROLLBACK_TAG" ]; then
            bash deploy/rollback.sh --tag "$ROLLBACK_TAG" --host "$DEPLOY_HOST" --user "$DEPLOY_USER" --path "$DEPLOY_PATH"
          fi
          exit 1

      # UTV2-1618: root cause of a real production incident (2026-08-01) --
      # this step's `docker compose exec` never received UNIT_TALK_IMAGE_TAG,
      # which the production compose file requires (`${UNIT_TALK_IMAGE_TAG:?required}`)
      # for EVERY service, not just the one being released. Compose therefore
      # failed closed before printenv ever ran, and `2>/dev/null || true`
      # silently discarded that failure, misreporting a genuine Compose
      # evaluation error as "the variable is missing at runtime". The API
      # container itself was correctly recreated and healthy the whole time --
      # only this verification step's own evaluation was broken. See
      # scripts/ci/deploy-parked-mode.test.ts for the regression fixture.
      #
      # PM review (Bounce 3) found this step's own capture pattern repeated
      # the class of bug it exists to catch: `OUTPUT=$(ssh ...)` followed by a
      # separate `STATUS=$?` line runs this step under `bash -e`, so a failed
      # ssh/compose call exits before `STATUS=$?` (or any later classification)
      # ever executes -- the deploy still fails closed, but the precise
      # diagnosis never happens. Every ssh capture below now uses
      # `if OUTPUT=$(...); then ... else STATUS=$?; fi` -- a command that is
      # the condition of an `if` is exempt from `set -e` by POSIX/bash
      # definition, so the classification logic is now actually reachable.
      - name: Confirm syndicate machine gate in canary container
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          case "$SYNDICATE_MACHINE_MODE" in
            active) REQUESTED_VALUE=true ;;
            parked) REQUESTED_VALUE=false ;;
            *)
              echo "::error::Validated syndicate-machine mode is missing or invalid for canary readiness."
              exit 1
              ;;
          esac

          # 1. Resolve the exact deployed tag from the host's own release record
          #    (written by "Release API canary" moments earlier) and cross-check
          #    it against what this job resolved -- an independent confirmation
          #    of what actually got deployed, not just what was requested.
          if RELEASE_TAG=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" "cat '$DEPLOY_PATH/.unit-talk-release'" 2>&1); then
            RELEASE_TAG_STATUS=0
          else
            RELEASE_TAG_STATUS=$?
          fi
          if [ "$RELEASE_TAG_STATUS" -ne 0 ] || [ -z "$RELEASE_TAG" ]; then
            echo "::error::Could not read .unit-talk-release from the remote host -- no record of what canary actually deployed. Raw output: $RELEASE_TAG"
            exit 1
          fi
          if [ "$RELEASE_TAG" != "$IMAGE_TAG" ]; then
            echo "::error::Release record mismatch: workflow resolved tag '$IMAGE_TAG' but .unit-talk-release on host records '$RELEASE_TAG'."
            exit 1
          fi

          # 2/3. Every compose evaluation requires UNIT_TALK_IMAGE_TAG -- supply
          # it here exactly as the release step did. No stderr suppression, no
          # `|| true`: a real failure must surface as a real failure.
          if COMPOSE_EXEC_OUTPUT=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && UNIT_TALK_IMAGE_TAG='$IMAGE_TAG' docker compose exec -T api printenv SYNDICATE_MACHINE_ENABLED" 2>&1); then
            COMPOSE_EXEC_STATUS=0
          else
            COMPOSE_EXEC_STATUS=$?
          fi

          # 4. Classify the failure precisely rather than collapsing every
          # non-zero outcome into "variable missing".
          if [ "$COMPOSE_EXEC_STATUS" -ne 0 ]; then
            if printf '%s' "$COMPOSE_EXEC_OUTPUT" | grep -qi "variable is not set\|required"; then
              echo "::error::Compose evaluation failed while confirming the canary container (missing/invalid compose variable): $COMPOSE_EXEC_OUTPUT"
            elif printf '%s' "$COMPOSE_EXEC_OUTPUT" | grep -qi "no such service\|no container found\|is not running"; then
              echo "::error::Canary api service/container could not be resolved: $COMPOSE_EXEC_OUTPUT"
            else
              echo "::error::SYNDICATE_MACHINE_ENABLED is absent in the canary container: $COMPOSE_EXEC_OUTPUT"
            fi
            exit 1
          fi
          VALUE="$COMPOSE_EXEC_OUTPUT"
          if [ "$VALUE" != "$REQUESTED_VALUE" ]; then
            echo "::error::SYNDICATE_MACHINE_ENABLED value mismatch in canary container: requested='$REQUESTED_VALUE' runtime='$VALUE'"
            exit 1
          fi

          # 5. Independent verification via docker inspect + compose labels --
          # resolves the exact running container by its compose project AND
          # service labels (not service alone -- a stray container from a
          # different compose project sharing the service name must never be
          # inspected), rejects the evidence outright if more than one
          # container matches, and reads its real image reference and process
          # environment straight from the Docker daemon. This path needs no
          # compose-file re-evaluation at all, so it can never be broken by
          # the class of bug that caused this incident, and it cross-validates
          # the compose-exec result above rather than replacing it.
          if CIDS=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker ps -q --filter 'label=com.docker.compose.service=api' --filter 'status=running'" 2>&1); then
            CIDS_STATUS=0
          else
            CIDS_STATUS=$?
          fi
          if [ "$CIDS_STATUS" -ne 0 ]; then
            echo "::error::docker-inspect verification: could not list containers for service=api: $CIDS"
            exit 1
          fi
          CID_COUNT=$(printf '%s\n' "$CIDS" | grep -c . || true)
          if [ "$CID_COUNT" -eq 0 ]; then
            echo "::error::docker-inspect verification: no running container found with compose label service=api."
            exit 1
          fi
          if [ "$CID_COUNT" -gt 1 ]; then
            echo "::error::docker-inspect verification: found $CID_COUNT containers labeled service=api -- expected exactly one, evidence is ambiguous."
            exit 1
          fi
          CID="$CIDS"

          if INSPECT_PROJECT=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker inspect --format '{{index .Config.Labels \"com.docker.compose.project\"}}' '$CID'" 2>&1); then
            INSPECT_PROJECT_STATUS=0
          else
            INSPECT_PROJECT_STATUS=$?
          fi
          if [ "$INSPECT_PROJECT_STATUS" -ne 0 ] || [ -z "$INSPECT_PROJECT" ]; then
            echo "::error::docker-inspect verification: could not read compose project label from $CID: $INSPECT_PROJECT"
            exit 1
          fi

          # Re-resolve the container filtered by BOTH service and the project
          # label just read -- binding the evidence to one exact compose
          # project, not merely re-reading a label off whatever container the
          # first unfiltered lookup happened to find.
          if CIDS_BOUND=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker ps -q --filter 'label=com.docker.compose.service=api' --filter 'label=com.docker.compose.project=$INSPECT_PROJECT' --filter 'status=running'" 2>&1); then
            CIDS_BOUND_STATUS=0
          else
            CIDS_BOUND_STATUS=$?
          fi
          if [ "$CIDS_BOUND_STATUS" -ne 0 ]; then
            echo "::error::docker-inspect verification: could not re-resolve service=api within project=$INSPECT_PROJECT: $CIDS_BOUND"
            exit 1
          fi
          CID_BOUND_COUNT=$(printf '%s\n' "$CIDS_BOUND" | grep -c . || true)
          if [ "$CID_BOUND_COUNT" -ne 1 ] || [ "$CIDS_BOUND" != "$CID" ]; then
            echo "::error::docker-inspect verification: service=api within project=$INSPECT_PROJECT did not resolve to exactly the same single container (found $CID_BOUND_COUNT) -- evidence is ambiguous."
            exit 1
          fi

          if INSPECT_IMAGE=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker inspect --format '{{.Config.Image}}' '$CID'" 2>&1); then
            INSPECT_IMAGE_STATUS=0
          else
            INSPECT_IMAGE_STATUS=$?
          fi
          if [ "$INSPECT_IMAGE_STATUS" -ne 0 ]; then
            echo "::error::docker-inspect: could not read image reference for $CID: $INSPECT_IMAGE"
            exit 1
          fi
          EXPECTED_IMAGE="$IMAGE_NAMESPACE/api:$IMAGE_TAG"
          if [ "$INSPECT_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "::error::docker-inspect image mismatch: container reports '$INSPECT_IMAGE', requested '$EXPECTED_IMAGE'."
            exit 1
          fi

          if INSPECT_ENV=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' '$CID'" 2>&1); then
            INSPECT_ENV_STATUS=0
          else
            INSPECT_ENV_STATUS=$?
          fi
          if [ "$INSPECT_ENV_STATUS" -ne 0 ]; then
            echo "::error::docker-inspect: could not read process environment for $CID: $INSPECT_ENV"
            exit 1
          fi
          INSPECT_SYNDICATE=$(printf '%s\n' "$INSPECT_ENV" | grep '^SYNDICATE_MACHINE_ENABLED=' | head -1 | cut -d= -f2-)
          if [ -z "$INSPECT_SYNDICATE" ]; then
            echo "::error::docker-inspect: SYNDICATE_MACHINE_ENABLED is absent from the container's process environment (compose project '$INSPECT_PROJECT', image '$INSPECT_IMAGE')."
            exit 1
          fi
          if [ "$INSPECT_SYNDICATE" != "$REQUESTED_VALUE" ]; then
            echo "::error::docker-inspect value mismatch: requested='$REQUESTED_VALUE' actual='$INSPECT_SYNDICATE' (compose project '$INSPECT_PROJECT', image '$INSPECT_IMAGE')."
            exit 1
          fi

          printf '{"service":"deploy","event":"syndicate_machine_mode.confirmed","stage":"canary","mode":"%s","requestedValue":"%s","runtimeValue":"%s","composeExecValue":"%s","inspectValue":"%s","inspectImage":"%s","inspectProject":"%s","releaseTag":"%s"}\n' \
            "$SYNDICATE_MACHINE_MODE" "$REQUESTED_VALUE" "$VALUE" "$VALUE" "$INSPECT_SYNDICATE" "$INSPECT_IMAGE" "$INSPECT_PROJECT" "$RELEASE_TAG"

  promote:
    name: Promote production
    needs: canary
    runs-on: ubuntu-latest
    environment: production
    # UTV2-1648: this job only ever needs to pull images build already pushed
    # -- never write/push. Overrides the workflow-level packages:write default.
    permissions:
      contents: read
      packages: read
    env:
      SYNDICATE_MACHINE_MODE: ${{ needs.canary.outputs.syndicate_machine_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_HEALTH_URL"

      - name: Install SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.UNIT_TALK_DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Write .env.production to server
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_CAPPER_ROLE_ID: ${{ secrets.DISCORD_CAPPER_ROLE_ID }}
          DISCORD_VIP_ROLE_ID: ${{ secrets.DISCORD_VIP_ROLE_ID }}
          DISCORD_VIP_PLUS_ROLE_ID: ${{ secrets.DISCORD_VIP_PLUS_ROLE_ID }}
          DISCORD_CAPPER_CHANNEL_ID: ${{ secrets.DISCORD_CAPPER_CHANNEL_ID }}
          DISCORD_OPERATOR_ROLE_ID: ${{ secrets.DISCORD_OPERATOR_ROLE_ID }}
          UNIT_TALK_BOT_API_KEY: ${{ secrets.UNIT_TALK_BOT_API_KEY }}
          UNIT_TALK_INGESTOR_API_KEY: ${{ secrets.UNIT_TALK_INGESTOR_API_KEY }}
          UNIT_TALK_DISTRIBUTION_TARGETS: ${{ secrets.UNIT_TALK_DISTRIBUTION_TARGETS }}
          UNIT_TALK_DISCORD_TARGET_MAP: ${{ secrets.UNIT_TALK_DISCORD_TARGET_MAP }}
          UNIT_TALK_ENABLED_TARGETS: ${{ secrets.UNIT_TALK_ENABLED_TARGETS }}
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          SGO_API_KEY_FALLBACK: ${{ secrets.SGO_API_KEY_FALLBACK }}
          CADDY_DOMAIN: ${{ secrets.CADDY_DOMAIN }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          UNIT_TALK_OPS_ALERT_WEBHOOK_URL: ${{ secrets.UNIT_TALK_OPS_ALERT_WEBHOOK_URL }}
          BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          # UTV2-1646: parked mode must fully stop provider-derived producers and
          # public delivery, not just the API's own schedulers (SYNDICATE_MACHINE_ENABLED).
          # These four vars used to be hardcoded literals regardless of mode; a parked
          # deploy still left the ingestor polling live SGO/Odds APIs and the worker
          # able to claim/deliver any outbox row not separately kill-switched.
          case "$SYNDICATE_MACHINE_MODE" in
            active)
              SYNDICATE_MACHINE_ENABLED=true
              _ingestor_autorun=true
              _ingestor_scheduling_enabled=true
              _worker_autorun=true
              ;;
            parked)
              SYNDICATE_MACHINE_ENABLED=false
              _ingestor_autorun=false
              _ingestor_scheduling_enabled=false
              _worker_autorun=false
              ;;
            *)
              echo "::error::Validated syndicate-machine mode is missing or invalid for production deploy."
              exit 1
              ;;
          esac
          # Resolve worker distribution target and promotion target coverage.
          # The worker must cover all *enabled* promotion targets (default: best-bets,
          # trader-insights). When channel secrets aren't configured we disable all
          # promotion targets so coverage check passes and the worker starts cleanly.
          _dist_targets="${UNIT_TALK_DISTRIBUTION_TARGETS:-}"
          _enabled_targets="${UNIT_TALK_ENABLED_TARGETS:-}"
          if [ -z "$_dist_targets" ] && [ -n "${DISCORD_CAPPER_CHANNEL_ID:-}" ]; then
            _dist_targets="discord:${DISCORD_CAPPER_CHANNEL_ID}"
          elif [ -z "$_dist_targets" ]; then
            # No channel IDs configured: use a valid-format placeholder and disable
            # all promotion targets so the target-coverage check doesn't block startup.
            _dist_targets="discord:0"
            [ -z "$_enabled_targets" ] && _enabled_targets="none"
          fi
          # UTV2-1646: parked mode must never resolve to a real target (public delivery
          # must remain impossible), regardless of what UNIT_TALK_ENABLED_TARGETS holds.
          # Active mode keeps its prior fallback semantics unchanged (best-bets when unset).
          if [ "$SYNDICATE_MACHINE_MODE" = "parked" ]; then
            _enabled_targets="none"
          elif [ -z "$_enabled_targets" ]; then
            _enabled_targets="best-bets"
          fi
          _target_map="${UNIT_TALK_DISCORD_TARGET_MAP:-}"
          [ -z "$_target_map" ] && _target_map='{}'
          # Discord bot requires non-empty strings for guild/role/channel IDs.
          # Use "0" as a placeholder when secrets aren't configured so the bot starts
          # instead of crash-looping; deliveries to placeholder IDs will fail gracefully.
          # apps/smart-form/auth.ts signs the capper bearer with NEXTAUTH_SECRET and
          # apps/api/src/auth.ts verifies it with UNIT_TALK_JWT_SECRET. They are the
          # same key by construction here; if it is absent the API would accept no
          # capper token at all, so refuse to write a half-configured environment.
          if [ -z "${NEXTAUTH_SECRET:-}" ]; then
            echo "::error title=Missing capper signing key::NEXTAUTH_SECRET is required; it is also written as UNIT_TALK_JWT_SECRET so the API can verify Smart Form session bearers." >&2
            exit 1
          fi
          _guild_id="${DISCORD_GUILD_ID:-0}"
          _capper_role="${DISCORD_CAPPER_ROLE_ID:-0}"
          _vip_role="${DISCORD_VIP_ROLE_ID:-0}"
          _vip_plus_role="${DISCORD_VIP_PLUS_ROLE_ID:-0}"
          _capper_channel="${DISCORD_CAPPER_CHANNEL_ID:-0}"
          printf '%s\n' \
            "NODE_ENV=production" \
            "UNIT_TALK_APP_ENV=production" \
            "UNIT_TALK_API_URL=http://api:4000" \
            "SUPABASE_URL=$SUPABASE_URL" \
            "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" \
            "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" \
            "UNIT_TALK_API_RUNTIME_MODE=fail_closed" \
            "UNIT_TALK_INGESTOR_RUNTIME_MODE=fail_closed" \
            "UNIT_TALK_WORKER_RUNTIME_MODE=fail_closed" \
            "UNIT_TALK_DISCORD_BOT_RUNTIME_MODE=fail_closed" \
            "UNIT_TALK_API_RATE_LIMIT_STORE=supabase_rpc" \
            "UNIT_TALK_API_RATE_LIMIT_KEY_STRATEGY=authenticated_identity" \
            "UNIT_TALK_INGESTOR_AUTORUN=$_ingestor_autorun" \
            "UNIT_TALK_INGESTOR_MAX_CYCLES=0" \
            "UNIT_TALK_INGESTOR_SCHEDULING_ENABLED=$_ingestor_scheduling_enabled" \
            "UNIT_TALK_INGESTOR_PEAK_POLL_MS=30000" \
            "UNIT_TALK_INGESTOR_OFFPEAK_POLL_MS=300000" \
            "UNIT_TALK_INGESTOR_PEAK_START_HOUR_ET=12" \
            "UNIT_TALK_INGESTOR_PEAK_END_HOUR_ET=24" \
            "UNIT_TALK_INGESTOR_PINNACLE_ONLY_PEAK=true" \
            "UNIT_TALK_WORKER_ID=worker-prod" \
            "UNIT_TALK_WORKER_AUTORUN=$_worker_autorun" \
            "UNIT_TALK_WORKER_MAX_CYCLES=0" \
            "UNIT_TALK_WORKER_ADAPTER=discord" \
            "UNIT_TALK_WORKER_DRY_RUN=false" \
            "UNIT_TALK_DISTRIBUTION_TARGETS=$_dist_targets" \
            "UNIT_TALK_DISCORD_TARGET_MAP=$_target_map" \
            "UNIT_TALK_ENABLED_TARGETS=$_enabled_targets" \
            "DISCORD_BOT_TOKEN=$DISCORD_BOT_TOKEN" \
            "DISCORD_CLIENT_ID=$DISCORD_CLIENT_ID" \
            "DISCORD_GUILD_ID=$_guild_id" \
            "DISCORD_CAPPER_ROLE_ID=$_capper_role" \
            "DISCORD_VIP_ROLE_ID=$_vip_role" \
            "DISCORD_VIP_PLUS_ROLE_ID=$_vip_plus_role" \
            "DISCORD_CAPPER_CHANNEL_ID=$_capper_channel" \
            "DISCORD_OPERATOR_ROLE_ID=${DISCORD_OPERATOR_ROLE_ID:-0}" \
            "UNIT_TALK_BOT_API_KEY=$UNIT_TALK_BOT_API_KEY" \
            "UNIT_TALK_INGESTOR_API_KEY=$UNIT_TALK_INGESTOR_API_KEY" \
            "SGO_API_KEY=$SGO_API_KEY" \
            "SGO_API_KEY_FALLBACK=${SGO_API_KEY_FALLBACK:-}" \
            "SYNDICATE_MACHINE_ENABLED=$SYNDICATE_MACHINE_ENABLED" \
            "UNIT_TALK_GRADING_CRON_AUTORUN=true" \
            "UNIT_TALK_OPS_ALERT_WEBHOOK_URL=${UNIT_TALK_OPS_ALERT_WEBHOOK_URL:-}" \
            "CADDY_DOMAIN=${CADDY_DOMAIN:-}" \
            "UNIT_TALK_JWT_SECRET=$NEXTAUTH_SECRET" \
            "UNIT_TALK_BUILD_TIMESTAMP=${BUILD_TIMESTAMP:-}" \
            "UNIT_TALK_DEPLOYMENT_ID=${IMAGE_TAG:-}" \
            | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
                "cat > '$DEPLOY_PATH/.env.production' && chmod 600 '$DEPLOY_PATH/.env.production' && echo 'env.production written'"

      # UTV2-1795: the Next.js surfaces get their own narrow env files instead of
      # sharing .env.production. The public website holds no secret at all, the
      # TLS edge holds only hostnames, and the Google/Auth.js credentials reach
      # exactly one container. Before this, everything with `env_file:
      # .env.production` -- including the public edge -- held the Supabase
      # service-role key, the Discord bot token and the SGO keys.
      #
      # Every value is written from a secret to a 0600 file over ssh. Nothing is
      # echoed, and no value appears in a build arg or an image layer.
      - name: Write Next.js service env files to server
        env:
          CADDY_DOMAIN: ${{ secrets.CADDY_DOMAIN }}
          WEB_DOMAIN: ${{ secrets.UNIT_TALK_WEB_DOMAIN }}
          SMART_FORM_DOMAIN: ${{ secrets.UNIT_TALK_SMART_FORM_DOMAIN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          ALLOWED_CAPPER_EMAILS: ${{ secrets.ALLOWED_CAPPER_EMAILS }}
        run: |
          set -eu
          # Fail closed a second time at the point of use. The verify job checked
          # these, but verify and this job are separated by the whole build, and
          # an env file that is silently short is worse than a refused deploy:
          # an empty ALLOWED_CAPPER_EMAILS admits nobody while the container
          # still reports healthy, and an empty hostname crash-loops Caddy.
          for name in CADDY_DOMAIN WEB_DOMAIN SMART_FORM_DOMAIN \
                      GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET NEXTAUTH_SECRET \
                      ALLOWED_CAPPER_EMAILS; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "::error::$name is empty at deploy time. Refusing to write a partial Next.js configuration."
              exit 1
            fi
          done

          # Hostnames are the single source of truth for the derived URLs, so the
          # Google callback URI cannot drift from the hostname Caddy serves.
          printf '%s\n' \
            "CADDY_DOMAIN=$CADDY_DOMAIN" \
            "UNIT_TALK_WEB_DOMAIN=$WEB_DOMAIN" \
            "UNIT_TALK_SMART_FORM_DOMAIN=$SMART_FORM_DOMAIN" \
            | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
                "cat > '$DEPLOY_PATH/.env.edge' && chmod 600 '$DEPLOY_PATH/.env.edge' && echo 'env.edge written'"

          printf '%s\n' \
            "NODE_ENV=production" \
            "PORT=4200" \
            "NEXT_PUBLIC_API_BASE_URL=https://$CADDY_DOMAIN" \
            "NEXT_PUBLIC_SITE_URL=https://$WEB_DOMAIN" \
            | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
                "cat > '$DEPLOY_PATH/.env.web' && chmod 600 '$DEPLOY_PATH/.env.web' && echo 'env.web written'"

          printf '%s\n' \
            "NODE_ENV=production" \
            "PORT=4400" \
            "NEXTAUTH_URL=https://$SMART_FORM_DOMAIN" \
            "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" \
            "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" \
            "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" \
            "ALLOWED_CAPPER_EMAILS=$ALLOWED_CAPPER_EMAILS" \
            "UNIT_TALK_API_URL=http://api:4000" \
            "NEXT_PUBLIC_API_BASE_URL=https://$CADDY_DOMAIN" \
            | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
                "cat > '$DEPLOY_PATH/.env.smart-form' && chmod 600 '$DEPLOY_PATH/.env.smart-form' && echo 'env.smart-form written'"

          # The QA authentication bypass is never enabled in production. Assert it
          # rather than assume it: a bypass name reaching the server would make the
          # allow-list decorative.
          if ssh "$DEPLOY_USER@$DEPLOY_HOST" \
               "grep -qE '^(NEXT_PUBLIC_)?SMART_FORM_QA_AUTH_BYPASS=' '$DEPLOY_PATH/.env.smart-form'"; then
            echo "::error::A QA auth bypass variable reached the production Smart Form env file."
            exit 1
          fi
          echo "Next.js env files written; QA auth bypass absent."

      # UTV2-1648: replaces the long-lived GHCR_PAT secret -- see the matching
      # canary-job comment for the full rationale.
      - name: Authenticate GHCR on remote
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      # UTV2-1648: same pre-mutation registry preflight as the canary job --
      # this job runs on a fresh runner with its own auth, so it needs its own
      # check even though canary already verified moments earlier.
      - name: Preflight — verify registry auth and resolve all 6 image tags
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          failed=""
          for svc in api worker ingestor discord-bot web smart-form; do
            if ! ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker pull '$IMAGE_NAMESPACE/$svc:$IMAGE_TAG' >/dev/null 2>&1"; then
              failed="$failed $svc"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Registry preflight failed for tag $IMAGE_TAG -- could not authenticate or resolve:$failed. Aborting before any container mutation."
            exit 1
          fi
          echo "Registry preflight passed: all 6 images resolved for tag $IMAGE_TAG."

      - name: Promote all production containers
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu && cd '$DEPLOY_PATH' && \
             docker rm -f caddy 2>/dev/null || true && \
             printf '%s\n' '$IMAGE_TAG' > .unit-talk-release && \
             UNIT_TALK_IMAGE_TAG='$IMAGE_TAG' docker compose pull && \
             UNIT_TALK_IMAGE_TAG='$IMAGE_TAG' docker compose up -d --remove-orphans"
          for attempt in $(seq 1 30); do
            if ssh "$DEPLOY_USER@$DEPLOY_HOST" "curl -fsS http://localhost:4000/health >/dev/null 2>&1"; then
              exit 0
            fi
            sleep 10
          done
          if [ -n "$ROLLBACK_TAG" ]; then
            bash deploy/rollback.sh --tag "$ROLLBACK_TAG" --host "$DEPLOY_HOST" --user "$DEPLOY_USER" --path "$DEPLOY_PATH"
          fi
          exit 1

      # UTV2-1795: the API health loop above says nothing about the two Next.js
      # surfaces -- they listen on the Docker network only, so `curl localhost`
      # on the host cannot see them. Read each container's own compose
      # healthcheck verdict instead, and fail the deploy if either surface is
      # not healthy. Rolling one back is independent of the other and of the
      # API: `UNIT_TALK_IMAGE_TAG=<previous> docker compose up -d --no-deps web`
      # (or `smart-form`) replaces exactly that container.
      - name: Verify Next.js surfaces are healthy
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          set -eu
          for svc in web smart-form; do
            healthy=""
            for attempt in $(seq 1 30); do
              if status=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
                    "cd '$DEPLOY_PATH' && UNIT_TALK_IMAGE_TAG='$IMAGE_TAG' docker compose ps --format '{{.Service}} {{.Health}}' 2>/dev/null | awk -v s=$svc '\$1==s {print \$2}'"); then
                case "$status" in
                  healthy) healthy="yes"; break ;;
                esac
              fi
              sleep 10
            done
            if [ -z "$healthy" ]; then
              echo "::error::$svc did not report healthy after promotion (last status: ${status:-unknown})."
              exit 1
            fi
            echo "$svc: healthy"
          done

      # UTV2-1618: same root cause and fix as the canary confirm step -- see its
      # comment header for the full incident account. Every docker compose exec
      # here now receives UNIT_TALK_IMAGE_TAG, failures are classified instead of
      # collapsed, and each variable is independently cross-checked via docker
      # inspect + compose labels rather than trusting compose-exec alone.
      #
      # PM review (Bounce 3), three findings, all addressed below:
      #   - every ssh capture now uses `if VAR=$(...); then STATUS=0; else
      #     STATUS=$?; fi` -- a plain `VAR=$(...)` followed by `STATUS=$?` runs
      #     under `bash -e` and exits before `STATUS=$?` is ever reached on
      #     failure, so the classification logic was unreachable.
      #   - UNIT_TALK_ENABLED_TARGETS is now independently verified via
      #     docker-inspect too (parked mode asserts it reads exactly "none"),
      #     not just through compose-exec as before.
      #   - the docker-inspect loop now binds every container lookup to one
      #     specific compose project (established from the API container,
      #     itself release-tag- and image-verified) AND rejects the evidence
      #     outright if more than one container matches service+project, and
      #     verifies each service's exact image tag -- not service-label alone.
      - name: Confirm syndicate machine gate in production container
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          case "$SYNDICATE_MACHINE_MODE" in
            active)
              REQUESTED_VALUE=true
              REQUESTED_INGESTOR_AUTORUN=true
              REQUESTED_INGESTOR_SCHEDULING=true
              REQUESTED_WORKER_AUTORUN=true
              ;;
            parked)
              REQUESTED_VALUE=false
              REQUESTED_INGESTOR_AUTORUN=false
              REQUESTED_INGESTOR_SCHEDULING=false
              REQUESTED_WORKER_AUTORUN=false
              ;;
            *)
              echo "::error::Validated syndicate-machine mode is missing or invalid for production readiness."
              exit 1
              ;;
          esac

          # 1. Cross-check the resolved tag against the host's own release record.
          if RELEASE_TAG=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" "cat '$DEPLOY_PATH/.unit-talk-release'" 2>&1); then
            RELEASE_TAG_STATUS=0
          else
            RELEASE_TAG_STATUS=$?
          fi
          if [ "$RELEASE_TAG_STATUS" -ne 0 ] || [ -z "$RELEASE_TAG" ]; then
            echo "::error::Could not read .unit-talk-release from the remote host -- no record of what production actually deployed. Raw output: $RELEASE_TAG"
            exit 1
          fi
          if [ "$RELEASE_TAG" != "$IMAGE_TAG" ]; then
            echo "::error::Release record mismatch: workflow resolved tag '$IMAGE_TAG' but .unit-talk-release on host records '$RELEASE_TAG'."
            exit 1
          fi

          # 2/3/5. Same fix as canary, applied to all five production variables
          # (api/ingestor-autorun/ingestor-scheduling/worker-autorun/enabled-
          # targets): every compose evaluation gets UNIT_TALK_IMAGE_TAG,
          # failures are classified instead of collapsed, and the assignment
          # is the condition of an `if` so `set -e` cannot skip classification.

          if API_EXEC_OUTPUT=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && UNIT_TALK_IMAGE_TAG='$IMAGE_TAG' docker compose exec -T api printenv SYNDICATE_MACHINE_ENABLED" 2>&1); then
            API_EXEC_STATUS=0
          else
            API_EXEC_STATUS=$?
          fi
          if [ "$API_EXEC_STATUS" -ne 0 ]; then
            if printf '%s' "$API_EXEC_OUTPUT" | grep -qi "variable is not set\|required"; then
              echo "::error::Compose evaluation failed while confirming the production api container: $API_EXEC_OUTPUT"
            elif printf '%s' "$API_EXEC_OUTPUT" | grep -qi "no such service\|no container found\|is not running"; then
              echo "::error::Production api service/container could not be resolved: $API_EXEC_OUTPUT"
            else
              echo "::error::SYNDICATE_MACHINE_ENABLED is absent in the production api container: $API_EXEC_OUTPUT"
            fi
            exit 1
          fi
          VALUE="$API_EXEC_OUTPUT"
          if [ "$VALUE" != "$REQUESTED_VALUE" ]; then
            echo "::error::SYNDICATE_MACHINE_ENABLED readiness RED in production container: requested='$REQUESTED_VALUE' runtime='${VALUE:-missing}'"
            exit 1
          fi

          if INGESTOR_AUTORUN_OUTPUT=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && UNIT_TALK_IMAGE_TAG='$IMAGE_TAG' docker compose exec -T ingestor printenv UNIT_TALK_INGESTOR_AUTORUN" 2>&1); then
            INGESTOR_AUTORUN_STATUS=0
          else
            INGESTOR_AUTORUN_STATUS=$?
          fi
          if [ "$INGESTOR_AUTORUN_STATUS" -ne 0 ]; then
            if printf '%s' "$INGESTOR_AUTORUN_OUTPUT" | grep -qi "variable is not set\|required"; then
              echo "::error::Compose evaluation failed while confirming the production ingestor container: $INGESTOR_AUTORUN_OUTPUT"
            elif printf '%s' "$INGESTOR_AUTORUN_OUTPUT" | grep -qi "no such service\|no container found\|is not running"; then
              echo "::error::Production ingestor service/container could not be resolved: $INGESTOR_AUTORUN_OUTPUT"
            else
              echo "::error::UNIT_TALK_INGESTOR_AUTORUN is absent in the production ingestor container: $INGESTOR_AUTORUN_OUTPUT"
            fi
            exit 1
          fi
          INGESTOR_AUTORUN_VALUE="$INGESTOR_AUTORUN_OUTPUT"
          if [ "$INGESTOR_AUTORUN_VALUE" != "$REQUESTED_INGESTOR_AUTORUN" ]; then
            echo "::error::UNIT_TALK_INGESTOR_AUTORUN readiness RED in production container: requested='$REQUESTED_INGESTOR_AUTORUN' runtime='${INGESTOR_AUTORUN_VALUE:-missing}'"
            exit 1
          fi

          if INGESTOR_SCHEDULING_OUTPUT=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && UNIT_TALK_IMAGE_TAG='$IMAGE_TAG' docker compose exec -T ingestor printenv UNIT_TALK_INGESTOR_SCHEDULING_ENABLED" 2>&1); then
            INGESTOR_SCHEDULING_STATUS=0
          else
            INGESTOR_SCHEDULING_STATUS=$?
          fi
          if [ "$INGESTOR_SCHEDULING_STATUS" -ne 0 ]; then
            if printf '%s' "$INGESTOR_SCHEDULING_OUTPUT" | grep -qi "variable is not set\|required"; then
              echo "::error::Compose evaluation failed while confirming the production ingestor container: $INGESTOR_SCHEDULING_OUTPUT"
            elif printf '%s' "$INGESTOR_SCHEDULING_OUTPUT" | grep -qi "no such service\|no container found\|is not running"; then
              echo "::error::Production ingestor service/container could not be resolved: $INGESTOR_SCHEDULING_OUTPUT"
            else
              echo "::error::UNIT_TALK_INGESTOR_SCHEDULING_ENABLED is absent in the production ingestor container: $INGESTOR_SCHEDULING_OUTPUT"
            fi
            exit 1
          fi
          INGESTOR_SCHEDULING_VALUE="$INGESTOR_SCHEDULING_OUTPUT"
          if [ "$INGESTOR_SCHEDULING_VALUE" != "$REQUESTED_INGESTOR_SCHEDULING" ]; then
            echo "::error::UNIT_TALK_INGESTOR_SCHEDULING_ENABLED readiness RED in production container: requested='$REQUESTED_INGESTOR_SCHEDULING' runtime='${INGESTOR_SCHEDULING_VALUE:-missing}'"
            exit 1
          fi

          if WORKER_AUTORUN_OUTPUT=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && UNIT_TALK_IMAGE_TAG='$IMAGE_TAG' docker compose exec -T worker printenv UNIT_TALK_WORKER_AUTORUN" 2>&1); then
            WORKER_AUTORUN_STATUS=0
          else
            WORKER_AUTORUN_STATUS=$?
          fi
          if [ "$WORKER_AUTORUN_STATUS" -ne 0 ]; then
            if printf '%s' "$WORKER_AUTORUN_OUTPUT" | grep -qi "variable is not set\|required"; then
              echo "::error::Compose evaluation failed while confirming the production worker container: $WORKER_AUTORUN_OUTPUT"
            elif printf '%s' "$WORKER_AUTORUN_OUTPUT" | grep -qi "no such service\|no container found\|is not running"; then
              echo "::error::Production worker service/container could not be resolved: $WORKER_AUTORUN_OUTPUT"
            else
              echo "::error::UNIT_TALK_WORKER_AUTORUN is absent in the production worker container: $WORKER_AUTORUN_OUTPUT"
            fi
            exit 1
          fi
          WORKER_AUTORUN_VALUE="$WORKER_AUTORUN_OUTPUT"
          if [ "$WORKER_AUTORUN_VALUE" != "$REQUESTED_WORKER_AUTORUN" ]; then
            echo "::error::UNIT_TALK_WORKER_AUTORUN readiness RED in production container: requested='$REQUESTED_WORKER_AUTORUN' runtime='${WORKER_AUTORUN_VALUE:-missing}'"
            exit 1
          fi

          if ENABLED_TARGETS_OUTPUT=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && UNIT_TALK_IMAGE_TAG='$IMAGE_TAG' docker compose exec -T worker printenv UNIT_TALK_ENABLED_TARGETS" 2>&1); then
            ENABLED_TARGETS_STATUS=0
          else
            ENABLED_TARGETS_STATUS=$?
          fi
          if [ "$ENABLED_TARGETS_STATUS" -ne 0 ]; then
            if printf '%s' "$ENABLED_TARGETS_OUTPUT" | grep -qi "variable is not set\|required"; then
              echo "::error::Compose evaluation failed while confirming the production worker container: $ENABLED_TARGETS_OUTPUT"
            elif printf '%s' "$ENABLED_TARGETS_OUTPUT" | grep -qi "no such service\|no container found\|is not running"; then
              echo "::error::Production worker service/container could not be resolved: $ENABLED_TARGETS_OUTPUT"
            else
              echo "::error::UNIT_TALK_ENABLED_TARGETS is absent in the production worker container: $ENABLED_TARGETS_OUTPUT"
            fi
            exit 1
          fi
          ENABLED_TARGETS_VALUE="$ENABLED_TARGETS_OUTPUT"

          # UNIT_TALK_ENABLED_TARGETS is asserted only in parked mode: active mode's
          # value legitimately varies with the UNIT_TALK_ENABLED_TARGETS secret, but
          # parked mode must NEVER resolve to a real target regardless of that secret.
          if [ "$SYNDICATE_MACHINE_MODE" = "parked" ] && [ "$ENABLED_TARGETS_VALUE" != "none" ]; then
            echo "::error::UNIT_TALK_ENABLED_TARGETS readiness RED in production container: parked mode requires 'none', runtime='${ENABLED_TARGETS_VALUE:-missing}'"
            exit 1
          fi
          # In parked mode the contract is exactly "none"; in active mode there
          # is no fixed expected string (it legitimately varies with the
          # UNIT_TALK_ENABLED_TARGETS secret), so the docker-inspect step below
          # cross-checks against whichever value compose-exec already proved.
          if [ "$SYNDICATE_MACHINE_MODE" = "parked" ]; then
            REQUESTED_ENABLED_TARGETS="none"
          else
            REQUESTED_ENABLED_TARGETS="$ENABLED_TARGETS_VALUE"
          fi

          # 5. Independent docker-inspect + compose-labels cross-check across
          # all three services, all five variables (including
          # UNIT_TALK_ENABLED_TARGETS, previously verified only through
          # compose-exec). Every container lookup is bound to the exact
          # compose project established from the API container below (itself
          # release-tag- and image-verified), rejects the evidence outright if
          # more than one container matches service+project, and verifies
          # each service's exact image tag -- not service-label alone. This
          # path needs no compose-file re-evaluation at all, so it can never
          # be broken by the class of bug that caused this incident.
          if API_CIDS=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker ps -q --filter 'label=com.docker.compose.service=api' --filter 'status=running'" 2>&1); then
            API_CIDS_STATUS=0
          else
            API_CIDS_STATUS=$?
          fi
          if [ "$API_CIDS_STATUS" -ne 0 ]; then
            echo "::error::docker-inspect verification: could not list containers for service=api: $API_CIDS"
            exit 1
          fi
          API_CID_COUNT=$(printf '%s\n' "$API_CIDS" | grep -c . || true)
          if [ "$API_CID_COUNT" -ne 1 ]; then
            echo "::error::docker-inspect verification: expected exactly one running container for service=api, found $API_CID_COUNT -- evidence is ambiguous."
            exit 1
          fi
          API_CID="$API_CIDS"

          if EXPECTED_PROJECT=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker inspect --format '{{index .Config.Labels \"com.docker.compose.project\"}}' '$API_CID'" 2>&1); then
            EXPECTED_PROJECT_STATUS=0
          else
            EXPECTED_PROJECT_STATUS=$?
          fi
          if [ "$EXPECTED_PROJECT_STATUS" -ne 0 ] || [ -z "$EXPECTED_PROJECT" ]; then
            echo "::error::docker-inspect verification: could not read compose project label from the api container ($API_CID): $EXPECTED_PROJECT"
            exit 1
          fi

          for pair in "api:SYNDICATE_MACHINE_ENABLED:$REQUESTED_VALUE" \
                      "ingestor:UNIT_TALK_INGESTOR_AUTORUN:$REQUESTED_INGESTOR_AUTORUN" \
                      "ingestor:UNIT_TALK_INGESTOR_SCHEDULING_ENABLED:$REQUESTED_INGESTOR_SCHEDULING" \
                      "worker:UNIT_TALK_WORKER_AUTORUN:$REQUESTED_WORKER_AUTORUN" \
                      "worker:UNIT_TALK_ENABLED_TARGETS:$REQUESTED_ENABLED_TARGETS"; do
            svc="${pair%%:*}"
            rest="${pair#*:}"
            var="${rest%%:*}"
            requested="${rest#*:}"

            if cids=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker ps -q --filter 'label=com.docker.compose.service=$svc' --filter 'label=com.docker.compose.project=$EXPECTED_PROJECT' --filter 'status=running'" 2>&1); then
              cids_status=0
            else
              cids_status=$?
            fi
            if [ "$cids_status" -ne 0 ]; then
              echo "::error::docker-inspect verification: could not list containers for service=$svc project=$EXPECTED_PROJECT: $cids"
              exit 1
            fi
            cid_count=$(printf '%s\n' "$cids" | grep -c . || true)
            if [ "$cid_count" -eq 0 ]; then
              echo "::error::docker-inspect verification: no running container found for service=$svc in project=$EXPECTED_PROJECT."
              exit 1
            fi
            if [ "$cid_count" -gt 1 ]; then
              echo "::error::docker-inspect verification: found $cid_count containers for service=$svc in project=$EXPECTED_PROJECT -- expected exactly one, evidence is ambiguous."
              exit 1
            fi
            cid="$cids"

            if inspect_image=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker inspect --format '{{.Config.Image}}' '$cid'" 2>&1); then
              inspect_image_status=0
            else
              inspect_image_status=$?
            fi
            if [ "$inspect_image_status" -ne 0 ]; then
              echo "::error::docker-inspect: could not read image reference for $svc ($cid): $inspect_image"
              exit 1
            fi
            expected_image="$IMAGE_NAMESPACE/$svc:$IMAGE_TAG"
            if [ "$inspect_image" != "$expected_image" ]; then
              echo "::error::docker-inspect image mismatch for $svc: container reports '$inspect_image', requested '$expected_image'."
              exit 1
            fi

            if inspect_env=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' '$cid'" 2>&1); then
              inspect_env_status=0
            else
              inspect_env_status=$?
            fi
            if [ "$inspect_env_status" -ne 0 ]; then
              echo "::error::docker-inspect: could not read process environment for $svc ($cid): $inspect_env"
              exit 1
            fi
            inspect_value=$(printf '%s\n' "$inspect_env" | grep "^${var}=" | head -1 | cut -d= -f2-)
            if [ -z "$inspect_value" ]; then
              echo "::error::docker-inspect: $var is absent from the $svc container's process environment (project=$EXPECTED_PROJECT, image=$inspect_image)."
              exit 1
            fi
            if [ "$inspect_value" != "$requested" ]; then
              echo "::error::docker-inspect value mismatch for $svc/$var: requested='$requested' actual='$inspect_value' (project=$EXPECTED_PROJECT, image=$inspect_image)."
              exit 1
            fi
          done

          # 6. Prove the public kill switches remain engaged for the live
          # Discord-facing targets, independent of anything in the container --
          # a read-only query against the same production Supabase this deploy
          # targets. Parked mode never requires this (it's defense-in-depth,
          # not this deploy's own responsibility to flip), but it must never be
          # silently disengaged, and this deploy must prove it either way.
          if KILL_SWITCH_JSON=$(curl -sS --max-time 15 \
            "$SUPABASE_URL/rest/v1/delivery_kill_switch?target=in.(best-bets,trader-insights)&select=target,killed" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"); then
            KILL_SWITCH_STATUS=0
          else
            KILL_SWITCH_STATUS=$?
          fi
          if [ "$KILL_SWITCH_STATUS" -ne 0 ]; then
            echo "::error::Could not query the delivery_kill_switch table: curl exited $KILL_SWITCH_STATUS"
            exit 1
          fi
          if ! printf '%s' "$KILL_SWITCH_JSON" | python3 -c "
          import json, sys
          rows = json.load(sys.stdin)
          targets = {r['target']: r['killed'] for r in rows}
          for t in ('best-bets', 'trader-insights'):
              if targets.get(t) is not True:
                  print(f'{t}: killed={targets.get(t)!r} (expected true)', file=sys.stderr)
                  sys.exit(1)
          "; then
            echo "::error::Public delivery kill-switch is not engaged for best-bets/trader-insights: $KILL_SWITCH_JSON"
            exit 1
          fi

          printf '{"service":"deploy","event":"syndicate_machine_mode.confirmed","stage":"production","mode":"%s","requestedValue":"%s","runtimeValue":"%s","ingestorAutorun":"%s","ingestorScheduling":"%s","workerAutorun":"%s","enabledTargets":"%s","releaseTag":"%s","killSwitchEngaged":true}\n' \
            "$SYNDICATE_MACHINE_MODE" "$REQUESTED_VALUE" "$VALUE" "$INGESTOR_AUTORUN_VALUE" "$INGESTOR_SCHEDULING_VALUE" "$WORKER_AUTORUN_VALUE" "$ENABLED_TARGETS_VALUE" "$RELEASE_TAG"

  smoke:
    name: Post-deploy functional smoke
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.UNIT_TALK_DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Run post-deploy functional smoke via SSH
        run: |
          # Curl from inside server — Hetzner Cloud firewall blocks port 4000 from runner IPs
          RESULT=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "HTTP=\$(curl -o /tmp/smoke-health.json -w '%{http_code}' -s --max-time 30 http://localhost:4000/health 2>/dev/null || echo '000'); \
             BODY=\$(cat /tmp/smoke-health.json 2>/dev/null | head -c 2000 || echo '{}'); \
             echo \"{\\\"httpStatus\\\":\$HTTP,\\\"body\\\":\$(echo \"\$BODY\" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))' 2>/dev/null || echo '\"{}\"')}\"")
          echo "Raw smoke result: $RESULT"
          HTTP_STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('httpStatus',0))")
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo '{"verdict":"PASS","httpStatus":200,"checks":[{"name":"health 200","passed":true}]}' | tee smoke-result.json
          else
            echo "{\"verdict\":\"FAIL\",\"httpStatus\":$HTTP_STATUS,\"checks\":[{\"name\":\"health 200\",\"passed\":false,\"detail\":\"HTTP $HTTP_STATUS\"}]}" | tee smoke-result.json
            echo "::error::Post-deploy smoke FAILED — health returned HTTP $HTTP_STATUS (expected 200)"
            exit 1
          fi

      - name: Upload smoke result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-result-${{ github.run_id }}.json
          path: smoke-result.json
          retention-days: 30
