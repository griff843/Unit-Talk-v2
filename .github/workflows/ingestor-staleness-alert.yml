name: Ingestor and Alert-System Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingestor-alert-system-monitor
  cancel-in-progress: false

jobs:
  alerting-pass:
    name: Run alert detection and notification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run one alerting pass
        run: pnpm ingestor:alert-check -- --run-alerting-pass
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UNIT_TALK_OPS_ALERT_WEBHOOK_URL: ${{ secrets.UNIT_TALK_OPS_ALERT_WEBHOOK_URL }}
          ALERT_AGENT_ENABLED: 'true'
          ALERT_DRY_RUN: 'false'
          SYSTEM_PICKS_ENABLED: 'false'
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          UNIT_TALK_DISCORD_TARGET_MAP: ${{ secrets.UNIT_TALK_DISCORD_TARGET_MAP }}
          # Member-facing alert delivery is NOT authorized. The alert-worthy tier
          # would otherwise fan out to discord:trader-insights via resolveChannels().
          # This scheduled pass is canary-only; flipping this to 'true' is a
          # separate activation decision, not a config tidy-up.
          ALERT_MEMBER_CHANNELS_ENABLED: 'false'

  monitor:
    name: Check ingestion and alert-system freshness
    needs: alerting-pass
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check ingestion and alert-system freshness
        run: pnpm ingestor:alert-check -- --production-cadence
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UNIT_TALK_INGESTOR_OFFER_STALE_MINUTES: ${{ vars.UNIT_TALK_INGESTOR_OFFER_STALE_MINUTES || '30' }}
          INGESTOR_ALERT_CYCLE_THRESHOLD_MINUTES: ${{ vars.INGESTOR_ALERT_CYCLE_THRESHOLD_MINUTES || '30' }}
          INGESTOR_ALERT_RESULTS_THRESHOLD_MINUTES: ${{ vars.INGESTOR_ALERT_RESULTS_THRESHOLD_MINUTES || '60' }}
          # 60, not 15: the alert.detection/alert.notification runs this threshold
          # watches are produced by this same throttled scheduler (measured ~28 min
          # effective cadence against a */5 cron), so 15 marks a healthy system stale.
          ALERT_SYSTEM_STALE_MINUTES: ${{ vars.ALERT_SYSTEM_STALE_MINUTES || '60' }}
          UNIT_TALK_OPS_ALERT_WEBHOOK_URL: ${{ secrets.UNIT_TALK_OPS_ALERT_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          UNIT_TALK_DISCORD_TARGET_MAP: ${{ secrets.UNIT_TALK_DISCORD_TARGET_MAP }}
