name: Linear Auto-Close

# On push to main, parse explicit close-intent markers from the head commit
# message and move the referenced Linear issue(s) to Done with a merge-SHA
# comment.
#
# This workflow closes Linear issues ONLY when the commit message contains an
# explicit close-intent marker, following the same conventions as GitHub's
# own issue auto-closing syntax:
#
#   - Closes UTV2-NNN     (inline verb, case-insensitive on the verb)
#   - Fixes UTV2-NNN      (inline verb, case-insensitive on the verb)
#   - Resolves UTV2-NNN   (inline verb, case-insensitive on the verb)
#   - Linear-Close: UTV2-NNN   (commit trailer, anchored to line start)
#   - chore(lanes): close UTV2-NNN   (the sanctioned closeout commit, anchored
#     to line start; added UTV2-1724 because the closeout path emits the bare
#     imperative, which none of the forms above match)
#
# Free-form mentions like "UTV2-NNN dispatch packet", "follow-up to UTV2-NNN",
# file path literals, code examples, or "supersedes UTV2-NNN" wording are
# IGNORED. This prevents the false-positive class that caused an earlier
# packet-describing PR to incorrectly close the target issue.
#
# Identifier prefix is case-sensitive — `UTV2-NNN` matches, `utv2-NNN` does
# not. This ensures conventional-commit scope prefixes like `feat(utv2-519):`
# cannot trigger a close on their own. Use the explicit close-intent verb in
# a separate position to close.
#
# Extraction logic lives in `.github/workflows/linear-auto-close.test.sh`,
# which also contains a standalone test harness. Run the harness manually:
#
#   bash .github/workflows/linear-auto-close.test.sh
#
# Any change to the extraction regex MUST be accompanied by a test update in
# the same PR. The harness covers the full intended behaviour — the original
# false-positive incident, the sanctioned closeout form, the fail-closed
# tripwire, and the complete completion-decision path. Run it for the current
# count rather than trusting a number here; an earlier revision of this line
# went stale and no longer matched the suite.
#
# Requirements:
#   - Repo secret LINEAR_API_TOKEN with scope sufficient to read + update
#     issues and create comments. Generate at https://linear.app/settings/api
#     and add via Settings > Secrets and variables > Actions.
#
# Safety:
#   - Only fires on push to main.
#   - Skips silently if LINEAR_API_TOKEN is not configured (first-time setup).
#   - Idempotent: re-running against an already-Done issue only attaches the
#     merge-SHA comment; it does not error.
#   - Never creates new issues, never moves issues to states other than Done,
#     never deletes anything.

on:
  push:
    branches:
      - main

# Scoped per commit, NOT shared with post-merge-lane-close's
# `merge-closeout-mutex`.
#
# `cancel-in-progress: false` protects a RUNNING job, but GitHub keeps at most
# one PENDING run per concurrency group: a run queued behind the mutex is
# cancelled outright when a newer run enters the same group. There is no retry
# and no replacement run, so the Linear transition is skipped silently.
#
# Observed: run 31900689921 on commit 52b4878b was evicted while queued behind
# post-merge-lane-close -- it recorded `conclusion: cancelled` with zero jobs
# ever created, i.e. it died before execution rather than mid-run.
#
# That run would not have closed anything even had it executed: its commit
# message carried no recognized close-intent marker. It is cited here as
# evidence of the eviction mechanism only, NOT as an instance of a Linear
# transition being lost. This guards a latent failure, not an observed one.
#
# This workflow only reads the head commit message and updates Linear -- it
# never writes to the repository -- so it does not need to serialize against
# the closeout writer. A per-SHA group still de-duplicates repeated runs for
# the same commit, which is the only serialization it actually requires.
concurrency:
  group: linear-auto-close-${{ github.sha }}
  cancel-in-progress: false

jobs:
  linear-auto-close:
    name: Close Linear issues referenced in merge commit
    runs-on: ubuntu-latest

    steps:
      - name: Skip if Linear token not configured
        id: guard
        env:
          LINEAR_API_TOKEN: ${{ secrets.LINEAR_API_TOKEN }}
        run: |
          if [ -z "$LINEAR_API_TOKEN" ]; then
            echo "LINEAR_API_TOKEN secret not set — skipping auto-close."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo (for extraction function)
        if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          # Minimal checkout — only the workflow files are needed for the
          # extraction function. No history, no LFS, no submodules.
          fetch-depth: 1

      - name: Extract close-intent issue IDs from commit message
        if: steps.guard.outputs.configured == 'true'
        id: extract
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Source the shared extraction function from the test file.
          # The function parses the commit message and emits only identifiers
          # referenced with an explicit close-intent marker. Sourcing the test
          # file ensures the workflow and the test harness cannot drift apart.
          # shellcheck disable=SC1091
          source .github/workflows/linear-auto-close.test.sh

          ids=$(extract_linear_close_ids "$COMMIT_MSG")
          subject=$(echo "$COMMIT_MSG" | head -n 1)

          # UTV2-1724 hatch 8: the tripwire must be evaluated on its own terms,
          # not gated behind an empty id set. `ids` is built from the whole
          # message while the closeout signature is read from the subject, so a
          # commit whose body mentions any unrelated issue used to make the
          # tripwire unreachable — closing that unrelated issue while the real
          # closeout drifted away in silence.
          if should_fire_closeout_tripwire "$COMMIT_MSG" "$ids"; then
            echo "::error title=linear-auto-close::decision=no_close reason=closeout_signature_unmatched commit=\"$subject\" — this commit carries a lane-closeout signature but did not yield its own issue id, so that lane will NOT transition. The closeout commit template has almost certainly drifted away from extract_linear_close_ids(). Fix the grammar in .github/workflows/linear-auto-close.test.sh and add a case for the new shape; do not hand-edit the Linear record."
            exit 1
          fi

          if [ -z "$ids" ]; then
            # UTV2-1724 fail-closed tripwire.
            #
            # "No close intent" is the correct, quiet outcome for the vast
            # majority of commits. It is the WRONG outcome for a commit the
            # sanctioned closeout path produced — that commit exists precisely
            # to close an issue, so a no-match means this workflow failed at
            # its one job.
            #
            # Before this check both cases emitted the same ::notice and the
            # job stayed green. 25 merged lanes were stranded as Linear ghosts
            # over 24 days with nothing anywhere going red. An aggregate green
            # that conflates "nothing to do" with "the thing I exist to do did
            # not happen" is not a signal.
            #
            # An explicit opt-out (No-close:, plan-only, partial-fix) is a
            # deliberate decision, not drift, and stays a notice.
            echo "::notice title=linear-auto-close::decision=no_close reason=no_close_intent commit=\"$subject\""
            echo "ids=" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=linear-auto-close::decision=will_close ids=\"$ids\" commit=\"$subject\""
            echo "ids=$ids" >> "$GITHUB_OUTPUT"
          fi

      - name: Move issues to Done and attach merge SHA
        if: steps.guard.outputs.configured == 'true' && steps.extract.outputs.ids != ''
        env:
          LINEAR_API_TOKEN: ${{ secrets.LINEAR_API_TOKEN }}
          IDS: ${{ steps.extract.outputs.ids }}
          MERGE_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Same shared source as the extraction step, for
          # has_lane_closeout_signature() and resolve_authoritative_merge_sha().
          # Sourcing rather than duplicating keeps the workflow and the harness
          # from drifting apart — the same reason extraction is shared.
          # shellcheck disable=SC1091
          source .github/workflows/linear-auto-close.test.sh

          # Fetch the Done state id for team unit-talk-v2 once
          # Use the team UUID, not the name slug. Linear's team(id:) requires UUID.
          team_query='{"query":"query { team(id: \"00075741-4bdd-49ac-942e-eee06cc56fb5\") { states { nodes { id name type } } } }"}'
          team_resp=$(curl -sS -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$team_query")

          done_state_id=$(echo "$team_resp" | jq -r '.data.team.states.nodes[] | select(.name=="Done") | .id')
          if [ -z "$done_state_id" ] || [ "$done_state_id" = "null" ]; then
            echo "::warning title=Linear state lookup failed::Could not resolve Done state id. Team response: $team_resp"
            exit 0
          fi
          echo "Resolved Done state id: $done_state_id"

          short_sha="${MERGE_SHA:0:7}"
          # Extract the commit subject (first line only)
          subject=$(echo "$COMMIT_SUBJECT" | head -n 1)

          for identifier in $IDS; do
            echo "---"
            echo "Processing $identifier..."

            # Look up the issue by identifier to get its UUID
            lookup_query="{\"query\":\"query { issue(id: \\\"$identifier\\\") { id state { name } } }\"}"
            lookup_resp=$(curl -sS -X POST https://api.linear.app/graphql \
              -H "Authorization: $LINEAR_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$lookup_query")

            issue_uuid=$(echo "$lookup_resp" | jq -r '.data.issue.id')
            current_state=$(echo "$lookup_resp" | jq -r '.data.issue.state.name')

            if [ -z "$issue_uuid" ] || [ "$issue_uuid" = "null" ]; then
              echo "::warning title=Issue not found::$identifier not found in Linear. Response: $lookup_resp"
              continue
            fi

            echo "  uuid=$issue_uuid current_state=$current_state"

            # UTV2-1619 capability 17: truth-gated lifecycle completion.
            #
            # A merge event is NOT evidence of completion. This workflow
            # previously moved an issue to Done purely because a merge commit
            # named it, which produced three distinct false-Done reproductions
            # in one day:
            #   1. post-merge-lane-close FAILED and this still said Done
            #   2. no lane manifest existed at all, so no receipt was possible
            #   3. a lane closed truthfully on a multi-increment issue that had
            #      three capabilities still outstanding
            #
            # Completion now requires a lane manifest that is BOTH terminal-
            # successful AND bound to this exact merge SHA, with a passing
            # truth-check receipt recorded against that same SHA. Anything else
            # leaves the issue open and says why. Absence of a manifest means
            # "not complete" -- the fail-closed direction, and precisely case 2.
            # UTV2-1724: the truth-gated completion decision now lives in
            # evaluate_completion_block() in the shared file, so the harness
            # exercises the real decision path instead of a paraphrase. Testing
            # ID extraction alone is how the SHA-comparison defect survived —
            # the grammar could be fully green while the gate consuming it
            # refused every sanctioned closeout.
            manifest_path="docs/06_status/lanes/${identifier}.json"
            effective_merge_sha=$(resolve_authoritative_merge_sha "$COMMIT_SUBJECT" "$manifest_path" "$MERGE_SHA")
            completion_block=$(evaluate_completion_block "$identifier" "$manifest_path" "$COMMIT_SUBJECT" "$MERGE_SHA")

            if [ -n "$completion_block" ]; then
              echo "::notice title=Completion withheld::$identifier left open — $completion_block"
              echo "  NOT completing $identifier: $completion_block"
            elif [ "$current_state" = "Done" ]; then
              echo "  already Done — attaching merge comment only"
            else
              # Update to Done
              update_query=$(jq -n \
                --arg id "$issue_uuid" \
                --arg state "$done_state_id" \
                '{query: "mutation UpdateIssue($id: String!, $state: String!) { issueUpdate(id: $id, input: { stateId: $state }) { success } }", variables: {id: $id, state: $state}}')

              update_resp=$(curl -sS -X POST https://api.linear.app/graphql \
                -H "Authorization: $LINEAR_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$update_query")

              success=$(echo "$update_resp" | jq -r '.data.issueUpdate.success')
              if [ "$success" = "true" ]; then
                echo "  moved to Done"
              else
                echo "::warning title=Issue update failed::$identifier update response: $update_resp"
                continue
              fi
            fi

            # Post a comment citing the AUTHORITATIVE merge SHA.
            #
            # UTV2-1724 P1: $short_sha is derived from github.sha, which on the
            # sanctioned closeout path is the closeout commit rather than the
            # merge. Attaching it recorded the wrong SHA against the issue — the
            # bookkeeping commit, not the change that shipped. Prefer the
            # resolved SHA and link it directly; fall back to the pushed commit
            # only when nothing authoritative resolved.
            if [ -n "$effective_merge_sha" ] && [ "$effective_merge_sha" != "$MERGE_SHA" ]; then
              comment_body="Merged to main: [\`${effective_merge_sha:0:7}\`](https://github.com/${REPO}/commit/${effective_merge_sha}) — $subject (closeout commit: [\`$short_sha\`]($COMMIT_URL))"
            else
              comment_body="Merged to main: [\`$short_sha\`]($COMMIT_URL) — $subject"
            fi
            comment_query=$(jq -n \
              --arg id "$issue_uuid" \
              --arg body "$comment_body" \
              '{query: "mutation CreateComment($id: String!, $body: String!) { commentCreate(input: { issueId: $id, body: $body }) { success } }", variables: {id: $id, body: $body}}')

            comment_resp=$(curl -sS -X POST https://api.linear.app/graphql \
              -H "Authorization: $LINEAR_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$comment_query")

            comment_ok=$(echo "$comment_resp" | jq -r '.data.commentCreate.success')
            if [ "$comment_ok" = "true" ]; then
              echo "  merge comment attached"
            else
              echo "::warning title=Comment create failed::$identifier comment response: $comment_resp"
            fi
          done
