name: Reconcile Stale Lanes

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # UTV2-1619: this checked out with the default GITHUB_TOKEN, which
          # cannot push to protected `main` -- so every scheduled run since at
          # least 2026-08-01 computed its manifest fixes correctly, committed
          # them, and then died on:
          #   GH006: Protected branch update failed for refs/heads/main
          # The reconciler has therefore been a no-op for weeks while appearing
          # to be scheduled, which is how the ghost backlog accumulated.
          #
          # SYNC_BOT_TOKEN is the same repo-owner PAT that post-merge-lane-close.yml
          # already uses for its manifest commits. Falls back to GITHUB_TOKEN when
          # unset, in which case the push is blocked exactly as before -- the
          # failure stays loud rather than silently skipping the write.
          token: ${{ secrets.SYNC_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reconcile stale lane manifests
        run: pnpm ops:reconcile --apply

      - name: Commit manifest mutations (no-op if nothing changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/06_status/lanes/
          git diff --cached --quiet || git commit -m "chore(lanes): auto-reconcile stale manifests"
          git push
