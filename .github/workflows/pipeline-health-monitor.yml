name: Pipeline Health Monitor

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  monitor:
    name: Monitor pipeline health
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate pipeline health report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UNIT_TALK_DISTRIBUTION_TARGETS: ${{ vars.UNIT_TALK_DISTRIBUTION_TARGETS }}
        run: |
          mkdir -p artifacts
          pnpm exec tsx scripts/pipeline-health.ts --output-json artifacts/pipeline-health.json

      - name: Check anomaly conditions
        id: anomaly
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const reportPath = 'artifacts/pipeline-health.json';

          if (!fs.existsSync(reportPath)) {
            console.error(`Pipeline health JSON report not found at ${reportPath}`);
            process.exit(1);
          }

          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const checks = [
            {
              name: 'outbox_dead_letter_count',
              value: Number(report.outbox_dead_letter_count ?? 0),
              limit: '> 0',
              triggered: Number(report.outbox_dead_letter_count ?? 0) > 0,
            },
            {
              name: 'criticals',
              value: (report.criticals ?? []).join('; '),
              limit: 'length > 0',
              triggered: Array.isArray(report.criticals) && report.criticals.length > 0,
            },
          ];

          const triggered = checks.filter((check) => check.triggered);
          const detected = triggered.length > 0;
          const summary = detected
            ? triggered.map((check) => `${check.name}=${check.value} (${check.limit})`).join('\n')
            : 'No anomaly thresholds exceeded.';

          fs.appendFileSync(process.env.GITHUB_ENV, `ANOMALY_DETECTED=${detected ? 'true' : 'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `ANOMALY_SUMMARY<<PIPELINE_HEALTH_SUMMARY\n${summary}\nPIPELINE_HEALTH_SUMMARY\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `detected=${detected ? 'true' : 'false'}\n`);
          console.log(summary);
          NODE

      - name: Open GitHub issue for anomaly
        id: create-anomaly-issue
        if: env.ANOMALY_DETECTED == 'true'
        uses: actions/github-script@v7
        env:
          ANOMALY_SUMMARY: ${{ env.ANOMALY_SUMMARY }}
        with:
          script: |
            const fs = require('fs');
            const titlePrefix = '[Pipeline Health] Anomaly detected';
            const title = `${titlePrefix} — ${new Date().toISOString().slice(0, 10)}`;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find((issue) => !issue.pull_request && issue.title.startsWith(titlePrefix));
            if (existing) {
              core.notice(`Open pipeline health issue already exists: ${existing.html_url}`, {
                title: 'pipeline-health-monitor',
              });
              return;
            }

            const report = fs.readFileSync('artifacts/pipeline-health.json', 'utf8');
            const body = [
              'Pipeline health anomaly thresholds were exceeded.',
              '',
              'Summary:',
              process.env.ANOMALY_SUMMARY,
              '',
              'Report JSON:',
              '```json',
              report.trim(),
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              assignees: [context.repo.owner],
            });
            core.info(`Created GitHub issue #${created.data.number}: ${created.data.html_url}`);

      - name: Upload pipeline health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-health-report
          path: artifacts/pipeline-health.json
          retention-days: 7
