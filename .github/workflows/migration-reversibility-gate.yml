name: migration-reversibility-gate

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'db/migrations-rollback/**'
      - 'scripts/ci/migration-reversibility-gate.ts'
      - 'scripts/ci/schema-roundtrip-hash.ts'
      - 'scripts/ci/migration-precondition-drill.ts'
      - '.github/workflows/migration-reversibility-gate.yml'

permissions:
  contents: read

jobs:
  reversibility-check:
    name: Down-script presence check (fail-closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check down-script presence (fail-closed)
        run: |
          npx tsx scripts/ci/migration-reversibility-gate.ts \
            --base origin/${{ github.base_ref }} \
            --json | tee /tmp/reversibility-result.json
          # Re-run without --json for human-readable annotation
          npx tsx scripts/ci/migration-reversibility-gate.ts \
            --base origin/${{ github.base_ref }}

      - name: Run adversarial gate tests
        run: npx tsx --test scripts/ci/migration-reversibility-gate.test.ts

      - name: Validate schema v2 proof binding (fail-closed)
        run: |
          # Detect issue ID from PR branch name — validates the current PR's proof.
          BRANCH="${{ github.head_ref }}"
          ISSUE_ID=$(echo "$BRANCH" | grep -oiE 'utv2-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]')

          if [ -z "$ISSUE_ID" ]; then
            # Fail-closed: migration PRs must have a UTV2 issue ID in the branch name.
            echo "::error title=proof-binding::No UTV2 issue ID found in branch name '${BRANCH}'."
            echo "Migration PRs must use branch name format: <prefix>/utv2-NNN-<description>"
            exit 1
          fi

          PROOF_DIR="docs/06_status/proof/${ISSUE_ID}"
          if [ ! -d "$PROOF_DIR" ]; then
            # Fail-closed: migration PRs must have a proof bundle.
            echo "::error title=proof-binding::Proof directory missing: $PROOF_DIR"
            echo "T1 migration lanes require a proof bundle at docs/06_status/proof/${ISSUE_ID}/evidence.json"
            exit 1
          fi

          echo "Validating proof binding for $ISSUE_ID at $PROOF_DIR"
          npx tsx scripts/ci/proof-binding-validator.ts \
            --proof-dir "$PROOF_DIR" \
            --json | tee /tmp/proof-binding-result.json
          npx tsx scripts/ci/proof-binding-validator.ts \
            --proof-dir "$PROOF_DIR"

  schema-roundtrip-drill:
    name: Schema round-trip drill (scratch Postgres — all new migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install postgresql-client
        run: sudo apt-get install -y postgresql-client

      - name: Detect new migrations on this PR
        id: detect
        run: |
          # Validate base ref is resolvable; fail closed if not.
          if ! git rev-parse --verify "origin/${{ github.base_ref }}" > /dev/null 2>&1; then
            echo "ERROR: Cannot resolve origin/${{ github.base_ref }}" >&2
            exit 2
          fi
          # grep exits 1 when there are no matches; || true prevents bash -e from
          # treating "zero new migrations" as a step failure.
          NEW=$(git diff --name-only --diff-filter=A \
                "origin/${{ github.base_ref }}...HEAD" \
                -- supabase/migrations/ | grep '\.sql$' || true)
          echo "migrations<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NEW" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [[ -n "$NEW" ]]; then
            echo "has_migration=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_migration=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Migration history receipt replay drill (UTV2-1822)
        if: steps.detect.outputs.has_migration == 'true'
        run: |
          # Proves the receipt model by executing it, not by inspecting the files:
          # the baseline applies, all receipts replay under ON_ERROR_STOP=1, and the
          # catalog fingerprint is byte-identical before and after the receipt set.
          # That last assertion is what rules out the double-applied and aliased
          # versions colliding -- if any receipt still carried its historical DDL it
          # would either error or move the fingerprint.
          #
          # Runs in its own database so the surrounding drill's fixtures and baseline
          # application cannot contaminate the before/after comparison.
          psql "postgresql://postgres:postgres@localhost:5432/postgres" \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE receipt_replay_drill;"
          POSTGRES_URL="postgresql://postgres:postgres@localhost:5432/receipt_replay_drill" \
            npx tsx scripts/ci/migration-history-replay-drill.ts

      - name: Adversarial round-trip fixture — invalid SQL down script caught by psql
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          # Defence-in-depth: prove psql rejects syntactically invalid SQL.
          # This fixture runs regardless of whether there are new migrations.
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE IF NOT EXISTS _adv_invalid_sql_tbl (id uuid primary key);"

          echo "THIS IS NOT SQL — adversarial fixture for UTV2-1083;" \
            > /tmp/adv-invalid.down.sql

          # psql with ON_ERROR_STOP=1 must exit non-zero on invalid SQL.
          if psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -f /tmp/adv-invalid.down.sql 2>/dev/null; then
            echo "FAIL: psql accepted invalid SQL — round-trip drill would not catch bad down scripts"
            exit 1
          fi
          echo "PASS: psql correctly rejected invalid SQL down script (exit $(echo $?))"

          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 \
            -c "DROP TABLE IF EXISTS _adv_invalid_sql_tbl;"

      - name: Apply all baseline migrations to scratch DB
        if: steps.detect.outputs.has_migration == 'true'
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          # Apply all migrations EXCEPT the new ones — establishes baseline state.
          # Use ON_ERROR_STOP=0 for baseline migrations: some rely on Supabase-specific
          # extensions (e.g. pg_cron) that are unavailable in the scratch container.
          # The round-trip drill for NEW migrations (below) still uses ON_ERROR_STOP=1.
          NEW_LIST="${{ steps.detect.outputs.migrations }}"
          for f in supabase/migrations/*.sql; do
            if echo "$NEW_LIST" | grep -qF "$(basename "$f")"; then
              echo "Skipping new migration (not yet applied): $f"
            else
              psql "$POSTGRES_URL" -f "$f" --quiet 2>&1 \
                | grep -v "^$" | sed "s/^/  [$(basename "$f")] /" || true
            fi
          done

      - name: Round-trip drill for each new migration
        if: steps.detect.outputs.has_migration == 'true'
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          FAIL=0

          while IFS= read -r MIGRATION; do
            [[ -z "$MIGRATION" ]] && continue
            BASE=$(basename "$MIGRATION" .sql)
            DOWN="db/migrations-rollback/${BASE}.down.sql"

            echo "=== Drilling: $BASE ==="

            # UTV2-1822: a non-executable historical version receipt executes nothing,
            # so there is no state to roll back and its only possible down script is a
            # no-op -- which migration-reversibility-gate.ts itself rejects as
            # comment-only. The exemption is decided by the in-scope predicate reading
            # the file's actual contents, never by its header claim: a receipt that
            # gains an executable statement fails the check below, falls through, and is
            # held to the ordinary down-script requirement like any other migration.
            if npx tsx scripts/ci/migration-history-receipt-check.ts "$MIGRATION"; then
              echo "EXEMPT: verified non-executable historical version receipt (UTV2-1822)."
              continue
            fi

            if [[ ! -f "$DOWN" ]]; then
              echo "FAIL: Down script missing: $DOWN"
              FAIL=1
              continue
            fi

            # Check for IRREVERSIBLE — validate ratification, then skip drill.
            if grep -q -- '-- IRREVERSIBLE:' "$DOWN"; then
              # Ratification check: gate script already verified this; re-check here for defence-in-depth.
              if ! npx tsx scripts/ci/migration-reversibility-gate.ts \
                    --base "origin/${{ github.base_ref }}" \
                    --json 2>/dev/null \
                    | python3 -c "import sys,json; d=json.load(sys.stdin); \
                        m=[x for x in d['migrations'] if '${BASE}' in x['migration']]; \
                        exit(0 if m and m[0]['pass'] else 1)"; then
                echo "FAIL: IRREVERSIBLE migration failed gate check: $MIGRATION"
                FAIL=1
              else
                echo "ADVISORY: Migration marked IRREVERSIBLE with ratification — drill skipped."
                echo "  Refer to PITR runbook: docs/05_operations/DB_ROLLBACK_RUNBOOK.md"
              fi
              continue
            fi

            # 1. Capture PRE-UP hash (baseline before this migration).
            npx tsx scripts/ci/schema-roundtrip-hash.ts --output "/tmp/hash-pre-up-${BASE}.txt"
            PRE_UP=$(cat "/tmp/hash-pre-up-${BASE}.txt")
            echo "  pre-up hash: $PRE_UP"

            # 2. Apply up migration (fail closed on SQL error).
            psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -f "$MIGRATION"

            # 3. Capture POST-UP hash.
            npx tsx scripts/ci/schema-roundtrip-hash.ts --output "/tmp/hash-post-up-${BASE}.txt"
            POST_UP=$(cat "/tmp/hash-post-up-${BASE}.txt")
            echo "  post-up hash: $POST_UP"

            # 4. Apply down script (fail closed on SQL error).
            psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -f "$DOWN"

            # 5. Capture POST-DOWN hash — must equal PRE-UP.
            npx tsx scripts/ci/schema-roundtrip-hash.ts --output "/tmp/hash-post-down-${BASE}.txt"
            POST_DOWN=$(cat "/tmp/hash-post-down-${BASE}.txt")
            echo "  post-down hash: $POST_DOWN"

            if [[ "$POST_DOWN" != "$PRE_UP" ]]; then
              echo "FAIL: post-down hash does not match pre-up baseline for $BASE"
              echo "  pre-up:    $PRE_UP"
              echo "  post-down: $POST_DOWN"
              echo "  The down script does not correctly restore the schema to its prior state."
              FAIL=1
              # Do not re-apply up — leave DB in consistent state for remaining migrations.
              continue
            fi

            # 6. Re-apply up migration.
            psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -f "$MIGRATION"

            # 7. Capture POST-REUP hash — must equal POST-UP.
            npx tsx scripts/ci/schema-roundtrip-hash.ts --output "/tmp/hash-post-reup-${BASE}.txt"
            POST_REUP=$(cat "/tmp/hash-post-reup-${BASE}.txt")
            echo "  post-reup hash: $POST_REUP"

            if [[ "$POST_REUP" != "$POST_UP" ]]; then
              echo "FAIL: post-reup hash does not match post-up for $BASE (non-deterministic migration)"
              echo "  post-up:   $POST_UP"
              echo "  post-reup: $POST_REUP"
              FAIL=1
              continue
            fi

            echo "PASS: $BASE (pre-up → post-down verified; round-trip verified)"

          done <<< "${{ steps.detect.outputs.migrations }}"

          if [[ $FAIL -ne 0 ]]; then
            echo ""
            echo "FAIL: One or more migrations failed the round-trip drill."
            exit 1
          fi
          echo ""
          echo "PASS: All new migrations passed the schema round-trip drill."

  # UTV2-1718 — proves a migration's fail-closed precondition actually refuses.
  #
  # Deliberately a SEPARATE job from schema-roundtrip-drill, for two reasons:
  #   1. The round-trip drill leaves the new migration applied. This drill needs a
  #      schema where the target relations are ABSENT, so sharing a database would
  #      make the refusal cases untestable.
  #   2. The existing apply -> rollback -> reapply convergence proof is green and
  #      must stay untouched. Adding steps to that job risks perturbing it.
  #
  # Ephemeral postgres service only. This job must never be given a production or
  # staging DSN: its whole method is seeding decoy relations and forcing failures.
  precondition-drill:
    name: Fail-closed precondition drill (scratch Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install postgresql-client
        run: sudo apt-get install -y postgresql-client

      - name: Detect new migrations on this PR
        id: detect
        run: |
          if ! git rev-parse --verify "origin/${{ github.base_ref }}" > /dev/null 2>&1; then
            echo "ERROR: Cannot resolve origin/${{ github.base_ref }}" >&2
            exit 2
          fi
          NEW=$(git diff --name-only --diff-filter=A \
                "origin/${{ github.base_ref }}...HEAD" \
                -- supabase/migrations/ | grep '\.sql$' || true)
          echo "migrations<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NEW" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [[ -n "$NEW" ]]; then
            echo "has_migration=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_migration=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply baseline migrations to scratch DB
        if: steps.detect.outputs.has_migration == 'true'
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          # Everything EXCEPT the new migrations, matching the round-trip drill.
          # ON_ERROR_STOP=0 because some baseline migrations need Supabase-only
          # extensions absent from the scratch container. The drill itself is
          # strict.
          NEW_LIST="${{ steps.detect.outputs.migrations }}"
          for f in supabase/migrations/*.sql; do
            if echo "$NEW_LIST" | grep -qF "$(basename "$f")"; then
              echo "Skipping new migration (not yet applied): $f"
            else
              psql "$POSTGRES_URL" -f "$f" --quiet 2>&1 \
                | grep -v "^$" | sed "s/^/  [$(basename "$f")] /" || true
            fi
          done

      - name: Drill each new migration's fail-closed precondition
        if: steps.detect.outputs.has_migration == 'true'
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          FAIL=0
          DRILLED=0
          while IFS= read -r MIGRATION; do
            [[ -z "$MIGRATION" ]] && continue

            # Both marker greps are anchored to the start of a comment line.
            # An unanchored grep matches PROSE that merely mentions a marker, which
            # is how the first run of this job silently exempted the very migration
            # it exists to test -- and still reported green.
            HAS_GUARD=0
            HAS_EXEMPT=0
            grep -qE '^[[:space:]]*--[[:space:]]*FAIL-CLOSED-PRECONDITION:' "$MIGRATION" && HAS_GUARD=1
            grep -qE '^[[:space:]]*--[[:space:]]*NO-PRECONDITION-REQUIRED:' "$MIGRATION" && HAS_EXEMPT=1

            # A migration cannot both declare a guard and claim exemption from it.
            # Ambiguity resolves to failure, never to skipping.
            if [[ "$HAS_GUARD" -eq 1 && "$HAS_EXEMPT" -eq 1 ]]; then
              echo "::error title=precondition-drill::$MIGRATION declares BOTH a fail-closed precondition and an exemption. Contradictory declarations fail closed."
              FAIL=1
              continue
            fi

            # Exemption applies only when no guard is declared.
            if [[ "$HAS_EXEMPT" -eq 1 ]]; then
              echo "=== $MIGRATION: exempt (explicit exemption marker, no guard declared) ==="
              continue
            fi

            echo "=== Drilling precondition: $MIGRATION ==="
            DRILLED=$((DRILLED + 1))
            if ! pnpm exec tsx scripts/ci/migration-precondition-drill.ts "$MIGRATION"; then
              FAIL=1
            fi
          done <<< "${{ steps.detect.outputs.migrations }}"

          # A run that drilled nothing is not a pass. Without this, any future
          # marker-matching bug degrades silently into a green no-op.
          echo "drilled $DRILLED migration(s)"
          if [[ "$DRILLED" -eq 0 ]]; then
            echo "::error title=precondition-drill::New migrations were detected but NONE were drilled. A green run that tested nothing is a failure, not a pass."
            exit 1
          fi

          if [[ "$FAIL" -ne 0 ]]; then
            # Deliberately does not assert WHICH failure occurred: the drill exits
            # non-zero both when a guard fails to refuse and when the drill itself
            # errors. Claiming the former when it was the latter would be a false
            # finding, so the cause is left to the drill's own output above.
            echo "::error title=precondition-drill::The precondition drill did not pass. See the drill output above for whether a guard failed to refuse or the drill itself errored."
            exit 1
          fi

      - name: Adversarial fixture — a guard that does not refuse must fail the drill
        if: steps.detect.outputs.has_migration == 'true'
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          # Defence-in-depth: proves the drill reports FAIL rather than silently
          # passing when a migration declares a precondition it does not enforce.
          # Without this, a drill bug would look identical to a healthy guard.
          cat > /tmp/adv-no-guard.sql <<'SQL'
          -- FAIL-CLOSED-PRECONDITION: public._adv_precondition_fixture
          CREATE TABLE IF NOT EXISTS public._adv_precondition_fixture (id uuid PRIMARY KEY);
          SQL

          if pnpm exec tsx scripts/ci/migration-precondition-drill.ts /tmp/adv-no-guard.sql; then
            echo "FAIL: drill passed a migration whose declared guard never refuses"
            exit 1
          fi
          echo "PASS: drill correctly rejected a declared-but-unenforced precondition"

          # Regression fixture for the marker-classification bug that made the first
          # run of this job green while drilling nothing: a migration whose PROSE
          # mentions the exemption marker must still be classified as guarded.
          cat > /tmp/adv-prose-mention.sql <<'SQL'
          -- A migration that declares neither this marker nor an explicit
          -- "-- NO-PRECONDITION-REQUIRED:" declaration fails the drill outright.
          -- FAIL-CLOSED-PRECONDITION: public._adv_prose_fixture
          SELECT 1;
          SQL

          HAS_GUARD=0
          HAS_EXEMPT=0
          grep -qE '^[[:space:]]*--[[:space:]]*FAIL-CLOSED-PRECONDITION:' /tmp/adv-prose-mention.sql && HAS_GUARD=1
          grep -qE '^[[:space:]]*--[[:space:]]*NO-PRECONDITION-REQUIRED:' /tmp/adv-prose-mention.sql && HAS_EXEMPT=1

          if [[ "$HAS_GUARD" -ne 1 ]]; then
            echo "FAIL: a declared guard was not detected"
            exit 1
          fi
          if [[ "$HAS_EXEMPT" -ne 0 ]]; then
            echo "FAIL: prose mentioning the exemption marker was classified as an exemption — this is the original fail-open bug"
            exit 1
          fi
          echo "PASS: prose mentioning the exemption marker does not exempt a guarded migration"
