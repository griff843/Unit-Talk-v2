# Independent Review
#
# WORK-2026110804 (Standard/Protected operating model, Step A: add-only).
#
# Passes only on the TRUSTED connector's (default
# chatgpt-codex-connector[bot], a GitHub Bot account) anchored
# codex-review-state:v1 summary comment bound to the exact PR head with
# status=completed and has_any_findings=false. A bare review object never
# passes; a missing summary fails. Any P0/P1 finding raised at the head
# (thread comment, review body, CHANGES_REQUESTED, or a summary reporting
# findings) blocks that head permanently - a new commit with a fresh clean
# summary is required. Unresolved P0/P1 threads at any head block. Resolving
# a thread or an untrusted edit never clears a finding; deleting the trusted
# comment or review body does clear it at the next recompute (known limit,
# see docs/05_operations/LEAN_MODE_ACTIVATION.md). Reads only
# GitHub-trusted artifacts via scripts/ops/operating-model.cjs; PR-body text
# is never consulted. Fails closed, including on connector outage.
#
# Inert unless OPERATING_MODEL=lean and LEAN_MODE_ACTIVATED_AT is set, and when
# the base commit predates the policy module (lazy, guarded require): reports
# "not applicable" and passes; Merge Gate then runs its legacy path.
#
# Retry: a review (submitted, edited, dismissed) is a pull_request_review
# event and an inline review-thread comment (created, edited, deleted) is a
# pull_request_review_comment event; both run the ineligible, read-only job
# below. required-check-refresh.yml (trusted, default-branch definition)
# observes that run via workflow_run and, in lean mode, reruns Independent
# Review, Merge Gate, Executor Result Validation and Risk Class at the exact
# live head. Issue comments (connector summary, escalation) are observed by
# required-check-refresh.yml directly. Thread resolve/unresolve has no
# Actions event: see Known limits in docs/05_operations/LEAN_MODE_ACTIVATION.md.
#
# Pinned to the PR's immutable base SHA so a PR cannot rewrite its own review
# rules.

name: Independent Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

jobs:
  review:
    name: ${{ github.event_name == 'pull_request' && 'Independent Review' || 'Independent Review (ineligible event)' }}
    concurrency:
      group: independent-review-${{ github.event.pull_request.number }}-${{ github.event_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Evaluate independent review
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          OPERATING_MODEL: ${{ vars.OPERATING_MODEL }}
          LEAN_MODE_ACTIVATED_AT: ${{ vars.LEAN_MODE_ACTIVATED_AT }}
          TRUSTED_REVIEWER_LOGINS: ${{ vars.TRUSTED_REVIEWER_LOGINS }}
        with:
          script: |
            let operatingModel = null;
            if (String(process.env.OPERATING_MODEL || '').trim().toLowerCase() === 'lean') {
              try {
                operatingModel = require('./scripts/ops/operating-model.cjs');
              } catch (error) {
                if (!(error && error.code === 'MODULE_NOT_FOUND' && String(error.message || '').includes('operating-model.cjs'))) throw error;
                core.notice('Lean operating model requested, but scripts/ops/operating-model.cjs is absent on the base commit; legacy path applies.');
              }
            }
            if (!operatingModel) {
              core.notice('Independent Review: not applicable (lean mode not requested or policy module absent on base).');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: context.payload.pull_request.number });
            if (pr.head.sha !== context.payload.pull_request.head.sha) {
              core.setFailed(`Independent Review: PR head moved to ${pr.head.sha}; this run is stale.`);
              return;
            }
            const policy = await operatingModel.loadPullRequestPolicy({ github, owner, repo, pr, env: process.env });
            if (policy.mode.mode !== 'lean') {
              core.notice(`Independent Review: not applicable (${policy.mode.reason})`);
              return;
            }
            const result = operatingModel.evaluatePolicyReview({ policy, pr });
            if (result.pass) {
              core.notice(`Independent Review passed at ${pr.head.sha.slice(0, 12)} by ${result.reviewers.join(', ')}`);
            } else {
              core.setFailed(`Independent Review blocked:\n${result.reasons.map(r => '- ' + r).join('\n')}`);
            }

      - name: Review event observed (retry signal only)
        if: github.event_name != 'pull_request'
        run: echo "${{ github.event_name }} observed; required-check-refresh.yml reruns the native Independent Review run at the live head."
