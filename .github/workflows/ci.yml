name: CI

on:
  push:
    branches:
      - main
    # Closeout bookkeeping pushes (lane manifests, proof bundles, sync files)
    # are metadata-only and cannot break the build; skipping them stops each
    # lane closeout from invalidating every open PR a second time.
    # Fail-closed: a push touching ANY path outside this list runs full verify.
    # PR-triggered runs (the required "verify" context) are unaffected.
    paths-ignore:
      - 'docs/06_status/lanes/**'
      - 'docs/06_status/proof/**'
      - '.ops/sync/**'
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # UTV2-1630: binding `staging-ci` is what releases CI_SUPABASE_*. This job
    # no longer has access to any production database credential — the
    # production secrets are not referenced anywhere in this file.
    #
    # Supersedes the ci.yml change in UTV2-1627 Phase A (frozen at b446cbb2),
    # which swapped to CI_SUPABASE_ANON_KEY/CI_SUPABASE_SERVICE_ROLE_KEY. Those
    # secret names were never provisioned; the environment created for this lane
    # uses CI_SUPABASE_PUBLISHABLE_KEY/CI_SUPABASE_SECRET_KEY. UTV2-1627 must
    # rebase onto this version rather than restore its own.
    environment: staging-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write CI local env
        run: |
          cat <<'EOF' > local.env
          NODE_ENV=development
          UNIT_TALK_APP_ENV=ci
          COMMAND_CENTER_AUTH_TOKEN=ci-command-center-token
          AUTH_SECRET=ci-auth-secret
          NEXTAUTH_SECRET=ci-nextauth-secret
          LINEAR_API_TOKEN=
          LINEAR_TEAM_ID=
          NOTION_TOKEN=
          SLACK_BOT_TOKEN=
          SLACK_SIGNING_SECRET=
          UNIT_TALK_DB_ACCESS_MODE=writable-isolated
          SUPABASE_PROJECT_REF=${{ secrets.CI_SUPABASE_PROJECT_REF }}
          SUPABASE_URL=${{ secrets.CI_SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.CI_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.CI_SUPABASE_SECRET_KEY }}
          DISCORD_BOT_TOKEN=
          DISCORD_GUILD_ID=
          DISCORD_ANNOUNCEMENT_CHANNEL_ID=
          OPENAI_API_KEY=
          EOF

      # npm's legacy audit endpoint was permanently retired (HTTP 410,
      # 2026-07-14): "This endpoint is being retired. Use the bulk advisory
      # endpoint instead." `pnpm audit` has no bulk-endpoint support in the
      # pnpm version this repo runs, so the command now fails unconditionally
      # regardless of actual dependency vulnerabilities. continue-on-error
      # keeps this advisory (reported in the CI truth summary below) rather
      # than letting an upstream API retirement fail every PR's required
      # verify check. Revert once pnpm ships bulk-endpoint support and the
      # command is confirmed working again.
      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

      # UTV2-1292: static checks only (lint/type-check/build/local + non-DB tests).
      # Live Supabase proof is isolated into the classified step below, so a
      # transient DB degradation cannot fail this gate as a code failure.
      - name: Verify (static)
        id: verify
        run: pnpm verify:static

      - name: Command Center tests
        id: command_center
        run: pnpm test:command-center

      # UTV2-1292: live-DB proof (test:db + the live t1-proof subset) wrapped by
      # the verdict classifier. It exits non-zero ONLY on a real code failure;
      # transient infrastructure degradation (schema-cache / statement timeout /
      # 520-521 / connection failure) is reported as `infra_unavailable` and does
      # NOT fail this gate. T1 strictness is preserved independently by the
      # fail-closed `T1 Proof Gate` workflow (which runs `ci:db-smoke` for tier:T1).
      - name: Live DB proof (classified)
        id: live_db
        env:
          CI_REQUIRE_DB_SMOKE: ${{ github.ref_protected || github.ref == 'refs/heads/main' }}
        # UTV2-1630: the live-DB path previously ran `pnpm test:db` directly via
        # test:live-db, bypassing ci:db-smoke's guard entirely. On 2026-07-30
        # that wrote 7 picks + 4 submissions to production from a pull request.
        # `test:db` and `test:t1-proof:live` are now gated at the script level;
        # this assertion fails the job early with a clear message.
        run: |
          set -euo pipefail
          pnpm ci:assert-staging
          pnpm verify:live-db-verdict

      - name: CI truth summary
        if: always()
        run: |
          {
            echo "### CI truth gate"
            echo "- verify_static: ${{ steps.verify.outcome }}"
            echo "- live_db (classified): ${{ steps.live_db.outcome }}"
            echo "- command_center_tests: ${{ steps.command_center.outcome }}"
            echo "- audit: ${{ steps.audit.outcome }}"
            if [ -f live-db-verdict.json ]; then
              echo ""
              echo "Live-DB verdict:"
              echo '```json'
              cat live-db-verdict.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
