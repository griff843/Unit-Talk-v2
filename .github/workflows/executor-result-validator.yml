# Executor Result Validator
#
# Validates executor completion claims independently. Does NOT trust comment
# content — verifies CI, proof files, and SHA binding via GitHub API.
#
# WORK-2026100801: this PR-controlled definition is wholly read-only. Trusted
# comment/manual/native-completion events request exact-run retries through
# required-check-refresh.yml, whose definition is loaded from the default branch.
#
# Spec: docs/05_operations/GOVERNED_LOOP_SPEC.md (sections 2B, 3A, 3D, 3E)

name: Executor Result Validator

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    # Keep the event-qualified identity defensive: only the eligible native
    # pull_request publication may satisfy the required context.
    name: ${{ github.event_name == 'pull_request' && 'Executor Result Validation' || 'Executor Result Validation (ineligible event)' }}
    if: github.event_name == 'pull_request'
    permissions:
      checks: read
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      # UTV2-1550 follow-up (Codex P1): pin to the base ref on pull_request
      # events. actions/checkout defaults to the PR's own head/merge ref,
      # which is attacker-controlled. Pinning the ref to
      # the PR's base SHA (immutable, reachable from main, never PR-supplied)
      # means that script is always the trusted main-branch version regardless
      # of what the PR itself contains.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate executor result
        uses: actions/github-script@v7
        with:
          script: |
            const { selectLatestVerifyCheckRun } = require('./scripts/ops/executor-result-check-selection.cjs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let prNumber, headSha, headRef, prLabels;

            // ── 1. Resolve PR ──────────────────────────────────────────
            const pr = context.payload.pull_request;
            prNumber = pr.number;
            headSha = pr.head.sha;
            headRef = pr.head.ref;
            const { data: issue } = await github.rest.issues.get({
              owner, repo, issue_number: prNumber
            });
            prLabels = (issue.labels || []).map(l =>
              typeof l === 'string' ? l : l.name
            );

            // ── 2. Get all PR comments ─────────────────────────────────
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100
            });

            // ── 3. Parse executor result comments ──────────────────────
            function parseResult(body) {
              if (!body) return null;
              // Strip markdown bold (**key:**) and YAML front-matter fences (---).
              const lines = body.split(/\r?\n/).map(l =>
                l.trim().replace(/^\*\*(.+?)\*\*\s*/, '$1 ').replace(/^---$/, '')
              );
              if (!lines.some(l => l === 'EXECUTOR_RESULT: READY_FOR_REVIEW')) return null;
              if (!lines.some(l => l === 'schema: executor-result/v1')) return null;

              const field = (name) => {
                const re = new RegExp('^' + name + ':\\s+(.+)$', 'i');
                const hit = lines.find(l => re.test(l));
                return hit ? hit.replace(re, '$1').trim() : null;
              };

              return {
                issueId:   field('Issue'),
                lane:      field('Lane'),
                branch:    field('Branch'),
                pr:        field('PR'),
                headSha:   field('Head SHA'),
                proofPath: field('Proof Artifact'),
              };
            }

            const parsed = comments
              .map(c => parseResult(c.body))
              .filter(Boolean);

            const errors = [];

            try {
              if (parsed.length === 0) {
                errors.push('No valid executor-result/v1 comment found on this PR.');
              } else {
                // Use the most recent valid result
                const r = parsed[parsed.length - 1];

                // ── 5. Validate schema fields ──────────────────────────
                // UTV2-1688: these two literals are duplicated from
                // scripts/ops/executor-result-validate.ts
                // (EXECUTOR_RESULT_ISSUE_ID_RE / EXECUTOR_RESULT_BRANCH_RE)
                // because a github-script `script:` block is a YAML string and
                // cannot import that module. This copy is the one that gates
                // merges. scripts/ops/executor-result-validate.test.ts reads this
                // file and asserts both literals are byte-identical to the
                // exported ones, so the pair can never drift again -- as it did
                // when `bootstrap/` was added to neither.
                if (!r.issueId || !/^(UTV2|UNI|WORK)-\d+$/i.test(r.issueId)) {
                  errors.push(`Invalid Issue ID: "${r.issueId || '<missing>'}". Must match UTV2-NNN, UNI-NNN or WORK-NNN.`);
                }

                if (!r.lane || !['claude', 'codex'].includes(r.lane.toLowerCase())) {
                  errors.push(`Invalid Lane: "${r.lane || '<missing>'}". Must be "claude" or "codex".`);
                }

                const branchRe = /^(claude|codex|bootstrap)\/(utv2|uni|work)-\d+/i;
                if (!r.branch || !branchRe.test(r.branch)) {
                  errors.push(`Invalid branch: "${r.branch || '<missing>'}". Must match claude/, codex/ or bootstrap/ followed by utv2-NNN-*, uni-NNN-* or work-NNN-*.`);
                }
                if (r.branch && r.branch !== headRef) {
                  errors.push(`Branch mismatch: comment declares "${r.branch}", PR head is "${headRef}".`);
                }

                const declaredPR = r.pr ? Number(String(r.pr).replace('#', '')) : null;
                if (!declaredPR || declaredPR !== prNumber) {
                  errors.push(`PR mismatch: comment declares "${r.pr || '<missing>'}", actual is #${prNumber}.`);
                }

                // HEAD SHA — critical for preventing stale results
                if (!r.headSha) {
                  errors.push('Head SHA missing from executor result.');
                } else if (r.headSha !== headSha) {
                  errors.push(`HEAD SHA mismatch: comment has "${r.headSha}", current PR head is "${headSha}". Re-post executor result after pushing.`);
                }

                // ── 6. Determine tier from PR labels ───────────────────
                const tierLabel = prLabels.find(l => /^tier:T[123]$/i.test(l));
                const tier = tierLabel
                  ? tierLabel.split(':')[1].toUpperCase()
                  : null;

                // ── 7. Validate proof file ─────────────────────────────
                const proofPath = r.proofPath;
                const isT3 = tier === 'T3';
                const proofSkipped = !proofPath ||
                  proofPath.toLowerCase() === 'ci only' ||
                  proofPath.toLowerCase() === 'n/a';

                if (proofSkipped && !isT3) {
                  errors.push('Proof Artifact path is required for T1/T2 issues.');
                } else if (!proofSkipped) {
                  try {
                    const { data: file } = await github.rest.repos.getContent({
                      owner, repo, path: proofPath, ref: headSha
                    });

                    if (!file.content) {
                      errors.push(`Proof file is empty: ${proofPath}`);
                    } else {
                      const content = Buffer.from(
                        file.content, 'base64'
                      ).toString('utf-8');

                      if (!content.includes('# PROOF:')) {
                        errors.push('Proof file missing "# PROOF:" header.');
                      }
                      // ── MERGE_SHA / execution identity (UTV2-1783) ──
                      // This block used to require the top-level MERGE_SHA:
                      // row to be a real hex SHA and an ancestor of the PR
                      // head, while scripts/ci/proof-binding-validator.ts
                      // required that same row to be the literal "pending
                      // merge". No bundle satisfied both, so any lane where
                      // both consumers ran was unmergeable — invisible until
                      // a migration lane tripped both.
                      //
                      // The rules now live once, in
                      // scripts/ops/proof-schema.ts, and this workflow calls
                      // that module rather than restating them. Restating
                      // them here is precisely how the two drifted apart, and
                      // a test against a restatement proves only that the
                      // copy agrees with itself. The checkout above is pinned
                      // to the PR base ref, so the module executed is always
                      // the trusted main-branch version.
                      if (!content.includes('MERGE_SHA:')) {
                        errors.push('Proof file missing "MERGE_SHA:" field.');
                      } else {
                        const fs = require('fs');
                        const os = require('os');
                        const path = require('path');
                        const { execFileSync } = require('child_process');

                        const tmp = fs.mkdtempSync(
                          path.join(os.tmpdir(), 'erv-proof-')
                        );
                        const verificationFile = path.join(tmp, 'verification.md');
                        fs.writeFileSync(verificationFile, content);

                        // evidence.json sits beside the proof artifact. Its
                        // absence selects the narrow legacy contract (the row
                        // itself must be a real SHA); it never relaxes a rule.
                        // A present-but-unreadable evidence file is an error,
                        // not a downgrade — otherwise a lane could escape the
                        // schema-v2 contract by corrupting its own evidence.
                        const evidencePath = proofPath.replace(
                          /[^/]+$/, 'evidence.json'
                        );
                        let evidenceFile = null;
                        try {
                          const { data: ev } =
                            await github.rest.repos.getContent({
                              owner, repo, path: evidencePath, ref: headSha
                            });
                          if (ev.content) {
                            evidenceFile = path.join(tmp, 'evidence.json');
                            fs.writeFileSync(
                              evidenceFile,
                              Buffer.from(ev.content, 'base64').toString('utf-8')
                            );
                          }
                        } catch (e) {
                          if (e.status !== 404) {
                            errors.push(
                              `Could not read ${evidencePath}: ${e.message}`
                            );
                          }
                        }

                        let identity = null;
                        try {
                          // --phase pre-merge is not a default and is not
                          // inferred. This workflow only ever validates an
                          // OPEN pull request, which is unmerged by
                          // definition, so merge authority cannot exist yet.
                          // Without this, a bundle that names a plausible SHA
                          // in sha_binding.merge_sha and repeats it in both
                          // markdown merge rows would be read as post-merge
                          // and pass -- granting itself authority GitHub
                          // never gave it. The CLI rejects a missing --phase
                          // rather than defaulting, so this cannot be lost.
                          const argv = [
                            'exec', 'tsx', 'scripts/ops/proof-schema.ts',
                            'proof-identity',
                            '--phase', 'pre-merge',
                            '--verification', verificationFile
                          ];
                          if (evidenceFile) argv.push('--evidence', evidenceFile);
                          identity = JSON.parse(
                            execFileSync('pnpm', argv, { encoding: 'utf-8' })
                          );
                        } catch (e) {
                          errors.push(
                            `Proof identity contract could not be evaluated: ${e.message}`
                          );
                        }

                        if (identity) {
                          for (const f of identity.failures) {
                            errors.push(`${f.field}: ${f.message}`);
                          }
                          // Execution provenance. Pre-merge this is
                          // sha_binding.verified_source_sha, never the merge
                          // row. A null anchor means the bundle failed to
                          // declare one — treat that as unverified, never as
                          // "nothing to check".
                          const anchor = identity.provenanceAnchorSha;
                          if (!anchor) {
                            if (identity.failures.length === 0) {
                              errors.push(
                                'Proof declares no execution identity to verify against the PR head.'
                              );
                            }
                          } else {
                            try {
                              const cmp = await github.rest.repos.compareCommits({
                                owner, repo, base: anchor, head: headSha
                              });
                              // "ahead": head is ahead of the anchor.
                              // "identical": same commit. Both are valid.
                              if (!['ahead', 'identical'].includes(cmp.data.status)) {
                                errors.push(
                                  `Proof execution SHA "${anchor}" is not an ancestor of PR HEAD "${headSha}" (compare status: ${cmp.data.status}).`
                                );
                              }
                            } catch (e) {
                              errors.push(
                                `Could not verify execution SHA "${anchor}": ${e.message}`
                              );
                            }
                          }
                        }
                      }
                      if (!content.includes('ASSERTIONS:')) {
                        errors.push(
                          'Proof file missing "ASSERTIONS:" section.'
                        );
                      } else {
                        const assertionCount = (
                          content.match(/^- \[[ x]\]/gm) || []
                        ).length;
                        if (assertionCount < 1) {
                          errors.push(
                            'Proof file has no assertions (need at least one "- [ ]" or "- [x]" item).'
                          );
                        }
                      }
                      if (!content.includes('EVIDENCE:')) {
                        errors.push(
                          'Proof file missing "EVIDENCE:" section.'
                        );
                      } else {
                        const fenceCount = (
                          content.match(/^```/gm) || []
                        ).length;
                        if (fenceCount < 2) {
                          errors.push(
                            'Proof file EVIDENCE section has no fenced code blocks.'
                          );
                        }
                      }

                      // Reject uppercase placeholders (case-sensitive to avoid false
                      // positives from test runner output like "ℹ todo 0").
                      if (/\b(TODO|TBD|FIXME|PLACEHOLDER|<fill-in>)\b/.test(content)) {
                        errors.push(
                          'Proof file contains placeholder text (TODO/TBD/FIXME).'
                        );
                      }
                    }
                  } catch (e) {
                    errors.push(`Proof file not found at "${proofPath}" on HEAD SHA ${headSha}.`);
                  }
                }

                // ── 8. Verify CI on exact HEAD SHA ─────────────────────
                // UTV2-1573: paginate across every page of check-runs for
                // this commit. GitHub's Checks API defaults to 30 per page;
                // this repo routinely accumulates 60-100+ check-runs on a
                // single commit (dozens of required/advisory workflows and
                // matrix jobs), so an unpaginated call can miss a real,
                // completed, successful "verify" run just because it fell
                // outside the first page -- a false-negative that fails this
                // required check for reasons unrelated to the PR's actual
                // state. `github.paginate` walks every page (no upper
                // bound); `filter: 'latest'` keeps only the newest run per
                // check-run name+app so re-runs and duplicate checks don't
                // inflate the fetched set.
                const allCheckRuns = await github.paginate(github.rest.checks.listForRef, {
                  owner, repo, ref: headSha, per_page: 100, filter: 'latest'
                });

                // Deterministically select the newest "verify" run from the
                // github-actions app -- see scripts/ops/executor-result-check-selection.cjs
                // and its test suite for the exact selection semantics.
                const ciRun = selectLatestVerifyCheckRun(allCheckRuns);

                if (!ciRun) {
                  errors.push(
                    `CI check "verify" not found on HEAD SHA ${headSha}. Wait for CI to complete.`
                  );
                } else if (ciRun.status !== 'completed') {
                  errors.push(
                    `CI check is ${ciRun.status}, not completed. Wait for CI to finish.`
                  );
                } else if (ciRun.conclusion !== 'success') {
                  errors.push(
                    `CI conclusion is "${ciRun.conclusion}", not "success". Fix CI before requesting review.`
                  );
                }
              }
            } catch (e) {
              errors.push(`Internal validation error: ${e.message}`);
            }

            // ── 9. Complete check run ──────────────────────────────────
            const passed = errors.length === 0;

            if (passed) {
              core.info('Executor result valid: proof and CI are bound to the exact PR HEAD.');
            } else {
              core.setFailed(`Executor result validation failed:\n${errors.map(e => '- ' + e).join('\n')}`);
            }
