name: Readiness Regression Gate

# UTV2-1626 — the gate now says WHICH kind of failure it found.
#
# It used to inline a bash script that exited 1 for two very different things: a
# ledger older than 48h, and a RED verdict. Both printed a red X, so a real
# regression and a forgotten artifact were indistinguishable — and since the
# ledger was never refreshed, every lane learned to ignore the check entirely.
#
# scripts/ci/readiness-ledger-gate.ts separates them:
#   LEDGER_MISSING / LEDGER_INVALID / LEDGER_STALE / DIMENSION_STALE /
#   OBSERVER_DEGRADED  → the ledger cannot be trusted (observer failure)
#   READINESS_RED      → production is measurably failing (product condition)
#
# This job reads only the committed ledger. It holds no credential and touches no
# production system.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  readiness-regression-gate:
    name: Readiness Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Evaluate the readiness ledger
        run: pnpm ci:readiness-gate
