name: Return Review Packet

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  return-review-packet:
    name: Return review packet
    runs-on: ubuntu-latest
    steps:
      - name: Detect T1/T2 PR
        id: tier
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(label => label.name);
            const tier = labels.find(label => label === 'tier:T1' || label === 'tier:T2') || '';
            core.setOutput('tier', tier);
            core.setOutput('required', tier ? 'true' : 'false');

      - name: Checkout
        if: steps.tier.outputs.required == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        if: steps.tier.outputs.required == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node
        if: steps.tier.outputs.required == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.tier.outputs.required == 'true'
        run: pnpm install --frozen-lockfile

      - name: Collect changed files
        if: steps.tier.outputs.required == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number, per_page: 100,
            });
            fs.mkdirSync('.out', { recursive: true });
            fs.writeFileSync('.out/return-review-files.txt', files.map(file => file.filename).join('\n') + '\n');

      # Same trusted resolver, same runner-temp transport, same fail-closed exit
      # handling as the other two consumers. The packet generator downstream
      # only renders the decision; it never makes one.
      - name: Resolve trusted bootstrap governance action
        id: bootstrap
        if: steps.tier.outputs.required == 'true'
        env:
          ACTION_BRANCH: ${{ github.event.pull_request.head.ref }}
          ACTION_TIER: ${{ steps.tier.outputs.tier }}
        run: |
          set -euo pipefail
          DECISION="$RUNNER_TEMP/bootstrap-action.json"
          RESOLVER="$RUNNER_TEMP/trusted-bootstrap-authorization.ts"
          rm -f "$DECISION" "$RESOLVER"

          if ! git show "origin/main:scripts/ops/bootstrap-authorization.ts" > "$RESOLVER"; then
            echo "::error::Base branch has no bootstrap governance resolver"
            exit 1
          fi
          if ! grep -q -- '--resolve-action' "$RESOLVER"; then
            echo "::warning::Trusted resolver predates bootstrap action resolution; no bootstrap identity can be granted."
            echo "state=unsupported" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ISSUE="$(printf '%s' "$ACTION_BRANCH" | grep -oEi 'UTV2-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]' || true)"
          set +e
          pnpm exec tsx "$RESOLVER" \
            --resolve-action "$ISSUE" --branch "$ACTION_BRANCH" --tier "${ACTION_TIER#tier:}" \
            --changed-files-file .out/return-review-files.txt \
            --head HEAD --output-json "$DECISION"
          CODE=$?
          set -e

          case "$CODE" in
            0) echo "state=valid" >> "$GITHUB_OUTPUT" ;;
            3) echo "::error::Bootstrap governance action refused by the trusted resolver."; exit 1 ;;
            4) echo "state=normal" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Bootstrap resolver failed with exit $CODE; failing closed."; exit 1 ;;
          esac

      - name: Generate return review packet
        if: steps.tier.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE="$(echo "${{ github.event.pull_request.head.ref }}" | sed -nE 's/.*(utv2|UTV2)-([0-9]+).*/UTV2-\2/p')"
          if [ -z "$ISSUE" ]; then
            echo "Unable to infer UTV2 issue id from branch ${{ github.event.pull_request.head.ref }}"
            exit 1
          fi
          ARGS=(
            --issue "$ISSUE"
            --pr "${{ github.event.pull_request.number }}"
            --base "origin/${{ github.event.pull_request.base.ref }}"
            --head "${{ github.event.pull_request.head.sha }}"
            --output "artifacts/return-review-packet.json"
            --risk-output "artifacts/pr-risk-packet.json"
            --json
          )
          if [ "${{ steps.bootstrap.outputs.state }}" = "valid" ]; then
            ARGS+=(--bootstrap-action-file "$RUNNER_TEMP/bootstrap-action.json")
          fi
          pnpm ops:pr-review-packet -- "${ARGS[@]}"

      - name: Upload return review packet
        if: steps.tier.outputs.required == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: return-review-packet
          path: |
            artifacts/return-review-packet.json
            artifacts/pr-risk-packet.json
          if-no-files-found: ignore
