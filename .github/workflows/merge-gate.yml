# Merge Gate
#
# THE merge-authorization policy engine for main.
#
# Risk-Scoped Merge Authority (RMA/v1), ratified 2026-09-02 under
# docs/mission/intent.md. Authority follows what a diff TOUCHES, not how its
# lane was admitted:
#
#   auto  -- the diff touches no reserved surface. Authorized on green CI.
#            `verify`, `P0 Protocol` and `Executor Result Validation` remain
#            independently required by branch protection.
#   human -- the diff touches a surface Griff reserves. Requires the
#            `griff-approved` label AND a head-SHA-bound pm-verdict/v1 APPROVED
#            comment from a CODEOWNERS member. Both; neither alone.
#
# Reserved surfaces are enumerated in
# docs/05_operations/RESERVED_RISK_SURFACES.json and classified by
# scripts/ops/merge-authority.cjs (tested: scripts/ops/merge-authority.test.ts).
# That policy reserves its own files, so RMA cannot widen its own authority --
# every change to the gate itself still requires a human.
#
# Fail-closed throughout: an unreadable policy, an unavailable diff, or any
# unclassifiable condition reserves the merge rather than releasing it.
#
# governance:pause label on PR = hard block regardless of classification.
#
# Supersedes the lane-manifest tier model (T1/T2/T3), under which every PR
# resolved to T1 and a typo fix demanded the same human relay as a production
# migration. Verdict parsing/validation is unchanged and still lives in
# scripts/ops/merge-gate-verdict.cjs.

name: Merge Gate

on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: 'PR number to re-evaluate (for P0 lanes where self-approval is structurally blocked)'
        required: true
        type: number
  pull_request:
    # UTV2-1551: `opened` was missing here, so a brand-new PR got zero Merge
    # Gate evaluation from PR creation itself -- only from a later
    # push/label/review/comment event. That could leave a fresh T1/T2 PR
    # sitting `mergeStateStatus: BLOCKED` with the required "Merge Gate"
    # check never having run at all (not failed -- never executed), with no
    # visible signal of why. Adding `opened` makes Merge Gate run and report
    # a status immediately on PR creation. This does not approve anything
    # prematurely: the gate job's own logic already fails closed when no
    # tier label / lane manifest / PM verdict exists yet (see the "Tier
    # validation failed" and per-tier branches below), which is exactly the
    # BLOCKED status a truly fresh PR should show.
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write

jobs:
  gate:
    # The required branch-protection identity is the custom check run managed
    # below. The native Actions job check must never share that name.
    name: Merge Gate Evaluator
    concurrency:
      group: merge-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_number }}
      # Every event updates the same exact-head check. Queue evaluations so an
      # older run cannot be cancelled while that canonical check is in_progress.
      cancel-in-progress: false
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, 'PM_VERDICT:'))
    runs-on: ubuntu-latest
    steps:
      # UTV2-1543 (Codex P1): materialize the repo before requiring the T1
      # verdict helper below -- without this, `require('./scripts/ops/
      # merge-gate-verdict.cjs')` throws before the check run is even
      # created, failing Merge Gate for every PR/comment/dispatch
      # evaluation, not just enforcing the new freshness rule.
      #
      # Same privilege-boundary reasoning as UTV2-1550's Executor Result
      # Validator fix: this job holds checks/pull-requests/issues: write, and
      # actions/checkout defaults to the PR's own head/merge ref on
      # pull_request(_review) events -- attacker-controlled. Pin the ref to
      # the PR's base SHA (immutable, reachable from main, never PR-supplied)
      # for those event types so a PR can never modify merge-gate-verdict.cjs
      # to defeat its own T1 freshness check. issue_comment/workflow_dispatch
      # keep the default github.sha, which already resolves to the base
      # repo's default-branch HEAD for those trigger types.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && github.event.pull_request.base.sha || github.sha }}

      # UTV2-1554 landed the final scripts/ops/merge-gate-verdict.cjs on main
      # ahead of this lane specifically so this job never needs to fetch or
      # execute PR-head content to bootstrap it. base.sha always has the
      # trusted copy; there is no first-introduction case to special-case
      # here anymore. See scripts/ops/workflow-hardening.test.ts for the
      # regression assertion that this job never fetches or executes
      # anything keyed on pull_request.head.sha.
      - name: Evaluate merge gate
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Authorized PM reviewers — must match .github/CODEOWNERS
            const AUTHORIZED_REVIEWERS = new Set(['griff843']);

            // UTV2-1543: T1 pm-verdict/v1 parsing + PR/head-SHA freshness
            // validation lives in a tested pure module, not duplicated here.
            const { parseVerdict, validateT1Verdicts } = require('./scripts/ops/merge-gate-verdict.cjs');

            // ── 1. Resolve PR ──────────────────────────────────────────
            let prNumber, headSha, headRef, baseSha, prTitle, declaredFileCount;
            if (context.eventName === 'pull_request' ||
                context.eventName === 'pull_request_review') {
              const pr = context.payload.pull_request;
              prNumber = pr.number;
              headSha = pr.head.sha;
              headRef = pr.head.ref;
              baseSha = pr.base.sha;
              prTitle = pr.title || '';
              declaredFileCount = pr.changed_files;
            } else if (context.eventName === 'workflow_dispatch') {
              prNumber = parseInt(context.payload.inputs.pull_number, 10);
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: prNumber
              });
              headSha = pr.head.sha;
              headRef = pr.head.ref;
              baseSha = pr.base.sha;
              prTitle = pr.title || '';
              declaredFileCount = pr.changed_files;
            } else {
              prNumber = context.payload.issue.number;
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: prNumber
              });
              headSha = pr.head.sha;
              headRef = pr.head.ref;
              baseSha = pr.base.sha;
              prTitle = pr.title || '';
              declaredFileCount = pr.changed_files;
            }

            // ── 2. Upsert the canonical exact-head check run ───────────
            // Identity is repository + PR + exact head SHA. PR serialization
            // above makes this read/create sequence race-free across events.
            const existingChecks = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner, repo,
                ref: headSha,
                check_name: 'Merge Gate',
                filter: 'all',
                per_page: 100,
              }
            );
            const canonicalExternalId = `merge-gate:${prNumber}:${headSha}`;
            // Match on name + exact head SHA + app only -- NOT external_id.
            // Check-runs created by the former create-on-every-event behavior
            // never had an external_id set, so requiring one here would let
            // those legacy duplicates survive untouched and keep blocking
            // branch protection forever. Any same-name check already docked
            // to this exact head is adoptable as the canonical one; prefer a
            // check that already carries the canonical external_id (stable
            // across repeated runs once adopted), otherwise fall back to the
            // most recently created same-head check.
            const matchingChecks = existingChecks
              .filter(run =>
                run.name === 'Merge Gate' &&
                run.head_sha === headSha &&
                run.app?.slug === 'github-actions'
              )
              .sort((a, b) => {
                const aCanonical = a.external_id === canonicalExternalId ? 1 : 0;
                const bCanonical = b.external_id === canonicalExternalId ? 1 : 0;
                if (aCanonical !== bCanonical) return bCanonical - aCanonical;
                return b.id - a.id;
              });

            let check = matchingChecks[0];
            if (!check) {
              const created = await github.rest.checks.create({
                owner, repo,
                name: 'Merge Gate',
                head_sha: headSha,
                external_id: canonicalExternalId,
                status: 'in_progress',
                started_at: new Date().toISOString()
              });
              check = created.data;
            } else {
              // Adopt (or re-affirm) the canonical external_id on update so a
              // legacy check without one is bound to this identity going
              // forward, and so subsequent runs pick it deterministically.
              await github.rest.checks.update({
                owner, repo,
                check_run_id: check.id,
                external_id: canonicalExternalId,
                status: 'in_progress',
                started_at: new Date().toISOString(),
                output: {
                  title: 'Merge Gate: EVALUATING',
                  summary: `Re-evaluating merge policy for PR #${prNumber} at ${headSha}.`
                }
              });
            }

            // One-time repair for heads polluted by the former create-on-every-
            // event behavior. Superseded failures become neutral so only the
            // newest exact-head check can govern branch protection.
            for (const duplicate of matchingChecks.slice(1)) {
              await github.rest.checks.update({
                owner, repo,
                check_run_id: duplicate.id,
                status: 'completed',
                conclusion: 'neutral',
                completed_at: new Date().toISOString(),
                output: {
                  title: 'Merge Gate: SUPERSEDED',
                  summary: `Superseded by canonical Merge Gate check run ${check.id} for PR #${prNumber} at ${headSha}.`
                }
              });
            }

            const errors = [];
            // UTV2-1619 capability 19: non-blocking facts the verdict depends on
            // and that a reviewer must see. A merge authorized under a bootstrap
            // governance identity would otherwise pass with the same "all
            // requirements satisfied" summary as an ordinary lane.
            const notes = [];
            let evaluatorError = null;

            try {
              // ── 3. Get PR labels ───────────────────────────────────
              const { data: issue } = await github.rest.issues.get({
                owner, repo, issue_number: prNumber
              });
              const labels = (issue.labels || []).map(l =>
                typeof l === 'string' ? l : l.name
              ).filter(Boolean);

              // ── 4. Risk-Scoped Merge Authority (RMA/v1) ────────────
              // Replaces lane-manifest tier resolution. Authority follows what
              // the diff TOUCHES, not how the lane was admitted. See
              // docs/05_operations/RESERVED_RISK_SURFACES.json and
              // docs/mission/intent.md.
              //
              // Under the tier model every PR resolved to T1, so a typo fix and
              // a production migration demanded identical human relay. Pricing
              // everything as reserved prices the real decisions at zero
              // attention. RMA reserves the eight surfaces Griff owns and
              // authorizes the rest on green CI -- `verify`, `P0 Protocol` and
              // `Executor Result Validation` remain independently required by
              // branch protection, so "authorized" here never means "unchecked".
              //
              // Both this module and the policy it reads come from the base
              // checkout pinned above, so a PR cannot supply its own rules. The
              // policy additionally reserves its own files, which is what makes
              // RMA non-self-amending: widening authority always requires a
              // human.
              // Two-phase bootstrap. This gate reads its classifier from the
              // BASE checkout, so on the one PR that FIRST introduces that
              // classifier the base commit does not have it yet and the
              // require() below throws. Treating that as an internal error made
              // RMA unlandable except by a repo-owner override of a required
              // check -- which is the one thing a merge-authority control must
              // never depend on.
              //
              // PHASE 1: base has no classifier. Reserve the merge as `human`
              // -- the MOST restrictive outcome, not a relaxation -- clearable
              // only by the ordinary reserved-surface artifacts below.
              // PHASE 2: base carries it; this branch is unreachable. Getting
              // back to PHASE 1 means deleting merge-authority.cjs from main,
              // which is itself a merge-authority-surface change and so already
              // requires a human.
              //
              // Only MODULE_NOT_FOUND enters the bootstrap path. A malformed or
              // unreadable policy still fails closed as an internal error: that
              // is corruption of a control that exists, not the absence of one
              // that does not exist yet.
              let mergeAuthority = null;
              let riskPolicy = null;
              let bootstrapPhase1 = false;
              try {
                mergeAuthority = require('./scripts/ops/merge-authority.cjs');
              } catch (e) {
                if (e.code !== 'MODULE_NOT_FOUND') throw e;
                bootstrapPhase1 = true;
              }
              if (mergeAuthority) {
                riskPolicy = mergeAuthority.loadPolicy();
              }

              // Changed files come from the API rather than a local diff so the
              // job never has to materialize PR head content.
              const changedFiles = await github.paginate(
                github.rest.pulls.listFiles,
                { owner, repo, pull_number: prNumber, per_page: 100 }
              );

              // Verdict validation stays in merge-gate-verdict.cjs, unchanged.
              // It already implements latest-verdict-wins, CODEOWNERS
              // authorization, and exact-head binding -- so a later
              // CHANGES_REQUIRED still blocks, and an approval of an earlier
              // head still does not carry forward onto new commits.
              const { data: gateComments } = await github.rest.issues.listComments({
                owner, repo, issue_number: prNumber, per_page: 100
              });
              const verdicts = gateComments
                .map(c => ({
                  user: c.user?.login,
                  userType: c.user?.type,
                  parsed: parseVerdict(c.body),
                  createdAt: c.created_at,
                }))
                .filter(v => v.parsed !== null);
              const verdictErrors = validateT1Verdicts(verdicts, {
                prNumber,
                headSha,
                authorizedReviewers: AUTHORIZED_REVIEWERS,
              });

              // previous_filename is what makes a rename classifiable. GitHub
              // reports the destination in `filename` and the reserved source
              // in `previous_filename`; dropping the latter would let
              // `git mv .github/CODEOWNERS anything-else` classify as `auto`.
              const classifiableFiles = changedFiles.map(f => ({
                filename: f.filename,
                previous_filename: f.previous_filename,
                patch: f.patch,
                status: f.status,
                // additions/deletions distinguish a pure rename (no content to
                // scan) from a rename whose patch GitHub withheld for size.
                additions: f.additions,
                deletions: f.deletions,
              }));

              // Structural manifest comparison needs the PARSED file at both
              // refs, not the patch. Three separate line-regex evasions were
              // found in review -- a JSON escape, a key split from its colon
              // across two added lines, and a runner name inside a `#` comment
              // -- and each parsed to exactly the value pnpm runs. A manifest
              // whose contents cannot be read is unclassifiable, never clean.
              const manifestPaths = new Set();
              for (const f of changedFiles) {
                for (const n of [f.filename, f.previous_filename]) {
                  if (n && /(^|\/)package\.json$/.test(n)) manifestPaths.add(n);
                }
              }
              const readManifestAt = async (p, ref) => {
                try {
                  const r = await github.rest.repos.getContent({ owner, repo, path: p, ref });
                  return Buffer.from(r.data.content, r.data.encoding || 'base64').toString('utf8');
                } catch (e) {
                  // 404 means the file genuinely does not exist at that ref.
                  // Anything else is a failure to read, which must not be
                  // reported as "unchanged" -- let it reserve.
                  if (e.status === 404) return null;
                  throw e;
                }
              };
              const manifests = {};
              for (const p of manifestPaths) {
                manifests[p] = {
                  base: await readManifestAt(p, baseSha),
                  head: await readManifestAt(p, headSha),
                };
              }

              if (bootstrapPhase1) {
                notes.push(
                  'RMA/v1 PHASE 1 (bootstrap): the trusted base checkout does not yet carry ' +
                  'scripts/ops/merge-authority.cjs. Reserving this merge as `human` -- the ' +
                  'most restrictive classification -- until it is on main. See the ' +
                  '`bootstrap` block in docs/05_operations/RESERVED_RISK_SURFACES.json.'
                );
                if (labels.includes('governance:pause')) {
                  errors.push('governance:pause label is active. All merges blocked until removed by Griff.');
                }
                const bootstrapLabels = ['griff-approved', 't1-approved'];
                if (!bootstrapLabels.some(l => labels.includes(l))) {
                  errors.push(
                    'Bootstrap (PHASE 1): requires the "griff-approved" label from a CODEOWNERS member.'
                  );
                }
                if (verdictErrors.length > 0) {
                  errors.push(...verdictErrors);
                }
              } else {
                const decision = mergeAuthority.evaluateMergeAuthority({
                  files: classifiableFiles,
                  policy: riskPolicy,
                  labels,
                  verdictApproved: verdictErrors.length === 0,
                  verdictErrors,
                  // listFiles caps at 3,000 files however far you paginate, so
                  // the classifier is told the PR's own total and reserves when
                  // what came back is short of it.
                  declaredFileCount,
                  manifests,
                });

                errors.push(...decision.errors);
                notes.push(...decision.notes);
              }

            } catch (e) {
              evaluatorError = e;
              errors.push(`Internal error: ${e.message}`);
            }

            // ── 10. Complete check run ─────────────────────────────────
            const passed = errors.length === 0;

            await github.rest.checks.update({
              owner, repo,
              check_run_id: check.id,
              status: 'completed',
              conclusion: passed ? 'success' : 'failure',
              completed_at: new Date().toISOString(),
              output: {
                // Under RMA every verdict carries notes (the classification and
                // the surfaces it matched), so the old "notes means bootstrap
                // identity" inference no longer holds -- it would have labelled
                // every ordinary approval as a bootstrap admission.
                title: passed ? 'Merge Gate: APPROVED' : 'Merge Gate: BLOCKED',
                summary: [
                  passed
                    ? 'RMA/v1: all merge-authority requirements satisfied.'
                    : `**Merge blocked:**\n\n${errors.map(e => '- ' + e).join('\n')}`,
                  notes.length > 0
                    ? `\n\n**Governance notes:**\n\n${notes.map(n => '- ' + n).join('\n')}`
                    : ''
                ].join('')
              }
            });

            if (!passed) {
              // Post visible comment on failure (fail loud)
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: prNumber,
                body: [
                  '**MERGE GATE: BLOCKED**',
                  '',
                  ...errors.map(e => '- ' + e),
                  '',
                  'Address the above before merge is authorized.'
                ].join('\n')
              });
            }

            // Policy denial is the expected fail-closed outcome and is fully
            // represented by the custom check. Only evaluator malfunction
            // fails this non-required Actions job.
            if (evaluatorError) {
              throw evaluatorError;
            }

  # ── WFR-v2 Validators ──────────────────────────────────────────────────────
  # Workflow Runtime v2 Phase D: consume proof-check, tier-sync, review state.
  # Runs in parallel with the gate job. Fails closed on stale/missing/invalid
  # state. This is advisory for T3 but blocking for T1/T2.
  wfr-validators:
    name: WFR-v2 Validators
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract issue ID from branch
        id: branch
        run: |
          BRANCH="${{ github.head_ref }}"
          # Extract UTV2-#### from branch name
          ISSUE_ID=$(echo "$BRANCH" | grep -oP 'UTV2-\d+' | head -1 || echo "")
          echo "issue_id=$ISSUE_ID" >> "$GITHUB_OUTPUT"
          echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Run tier-sync validator
        if: steps.branch.outputs.issue_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_ID="${{ steps.branch.outputs.issue_id }}"
          PR="${{ steps.branch.outputs.pr_number }}"
          echo "Running ops:tier-sync $ISSUE_ID --pr $PR --sync"
          pnpm ops:tier-sync "$ISSUE_ID" --pr "$PR" --sync

      - name: Run proof-check validator
        if: steps.branch.outputs.issue_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_ID="${{ steps.branch.outputs.issue_id }}"
          PR="${{ steps.branch.outputs.pr_number }}"
          echo "Running ops:proof-check $ISSUE_ID --pr $PR"
          # proof-check is advisory in CI (proof may not exist on branch yet)
          pnpm ops:proof-check "$ISSUE_ID" --pr "$PR" || {
            echo "::warning::proof-check FAIL for $ISSUE_ID PR #$PR (proof may not yet exist on this branch)"
          }

      - name: Check review state (WFR-v2 Phase C)
        if: steps.branch.outputs.issue_id != ''
        run: |
          ISSUE_ID="${{ steps.branch.outputs.issue_id }}"
          REVIEW_PATH=".ops/reviews/${ISSUE_ID}.json"
          if [ -f "$REVIEW_PATH" ]; then
            echo "Review state found: $REVIEW_PATH"
            # Validate schema version
            VERSION=$(jq -r '.schema_version // "missing"' "$REVIEW_PATH")
            if [ "$VERSION" != "1" ]; then
              echo "::error::Review state schema_version must be 1, got: $VERSION"
              exit 1
            fi
            # Check for self-certification
            EXECUTOR=$(jq -r '.executor // ""' "$REVIEW_PATH")
            REVIEWER=$(jq -r '.reviewer // ""' "$REVIEW_PATH")
            if [ -n "$EXECUTOR" ] && [ -n "$REVIEWER" ] && [ "$EXECUTOR" = "$REVIEWER" ]; then
              echo "::error::Self-certification detected: executor=$EXECUTOR == reviewer=$REVIEWER"
              exit 1
            fi
            echo "Review state valid: executor=$EXECUTOR reviewer=$REVIEWER"
          else
            echo "::notice::No review state at $REVIEW_PATH — expected after ops:review runs"
          fi
