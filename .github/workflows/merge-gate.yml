# Merge Gate
#
# THE tier-aware policy engine for merge authorization on main.
# Branch protection defers review policy to this check — no universal
# PR review is required at the branch level.
#
# Reads tier from the lane manifest mirrored from Linear. GitHub tier labels
# remain required evidence, but automation applies/syncs them; labels are not
# authoritative. Verifies PM verdict is from an authorized CODEOWNERS member.
#
# T1: requires t1-approved label + PM_VERDICT: APPROVED from CODEOWNERS
# T2: pm-verdict/v1 APPROVED comment from CODEOWNERS is the canonical approval path
#   (ratified 2026-05-18, UTV2-979). GitHub PR review approval is also accepted.
#   Auto-merge via `gh pr merge --auto --squash` triggers once verdict + all checks pass.
# T3: passes automatically (CI + executor-result-validator are separate gates)
#
# governance:pause label on PR = hard block regardless of tier.
#
# Spec: docs/05_operations/GOVERNED_LOOP_SPEC.md (sections 2C, 3B, 4B)

name: Merge Gate

on:
  pull_request:
    # UTV2-1551: `opened` was missing here, so a brand-new PR got zero Merge
    # Gate evaluation from PR creation itself -- only from a later
    # push/label/review/comment event. That could leave a fresh T1/T2 PR
    # sitting `mergeStateStatus: BLOCKED` with the required "Merge Gate"
    # check never having run at all (not failed -- never executed), with no
    # visible signal of why. Adding `opened` makes Merge Gate run and report
    # a status immediately on PR creation. This does not approve anything
    # prematurely: the gate job's own logic already fails closed when no
    # tier label / lane manifest / PM verdict exists yet (see the "Tier
    # validation failed" and per-tier branches below), which is exactly the
    # BLOCKED status a truly fresh PR should show.
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read

jobs:
  gate:
    # This native pull_request job is the required branch-protection result.
    # Non-PR triggers still materialize skipped jobs. Give those jobs a
    # distinct identity so review/comment/manual events cannot satisfy the
    # required context without rerunning the eligible pull_request run.
    name: ${{ github.event_name == 'pull_request' && 'Merge Gate' || 'Merge Gate (ineligible event)' }}
    concurrency:
      group: merge-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      # UTV2-1543 (Codex P1): materialize the repo before requiring the T1
      # verdict helper below -- without this, `require('./scripts/ops/
      # merge-gate-verdict.cjs')` throws before the check run is even
      # created, failing Merge Gate for every PR/comment/dispatch
      # evaluation, not just enforcing the new freshness rule.
      #
      # Same privilege-boundary reasoning as UTV2-1550's Executor Result
      # Validator fix: actions/checkout defaults to the PR's own head/merge
      # ref. Pin the read-only policy job to the PR's immutable base SHA so a
      # PR can never modify merge-gate-verdict.cjs to defeat its own T1
      # freshness check.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install trusted dependencies
        run: pnpm install --frozen-lockfile

      # The collector compares commit/blob objects but never materializes or
      # executes PR-head bytes. The working tree remains pinned to base.sha.
      - name: Fetch PR head as inert comparison data
        run: git fetch --no-tags origin "${{ github.event.pull_request.head.sha }}"

      # UTV2-1554 landed the final scripts/ops/merge-gate-verdict.cjs on main
      # ahead of this lane specifically so this job never needs to fetch or
      # execute PR-head content to bootstrap it. base.sha always has the
      # trusted copy; there is no first-introduction case to special-case
      # here anymore. See scripts/ops/workflow-hardening.test.ts for the
      # regression assertion that this job never fetches or executes
      # anything keyed on pull_request.head.sha.
      - name: Evaluate merge gate
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Authorized PM reviewers — must match .github/CODEOWNERS
            const AUTHORIZED_REVIEWERS = new Set(['griff843']);

            // UTV2-1543: T1 pm-verdict/v1 parsing + PR/head-SHA freshness
            // validation lives in a tested pure module, not duplicated here.
            const { parseVerdict, validateT1Verdicts } = require('./scripts/ops/merge-gate-verdict.cjs');

            // ── 1. Resolve PR ──────────────────────────────────────────
            let prNumber, headSha, headRef, baseSha, prTitle;
            const pr = context.payload.pull_request;
            prNumber = pr.number;
            headSha = pr.head.sha;
            headRef = pr.head.ref;
            baseSha = pr.base.sha;
            prTitle = pr.title || '';

            const errors = [];
            // UTV2-1619 capability 19: non-blocking facts the verdict depends on
            // and that a reviewer must see. A merge authorized under a bootstrap
            // governance identity would otherwise pass with the same "all
            // requirements satisfied" summary as an ordinary lane.
            const notes = [];

            try {
              // ── 3. Get PR labels ───────────────────────────────────
              const { data: issue } = await github.rest.issues.get({
                owner, repo, issue_number: prNumber
              });
              const labels = (issue.labels || []).map(l =>
                typeof l === 'string' ? l : l.name
              ).filter(Boolean);

              // ── 4. Resolve authoritative tier from lane manifest ───
              // Both ends bounded: `homework-123` or `work-123abc` must not resolve
              // as WORK-123 (UTV2-1892). The parser anchors the whole Issue: line.
              const issueMatch = (headRef || '').match(/(?:^|\/)((?:utv2|uni|work)-\d+)(?![a-z0-9])/i) ||
                (prTitle || '').match(/(?:^|[^a-z0-9])((?:UTV2|UNI|WORK)-\d+)(?![a-z0-9])/i);
              const issueId = issueMatch ? issueMatch[1].toUpperCase() : null;

              async function readManifest(ref) {
                if (!issueId || !ref) return null;
                try {
                  const { data } = await github.rest.repos.getContent({
                    owner, repo,
                    path: `docs/06_status/lanes/${issueId}.json`,
                    ref,
                  });
                  if (Array.isArray(data) || !data.content) return null;
                  return JSON.parse(Buffer.from(data.content, data.encoding || 'base64').toString('utf8'));
                } catch (error) {
                  if (error.status === 404) return null;
                  throw error;
                }
              }

              if (!issueId) {
                errors.push('No issue ID found in PR branch or title. Cannot resolve authoritative tier.');
              }

              const manifest = await readManifest(headSha) || await readManifest(baseSha);
              let authoritativeTier = manifest && /^(T1|T2|T3)$/.test(String(manifest.tier))
                ? String(manifest.tier).toUpperCase()
                : null;

              // ── 4b. Bootstrap governance identity (UTV2-1619 capability 19) ──
              // The lane system cannot bootstrap itself: Merge Gate errors
              // unconditionally on a missing authoritative tier, the only producer
              // of a lane manifest is `ops:lane-start`, and `lane-start` refuses
              // when the caps are exhausted. So the change that repairs admission
              // can never be merged. A bootstrap governance identity resolves that
              // WITHOUT fabricating a lane manifest -- it records that governance
              // self-repair was authorized rather than pretending normal lane
              // admission occurred.
              //
              // Deliberately narrow: consulted ONLY when no real manifest resolved
              // a tier, so it can never override, weaken, or shadow a genuine lane.
              //
              // TWO-PHASE AUTHORITY RESOLUTION (PM, 2026-08-05).
              //   Phase 1 -- bootstrap introduction: the artifact does not exist on
              //     base yet, because the PR introducing it is the one that needs it.
              //     Reading it from the PR head is a self-declared authority, so it is
              //     permitted ONLY under the hard constraints below, and it is
              //     announced in the verdict rather than applied silently.
              //   Phase 2 -- bootstrap operation: the artifact is on base. Base is
              //     canonical and the head copy is never consulted.
              //   Phase 3 -- retirement: no active grants remain.
              // A PR must never be able to introduce its own authority artifact and
              // use it to authorize itself. Phase 1 is the single, narrowly-bounded
              // exception that exists only so the bridge can be built; it is scoped to
              // one issue and one diff shape, and is removed once base carries it.
              const BOOTSTRAP_INTRODUCTION_ISSUE = 'UTV2-1619';
              // Strict changed-file allowlist for the phase-1 transition. Anything
              // outside this set refuses head-read entirely -- no application or
              // runtime file may ride in on a self-declared authority.
              const BOOTSTRAP_ALLOWED_FILES = new Set([
                'docs/governance/BOOTSTRAP_AUTHORIZATIONS.json',
                '.github/workflows/merge-gate.yml',
                'scripts/ops/bootstrap-authorization.ts',
                'scripts/ops/bootstrap-authorization.test.ts',
                'scripts/ops/bootstrap-head-fallback-guard.test.ts',
                'scripts/ops/lane-start.ts',
                'scripts/ops/pre-merge-authorization.ts',
                'scripts/ops/pre-merge-authorization.test.ts',
                'package.json',
              ]);
              const BOOTSTRAP_ALLOWED_PREFIXES = ['docs/06_status/proof/UTV2-1619/'];

              let bootstrapIdentity = null;
              let bootstrapSource = null;
              if (!authoritativeTier && issueId) {
                async function readBootstrapAuthorizations(ref) {
                  if (!ref) return null;
                  try {
                    const { data } = await github.rest.repos.getContent({
                      owner, repo,
                      path: 'docs/governance/BOOTSTRAP_AUTHORIZATIONS.json',
                      ref,
                    });
                    if (Array.isArray(data) || !data.content) return null;
                    return JSON.parse(Buffer.from(data.content, data.encoding || 'base64').toString('utf8'));
                  } catch (error) {
                    if (error.status === 404) return null;
                    throw error;
                  }
                }

                // Base first, always. Head is consulted only when base has nothing.
                let doc = await readBootstrapAuthorizations(baseSha);
                let candidateSource = doc ? 'base' : null;

                if (!doc) {
                  const headDoc = await readBootstrapAuthorizations(headSha);
                  if (headDoc) {
                    // Phase 1 gate. Every condition must hold or head-read is refused.
                    const introductionIssueOk = issueId === BOOTSTRAP_INTRODUCTION_ISSUE;
                    let diffScopeOk = true;
                    const offendingFiles = [];
                    try {
                      const changed = await github.paginate(github.rest.pulls.listFiles, {
                        owner, repo, pull_number: prNumber, per_page: 100,
                      });
                      for (const file of changed) {
                        const name = file.filename;
                        const allowed = BOOTSTRAP_ALLOWED_FILES.has(name)
                          || BOOTSTRAP_ALLOWED_PREFIXES.some(prefix => name.startsWith(prefix));
                        if (!allowed) { diffScopeOk = false; offendingFiles.push(name); }
                      }
                    } catch (error) {
                      // Cannot enumerate the diff -> cannot prove scope -> refuse.
                      diffScopeOk = false;
                      offendingFiles.push(`<diff enumeration failed: ${error.message}>`);
                    }

                    if (!introductionIssueOk) {
                      errors.push(
                        `A bootstrap identity was found on the PR head but not on base. Head-read is ` +
                        `permitted only for the initial governance bootstrap of ` +
                        `${BOOTSTRAP_INTRODUCTION_ISSUE}; this PR is for ${issueId}. A PR may not ` +
                        `introduce its own authority artifact and use it to authorize itself.`
                      );
                    } else if (!diffScopeOk) {
                      errors.push(
                        `A bootstrap identity was found on the PR head but not on base, and the PR ` +
                        `changes files outside the bootstrap allowlist: ${offendingFiles.join(', ')}. ` +
                        `The initial bootstrap transition may only touch the authorization artifact, ` +
                        `the Merge Gate resolution logic, the bootstrap mechanism, its tests, and its ` +
                        `proof artifacts.`
                      );
                    } else {
                      doc = headDoc;
                      candidateSource = 'head';
                    }
                  }
                }
                bootstrapSource = candidateSource;
                const entries = doc && Array.isArray(doc.authorizations) ? doc.authorizations : [];
                const now = Date.now();
                const active = entries.filter(entry => {
                  const expiry = Date.parse(String(entry && entry.expires_at));
                  return Number.isFinite(expiry) && expiry > now;
                });
                // Accumulation is refused, not resolved: more than one live
                // identity means "which one applied" has more than one answer.
                if (active.length > 1) {
                  errors.push(
                    `${active.length} unexpired bootstrap governance identities exist. ` +
                    'At most one may be active; expire or remove the others.'
                  );
                } else {
                  const candidate = active.find(
                    entry => String(entry.issue_id || '').toUpperCase() === issueId
                  );
                  if (candidate) {
                    const candidateTier = String(candidate.tier || '').toUpperCase();
                    if (candidate.lane_type !== 'governance') {
                      errors.push(
                        `Bootstrap governance identity for ${issueId} declares lane_type ` +
                        `"${candidate.lane_type}"; only "governance" may be bootstrapped.`
                      );
                    } else if (!/^(T1|T2|T3)$/.test(candidateTier)) {
                      errors.push(
                        `Bootstrap governance identity for ${issueId} declares an invalid tier ` +
                        `"${candidate.tier}".`
                      );
                    } else {
                      authoritativeTier = candidateTier;
                      bootstrapIdentity = candidate;
                    }
                  }
                }
              }

              if (!authoritativeTier) {
                errors.push(
                  `No authoritative lane manifest tier found${issueId ? ` for ${issueId}` : ''}. ` +
                  'GitHub tier labels are evidence only and cannot authorize merge by themselves.'
                );
              } else if (manifest && manifest.issue_id && String(manifest.issue_id).toUpperCase() !== issueId) {
                errors.push(`Lane manifest issue_id ${manifest.issue_id} does not match PR issue ${issueId}.`);
              }

              // A bootstrap admission must never be silently indistinguishable
              // from an ordinary one. Surface it in the gate's own output.
              if (bootstrapIdentity) {
                notes.push(
                  `Tier ${authoritativeTier} resolved from a BOOTSTRAP GOVERNANCE IDENTITY, not a lane ` +
                  `manifest. ${issueId} has no lane manifest because the concurrency governor refuses ` +
                  `its admission, and the change that repairs admission cannot merge without a tier. ` +
                  `Authorized by ${bootstrapIdentity.authorized_by} on ${bootstrapIdentity.authorized_at}, ` +
                  `expires ${bootstrapIdentity.expires_at}. Milestone: ${bootstrapIdentity.milestone}. ` +
                  `This is not normal lane admission and does not assert that a lane exists.`
                );
                // The source is the trust-relevant fact and must never be implicit.
                if (bootstrapSource === 'head') {
                  notes.push(
                    `Source: PR HEAD bootstrap artifact (not base). Reason: initial governance ` +
                    `bootstrap transition -- the artifact cannot exist on base until this PR merges. ` +
                    `This is a self-declared authority, permitted here ONLY because the issue is ` +
                    `${BOOTSTRAP_INTRODUCTION_ISSUE} and every changed file falls inside the bootstrap ` +
                    `allowlist. Once this PR merges, base carries the artifact and head is never ` +
                    `consulted again; the head fallback is scheduled for removal.`
                  );
                } else {
                  notes.push(
                    `Source: base bootstrap artifact (canonical). The PR head copy was not consulted.`
                  );
                }
              }

              // ── 5. Verify GitHub tier evidence mirrors manifest ─────
              const tierLabels = labels.filter(l =>
                /^tier:T[123]$/i.test(l)
              ).map(l => {
                const match = l.match(/^tier:(T[123])$/i);
                return `tier:${match[1].toUpperCase()}`;
              });
              const uniqueTierLabels = [...new Set(tierLabels)];
              const expectedTierLabel = authoritativeTier ? `tier:${authoritativeTier}` : null;

              if (expectedTierLabel && uniqueTierLabels.length === 0) {
                errors.push(
                  `Missing ${expectedTierLabel}. GitHub tier evidence must mirror the authoritative manifest.`
                );
              }

              if (expectedTierLabel && uniqueTierLabels.length > 0 && !uniqueTierLabels.includes(expectedTierLabel)) {
                errors.push(
                  `Tier drift: authoritative ${expectedTierLabel}, PR has ${uniqueTierLabels.join(', ')}. ` +
                  'Automation will mirror the authoritative tier; stale/manual labels cannot authorize merge.'
                );
              }

              if (expectedTierLabel && uniqueTierLabels.length > 1) {
                errors.push(
                  `Multiple tier labels found: ${uniqueTierLabels.join(', ')}. Must mirror exactly ${expectedTierLabel}.`
                );
              }

              // ── 4b. Kill switch ──────────────────────────────────
              if (labels.includes('governance:pause')) {
                errors.push(
                  'governance:pause label is active. All merges blocked until removed by PM.'
                );
              }

              if (errors.length === 0) {
                const tier = authoritativeTier;

                // ── 5. T3: auto-pass ──────────────────────────────────
                // T3 has no tier-specific policy errors. CI and executor
                // result validation remain separate required checks.

                // ── 6. T2: pm-verdict/v1 is the canonical approval path (UTV2-979, 2026-05-18) ──
                // GitHub PR review approval is also accepted. Either satisfies the gate.
                //
                // A third path (UTV2-1523) recognizes a valid EXECUTOR_RESULT/v1 comment from an
                // AUTHORIZED_REVIEWERS member as sufficient self-attestation. This exists because
                // GitHub blocks `gh pr review --approve` when the reviewing account is also the PR
                // author -- true for every executor in this repo, since Claude and Codex both open
                // PRs under the same griff843 identity. CLAUDE.md already documents self-approval as
                // intended to satisfy T2 with no PM presence required; this makes that mechanically
                // possible instead of requiring an --admin merge for every T2 PR.
                if (tier === 'T2') {
                  const { data: reviews } = await github.rest.pulls.listReviews({
                    owner, repo, pull_number: prNumber, per_page: 100
                  });
                  const approvals = reviews.filter(r => r.state === 'APPROVED');
                  if (approvals.length === 0) {
                    const { data: comments } = await github.rest.issues.listComments({
                      owner, repo, issue_number: prNumber, per_page: 100
                    });
                    // Check for pm-verdict/v1 APPROVED from an authorized CODEOWNERS member
                    const hasPmVerdictApproval = comments.some(c => {
                      if (!c.user?.login || !AUTHORIZED_REVIEWERS.has(c.user.login) || c.user?.type === 'Bot') return false;
                      const body = (c.body || '').replace(/\\n/g, '\n');
                      const lines = body.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                      return lines[0] === 'PM_VERDICT: APPROVED' && lines[1] === 'schema: pm-verdict/v1';
                    });
                    // Check for a valid executor-result/v1 self-attestation from an authorized member
                    const hasExecutorResultAttestation = comments.some(c => {
                      if (!c.user?.login || !AUTHORIZED_REVIEWERS.has(c.user.login) || c.user?.type === 'Bot') return false;
                      const body = (c.body || '').replace(/\\n/g, '\n');
                      const lines = body.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                      return lines[0] === 'EXECUTOR_RESULT: READY_FOR_REVIEW' && lines[1] === 'schema: executor-result/v1';
                    });
                    if (!hasPmVerdictApproval && !hasExecutorResultAttestation) {
                      errors.push(
                        'T2 requires a pm-verdict/v1 APPROVED comment from a CODEOWNERS member, ' +
                        'a GitHub PR review approval, or an executor-result/v1 self-attestation comment ' +
                        'from a CODEOWNERS member.'
                      );
                    }
                  }
                }

                // ── 7. T1: PM verdict + t1-approved label ────────────
                if (tier === 'T1') {
                  const { data: comments } = await github.rest.issues.listComments({
                    owner, repo, issue_number: prNumber, per_page: 100
                  });

                  const verdicts = comments
                    .map(c => ({
                      user: c.user?.login,
                      userType: c.user?.type,
                      parsed: parseVerdict(c.body),
                      createdAt: c.created_at,
                      htmlUrl: c.html_url,
                    }))
                    .filter(v => v.parsed !== null);

                  // UTV2-1543: also requires PR: and Head SHA: to match this
                  // exact PR/head, fail-closed on stale/mismatched verdicts —
                  // see scripts/ops/merge-gate-verdict.cjs and its test suite.
                  const t1Errors = validateT1Verdicts(verdicts, {
                    prNumber,
                    headSha,
                    authorizedReviewers: AUTHORIZED_REVIEWERS,
                  });
                  const t1Codes = Array.isArray(t1Errors.codes) ? t1Errors.codes : null;
                  const onlyStaleness =
                    t1Errors.length > 0 &&
                    t1Codes !== null &&
                    t1Codes.length === t1Errors.length &&
                    t1Codes.every(code => code === 'stale_head');

                  let carried = null;
                  if (onlyStaleness) {
                    const latestAuthorized = verdicts
                      .filter(v => v.userType !== 'Bot' && AUTHORIZED_REVIEWERS.has(v.user))
                      .at(-1);
                    const run = require('child_process').spawnSync(
                      'pnpm',
                      ['exec', 'tsx', 'scripts/ops/carry-forward-collect.ts',
                       '--pr', String(prNumber), '--issue', issueId],
                      {
                        encoding: 'utf8',
                        timeout: 120000,
                        env: { ...process.env, GH_TOKEN: process.env.GITHUB_TOKEN },
                      },
                    );
                    try {
                      const parsed = JSON.parse(run.stdout || '{}');
                      const completeConditions =
                        Array.isArray(parsed.conditions) &&
                        parsed.conditions.length === 7 &&
                        ['C1', 'C2', 'C3', 'C4', 'C5', 'C6', 'C7'].every((id, index) =>
                          parsed.conditions[index]?.id === id && parsed.conditions[index]?.status === 'pass');
                      if (!run.error && run.signal === null && run.status === 0 &&
                          parsed.schema === 'approval-carry-forward/v1' &&
                          parsed.verdict === 'VERIFIED' &&
                          parsed.issue_id === issueId &&
                          parsed.current_head_sha === headSha &&
                          parsed.original_verdict_sha === latestAuthorized?.parsed.headSha &&
                          parsed.original_verdict_url === latestAuthorized?.htmlUrl &&
                          completeConditions) {
                        carried = parsed;
                      }
                    } catch {
                      carried = null;
                    }
                  }

                  if (carried) {
                    const generatingRunUrl =
                      `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}` +
                      `/attempts/${process.env.GITHUB_RUN_ATTEMPT || '1'}`;
                    const disclaimer =
                      'This receipt carries forward the PM decision recorded at Original-Verdict-SHA. ' +
                      'It is not an independent review and asserts nothing about the implementation.';
                    const computed = {
                      ...carried,
                      generated_by: generatingRunUrl,
                      disclaimer,
                    };
                    core.notice(`APPROVAL_CARRY_FORWARD_COMPUTED=${JSON.stringify(computed)}`);
                    const canonicalReceipt = [
                      `APPROVAL_CARRY_FORWARD: ${carried.verdict}`,
                      `schema: ${carried.schema}`,
                      `Issue: ${carried.issue_id}`,
                      `Original-Verdict-SHA: ${carried.original_verdict_sha}`,
                      `Original-Verdict-URL: ${carried.original_verdict_url}`,
                      `Current-Head-SHA: ${carried.current_head_sha}`,
                      `Main-Anchor-SHA: ${carried.main_anchor_sha}`,
                      `PR-Diff-Patch-Id: ${carried.pr_diff_patch_id?.atApproved ?? 'unavailable'} (approved) / ` +
                        `${carried.pr_diff_patch_id?.atHead ?? 'unavailable'} (head)`,
                      `Generated-By: ${generatingRunUrl}`,
                      '',
                      'Conditions:',
                      ...carried.conditions.map(c =>
                        `- [${c.status === 'pass' ? 'x' : ' '}] ${c.id} — ${c.title}: ${c.detail}`),
                      ...(carried.admitted_paths?.length > 0
                        ? ['', 'Admitted paths:', ...carried.admitted_paths.map(a => `- ${a.path} (rule: ${a.rule})`)]
                        : []),
                      '',
                      disclaimer,
                    ].join('\n');
                    core.info(canonicalReceipt);
                    await core.summary
                      .addHeading('Computed approval carry-forward')
                      .addCodeBlock(canonicalReceipt, 'text')
                      .write();
                    notes.push(
                      `Approval carried forward from ${carried.original_verdict_sha.slice(0, 12)} ` +
                      `to ${headSha.slice(0, 12)}; original comment ${carried.original_verdict_url}`,
                    );
                  } else {
                    errors.push(...t1Errors);
                  }

                  if (!labels.includes('t1-approved')) {
                    errors.push(
                      'T1 requires "t1-approved" label on the PR. PM must apply this label after review.'
                    );
                  }
                }
              }

            } catch (e) {
              errors.push(`Internal error: ${e.message}`);
            }

            // ── 10. Complete check run ─────────────────────────────────
            const passed = errors.length === 0;
            if (passed) {
              core.info(notes.length > 0
                ? `Merge Gate approved with governance notes: ${notes.join('; ')}`
                : 'All tier-appropriate merge requirements satisfied.');
            } else {
              core.setFailed(`Merge Gate blocked:\n${errors.map(e => '- ' + e).join('\n')}`);
            }

  # ── WFR-v2 Validators ──────────────────────────────────────────────────────
  # Workflow Runtime v2 Phase D: consume proof-check, tier-sync, review state.
  # Runs in parallel with the gate job. Fails closed on stale/missing/invalid
  # state. This is advisory for T3 but blocking for T1/T2.
  wfr-validators:
    name: WFR-v2 Validators
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # This supporting read-only validator intentionally preserves the
        # pre-repair PR checkout. tier-sync and proof-check consume candidate
        # lane metadata that does not exist on the trusted base yet. The
        # required gate above remains pinned to trusted executable code; the
        # actions:write retry broker lives in required-check-refresh.yml and is
        # loaded only from the default branch.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract issue ID from branch
        id: branch
        run: |
          BRANCH="${{ github.head_ref }}"
          # Extract the UTV2-/UNI-/WORK- issue id from the branch name, bounded at both ends
          ISSUE_ID=$(echo "$BRANCH" | grep -oiP '(?<![a-z0-9])(utv2|uni|work)-\d+(?![a-z0-9])' | head -1 | tr '[:lower:]' '[:upper:]' || echo "")
          echo "issue_id=$ISSUE_ID" >> "$GITHUB_OUTPUT"
          echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Run tier-sync validator
        if: steps.branch.outputs.issue_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_ID="${{ steps.branch.outputs.issue_id }}"
          PR="${{ steps.branch.outputs.pr_number }}"
          echo "Running read-only ops:tier-sync $ISSUE_ID --pr $PR"
          pnpm ops:tier-sync "$ISSUE_ID" --pr "$PR"

      - name: Run proof-check validator
        if: steps.branch.outputs.issue_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_ID="${{ steps.branch.outputs.issue_id }}"
          PR="${{ steps.branch.outputs.pr_number }}"
          echo "Running ops:proof-check $ISSUE_ID --pr $PR"
          # proof-check is advisory in CI (proof may not exist on branch yet)
          pnpm ops:proof-check "$ISSUE_ID" --pr "$PR" || {
            echo "::warning::proof-check FAIL for $ISSUE_ID PR #$PR (proof may not yet exist on this branch)"
          }

      - name: Check review state (WFR-v2 Phase C)
        if: steps.branch.outputs.issue_id != ''
        run: |
          ISSUE_ID="${{ steps.branch.outputs.issue_id }}"
          REVIEW_PATH=".ops/reviews/${ISSUE_ID}.json"
          if [ -f "$REVIEW_PATH" ]; then
            echo "Review state found: $REVIEW_PATH"
            # Validate schema version
            VERSION=$(jq -r '.schema_version // "missing"' "$REVIEW_PATH")
            if [ "$VERSION" != "1" ]; then
              echo "::error::Review state schema_version must be 1, got: $VERSION"
              exit 1
            fi
            # Check for self-certification
            EXECUTOR=$(jq -r '.executor // ""' "$REVIEW_PATH")
            REVIEWER=$(jq -r '.reviewer // ""' "$REVIEW_PATH")
            if [ -n "$EXECUTOR" ] && [ -n "$REVIEWER" ] && [ "$EXECUTOR" = "$REVIEWER" ]; then
              echo "::error::Self-certification detected: executor=$EXECUTOR == reviewer=$REVIEWER"
              exit 1
            fi
            echo "Review state valid: executor=$EXECUTOR reviewer=$REVIEWER"
          else
            echo "::notice::No review state at $REVIEW_PATH — expected after ops:review runs"
          fi
