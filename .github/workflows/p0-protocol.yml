name: P0 Protocol
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions:
  contents: read
  pull-requests: read
  checks: write
jobs:
  p0-protocol:
    name: P0 Protocol
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    concurrency:
      group: p0-protocol-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: Resolve current PR and trusted base
        id: context
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request?.number || context.payload.issue?.number;
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
            const expectedRepo = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            if (pr.base.ref !== 'main' || pr.base.repo?.full_name?.toLowerCase() !== expectedRepo) throw new Error('P0 evaluator requires this repository protected main base');
            const {data: main} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (pr.base.sha !== main.commit.sha) throw new Error('PR base changed while resolving trusted main; rerun');
            core.setOutput('number', String(number));
            core.setOutput('base', main.commit.sha);
            core.setOutput('head', pr.head.sha);
      - name: Checkout trusted evaluator
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.base }}
          fetch-depth: 1
          persist-credentials: false
      - name: Classify and enforce P0
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.context.outputs.number }}
          EXPECTED_HEAD: ${{ steps.context.outputs.head }}
        with:
          script: |
            const fs = require('node:fs');
            const number = Number(process.env.PR_NUMBER);
            const headSha = process.env.EXPECTED_HEAD;
            const check = await github.rest.checks.create({...context.repo, name: 'P0 Protocol', head_sha: headSha, status: 'in_progress'});
            let conclusion = 'failure';
            let summary = '';
            try {
              const evaluator = './scripts/ops/tracker-independence/p0-workflow.cjs';
              if (!fs.existsSync(evaluator)) throw new Error('Trusted base lacks repository P0 evaluator; governed bootstrap review is required. Candidate code cannot authorize its own classification.');
              const {evaluatePullRequest} = require(evaluator);
              summary = await evaluatePullRequest({github, repo: context.repo, number, headSha});
              conclusion = 'success';
            } catch (error) {
              summary = error.message;
              fs.mkdirSync('/tmp/p0-event', {recursive: true});
              fs.writeFileSync('/tmp/p0-event/p0-failure-event.json', JSON.stringify({pr: number, head_sha: headSha, block_reason: summary, actor: context.actor, timestamp: new Date().toISOString(), runbook: 'docs/05_operations/P0_PROTOCOL_SPEC.md'}, null, 2));
              core.setFailed(summary);
            } finally {
              await github.rest.checks.update({...context.repo, check_run_id: check.data.id, status: 'completed', conclusion, output: {title: `P0 Protocol: ${conclusion}`, summary}});
              await core.summary.addHeading('P0 Protocol').addRaw(summary).write();
            }
      - name: Upload P0 failure event artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p0-failure-event
          path: /tmp/p0-event/p0-failure-event.json
          retention-days: 90
          if-no-files-found: ignore
