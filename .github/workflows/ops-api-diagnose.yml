name: Ops — API Diagnose

# UTV2-1610 read-only containment verification.
#
# STRICTLY READ-ONLY. No sed, no redirect into any file, no compose
# up/restart/down, no docker pull, no database access, no secret rotation.
# Every command reads a file, inspects container state, or probes HTTP.
#
# It exists because the containment run (30363396719) could not verify its own
# result: it exported UNIT_TALK_IMAGE_TAG only on the `compose up` line, so
# `compose exec` / `compose ps` failed (the compose file requires that variable
# for every service), and it probed a hardcoded host port while the compose file
# maps "${UNIT_TALK_API_HOST_PORT:-4000}:4000". Both are corrected here.
#
# Only three .env.production keys are read. The previous revision printed the
# first 20 characters of SUPABASE_SERVICE_ROLE_KEY into the run log; that leak
# is removed.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ secrets.UNIT_TALK_DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.UNIT_TALK_DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.UNIT_TALK_DEPLOY_PATH }}

jobs:
  diagnose:
    name: Diagnose API container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required secrets
        run: |
          set -euo pipefail
          missing=()
          test -n "$DEPLOY_HOST" || missing+=(UNIT_TALK_DEPLOY_HOST)
          test -n "$DEPLOY_USER" || missing+=(UNIT_TALK_DEPLOY_USER)
          test -n "$DEPLOY_PATH" || missing+=(UNIT_TALK_DEPLOY_PATH)
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'ERROR: Required secrets not configured: %s\n' "${missing[*]}"
            exit 1
          fi
          echo 'Required deployment secrets present; values remain redacted.'

      - name: Install SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.UNIT_TALK_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" || { echo 'ERROR: UNIT_TALK_DEPLOY_SSH_KEY not configured'; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Read-only containment verification
        run: |
          set -euo pipefail
          DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w 0)"
          TRANSCRIPT="$RUNNER_TEMP/diagnose.log"

          ssh "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH_B64='$DEPLOY_PATH_B64' bash -s" <<'REMOTE' | tee "$TRANSCRIPT"
          set -uo pipefail
          DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH_B64" | base64 -d)"
          cd "$DEPLOY_PATH"
          ENV_FILE=".env.production"
          RC=0

          echo '=== TIMESTAMP ==='
          date -u +%Y-%m-%dT%H:%M:%SZ

          echo '=== RELEASE TAG ==='
          if [ ! -f .unit-talk-release ]; then
            echo 'ERROR: .unit-talk-release missing'
            echo 'DIAGNOSTIC_COMPLETE=UTV2-1610'
            exit 1
          fi
          UNIT_TALK_IMAGE_TAG="$(tr -d '\r\n' < .unit-talk-release)"
          export UNIT_TALK_IMAGE_TAG
          printf 'current_release_tag=%s\n' "$UNIT_TALK_IMAGE_TAG"

          # Normalisation is deterministic and narrow: strip CR, surrounding ASCII
          # whitespace, and one layer of matching quotes. The RAW value is still
          # printed as classified evidence so normalisation can never hide drift.
          normalize_env_value() {
            printf '%s' "$1" \
              | tr -d '\r' \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
                    -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'$/\1/"
          }

          echo '=== ENV FILE CONTAINMENT KEYS (exactly-once + value) ==='
          CONTAINMENT_RC=0
          for key in SYNDICATE_MACHINE_ENABLED BOARD_PICK_WRITER_ENABLED; do
            count="$(grep -c "^${key}=" "$ENV_FILE" 2>/dev/null || true)"
            count="${count:-0}"
            raw="$(grep "^${key}=" "$ENV_FILE" 2>/dev/null | head -1 | cut -d= -f2- || true)"
            value="$(normalize_env_value "$raw")"
            printf '%s occurrences=%s raw=%s normalized=%s\n' \
              "$key" "$count" "$(printf '%s' "$raw" | od -c | head -1 | cut -c9-)" "${value:-<absent>}"
            if [ "$count" != '1' ]; then
              echo '  VERDICT: FAIL (expected exactly one occurrence)'; CONTAINMENT_RC=1; RC=1
            elif [ "$value" != 'false' ]; then
              echo '  VERDICT: FAIL (expected false)'; CONTAINMENT_RC=1; RC=1
            else
              echo '  VERDICT: PASS'
            fi
          done

          # The port is normalised with the SAME function as the containment keys
          # and validated before it is ever interpolated into a URL. Previously it
          # was read raw, so a quoted, padded or CRLF value produced a malformed
          # probe target and an unexplained FAIL.
          HOST_PORT_RAW="$(grep '^UNIT_TALK_API_HOST_PORT=' "$ENV_FILE" 2>/dev/null | head -1 | cut -d= -f2- || true)"
          HOST_PORT="$(normalize_env_value "$HOST_PORT_RAW")"
          HOST_PORT_SOURCE='env'
          if [ -z "$HOST_PORT" ]; then
            HOST_PORT=4000
            HOST_PORT_SOURCE='default'
          fi
          HOST_PORT_VALID=true
          case "$HOST_PORT" in
            ''|*[!0-9]*) HOST_PORT_VALID=false ;;
            *) if [ "$HOST_PORT" -lt 1 ] || [ "$HOST_PORT" -gt 65535 ]; then HOST_PORT_VALID=false; fi ;;
          esac
          printf 'UNIT_TALK_API_HOST_PORT raw=%s normalized=%s source=%s valid=%s\n' \
            "$(printf '%s' "$HOST_PORT_RAW" | od -c | head -1 | cut -c9-)" \
            "$HOST_PORT" "$HOST_PORT_SOURCE" "$HOST_PORT_VALID"

          echo '=== BACKUP / ROLLBACK STATE ==='
          ls -1 .env.production.utv2-1612.*.bak 2>/dev/null || echo '(no containment backup found)'
          printf 'env_file_mtime=%s\n' "$(date -u -r "$ENV_FILE" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo unknown)"

          echo '=== COMPOSE PS (api) ==='
          docker compose ps api </dev/null || { echo '  compose ps failed'; CONTAINMENT_RC=1; RC=1; }

          echo '=== RUNNING API IMAGE / STATUS ==='
          docker inspect --format 'config_image={{.Config.Image}}' unit-talk-api-1 </dev/null 2>/dev/null || true
          docker inspect --format 'image_digest={{.Image}}' unit-talk-api-1 </dev/null 2>/dev/null || true
          docker inspect --format 'status={{.State.Status}} started_at={{.State.StartedAt}} restarts={{.RestartCount}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' unit-talk-api-1 </dev/null 2>/dev/null || true

          echo '=== IN-CONTAINER CONTAINMENT VALUES ==='
          for key in SYNDICATE_MACHINE_ENABLED BOARD_PICK_WRITER_ENABLED; do
            v="$(docker compose exec -T api printenv "$key" </dev/null 2>/dev/null | tr -d '\r\n' || true)"
            printf '%s=%s\n' "$key" "${v:-<unset>}"
            if [ "$v" != 'false' ]; then
              echo '  VERDICT: FAIL (expected false inside the container)'; CONTAINMENT_RC=1; RC=1
            else
              echo '  VERDICT: PASS'
            fi
          done

          echo '=== HOST PORT HEALTH PROBE ==='
          HOST_ENDPOINT_RC=0
          if [ "$HOST_PORT_VALID" != 'true' ]; then
            printf 'host_port_health=SKIPPED (invalid port %s — refusing to construct a probe URL)\n' "$HOST_PORT"
            HOST_ENDPOINT_RC=1
          elif curl -fsS --max-time 10 "http://localhost:${HOST_PORT}/health" </dev/null >/dev/null 2>&1; then
            printf 'host_port_%s_health=PASS\n' "$HOST_PORT"
          else
            printf 'host_port_%s_health=FAIL\n' "$HOST_PORT"
            HOST_ENDPOINT_RC=1
          fi

          echo '=== CONTAINER-INTERNAL HEALTH PROBE ==='
          INTERNAL_HEALTH_RC=0
          if docker compose exec -T api wget -qO- http://localhost:4000/health </dev/null >/dev/null 2>&1; then
            echo 'container_internal_health=PASS'
          else
            echo 'container_internal_health=FAIL'
            INTERNAL_HEALTH_RC=1
            RC=1
          fi

          echo '=== VERDICTS (machine-readable, independent) ==='
          # Contract — which verdicts govern job success:
          #   CONTAINMENT_VERIFIED    REQUIRED. false => job red.
          #   INTERNAL_API_HEALTHY    REQUIRED. false => job red.
          #   HOST_ENDPOINT_REACHABLE ADVISORY. false => job stays green, reported
          #                           as a degraded state. Host publishing is a
          #                           separate defect class (UTV2-1561) and is not
          #                           a containment requirement.
          #   DIAGNOSTIC_COMPLETE     REQUIRED. absent => job red (truncated run).
          if [ "$CONTAINMENT_RC" -eq 0 ]; then echo 'CONTAINMENT_VERIFIED=true'; else echo 'CONTAINMENT_VERIFIED=false'; fi
          if [ "$INTERNAL_HEALTH_RC" -eq 0 ]; then echo 'INTERNAL_API_HEALTHY=true'; else echo 'INTERNAL_API_HEALTHY=false'; fi
          if [ "$HOST_ENDPOINT_RC" -eq 0 ]; then echo 'HOST_ENDPOINT_REACHABLE=true'; else echo 'HOST_ENDPOINT_REACHABLE=false'; fi
          echo 'HOST_ENDPOINT_SEVERITY=advisory'
          echo 'rollback_performed=false (this workflow performs no writes)'
          echo 'deployment_secrets=[REDACTED]'
          echo 'DIAGNOSTIC_COMPLETE=UTV2-1610'
          # Terminate with the accumulated status so a failed required check makes
          # the ssh command — and therefore the step — fail.
          exit "$RC"
          REMOTE

          # `set -o pipefail` above means an ssh failure propagates through `tee`,
          # so a non-zero remote exit already fails this step. These checks make the
          # contract explicit and catch a truncated run that exited 0.
          if ! grep -qx 'DIAGNOSTIC_COMPLETE=UTV2-1610' "$TRANSCRIPT"; then
            echo '::error::Diagnostic did not run to completion (sentinel absent) — treat as NO RESULT.'
            exit 1
          fi
          if ! grep -qx 'CONTAINMENT_VERIFIED=true' "$TRANSCRIPT"; then
            echo '::error::CONTAINMENT_VERIFIED=false — required verdict failed.'
            exit 1
          fi
          if ! grep -qx 'INTERNAL_API_HEALTHY=true' "$TRANSCRIPT"; then
            echo '::error::INTERNAL_API_HEALTHY=false — required verdict failed.'
            exit 1
          fi
          if ! grep -qx 'HOST_ENDPOINT_REACHABLE=true' "$TRANSCRIPT"; then
            echo '::warning::HOST_ENDPOINT_REACHABLE=false — advisory only; tracked as a separate defect class. Job remains green.'
          fi
          echo 'All required verdicts passed.'

      - name: Redact diagnostic transcript
        id: redact
        if: always()
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/diagnose.log" "$RUNNER_TEMP/diagnose-redacted.log" 2>/dev/null || : > "$RUNNER_TEMP/diagnose-redacted.log"
          # Defence in depth: the script never prints secrets, but strip any
          # KEY=value line for a secret-shaped name before publishing.
          sed -i -E 's/^([A-Z0-9_]*(KEY|SECRET|TOKEN|PASSWORD|SERVICE_ROLE)[A-Z0-9_]*)=.*/\1=[REDACTED]/' \
            "$RUNNER_TEMP/diagnose-redacted.log"
          if grep -qE '(SERVICE_ROLE|SUPABASE_[A-Z_]*KEY|BEGIN [A-Z ]*PRIVATE KEY)' "$RUNNER_TEMP/diagnose-redacted.log"; then
            echo '::error::Secret-shaped content detected in the transcript; refusing to publish the artifact.'
            exit 1
          fi

      # Publication is gated on the redaction step SUCCEEDING. `always()` alone
      # would publish even when the secret guard failed, which is the one case
      # where the artifact must never leave the runner. The guard's own `exit 1`
      # makes the job red, and this condition ensures no fallback path uploads.
      - name: Publish transcript artifact
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: utv2-1610-diagnose-${{ github.run_id }}
          path: ${{ runner.temp }}/diagnose-redacted.log
          retention-days: 30
