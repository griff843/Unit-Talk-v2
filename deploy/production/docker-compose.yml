configs:
  grafana_loki_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki:3100
          isDefault: true

services:
  api:
    image: ghcr.io/griff843/unit-talk-v2/api:${UNIT_TALK_IMAGE_TAG:?UNIT_TALK_IMAGE_TAG required}
    env_file:
      - .env.production
    environment:
      - LOKI_URL=http://loki:3100
    ports:
      - "${UNIT_TALK_API_HOST_PORT:-4000}:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 30s
      start_period: 30s
      retries: 5
    networks:
      - unit-talk
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  worker:
    image: ghcr.io/griff843/unit-talk-v2/worker:${UNIT_TALK_IMAGE_TAG:?UNIT_TALK_IMAGE_TAG required}
    env_file:
      - .env.production
    environment:
      - LOKI_URL=http://loki:3100
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - unit-talk
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'

  ingestor:
    image: ghcr.io/griff843/unit-talk-v2/ingestor:${UNIT_TALK_IMAGE_TAG:?UNIT_TALK_IMAGE_TAG required}
    env_file:
      - .env.production
    environment:
      - LOKI_URL=http://loki:3100
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # UTV2-1284: heartbeat-based liveness. `pgrep -f node` only proved a process
    # existed, not that the cycle loop advanced — so a wedged loop reported
    # "healthy" for ~5.5h (2026-06-20). healthcheck.ts exits non-zero when the
    # per-cycle heartbeat is stale. The in-process watchdog force-exits on the
    # same signal so `restart: unless-stopped` recreates the container.
    healthcheck:
      test: ["CMD-SHELL", "node_modules/.bin/tsx apps/ingestor/src/healthcheck.ts || exit 1"]
      interval: 60s
      timeout: 15s
      start_period: 90s
      retries: 3
    networks:
      - unit-talk
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'

  discord-bot:
    image: ghcr.io/griff843/unit-talk-v2/discord-bot:${UNIT_TALK_IMAGE_TAG:?UNIT_TALK_IMAGE_TAG required}
    env_file:
      - .env.production
    environment:
      - LOKI_URL=http://loki:3100
    restart: on-failure
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - unit-talk
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.1'

  grading-cron:
    image: ghcr.io/griff843/unit-talk-v2/api:${UNIT_TALK_IMAGE_TAG:?UNIT_TALK_IMAGE_TAG required}
    command: ["node_modules/.bin/tsx", "apps/api/src/grading-cron.ts"]
    env_file:
      - .env.production
    environment:
      - LOKI_URL=http://loki:3100
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'grading-cron' > /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - unit-talk
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki-data:/loki
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - unit-talk
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "127.0.0.1:3200:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - grafana-data:/var/lib/grafana
    configs:
      - source: grafana_loki_datasource
        target: /etc/grafana/provisioning/datasources/loki.yml
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - unit-talk
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.1'

  web:
    # Public marketing/website surface (apps/web). Built from
    # deploy/production/Dockerfile.nextjs; see that file for why one image serves
    # both Next.js applications.
    image: ghcr.io/griff843/unit-talk-v2/web:${UNIT_TALK_IMAGE_TAG:?UNIT_TALK_IMAGE_TAG required}
    # Deliberately NOT .env.production: the public website has no reason to hold
    # the Supabase service-role key, Discord bot token or SGO keys, and a
    # browser-facing Next.js process is the worst place to keep them.
    env_file:
      - .env.web
    expose:
      - "4200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4200/"]
      interval: 15s
      timeout: 10s
      start_period: 40s
      retries: 5
    networks:
      - unit-talk
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  smart-form:
    # Authenticated capper intake surface (apps/smart-form).
    image: ghcr.io/griff843/unit-talk-v2/smart-form:${UNIT_TALK_IMAGE_TAG:?UNIT_TALK_IMAGE_TAG required}
    # Narrow env file: Auth.js/Google credentials and the capper allow-list, and
    # nothing else. GOOGLE_CLIENT_SECRET, NEXTAUTH_SECRET and
    # ALLOWED_CAPPER_EMAILS stay server-side in this container only.
    env_file:
      - .env.smart-form
    expose:
      - "4400"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4400/login"]
      interval: 15s
      timeout: 10s
      start_period: 40s
      retries: 5
    networks:
      - unit-talk
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  command-center:
    # Operator console (apps/command-center). Reads Supabase directly and posts
    # privileged mutations to the API, so it is authenticated at the edge of its
    # own middleware and holds credentials no browser-facing surface should.
    image: ghcr.io/griff843/unit-talk-v2/command-center:${UNIT_TALK_IMAGE_TAG:?UNIT_TALK_IMAGE_TAG required}
    # Narrow env file, like web and smart-form. Notably absent:
    # SUPABASE_ACCESS_TOKEN. That is an account-scoped management PAT, not the
    # service-role key -- it can run DDL and ignores RLS -- and a web server is
    # the wrong place to keep one. Without it the storage-health panel degrades;
    # nothing else in the console depends on it.
    env_file:
      - .env.command-center
    expose:
      - "4300"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # /api/health is the one route the console leaves unauthenticated.
      test: ["CMD", "curl", "-fsS", "http://localhost:4300/api/health"]
      interval: 15s
      timeout: 10s
      start_period: 40s
      retries: 5
    networks:
      - unit-talk
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    # CADDY_DOMAIN, UNIT_TALK_WEB_DOMAIN, UNIT_TALK_SMART_FORM_DOMAIN and
    # UNIT_TALK_COMMAND_CENTER_DOMAIN must all reach the container for the
    # {$...} site addresses in the Caddyfile;
    # without them Caddy fails to parse the config and crash-loops.
    #
    # UTV2-1795: this was `.env.production`, which handed the public edge every
    # production secret in the file. It now reads a narrow edge env holding only
    # the three hostnames — the hardening the previous comment deferred, taken
    # now because .env.production gained Google OAuth credentials.
    env_file:
      - .env.edge
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      smart-form:
        condition: service_healthy
    networks:
      - unit-talk
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.1'

networks:
  unit-talk:
    driver: bridge

volumes:
  loki-data:
  grafana-data:
  caddy-data:
  caddy-config:
