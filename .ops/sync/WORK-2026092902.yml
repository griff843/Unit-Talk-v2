    description: >-
      # WORK-2026092902 — Command Center stops calling a delivered or voided
      pick "held"


      Tier: T2 · Lane type: delivery-ui (app: command-center) · Executor: claude


      Repo-owned work order (tracker independence, ratified 2026-09-05). No
      Linear issue exists for this identity by design. Part of the bounded
      official-picks controlled-release fix wave PM authorized on 2026-09-29.


      Required reading: `docs/03_product/COMMAND_CENTER_PRODUCT_CONTRACT.md`.


      ## Objective


      The pick detail page renders the `official-picks` kill-switch panel for
      every delivery-eligible pick with a human-capper promotion
      (`apps/command-center/src/app/picks/[id]/page.tsx:305-316`). An
      already-delivered pick (`ed0ed43c`, posted 2026-09-18 with a receipt)
      therefore reads "Delivery held: official-picks kill switch engaged", and
      so does a voided pick. Both statements are false: the switch no longer
      holds a delivered pick, and a voided pick is never delivered.


      ## Acceptance Criteria


      - A pure resolver decides the pick's delivery stage from data the page
      already loads (pick status, outbox rows, receipts): `voided`, `delivered`
      (a `sent` receipt on an `official-picks` outbox row), or
      `awaiting-delivery`.

      - `awaiting-delivery`: unchanged behaviour — the kill switch is read and
      rendered as held / open / missing / unavailable, failing closed.

      - `delivered`: no "Delivery held" text. The panel states the pick was
      delivered, names the receipt's Discord message id and time, and says the
      current kill-switch state does not hold it. The kill switch is not read.

      - `voided`: no "Delivery held" text and no kill-switch read; the panel
      states a voided pick is never delivered.

      - Tests extend the existing
      `apps/command-center/src/app/command-center-pages.test.tsx` (no new test
      file): delivered, voided, awaiting-with-killed, and the resolver's three
      outcomes, including a delivered pick whose switch is engaged not rendering
      "Delivery held".


      ## Guardrails


      - Display only. No API route, no write, no kill-switch change, no change
      outside `apps/command-center/` plus this lane's proof and manifest.


      ## Exit Criteria


      - PR merged on green CI per the Merge Gate's T2 path, then closed through
      `post-merge-lane-close.yml`.
