task_contract:
  schema_version: 1
  issue_id: UTV2-1745
  objective: >-
    Establish whether this system can currently produce a **trustworthy** pick.
    "Trustworthy" is the load-bearing word in the production goal, and nothing
    today proves it.

    **Read-only audit. This lane performs no writes.**
  acceptance_criteria:
    - >-
      ## Objective


      Establish whether this system can currently produce a **trustworthy**
      pick. "Trustworthy" is the load-bearing word in the production goal, and
      nothing today proves it.


      **Read-only audit. This lane performs no writes.**


      ## Why this is on the production critical path


      The first member-delivered pick must be defensible: correctly graded, with
      honest CLV, and traceable to real market data. If the existing 107,858
      picks cannot be shown to grade and resolve correctly, then delivering a
      new one is delivering an unverified claim to a paying customer. Better to
      know now than after a member sees it.


      ## Live evidence (read-only, production)


      ```text

      picks:            107,858 rows, last created 2026-07-30 20:14

      events:           789 total, 2026-04-18 -> 2026-07-02, ZERO with
      event_date >= today

      provider_offers:  8,191,206 rows

      last ingest cycle: 2026-06-30 12:54

      ```


      Note the constraint this imposes: there are **no future events**, so this
      audit is necessarily retrospective — it must prove correctness against
      historical picks, not generate a new one.


      ## Allowed scope


      * `scripts/ops/pick-truth-audit.ts` and its test

      * Its own `.ops/sync` and proof paths


      ## Prohibited scope


      * **No writes** — no regrading, no backfill, no CLV recomputation
      persisted

      * No `packages/domain/**`, `packages/contracts/**` (Tier C)

      * No `packages/db/src/repositories.ts`, `runtime-repositories.ts`,
      `lifecycle.ts` (Tier C)

      * No `apps/api/src/*-service.ts` (Tier C)

      * No `.github/workflows/**` (Tier C — collides with the active migration
      lane)

      * No SGO, ingestion, delivery, unpark, or production mutation


      ## Acceptance tests


      1. For a bounded sample of settled picks, independently recompute the
      grade from stored market data and report agreement rate, with every
      disagreement itemised.

      2. Report CLV resolvability: what fraction can resolve CLV, and for those
      that cannot, the **named** reason (the known `missing_event_context` class
      is a hypothesis to test, not an answer to assume).

      3. Identify picks that are structurally undeliverable — orphaned event,
      missing participant, unresolvable market — with counts.

      4. Produce a single honest verdict: **can this system currently produce a
      trustworthy pick, yes or no**, with the evidence. A "no" is a valid and
      useful result.

      5. Read-only. The test asserts no write path is reachable.


      ## Required proof


      `app-runtime` profile with real `runtime_proof.queries` and `row_counts`.
      Include agreement rates and failure-class counts. `pnpm verify:static`
      exit 0.


      ## Stop conditions


      Stop and return if the audit shows a systemic grading or CLV defect
      affecting a material share of picks — that becomes a product-truth
      decision, not a lane.


      ## Production mutation boundary


      **No production mutation.** Findings feed a later, separately-authorized
      remediation.
