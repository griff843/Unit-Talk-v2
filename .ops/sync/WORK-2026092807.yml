    description: >-
      # WORK-2026092807 — Smart Form states the server's delivery decision


      Tier: T2 · Lane type: delivery-ui · Executor: claude


      Repo-owned work order (tracker independence, ratified 2026-09-05). No
      Linear issue exists for this identity by design.


      ## Objective


      - The Smart Form receipt reports the delivery posture the server already
      returns (`deliveryPosture`: `track-only`, `delivered`, `delivery-refused`,
      with `deliveryRefusedReason`), instead of falling back to "Saved, not
      delivered".

      - The bet-slip copy states the ratified behaviour: Track Only stays Track
      Only; an authorized capper may explicitly request delivery, which the
      server authorizes or refuses and never widens from Track Only.


      ## Why


      - Since the Track Only intent guard was deployed, the server never widens
      a Track Only request, and `submitPickController` returns
      `deliveryPosture`. The client type drops that field, so a Track Only
      receipt cannot say Track Only and a refused delivery request is shown
      without its reason.

      - The bet slip still says "the server decides delivery" for a Track Only
      request, which describes the pre-fix behaviour.


      ## Acceptance Criteria


      - `resolveDeliveryDisposition` reads `deliveryPosture` when present:
      `track-only` yields a Track Only disposition stating no delivery record
      was created; `delivery-refused` yields a refusal disposition carrying the
      server's reason; `delivered` yields the queued disposition. It still reads
      the server response only, and falls back to today's behaviour when the
      field is absent (older API build).

      - `SubmitPickResult` declares `deliveryPosture`, `deliveryRefusedReason`
      and `deliveryTarget` as optional server fields.

      - The bet-slip line for a Track Only request says it will stay Track Only
      and never be delivered; for a delivery request it says the server
      authorizes or refuses it.

      - Existing tests in `apps/smart-form/test/api-client.test.ts` are extended
      to cover each posture and the fallback. No new test file.


      ## Guardrails


      - No API, contract, containment or kill-switch change. Client presentation
      only.


      ## Exit Criteria


      - PR merged on green CI, then closed through `post-merge-lane-close.yml`
      without `pr`.
