task_contract:
  schema_version: 1
  issue_id: UTV2-1789
  objective: "Command Center production auth fail-open override: explicit
    fail_open defeats production/staging fail-closed and grants full-operator
    dev_bypass"
  acceptance_criteria:
    - |-
      ## Classification

      **T1 / Tier C. Claude-owned. Must NOT be dispatched to a Codex lane.**

      Authority: `docs/05_operations/DELEGATION_POLICY.md`

      * `:117` — "**Security or privacy posture changes** — authentication, authorization, data exposure... Even a 'small' change here is Tier C plus PM presence."
      * `:124` / `:143` — "**Environment variable additions or removals**... default changes" / "Credentials / secrets / `.env*` (any env var addition, removal, or default change) — Always escalate. Configuration surface is PM-only."
      * `:226` — "**A Codex lane is never authorized to run Tier C work** — Tier C is Claude Code only, because the planning + merge touchpoints require direct PM dialogue."

      Requires PM plan approval **and** PM merge approval. Do not self-approve.

      ## Verified defect (2026-08-30, origin/main @ 247f1504)

      Command Center production auth is fail-closed *by default* — but that default is overridable by a single environment variable, and the override grants full operator identity.

      **Precedence bug. **`isCommandCenterAuthRequired` (`apps/command-center/src/lib/server-api.ts:301-322`) checks `explicitMode` **before** it checks the environment:

      ```
      309:  if (explicitMode === 'fail_open' || explicitMode === 'disabled') {
      310:    return false;
      ...
      317:  const appEnv = readEnv(env, 'UNIT_TALK_APP_ENV')?.toLowerCase();
      318:  const nodeEnv = readEnv(env, 'NODE_ENV')?.toLowerCase();
      319:  return (
      320:    appEnv === 'production' || appEnv === 'staging' || nodeEnv === 'production'
      321:  );
      ```

      So `COMMAND_CENTER_AUTH_MODE=fail_open` (or the alias `UNIT_TALK_COMMAND_CENTER_AUTH_MODE`, or `UNIT_TALK_OPERATOR_RUNTIME_MODE=fail_open`) returns `required=false` **even when** `UNIT_TALK_APP_ENV=production`. The production/staging branch is never reached.

      **Consequence — full-operator bypass, not merely "auth off".** With `required=false` and no credential configured, `config.enabled` is false (`:149`) and `authenticateCommandCenterRequest` returns:

      ```
      212:  if (!config.enabled) {
      213:    return {
      214:      ok: true,
      215:      auth: { role: 'operator', actor: 'command-center:dev-bypass', method: 'dev_bypass' },
      ```

      Every unauthenticated request is authenticated as a **full operator**. `apps/command-center/src/middleware.ts:53-59` then records it as a legitimate `command_center.privileged_action` — so the audit trail affirmatively attests to a bypassed request.

      **Blast radius beyond the UI.** The same override satisfies the privileged-database gate: `apps/command-center/src/lib/data/client.ts:55-57` gates service-role Supabase connections on `assertCommandCenterAuthConfig`, which passes trivially under `fail_open`. It also drops the outbound API key requirement — `assertCommandCenterApiKeyConfig` (`server-api.ts:179-191`) only requires `UNIT_TALK_CC_API_KEY` when auth is required, and `resolveCommandCenterApiHeaders` (`:69-72`) simply omits the `Authorization` header.

      **The bypass value is the shipped example default. **`apps/command-center/.env.example:5` is literally `COMMAND_CENTER_AUTH_MODE=fail_open`, with no warning comment. Root `.env.example:217` carries the same default (`:216` documents both values as valid).

      **Mitigating context, stated honestly:** Command Center is **not currently deployed to production** (`deploy/production/docker-compose.yml` runs `api`, `worker`, `ingestor`, `discord-bot`, `grading-cron` only; no workflow builds a command-center image). This is a latent defect that would become live on the first deployment — which is exactly why it must be fixed **before** any Command Center deployment lane, not after.

      ## Scope

      1. **Precedence** — an explicit `fail_open`/`disabled` mode must not override a production or staging environment. Production/staging must be fail-closed unconditionally. Decide and document whether `fail_open` remains honored in local/dev only, or is removed entirely.
      2. `dev_bypass` — must be impossible to reach in production/staging. Decide whether it remains a dev-only affordance or is removed. It must never mint `role: 'operator'` in a production-mode process.
      3. **Audit truthfulness** — a bypassed request must not be logged as a legitimate privileged action.
      4. **Example environment default** — `apps/command-center/.env.example` must not ship a bypass default; it must default fail-closed with an explanatory comment. (Tier C: `.env*` default change.)
      5. **Tests** — prove production/staging fail-closed **by execution, not by presence**: assert that with `UNIT_TALK_APP_ENV=production` plus `COMMAND_CENTER_AUTH_MODE=fail_open` and no credential, the request is refused and no `dev_bypass` operator identity is minted. Include the inverted/mutation case per `/mutation-test` — the test must fail if the guard is removed.
      6. **Root** `.env.example` **assessment** — assess and report the identical `fail_open` default at root `.env.example:217` and the sibling `*_RUNTIME_MODE=fail_open` defaults (`:37` api, `:87` worker, `:100` alert-agent, `:146` discord-bot, `:168` ingestor, `:186` provider-payload-archive). **Assess only — do not modify** without separate PM approval, since root `.env.example` is a shared configuration surface beyond Command Center.

      ## Explicitly out of scope

      * Redesigning shared database authority or the service-role read path (documented as residual risk in [UTV2-1788](https://linear.app/unit-talk-v2/issue/UTV2-1788/command-center-phase-0-stabilization-consolidate-the-authoritative)'s proof).
      * Deploying Command Center.
      * Any `apps/api/**` auth change (`apps/api/src/auth.ts` is its own always-escalate surface).
      * Modifying root `.env.example` without separate approval (item 6 is assessment only).

      ## Sequencing — must NOT start concurrently with [UTV2-1788](https://linear.app/unit-talk-v2/issue/UTV2-1788/command-center-phase-0-stabilization-consolidate-the-authoritative)

      `docs/governance/LANE_CONCURRENCY_POLICY.md` §1 and `CONCURRENCY_CONFIG.json` `type_caps."delivery-ui".max_per_app = 1`: only one Delivery/UI lane per app may be active. [UTV2-1788](https://linear.app/unit-talk-v2/issue/UTV2-1788/command-center-phase-0-stabilization-consolidate-the-authoritative) holds the `command-center` slot and is actively rewriting `src/lib/` and `src/components/`. Starting this lane concurrently would be refused by `ops:lane-start`, and would in any case conflict.

      **Start only after** [UTV2-1788](https://linear.app/unit-talk-v2/issue/UTV2-1788/command-center-phase-0-stabilization-consolidate-the-authoritative) **merges and its lane closes.** Then re-verify the defect still reproduces against the post-1788 head before implementing — 1788 touches neither `server-api.ts` nor `middleware.ts`, so it is expected to persist, but confirm rather than assume.

      ## Definition of done

      1. Production/staging authentication is fail-closed and cannot be downgraded by any environment variable.
      2. No `dev_bypass` operator identity is reachable in production/staging.
      3. Bypassed requests are never recorded as legitimate privileged actions.
      4. `apps/command-center/.env.example` defaults fail-closed with an explanatory comment.
      5. Execution-proven tests, including a mutation/inversion case demonstrating the guard actually fails on the condition it names.
      6. Root `.env.example` and sibling `fail_open` runtime-mode defaults assessed and reported, unmodified.
      7. PM plan approval recorded before implementation; PM merge approval on the exact head.

      ## Provenance

      Discovered during [UTV2-1788](https://linear.app/unit-talk-v2/issue/UTV2-1788/command-center-phase-0-stabilization-consolidate-the-authoritative) Phase 0 truth establishment (2026-08-30). Originally mis-scoped **into** that T2 Codex lane; removed and escalated here after `DELEGATION_POLICY.md` review. [UTV2-1788](https://linear.app/unit-talk-v2/issue/UTV2-1788/command-center-phase-0-stabilization-consolidate-the-authoritative) was stopped mid-run and re-dispatched under a narrowed contract that forbids its Codex executor from touching `server-api.ts`, `middleware.ts`, or `.env.example`. No auth or configuration file was modified by that lane — verified by diff scan before the narrowing.
