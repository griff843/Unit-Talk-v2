      `/pick`, operator controls, deferred tools and `/upgrade`. The `/upgrade`
      command stays registered and unchanged.


      `/trial-status`: keep the existing access title and tier labels.
      Descriptions by resolved tier:


      | Resolved tier | Description |

      |---|---|

      | Free | Welcome to Unit Talk. Join the conversation in our public
      channels. For help with your access, open a private ticket in
      <#1285609124050108436>. |

      | Trial | Your trial includes access to the VIP channels. For help with
      your trial or access, open a private ticket in <#1285609124050108436>. |

      | VIP | Your access includes the VIP channels. For help finding your way
      around, visit <#1559933414281322586>. |

      | VIP+ | Your access includes the VIP and VIP+ channels. For help finding
      your way around, visit <#1559933414281322586>. |

      | Existing reserved tier | For help with your access, open a private
      ticket in <#1285609124050108436>. |


      Only the existing `isCapper` flag adds **Submitting picks**: "Use the
      [Unit Talk pick form](https://picks.unit-talk.com/submit)." Roles never
      imply expiry, renewal, payment, role grants, alert availability or
      delivery.


      ## File Scope


      - apps/discord-bot/src/commands/help.ts

      - apps/discord-bot/src/commands/trial-status.ts

      - apps/discord-bot/src/discord-bot-foundation.test.ts


      ## PR opening is sequenced (overrides any generic "open a draft PR" step)


      Every pull request, including a draft, runs the shared `staging-ci-db`
      job. That job holds one running and one pending slot, and a third arrival
      cancels the pending proof of another lane. So:


      - Commit and push the lane branch as normal.

      - **Do not open a pull request.** When implementation and local
      verification are complete, write `.out/ops/ready-for-pr/<this issue
      id>.md` in the lane worktree. List the head SHA, the focused test commands
      and their results, and the observed model and effort.

      - Production Claude opens the PR when the staging slot is free, then
      reports the PR number back. After that, ask Production Claude before every
      push to the open PR.
