version: 1
approval:
  allow_multiple_issues: false
  skip_sync_required: false
entities:
  issues:
    - WORK-2026111102
  findings: []
  controls: []
  proofs: []
task_contract:
  schema_version: 1
  issue_id: WORK-2026111102
  objective: >-
    Rollout step 1: an operator command that turns an Odds API `/scores`
    response into events and full-game results, proven on doc-derived fixtures
    and on staging, with Track Only grading demonstrated end to end on staging.
    It cannot write to production and contacts the vendor only when a key is
    deliberately supplied with `--live` (code-complete, never run in this lane).
    No migrations: `game_results.source`, `events.metadata` and
    `system_runs.run_type` are unconstrained.

    Out of scope: scheduled ingestion, player props, models, a general provider
    framework, any change to the ingestor daemon, `deploy.yml`, containment, SGO
    code or SGO controls, Smart Form, the stale-input classification.

    ### Files

    | File | Change | |---|---| | `apps/ingestor/src/odds-api-fetcher.ts` | Fix
    `fetchOddsApiScores` only: return a new `OddsApiScoreEvent[]` type (no
    `bookmakers`), plus `rawBody`, `fetchedAt` and quota telemetry from
    `x-requests-remaining`, `x-requests-used`, `x-requests-last` (missing header
    gives null). Reject `daysFrom` outside 1 to 3 (integers only) before any
    request. Any non-200 throws carrying status and body. No other function
    touched | | `apps/ingestor/src/odds-api-scores-parser.ts` (new, pure) |
    `parseOddsApiScores(raw, league, now)` returns per-event `final` /
    `not_final` / `rejected(reason)`. No DB, no I/O | |
    `apps/ingestor/src/odds-api-scores-team-map.ts` (new) | Static `(league,
    exact vendor team string) -> participants.external_id` table for the 124
    teams (30 MLB, 30 NBA, 32 NFL, 32 NHL), with a header stating which strings
    are doc-derived and unconfirmed. Named so it falls under the A1 audit
    allow-list pattern `/odds-api-scores/` | |
    `apps/ingestor/src/odds-api-scores-resolver.ts` (new) |
    `resolveOddsApiScores(parsed, league, runId, repositories)`: resolve teams,
    guard against foreign events and existing results, upsert event and
    participants, insert results. Returns a counted summary with a reason per
    skipped event | |
    `apps/ingestor/src/__fixtures__/odds-api-scores/*.doc-derived.json` (new) |
    Hand-written responses matching the documented shape; provenance label in
    the file name, asserted by the loading test | |
    `scripts/ops/odds-api-scores-sync.ts` (new) + `package.json` script
    `results:odds-api-scores` | Operator CLI, modelled on
    `scripts/backfill-sgo-history.ts` | |
    `scripts/ops/track-only/odds-api-scores-staging.t1-proof.test.ts` (new) |
    Staging T1 proof (test 38), modelled on
    `scripts/ops/track-only/sgo-journey-staging.t1-proof.test.ts`, registered in
    `test:t1-proof:live` | | `apps/api/src/grading-service.ts` (+
    `grading-service.test.ts`) | Add `odds-api` to
    `TRUSTED_GRADING_EVENT_PROVIDERS`; add `'odds-api':
    'odds-api-scores.operator-run'` to `REQUIRED_INGESTION_SOURCE_BY_PROVIDER`;
    add the two provider-scoped rules below |

    Team mapping: exact string match only; no suffix, prefix or fuzzy match; a
    team not in the table skips the whole event. The derivation `UPPER(name,
    non-alphanumerics to "_") + "_" + league` reproduces almost every production
    `external_id` (`SACRAMENTO_KINGS_NBA`); explicit entries are needed for
    `STLOUIS_CARDINALS_MLB`, `ST_LOUIS_BLUES_NHL`, `OAKLAND_ATHLETICS_MLB`,
    `UTAH_HOCKEY_CLUB_NHL`, `PHILADELPHIA_76ERS_NBA` and
    `MONTREAL_CANADIENS_NHL`, each marked unconfirmed until the vendor
    `/participants` list is recorded. A scores entry is matched to home or away
    by `name` equality with `home_team` / `away_team`, never by array position.
    Do not reuse `namesMatch` or `resolveOddsApiEvents` from
    `ingest-odds-api.ts`.

    ### CLI contract

    ```

    pnpm results:odds-api-scores --league <NFL|NBA|NHL|MLB> [--days-from 1|2|3]
    \
         (--fixture <path> | --live) [--apply]
    ```

    Default is dry-run through `createDryRunIngestorRepositoryBundle`; output is
    the JSON blast-radius report plus the per-event decision list.

    `--fixture` reads a file and makes no network call. `--live` requires
    `ODDS_API_KEY` and is the only path that contacts the vendor. Exactly one of
    the two is required; neither is a default.

    `--apply` writes. The CLI refuses `--apply` when the configured Supabase
    project ref is production (`zfzdnfwdarxucxtaojxm`) and exits non-zero before
    any read or write. No override flag in this phase.

    All arguments are validated together before any work, and one message lists
    every problem with the full corrected invocation.

    Every run, dry or applied, prints credits used and remaining (null for
    fixtures). Applied runs open a `system_runs` row with
    `run_type='odds-api-scores.operator-run'`, opened as failed and upgraded on
    completion.

    ### Parser: an event is `final` only when all hold

    `completed === true`.

    `scores` is an array of exactly two entries whose `name` values equal
    `home_team` and `away_team` exactly, one each.

    Both `score` strings match `^\d+$`.

    `last_update` is a valid timestamp, later than `commence_time`, and not in
    the future.

    `now - last_update >= 15 minutes` (settle delay).

    `id` is 32 characters and `sport_key` equals the requested league's key.

    Tie rule: equal scores are accepted only for NFL. Equal scores in NHL, NBA
    or MLB are rejected as `tie_not_possible`.

    Anything else is `not_final` (clean pre-game or live shape) or `rejected`
    with a named reason. Rejected and not-final events write no results.

    ### Resolver

    Teams: both must resolve through the static table to exactly one
    `participants` row of type `team` in that sport; otherwise skip the event
    (`team_unmapped`).

    Foreign-event guard: if an event with a different provenance (`sgo`,
    `operator-manual-entry`, anything not `odds-api`) exists for the same two
    teams on the same Eastern date, skip (`ambiguous_existing_event`). No
    odds-api row is ever written onto another provider's event, and no second
    event is created beside it.

    Start-time guard: if the event already exists and the stored `starts_at`
    differs from `commence_time` by more than 6 hours, skip
    (`commence_time_changed`).

    Event row: `external_id` = vendor `id` unchanged; `event_name` = `"{away
    display_name} @ {home display_name}"` from canonical participants;
    `event_date` = Eastern date of `commence_time`; `status='completed'` only
    for a `final` parse; roles `home` and `away` in `event_participants`. A
    `completed` event is never regressed by a later non-final response.

    Event metadata: `{ source: 'odds-api', providerKey: 'odds-api',
    ingestionSource: 'odds-api-scores.operator-run', ingestionCycleRunId,
    starts_at, sport_key, home_team_name, away_team_name, resultsProof: {
    matchMethod: 'static-team-map', providerEventId, providerLastUpdate,
    fetchedAt, completedObserved: true, payloadKind: 'live' |
    'fixture-doc-derived' | 'fixture-recorded' } }`.

    Results, `source: 'odds-api'`, written only on `final`: `game_total_ou`
    (participant null, home + away); `team_total_ou` (home; away; that team's
    score); `game_spread_margin` (home; away; own minus opponent);
    `game_moneyline_win` (home; away; 1 / 0, or 0.5 each on an NFL tie). No
    other key is ever written; no period, regulation or 3-way key.

    Existing truth: if any `game_results` row already exists for the event under
    one of these keys, the event's results are skipped and counted
    (`results_already_present`). The CLI never reads or writes
    `settlement_records` or `picks`.

    ### Fixtures (doc-derived, each labelled in its file name)

    NBA final (documented example shape), live game, upcoming game with nulls,
    NFL tie, NHL regulation final, NHL overtime final (one-goal margin), NHL
    shootout as hypothesised (winner credited one goal), NHL shootout as feared
    (equal scores, `completed: true`), `completed: true` with `scores: null`,
    non-numeric score, score name not matching either team, swapped array order,
    `last_update` null on a completed game, unknown team string, wrong
    `sport_key`. The two NHL shootout fixtures are marked "behaviour unconfirmed
    by vendor".

    ### Grading (Track Only, after matching and freshness proof)

    For an event whose provider is `odds-api`, in addition to the four existing
    provenance checks:

    the pick must satisfy `isEvidencePlanePick(pick)`, else skip with
    `event_provenance_provider_scope_track_only`;

    `metadata.resultsProof` must have `completedObserved === true`, a
    `providerEventId` equal to `event.external_id`, a `providerLastUpdate` later
    than `metadata.starts_at`, and `payloadKind` not starting with `fixture`
    unless the run is against a non-production database; else skip with
    `event_provenance_results_proof_missing`.

    `sgo` behaviour, the moneyline and spread dedicated-key rules, and the
    stale-input classification are unchanged.

    ### Tests (all 38 required)

    Fetcher: 1. `daysFrom` 0, 4, 1.5 rejected before any request; 1, 2, 3 sent.
    2. Non-200 (401, 429, 500) throws and carries status; no partial result. 3.
    Quota headers surface in telemetry; missing headers give null. 4. Scores
    type has no `bookmakers`.

    Parser: 5. Documented completed example parses to final with integer scores.
    6. Live and upcoming are `not_final`. 7. `completed: true` with null scores,
    one score, three scores, non-numeric, negative, decimal: rejected. 8. Score
    names not equal to home/away: rejected; swapped array order: correct
    home/away assignment. 9. `last_update` null, before `commence_time`, in the
    future, or inside the settle delay: not final. 10. NFL tie accepted; NBA and
    MLB tie rejected. 11. NHL shootout, winner credited: 3-2 parses to final,
    total 5, margin +1/-1. 12. NHL shootout, equal scores with `completed:
    true`: rejected `tie_not_possible`; nothing written. 13. NHL overtime
    one-goal final parses as an ordinary final.

    Resolver: 14. Every one of the 124 map entries resolves to an existing
    canonical team (fixture catalog generated from the production external-id
    list). 15. Unknown team string skips the whole event; no partial rows. 16.
    "Kings", "Jets", "Rangers", "Giants", "Cardinals", "Panthers" resolve only
    within their own league and only by full string. 17. Foreign-provenance
    event for the same matchup and date: skipped, zero writes. 18. Pre-existing
    result rows on the event: skipped, rows and `sourced_at` unchanged. 19.
    Re-run is idempotent: no new rows, no updated rows. 20. Margin sign for both
    sides; moneyline 1/0; NFL tie 0.5/0.5 and margin 0. 21. No results before
    final; event stays non-completed. 22. Only the four keys are ever written
    (assert the full key set of a run). 23. `commence_time` drift over 6 hours:
    skipped. 24. A `completed` event is never regressed to `scheduled` by a
    later non-final response.

    CLI: 25. No `--apply`: zero writes, blast-radius report printed. 26.
    `--apply` against the production ref exits non-zero before any read or
    write. 27. Neither `--fixture` nor `--live`: usage error listing all
    problems; `--live` without a key fails with no request. 28. `--fixture`
    makes no network call (injected fetch asserts zero calls).

    Grading: 29. `odds-api` event with full provenance and proof grades a Track
    Only game total, team total, spread and moneyline pick. 30. Same event
    refused for a `posted` pick. 31. `odds-api` with `ingestionSource:
    'ingestor.cycle'` refused; without `resultsProof` refused; with
    `providerEventId` mismatch refused. 32. An event shaped like the legacy
    `resolveOddsApiEvents` output (no `providerKey`, no run id) still refused.
    33. `1p_total_ou`, `1p_moneyline` and a hypothetical `regulation_moneyline`
    classify `unsupported`; an NHL final does not grade them. 34. NHL Track Only
    total on a shootout final grades on the credited score; on the equal-score
    fixture the pick stays ungraded. 35. A pick that already has a settlement is
    not re-settled when an odds-api result appears. 36. Track Only settlement
    creates no outbox row and no recap. 37. Existing `grading-service.test.ts`,
    `results-resolver.test.ts`, `ingest-odds-api.test.ts` pass unchanged.

    Staging T1 proof: 38. Fixture payload through injected fetch, real staging
    tables, ids namespaced by `CI_FIXTURE_RUN_ID`: event, participants and
    results persist; the grading pass reads them back and writes the settlement;
    the outcome is derived, not seeded; no delivery row appears; vendor not
    contacted. Runs only through `test:t1-proof:live` in the CI staging job
    (`staging-ci-db`); it must refuse any target other than the staging project.
  acceptance_criteria:
    - "`pnpm verify` green and the CI staging live-proof job green; tests 1 to
      38 present and passing."
    - "`grep` shows `fetchOddsApiScores` called only from the new CLI path, and
      no import of `namesMatch` or `resolveOddsApiEvents` from the new files."
    - A dry run of each fixture reports zero writes; the staging apply run's row
      counts equal the dry-run report.
    - A second staging apply of the same fixture changes zero rows.
    - "`--apply` with production configuration exits non-zero before any read or
      write (test 26). After merge, production read-only counts of
      `game_results` with `source='odds-api'` and `events` with
      `metadata->>'providerKey'='odds-api'` both return 0."
    - The set of distinct `market_key` values written equals exactly the four
      keys.
    - Both NHL shootout tests pass, and the equal-score case writes nothing.
    - No diff in `deploy.yml`, `ingestor-runner.ts`, `index.ts`,
      `results-resolver.ts`, `ingest-odds-api.ts`, any `sgo-*` file, containment
      configuration or `scripts/audit-provider-scope.ts`.
    - Every fixture file name carries `doc-derived` or `recorded`, and a test
      fails if an unlabelled file is added.
    - "Provider audit (per D7): run `npx tsx scripts/audit-provider-scope.ts` on
      `origin/main` and on the PR head, diff the active-work-drift hit lists,
      require zero new hits, and record both lists (61 baseline) in the proof as
      visible debt. The audit script is not edited and no required CI is
      bypassed or weakened."
    - The `package.json` diff is limited to the `results:odds-api-scores` script
      and adding the new test files to existing test script lists (per D6).
    - T1 evidence bundle tied to the merge SHA; `t1-approved` label and
      `pm-verdict/v1` present before merge (PM-owned; never posted by the
      executor).
