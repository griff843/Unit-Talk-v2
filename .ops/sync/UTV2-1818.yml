  schema_version: 1
  issue_id: UTV2-1818
  objective: Automated main mutations can indefinitely invalidate exact-head T1
    approvals under strict branch freshness
  acceptance_criteria:
    - |-
      **Classification:** factory / governance support backlog. Not Ready. Not dispatched. Does not block factory launch.

      ## Problem

      Under `strict: true` branch protection, an approved T1 PR can be starved indefinitely by non-product automated commits to `main`. Exact-head approval artifacts (`t1-approved`, `pm-verdict/v1`, `EXECUTOR_RESULT`) all bind to a specific head SHA, so any sync required to restore freshness destroys the approval that was just granted.

      ## Measured reproducer (PR #1476, [UTV2-1699](https://linear.app/unit-talk-v2/issue/UTV2-1699/lane-maximizer-discovery-repair-bare-invocation-returns-an-empty-board), 2026-09-01)

      1. PR #1476 exact-head required checks green at `eb9072837a7f517036a53452d55be14f909a11c2`.
      2. PM applied exact-head T1 approval (`t1-approved` + `pm-verdict/v1` APPROVED) at that head.
      3. The readiness-ledger bot pushed `19a143a27c9951ce514f24ebcfab56b43b6a31b6` — `ops(readiness): refresh ledger [skip ci]` — to `main` ~50 seconds later, touching only `docs/06_status/readiness/readiness-score.json`.
      4. Strict freshness immediately made the approved PR BEHIND; the merge was refused with *"the head branch is not up to date with the base branch."*
      5. The sanctioned `pr-update-branch` sync produced a new head (`f0d21d23…`), which also moved the proof anchor (`docs/06_status/readiness/` is outside `proof-binding-validator`'s `PROOF_ONLY_PREFIXES`), forcing a proof re-anchor and a further new head (`56db713d…`).
      6. The exact-head approval is now stale and must be re-issued. The cycle can repeat on the next ledger refresh.

      ## Required future outcome

      Preserve **all** of: strict branch freshness, exact-head T1 approval semantics, and existing branch/PR controls — while preventing non-product automated `main` updates from indefinitely starving approved merges.

      **Do not prescribe the fix yet.** Investigate the interaction among:

      * readiness-ledger automation (cadence, whether it must write to `main` at all, whether it can batch or defer during an open approved T1)
      * merge mutex / serialization (`merge-lock`, `merge-closeout-mutex`)
      * GitHub merge queue and `update-branch` behaviour under `strict: true`
      * the exact-head approval lifecycle (whether an approval can survive a sync that provably changes no reviewed file)

      ## Related

      * Proof-anchor coupling: a sync that touches any path outside `PROOF_ONLY_PREFIXES` invalidates `verified_source_sha` and forces a second head change.
      * Adjacent proof-receipt integrity work: [UTV2-1817](https://linear.app/unit-talk-v2/issue/UTV2-1817/proof-receipts-are-not-mechanically-checked-against-the-tree-they-bind).
