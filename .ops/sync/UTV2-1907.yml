task_contract:
  schema_version: 1
  issue_id: UTV2-1907
  objective: "C1a: pipeline capper attribution must read picks.capper_id, not
    metadata.capper"
  acceptance_criteria:
    - >-
      Runtime half of the C1 capper-attribution correction. C1b (`UTV2-1905`)
      covers the Command Center reads and is queued behind the `delivery-ui`
      slot; this lane covers the pipeline reads in `apps/api`.


      ## Measured reads (2026-09-14)


      * `apps/api/src/promotion-service.ts:1327` —
      `readMetadataString(pick.metadata, 'capper') || pick.source`

      * `apps/api/src/promotion-service.ts:1894`, `:1900`, `:1912` — same
      pattern, in the operator-picks comparison path

      * `apps/api/src/clv-feedback.ts:58` — `typeof pickMetadata['capper'] ===
      'string' ? pickMetadata['capper'] : pick.source`


      `picks.capper_id` is a real column with a foreign key
      (`picks_capper_id_fkey`, `packages/db/src/database.types.ts:2200`).
      Attribution is currently read out of a JSON blob and silently falls back
      to `pick.source`, which is a *channel*, not a capper — so every
      non-attributed pick collapses into a pseudo-capper named after its source,
      and multiple cappers are not reliably separated.


      ## Outcome


      Every capper-facing read in `apps/api` resolves from `picks.capper_id`,
      with an explicit `unattributed` sentinel where the column is null. No
      silent fallback to `source`. Tests include a mutation control proving the
      fallback removal is actually asserted.


      ## Out of scope


      The wider `metadata.capper` read surface in other apps —
      `grading-service.ts:1175`, `recap-service.ts:681`, command-center
      `picks-workflow.ts:122` / `queues.ts:690,711` / `analytics.ts:250`,
      discord-bot `live.ts:90` / `my-picks.ts:88`,
      `apps/worker/src/delivery-adapters.ts:414`,
      `scripts/utv2-257-runtime-proof.ts:180`. C1 spans four apps and is at
      least three lanes; this is the `apps/api` runtime one.


      Containment unchanged: SGO off, member delivery disabled, Track Only
      containment enabled, no production writes.
