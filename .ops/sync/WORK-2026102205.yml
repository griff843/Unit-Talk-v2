      WORK-2026102205 — Privilege-only view migration: positively-asserting alternate to the relation-decoy precondition drill
      Tier: T1
      Lane type: governance
      Executor: codex

      Source: PM plan disposition on PR #1775, comment 6349139659 (authorizes a separately governed, narrowly scoped drill amendment; not merge approval). First intended consumer: PR #1775 (`supabase/migrations/20261022090000_revoke_governed_pick_performance_anon.sql`). #1775 and its files are NOT modified by this lane.

      ## Gate design (binding, from PM)

      1. **Mechanical classifier** (`scripts/ci/`): strip comments and string-literal noise, split into statements, and require every statement to be one of: `BEGIN`, `COMMIT`, `ALTER VIEW <schema.view> SET|RESET (security_invoker ...)`, `GRANT|REVOKE ... ON [TABLE] <schema.view> ...`, or a role-existence-guard `DO $$ ... $$` block that matches a strict allowlist (only `IF EXISTS pg_roles`, `FOREACH` over role names, `EXECUTE format('REVOKE|GRANT ... ON TABLE <the one target view> ...')`, `has_table_privilege` checks, `RAISE EXCEPTION`). Anything else (CREATE/DROP/ALTER TABLE, CREATE VIEW/FUNCTION, schema mutation, data DML, any statement naming a second relation, unknown DO content, mixed) => NOT privilege-only => fall back to the existing drill requirements (fail safe).
      2. **Declaration is checked, never trusted**: an anchored policy marker (`-- PRIVILEGE-ONLY-VIEW: <schema.view> security_invoker=true anon=none authenticated=none service_role=select`) selects the alternate drill but never exempts: it is accepted only if the classifier passes AND the declared view equals the view named in the SQL AND the view resolves on scratch Postgres to a relation of kind `v`. A declaration with failing classification, unresolved target, or non-view target FAILS the drill (no fallback to exemption). A fake/comment-only marker on a non-privilege-only migration fails.
      3. **Alternate drill** on scratch Postgres: create the roles and a stand-in for the target view (permissive pre-state mirroring the down script's restored state), apply the migration, POSITIVELY assert `security_invoker=true` from `pg_class.reloptions`, assert `has_table_privilege` for every privilege for anon/authenticated/service_role against the expected state DERIVED FROM THE MARKER (not hard-coded for one view), run `db/migrations-rollback/<same-name>.down.sql` and assert the pre-state is restored exactly, reapply and assert parity with the first apply (up/down/up).
      4. Wire into `.github/workflows/migration-reversibility-gate.yml` (around the "Drill each new migration's fail-closed precondition" step) so the classification happens before the marker greps, with no weakening of the existing relation/routine/seed drills, and add adversarial fixtures to the workflow.
      5. **Negative tests** under `scripts/ci` (`pnpm exec tsx --test`) that demonstrably fail closed: omitted revocation; migration leaving anon SELECT; wrong security_invoker; down script that does not restore; and proofs the exception CANNOT be used for CREATE TABLE, schema mutation, mixed migrations, a fake declaration/comment, or an unresolved/non-view target.

      ## File Scope

      - .github/workflows/migration-reversibility-gate.yml
      - scripts/ci/migration-precondition-drill.ts
      - scripts/ci/migration-precondition-drill.test.ts
      - scripts/ci/privilege-only-view-drill.ts
      - scripts/ci/privilege-only-view-drill.test.ts
      - package.json
      - .ops/work/WORK-2026102205.md
