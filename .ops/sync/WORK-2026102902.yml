      ## Acceptance Criteria


      - Unit tests in `model-routing.test.ts`:
        - The function sets the observed values and keeps the original declaration under `override.declared`.
        - It refuses empty fields, a no-op and an empty `authorized_by` or `reason`.
        - A reconciled block passes `validatePreMergeModelRoutingEvidence` against a sidecar that records the observed model with `override_used: true` and a matching `override_authorized_by`. It fails against the original declaration.
        - `validatePersistedModelRouting` refuses a reconciled block.
      - Unit tests in `lane-manifest.test.ts`:
        - `reconcile-routing` rewrites the manifest.
        - It refuses a non-Codex manifest, a `done` lane and missing flags, and names every missing flag in one error.
