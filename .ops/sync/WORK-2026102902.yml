      A Codex lane's `model_routing` is fixed at lane-start from a policy
      profile (`--model-profile`). Nothing can change it afterwards. Closeout
      (`rebindModelRoutingJsonSha`, `scripts/ops/proof-generate.ts`) and the
      pre-merge contract (`validatePreMergeModelRoutingEvidence`) both refuse a
      proof `model-routing.json` whose model, reasoning effort or profile
