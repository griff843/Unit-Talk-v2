    issue_url: https://linear.app/unit-talk-v2/issue/UTV2-1732/executors-receive-no-task-contract-repair-the-autonomous-execution
    title: "Executors receive no task contract: repair the autonomous execution work
      order"
    description: |-
      # ROUND 2 — REQUIRED CORRECTIONS (two independent reviews: REJECT / RISK HIGH)

      PR #1437 round 1 built the right core: `task_contract` in `.ops/sync`, `renderTaskContract()` in both prompts, `contract_hash` bound to `epoch.objective_identity`, three fail-closed refusals, 126 tests green. Verified by execution: the prompt carries the contract; the refusal fires on an EMPTY `acceptance_criteria`, not merely a missing file; a closed checkpoint accepts a correction brief; both executors share one renderer; scope is exactly as declared. **Do not restart — correct in place.**

      Two blockers make it unmergeable as-is.

      ## R1 BLOCKER — existing checkpoints have no migration, and become doubly stuck

      Verified live: `.out/ops/execution-checkpoints/UTV2-1729.json` has `status: in_progress`, `epoch.objective_identity: "UTV2-1729:codex/utv2-1729-proof-producing-contract"` (the OLD scheme) and **1 open attempt**.

      Post-merge that lane is refused twice over:

      * `codex-exec.ts` / `claude-exec.ts` refuse it — `objective_identity !== contract_hash`
      * `clearCheckpoint` also refuses it — the open-attempt guard

      No recovery tooling ships in this PR. **Required:** a migration/backfill for existing checkpoints, or a reset command able to retire an open-but-abandoned attempt. Prove it by executing the recovery against the real `UTV2-1729` checkpoint and showing it dispatchable afterwards.

      ## R2 BLOCKER — lane-start now hard-depends on a live Linear fetch and a heading format

      `fetchLinearTaskSource` reads only `issue.description` (never comments), and `buildTaskContract` throws `missing acceptance criteria` unless an `Objective` / `Acceptance Criteria` / `Exit Criteria` / `Required Outcome` heading parses non-empty.

      Verified: `UTV2-1667`'s real description carries only `Authority`, `Ownership`, `Scope — Phase 1 ONLY`, `Explicitly EXCLUDED`, `Required test coverage`, `Review budget`, `Guardrails`, `Expected file scope`. So `pnpm ops:lane-start UTV2-1667` **hard-fails after merge** — the exact lane being held for regeneration. Separately, any Linear outage now blocks every lane-start repo-wide (15s curl timeout, no degraded path).

      **Required:** a fallback deriving the contract from the raw description/title when no recognized heading exists, or a one-time migration; and dispatch must not brick when Linear is unavailable.

      ## R3 — codex-exec breaks its own JSON contract on the new failure mode

      `codex-exec.ts:704` calls `generateExecutionPacket` unwrapped. `claude-exec.ts:310` wraps it and emits `{ok:false, code:'PRECONDITION_FAILED'}`. On a task-contract failure Codex dies with a raw stderr string and no parseable `CodexExecResult`, breaking every JSON-parsing caller — on precisely the scenario this PR introduces. Wrap it to match.

      ## R4 — the rework-correction identity guard is bypassable

      `recordReworkCorrections` refuses only when `UNIT_TALK_EXECUTION_EPOCH_ID` / `_ATTEMPT` / `_MINIMUM_REVISION` are present; stripping them in a subshell (`env -u ...`) defeats it, and `--authority` is unverified free text. The only test covers the case where the vars ARE present. Either strengthen the boundary or document it explicitly as detective-only, and add a test for the stripped-env case.

      ## R5 — `contract_hash` is self-consistency, not tamper-resistance

      `assertTaskContract` re-derives the hash from the same file it validates, and no CI gate re-derives from an independent source; consistent edits to `.ops/sync/<id>.yml` plus the manifest `task_packet_hash` satisfy every check. Either add independent re-verification, or remove the "immutable"/tamper-proof language from the PR body and `renderTaskContract` output so the claim matches what is enforced.

      ## R6 — integration coverage is missing for exactly what failed

      Every current fixture is hand-authored with the new headings already applied. Add tests driving: a **real legacy** Linear description (use `UTV2-1667`'s actual body) through `lane-start` `main()`; an existing checkpoint carrying the old `objective_identity` through `codex-exec` `main()`; and a Linear API timeout during dispatch.

      ## R7 — dead code

      `buildSyncYml()` in `lane-start.ts` is unused; every call site now uses `buildSyncYmlWithTaskContract`. Remove it.

      ## R8 — spec doc is OUT of scope

      `docs/05_operations/LANE_MANIFEST_SPEC.md` lacks the new `LaneManifest.task_packet_hash` field. **Do not edit that file** — it is outside this lane's `file_scope_lock`. Record it as a follow-up in the proof bundle.

      ## Board note (not this lane's work)

      `merge-risk.ts` currently reports three `hard_fail` conditions: `TIER_C_CONFLICT` [UTV2-1667](https://linear.app/unit-talk-v2/issue/UTV2-1667/phase-1-implementation-deployment-truth-evidence-host-journal)↔[UTV2-1732](https://linear.app/unit-talk-v2/issue/UTV2-1732/executors-receive-no-task-contract-repair-the-autonomous-execution) and [UTV2-1729](https://linear.app/unit-talk-v2/issue/UTV2-1729/proof-producing-contract-is-broken-repair-the-canonical-generator-so)↔[UTV2-1732](https://linear.app/unit-talk-v2/issue/UTV2-1732/executors-receive-no-task-contract-repair-the-autonomous-execution) over `scripts/ops/lane-start.ts`, plus `MERGED_PR_ACTIVE_LANE` for [UTV2-1383](https://linear.app/unit-talk-v2/issue/UTV2-1383/null-stake-units-backfill-and-constraint-validation-repair-2902-legacy). These are board-state reconciliation items for the orchestrator, not code defects to fix here.

      ---

      ## Defect

      **A dispatched executor is never told what to do.** It infers the task from file scope, branch name, and the state of an existing PR.

      `buildCodexPrompt()` (`scripts/ops/codex-exec.ts:528`) assembles exactly four things:

      ```
      ## Allowed file scope        ← manifest.file_scope_lock
      ## Required verification     ← derived from tier
      ## Closeout instructions     ← derived
      ## Repo brief                ← .claude/agent-brief.md (repo-global, identical for every lane)
      ```

      `generateExecutionPacket(manifest)` (`scripts/ops/execution-packet.ts:103-114`) builds the packet from the **lane manifest**. The `ExecutionPacket` type has no objective, no acceptance criteria, no guardrails, no non-goals, no exit criteria. `grep -c comment scripts/ops/execution-packet.ts` returns 0, and the only `description` reference is a string about PR titles.

      So the work order that reaches an executor contains **no statement of the work**.

      ## Why this is a fail-open rather than an inconvenience

      A fresh lane usually succeeds, because scope plus branch name make the task inferable. The failure appears on **correction rounds**, where the executor must do something different from what the repository already shows — and there the packet says nothing, the PR looks green, and the run reports success.

      Observed on [UTV2-1729](https://linear.app/unit-talk-v2/issue/UTV2-1729/proof-producing-contract-is-broken-repair-the-canonical-generator-so) across three consecutive epochs:

      | Round | Channel used for the brief | Result |
      | -- | -- | -- |
      | 1 | issue description (rewritten before dispatch) | good work, incomplete |
      | 2 | Linear **comment** | never read — packet ingests no comments. Run reported *"PR is ready for review… blocked only on the PM verdict"*. `truth-check-lib.ts` untouched |
      | 3 | issue **description** (`# ROUND 2 — REQUIRED CORRECTIONS`) | `ROUND 2` appears **0 times** in the run. Codex called `linear.get_issue` via its own MCP only at the **end**, after concluding the PR was done. Gate files untouched |

      Three epochs, roughly two hours of executor time, and the actual correction was never attempted — while every run produced polished proof artifacts and reported success. Polished proof kept returning because proof is what the packet *does* describe.

      The checkpoint findings channel is real but unusable between runs: `buildResumeBrief()` injects *"Established findings (do not re-derive)"* and *"Pending actions carried forward"* into the prompt, but `recordPendingActions` refuses a closed checkpoint with `execution_checkpoint_missing`, so a rejected epoch cannot be given corrections.

      ## Required outcome

      Every dispatched executor receives a complete, authoritative work order containing:

      * objective
      * acceptance criteria
      * guardrails
      * non-goals
      * required evidence
      * exit criteria
      * **during rework:** the exact unresolved findings and required corrections

      The task contract must be **captured before execution**, **integrity-checked and epoch-bound**, consumed identically by Claude and Codex, and **fail closed when absent**. The binding hash detects drift and corruption between the sync record and the manifest; it is not tamper-resistance, because it is re-derived from the record it validates.

      Linear may supply source material during orchestration, but **executor success must not depend on the executor voluntarily querying Linear.**

      ## Guardrails

      * No direct-`main` work.
      * No inference from branch name, file scope, PR body, or the repo-global brief.
      * Executors cannot rewrite their own task or acceptance contract.
      * Closed checkpoints must still accept an authorized rework correction brief.
      * Preserve production containment; no SGO-dependent work.
      * Independent adversarial review is mandatory.
      * **Do not fold** [UTV2-1729](https://linear.app/unit-talk-v2/issue/UTV2-1729/proof-producing-contract-is-broken-repair-the-canonical-generator-so)'s proof-binding implementation into this lane. [UTV2-1729](https://linear.app/unit-talk-v2/issue/UTV2-1729/proof-producing-contract-is-broken-repair-the-canonical-generator-so) and its rejected history are preserved.

      ## Exit criteria

      1. A fresh dispatch prompt contains the complete task contract.
      2. Dispatch **fails before spawning** if objective or acceptance criteria are missing.
      3. A rework after a completed or rejected epoch contains the original task **plus** the exact corrections.
      4. Task and correction content are **hash-bound** to the execution epoch.
      5. Both Claude and Codex consume the same contract.
      6. An end-to-end [UTV2-1729](https://linear.app/unit-talk-v2/issue/UTV2-1729/proof-producing-contract-is-broken-repair-the-canonical-generator-so) re-dispatch produces **substantive changes to** `scripts/ops/truth-check-lib.ts` **and** `.github/workflows/executor-result-validator.yml` — the two files three blind epochs never touched.
      7. [UTV2-1729](https://linear.app/unit-talk-v2/issue/UTV2-1729/proof-producing-contract-is-broken-repair-the-canonical-generator-so) then passes fresh independent review, recovers [UTV2-1383](https://linear.app/unit-talk-v2/issue/UTV2-1383/null-stake-units-backfill-and-constraint-validation-repair-2902-legacy), and regenerates [UTV2-1667](https://linear.app/unit-talk-v2/issue/UTV2-1667/phase-1-implementation-deployment-truth-evidence-host-journal) before its merge.

      Criterion 6 is the real test: it is falsifiable, and it is exactly what every previous round failed.

      ## Sequencing

      This is fixed **before** further autonomy tuning. It caps what autonomous dispatch can achieve on any corrective round, and it explains the [UTV2-1729](https://linear.app/unit-talk-v2/issue/UTV2-1729/proof-producing-contract-is-broken-repair-the-canonical-generator-so) failure pattern.
