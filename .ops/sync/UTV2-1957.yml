    title: Production-safe post-migration verification for UTV2-1370 closeout
    description: >-
      ## Objective


      Provide the production-safe post-migration verification control required
      to close UTV2-1370 after its already-applied production migration.


      This is a bounded control lane. It does not change retention behavior,
      apply DDL, create a retention plan, run a canary, prune rows, or delete
      data.


      ## File scope


      * .github/workflows/production-post-migration-verify.yml

      * docs/05_operations/DB_ENVIRONMENT_OPERATOR_POLICY.md

      * docs/05_operations/DB_MIGRATION_WORKFLOW.md

      * docs/05_operations/db-writer-classification.json

      * package.json

      * scripts/ci/production-post-migration-verify.test.ts

      * scripts/ci/production-post-migration-verify.ts


      ## Acceptance Criteria


      * Preserve pnpm test:db and all writable/live DB suites as staging-only
      behind ci:assert-staging.

      * Provide a main-only, production-bound verifier using warehouse_reader, a
      session default of read-only, and an explicit read-only transaction.

      * Require exact local/remote migration-ledger alignment and the applied
      UTV2-1370 migration.

      * Verify the expected retention tables and RPCs, exact phase-role
      privilege boundaries, RLS, SECURITY DEFINER functions, and each
      immutability trigger bound to its expected table/function with tgenabled
      not disabled.

      * In --ledger-file mode, reject SUPABASE_ACCESS_TOKEN; keep it only on
      required Supabase CLI steps and remove it from every spawned psql
      environment.

      * Keep a separate authoritative production Live Schema Parity PASS
      mandatory before UTV2-1370 lane close.

      * Reject staging evidence as a substitute for production truth.


      ## Verification


      * pnpm test:production-post-migration

      * pnpm exec tsx --test scripts/ci/staging-path-enforcement.test.ts
      scripts/ci/workflow-production-credential-guard.test.ts

      * pnpm verify:static

      * pnpm exec tsx scripts/ci/r-level-check.ts --base origin/main --head HEAD

      * exact-head protected CI and staging proof where required
