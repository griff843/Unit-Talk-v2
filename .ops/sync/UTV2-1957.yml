task_contract:
  schema_version: 1
  issue_id: UTV2-1957
  objective: >-
    Provide the production-safe post-migration verification control required to
    close UTV2-1370 after its already-applied production migration.

    This is a bounded control lane. It does not change retention behavior, apply
    DDL, create a retention plan, run a canary, prune rows, or delete data.
  acceptance_criteria:
    - Preserve pnpm test:db and all writable/live DB suites as staging-only
      behind ci:assert-staging.
    - Provide a main-only, production-bound verifier using warehouse_reader, a
      session default of read-only, and an explicit read-only transaction.
    - Require exact local/remote migration-ledger alignment and the applied
      UTV2-1370 migration.
    - Verify the expected retention tables and RPCs, exact phase-role privilege
      boundaries, RLS, SECURITY DEFINER functions, and each immutability trigger
      bound to its expected table/function with tgenabled not disabled.
    - In --ledger-file mode, reject SUPABASE_ACCESS_TOKEN; keep it only on
      required Supabase CLI steps and remove it from every spawned psql
      environment.
    - Keep a separate authoritative production Live Schema Parity PASS mandatory
      before UTV2-1370 lane close.
    - Reject staging evidence as a substitute for production truth.
  guardrails: []
  non_goals: []
  required_evidence: []
  exit_criteria: []
  unmapped_sections:
