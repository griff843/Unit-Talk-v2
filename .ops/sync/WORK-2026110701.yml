    description: >-
      # WORK-2026110701 — Reconcile status-document authority pointers


      Tier: T2

      Lane type: governance

      Executor: claude


      Source: PM directive of 2026-11-07 ("initiate the Unit Talk documentation
      consolidation", first governed cleanup lane). PM's read-only audit of
      `main` confirmed authority contradictions between five documents.


      ## Objective


      Fix four confirmed contradictions, changing only navigation, status
      labeling and demonstrably contradictory pointers:


      1. `docs/05_operations/docs_authority_map.md` calls `PROGRAM_STATUS.md`
      superseded and also lists it as the "Primary status view".

      2. Root `CLAUDE.md` and `docs/START_HERE.md` still direct agents to that
      superseded file.

      3. `docs/06_status/CURRENT_STATE.md` claims canonical snapshot status but
      was last verified 2026-06-25, so its recorded GREEN readiness can be
      mistaken for current readiness.

      4. The mission plan and runtime measurements are newer than that snapshot;
      authority is reconciled without inventing operational status.


      ## Acceptance Criteria


      - Changed files are exactly: `CLAUDE.md`, `docs/START_HERE.md`,
      `docs/05_operations/docs_authority_map.md`, `docs/mission/spec.md`,
      `docs/06_status/CURRENT_STATE.md` (plus this work order and proof files).

      - `PROGRAM_STATUS.md` is no longer presented as a status source in those
      five files; `CURRENT_STATE.md` is presented as a dated snapshot with live
      evidence and `docs/mission/plan.md` overriding it.

      - `CURRENT_STATE.md` gains a snapshot-status note; no recorded fact in it
      is edited.

      - No new status authority, readiness definition, gate, lane type or tier.
      No change to `intent.md`, any contract, workflow, merge authority, proof
      archive or closed lane manifest.

      - Every path referenced by the changed lines exists.


      ## Guardrails


      - Documentation only. Preserve ratified policy and historical evidence.

      - Do not touch `docs/06_status/proof/` archives (other than this lane's
      own) or closed lane manifests.


      ## Required Evidence


      - Exact diff, a cross-reference validation log, PR head SHA and check
      results for PM review.
