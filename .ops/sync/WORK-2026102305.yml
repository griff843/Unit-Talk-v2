    description: >-
      # WORK-2026102305 — Move dated readings out of the always-loaded mission
      plan


      Tier: T2

      Lane type: governance

      Executor: claude


      Source: PM directive to the operating-model terminal (2026-10-24): reduce
      reduced-context cost with the smallest measurable change. No policy
      change; nothing is deleted.


      ## Objective


      `docs/mission/plan.md` is imported into every session via CLAUDE.md. Its
      sections 1-3 are dated readings (mostly 2026-10-15) that the plan itself
      says to re-measure before use. Move them unchanged to an on-demand
      archive, matching the existing `plan-lessons.md` /
      `plan-history-2026-09.md` pattern, and keep the standing holds in the
      plan. Measured baseline: the auto-loaded mission set is about 14k tokens
      above a minimal project; plan.md is 21 KB.


      ## Acceptance Criteria


      - Sections 1-3 of `plan.md` move verbatim to
      `docs/mission/plan-readings.md`; `plan.md` keeps Direction, workstreams,
      pre-SGO table, decisions, containment, pointers, lessons, and gains a
      short "Standing holds" list (kill switches, Track Only/containment,
      `706b136b`, the not-asked-for list) plus a pointer to the archive.

      - Mechanical check: every non-empty original line of `plan.md` exists in
      `plan.md` or `plan-readings.md`.

      - Measured before/after: bytes of the auto-loaded set and `claude -p`
      token totals (noise reported); estimates labeled.

      - No change to CLAUDE.md, `docs/mission/intent.md`, any workflow, hook,
      script, gate, tier rule, containment, kill switch, reserved decision or
      `settings*.json`.

      - Deferred, not in this lane (CLAUDE.md lease is held by an unclosed
      lane): relocating the CLAUDE.md lane-execution and product-intent sections
      to path-scoped `.claude/rules` files.


      ## File Scope


      - docs/mission/plan.md

      - docs/mission/plan-readings.md

      - .ops/work/WORK-2026102305.md
