  objective: Register authoritative Discord guild commands in governed production
    deployment
  acceptance_criteria:
    - "Griff-authorized bounded production-acceptance defect. Shipped commands
      exist but production guild registration is omitted from Deploy. Implement
      durable post-promotion registration using
      apps/discord-bot/scripts/deploy-commands.ts, guild-scoped full replacement
      only; validate configured application identity, read back exact
      authoritative manifest inventory, safe failure logging and fail-visible
      workflow. No global commands, delivery release, role changes, watched
      picks, or command redesign. Scope: .github/workflows/deploy.yml;
      apps/discord-bot/scripts/deploy-commands.ts and focused registration
      tests; focused deployment workflow test; package.json only to include the
      two new regression files in required test gates. Acceptance: focused
      tests/static/type/lint/pnpm verify/R-level green; review through normal
      gate; authorized production workflow and live guild inventory proof
      including live/today; bot/API/worker healthy; containment and zero
      official-message/receipt deltas. Named proof artifact
      docs/06_status/proof/<assigned issue>/verification.md. Production PASS
      only after actual registration acceptance; park before persona retest."
