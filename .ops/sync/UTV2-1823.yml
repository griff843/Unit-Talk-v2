      `apps/api/src/server.ts:604` is the API's only auth gate:


      ```

      if (method === 'POST' || url.pathname === '/api/discord/kill-switch') {

      ```


      Every GET route declared above that line is unauthenticated. `GET
      /api/picks/{id}/trace` (`server.ts:511-527` → `handleTracePickRoute` →
      `tracePickController`) is one of them, and it returns:


      * the full `PickRecord` including `metadata` (which carries
