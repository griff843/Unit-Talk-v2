      * `submissionEvents`, `promotionHistory`,

      * `outboxEntries` and `distributionReceipts` (delivery targets and
      external IDs),

      * `settlementRecords`,

      * `auditLogEntries`,

      * `lifecycleEvents`.


      Anyone who knows or guesses a pick UUID can read all of it over the public
      Caddy-terminated API hostname. UTV2-1427 already established the governing
      precedent in the same predicate: the kill-switch **GET** was gated because
      "its response reveals staff-only operational state ... not public delivery
