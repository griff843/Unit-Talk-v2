task_contract:
  schema_version: 1
  issue_id: UTV2-1823
  objective: |-
    Authenticate `GET /api/picks/{id}/trace` so canonical pick truth is not readable by an anonymous caller on the public API hostname.
    PM disposition (2026-09-02): **treat this as an authentication / data-exposure security change even though the mechanical lane type is** `runtime`**. Claude only — do not route to Codex.** PM plan approval and PM merge approval are both required.
    This is child A2 of the Command Center pilot wave under [UTV2-1788](https://linear.app/unit-talk-v2/issue/UTV2-1788/command-center-phase-0-stabilization-consolidate-the-authoritative). It is the only lane authorized to start from that packet right now. A1 (production deployment wiring) and Child B (Track Only operator evidence) are NOT authorized to start.
    ---
  acceptance_criteria:
    - Anonymous `GET /api/picks/<valid-id>/trace` returns **401** with the
      standard `UNAUTHORIZED` error body and **zero** pick data — no metadata,
      no outbox row, no audit entry, no field of the record in any form.
    - "Authenticated request with a valid operator/service credential returns
      the **unchanged 200 payload** (byte-compatible shape: `pick`,
      `submissionEvents`, `promotionHistory`, `outboxEntries`,
      `distributionReceipts`, `settlementRecords`, `auditLogEntries`,
      `lifecycleEvents`)."
    - Authenticated request for an **unknown** pick id still returns **404**
      `PICK_NOT_FOUND` — authentication failure and not-found remain
      distinguishable, and 404 is never used to mask a 401 or vice versa.
    - No other route's auth behaviour changes. `POST` routes and
      `/api/discord/kill-switch` behave exactly as before; every other
      currently-public GET keeps its current status unless explicitly
      dispositioned in this issue.
    - "`/api/picks/{id}/routing-preview` and `/api/picks/{id}/promotion-preview`
      are explicitly dispositioned in the proof: either gated in this same pass,
      or documented with the reason they remain public. Silence is not an
      acceptable outcome for either."
    - "No consumer regression: Command Center does not call `/trace` (verified —
      it reads Supabase directly), so no operator surface breaks. Any other
      in-repo caller found during implementation must be reported before the
      change lands."
    - ---
