      ## Lane classification (mechanical, not asserted)

      Run 2026-09-02 via `npx tsx scripts/ops/tier-classifier.ts`:

      ```
      declared_tier: T1
      mechanical_minimum: T1
      derived_tier: T1
      escalated: false
      ```

      * lane_type: `runtime` (`.lane/lanes/runtime.yml` admits `apps/api/**`; `verification.yml` explicitly forbids `apps/api/src/**` except the DB smoke test)
      * executor: **Claude only** (PM directive; `docs/05_operations/DELEGATION_POLICY.md:117` — security/authorization posture changes are Tier C, and `:226` — a Codex lane is never authorized to run Tier C work)
      * runtime is a singleton lane type; no runtime lane was active at admission time

      ---

      ## Sequencing context (PM-directed, 2026-09-02)

      ```
      A2 (this issue)  — start now, Claude, T1 runtime
      UTV2-1789        — continues unchanged, in flight
      then, in order:  UTV2-1812 → UTV2-1802 → Child B (Track Only operator evidence)
      A1 (CC production deployment) may begin ONLY after 1789, 1812 and 1802 all truth-close.
      ```

