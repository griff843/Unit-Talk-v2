    title: Authenticate GET /api/picks/{id}/trace — close the unauthenticated
      canonical pick-truth exposure before the Track Only pilot
    description: |-
      ## Objective

      Authenticate `GET /api/picks/{id}/trace` so canonical pick truth is not readable by an anonymous caller on the public API hostname.

      PM disposition (2026-09-02): **treat this as an authentication / data-exposure security change even though the mechanical lane type is** `runtime`**. Claude only — do not route to Codex.** PM plan approval and PM merge approval are both required.

      This is child A2 of the Command Center pilot wave under [UTV2-1788](https://linear.app/unit-talk-v2/issue/UTV2-1788/command-center-phase-0-stabilization-consolidate-the-authoritative). It is the only lane authorized to start from that packet right now. A1 (production deployment wiring) and Child B (Track Only operator evidence) are NOT authorized to start.

      ---

      ## Verified defect (against origin/main @ c26257b4, 2026-09-02)

      `apps/api/src/server.ts:604` is the API's only auth gate:

      ```
      if (method === 'POST' || url.pathname === '/api/discord/kill-switch') {
      ```

      Every GET route declared above that line is unauthenticated. `GET /api/picks/{id}/trace` (`server.ts:511-527` → `handleTracePickRoute` → `tracePickController`) is one of them, and it returns:

      * the full `PickRecord` including `metadata` (which carries `distributionMode`, `submittedBy`, `eventId`, promotion scores),
      * `submissionEvents`, `promotionHistory`,
      * `outboxEntries` and `distributionReceipts` (delivery targets and external IDs),
      * `settlementRecords`,
      * `auditLogEntries`,
      * `lifecycleEvents`.

      Anyone who knows or guesses a pick UUID can read all of it over the public Caddy-terminated API hostname. UTV2-1427 already established the governing precedent in the same predicate: the kill-switch **GET** was gated because "its response reveals staff-only operational state ... not public delivery truth". A pick's full lifecycle, audit trail and delivery receipts are staff-only operational state by the same standard.

      This must close **before** Griff submits the first real Smart Form Track Only pilot pick, because the pilot creates exactly the record this route exposes.

      ---

      ## Scope (bounded)

      Allowed:

      * `apps/api/src/server.ts` — the auth gate predicate only
      * one test file asserting the new behaviour (extend `apps/api/src/server.test.ts` or add a focused sibling test)
      * this lane's own artifacts: `.ops/sync/<ID>.yml`, `docs/06_status/lanes/<ID>.json`, `docs/06_status/proof/<ID>/**`

      Prohibited:

      * `apps/api/src/auth.ts` **must not be edited.** It is a Tier C exact path; `authenticateRequest` / `authorizeRoute` are sufficient as they stand.
      * No change to `tracePickController`, the route handlers, response shape, or any repository.
      * No new role, no new token type, no new env var, no change to `authorizeRoute`'s role policy.
      * No Command Center, deployment, contracts, DB, migration, delivery, scoring or production-data change.

      ---

      ## Acceptance criteria

      1. Anonymous `GET /api/picks/<valid-id>/trace` returns **401** with the standard `UNAUTHORIZED` error body and **zero** pick data — no metadata, no outbox row, no audit entry, no field of the record in any form.
      2. Authenticated request with a valid operator/service credential returns the **unchanged 200 payload** (byte-compatible shape: `pick`, `submissionEvents`, `promotionHistory`, `outboxEntries`, `distributionReceipts`, `settlementRecords`, `auditLogEntries`, `lifecycleEvents`).
      3. Authenticated request for an **unknown** pick id still returns **404** `PICK_NOT_FOUND` — authentication failure and not-found remain distinguishable, and 404 is never used to mask a 401 or vice versa.
      4. No other route's auth behaviour changes. `POST` routes and `/api/discord/kill-switch` behave exactly as before; every other currently-public GET keeps its current status unless explicitly dispositioned in this issue.
      5. `/api/picks/{id}/routing-preview` and `/api/picks/{id}/promotion-preview` are explicitly dispositioned in the proof: either gated in this same pass, or documented with the reason they remain public. Silence is not an acceptable outcome for either.
      6. No consumer regression: Command Center does not call `/trace` (verified — it reads Supabase directly), so no operator surface breaks. Any other in-repo caller found during implementation must be reported before the change lands.

      ---

      ## Verification / mutation plan

      * `pnpm verify` green on the branch and on the merge SHA.
      * New test asserts all three of: 401 anonymous, 200 authenticated, 404 authenticated-unknown-id.
      * **Mutation control (required, non-negotiable):** revert the gate predicate to its pre-change form and re-run — the anonymous-401 test **must fail**. A test that passes with the guard removed proves nothing and does not satisfy this lane. Record the failing output verbatim in `verification.md` per `/mutation-test`.
      * T1 runtime proof bundle: `diff-summary.md`, `evidence.json`, `verification.md`, `runtime-health.json`, plus `pnpm test:db` green (run-scoped staging receipt verified inside required `verify`).
      * Proof binds to the merge SHA, not branch HEAD.

