    title: WORK-2026110401 — Production session rotation handoff in the mission plan
    description: >-
      # WORK-2026110401 — Production session rotation handoff in the mission
      plan


      Tier: T2

      Lane type: governance

      Executor: claude


      Source: Griff's production directive of 2026-11-04 ("controlled session
      rotation and execution handoff"). Record a concise, durable production
      handoff under the repository's existing designated mechanism, without
      inventing a new governance system or editing historical evidence.


      ## Objective


      `docs/mission/plan.md` is the Claude-owned plan that fresh and compacted
      sessions recover from (`docs/mission/intent.md`, exit condition 4). It was
      last measured on 2026-10-15 against `4a88bcb49` and deployed release
      `2be2aec81`. Bring it to current live truth, and add a dated reading of
      the execution state to `docs/mission/plan-readings.md`, so a successor
      Production Claude session can resume without duplicating work.


      ## Acceptance Criteria


      - `plan.md` keeps its structure and authority statements. Its "Measured
      against" line, workstream table and Griff decision table reflect live
      GitHub, CI and read-only production readings taken on 2026-11-04. It gains
      a short "Current execution state and successor first action" section that
      points to the dated reading.

      - `plan-readings.md` gains one new dated section (2026-11-04). It covers:
        - mission and commercial objective;
        - shipped versus deployed;
        - production acceptance versus staging-only proof;
        - active work (PR, head, lane, owner, worktree, next action);
        - private-canary blockers;
        - outstanding data-truth, grading, CLV, Discord and Whop acceptance;
        - reserved decisions and safe parallel tasks;
        - uncommitted state, running processes and staging reservations;
        - what not to duplicate.

        Existing dated sections are not edited.
      - Every figure is a dated reading with its source (command, run ID or
      read-only query). Anything not verified is marked **UNKNOWN**.

      - No change to `intent.md`, `spec.md`, any contract, gate, workflow, merge
      authority or historical proof.


      ## Guardrails


      - Documentation only. No production mutation, deployment, kill-switch
      change or delivery.

      - Do not mark incomplete work done. Preserve every lane, lock, checkpoint
      and proof artifact.


      ## Required Evidence


      - Diff summary and a verification log listing the live commands and
      queries behind each reading.
