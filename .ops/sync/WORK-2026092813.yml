    description: >-
      # WORK-2026092813 — Merged lanes' proofs name the gate-required commands


      Tier: T3 · Lane type: governance · Executor: claude


      Repo-owned work order (tracker independence, ratified 2026-09-05). No
      Linear issue exists for this identity by design.


      ## Objective


      Two lanes merged with a `verification.md` that never names the commands
      `ops:truth-check` scans for. Their closeout refuses at P12/P13/P14:


      - WORK-2026092807 (#1681, merge `a6ca76a2b`)

      - WORK-2026092811 (#1684, merge `3b071d9d6`)


      A merged lane's proof cannot be repaired by a PR on that lane (ERV reads
      its merge-bound bundle as premature authority). This lane carries the
      repair under its own identity, as WORK-2026092804 did for WORK-2026092802.


      ## Acceptance Criteria


      - Each of the two `verification.md` files states, truthfully and on its
      own line, the `pnpm verify` run that gated the merge (the required CI
      `verify` context), that `pnpm type-check` and `pnpm test` ran inside it,
      and a `scripts/ci/r-level-check.ts` run with explicit base and head SHAs
      and its verdict.

      - No other change to either bundle: no SHA binding, evidence.json,
      manifest or code change.

      - After merge, each original lane closes through
      `post-merge-lane-close.yml` by `workflow_dispatch` without `pr`.


      ## Exit Criteria


      - PR merged on green CI; this lane and both repaired lanes closed.
