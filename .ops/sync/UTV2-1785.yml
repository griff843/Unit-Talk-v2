      A repo-owned source therefore exists. Fix it there. Do not hand-edit a local generated copy and do not invent a new hook architecture.

      **Note this is an agent-harness hook, not a git hook** — it gates Claude Code Bash calls containing `git commit`, so it does not affect CI or a human's direct `git` usage. Keep that in mind for security item 6 below.

      ## Root cause (exact)

      Line 23: `staged=$(git diff --cached --name-only)`. That diffs the index against `HEAD` only, with no `MERGE_HEAD` awareness. During a merge the index holds the entire merge result, so every file inherited from the incoming parent reads as staged and is validated as lane-authored.

      ## Blast radius (measured on current main)

      **158 of 245 **`evidence.json` files on `main` would trip this hook when merely inherited (most for `ci_sentinels`, many also for `verified_source_sha`). This blocks essentially every `git merge origin/main` into any lane branch — it is not specific to [UTV2-1745](https://linear.app/unit-talk-v2/issue/UTV2-1745/pick-trustworthiness-audit-can-this-system-currently-produce-a) or [UTV2-1729](https://linear.app/unit-talk-v2/issue/UTV2-1729/proof-producing-contract-is-broken-repair-the-canonical-generator-so).

      ## Suggested mechanism (verify before adopting)

      Git's own combined-diff semantics: a merge commit authors only what differs from **all** parents. Compute the staged set against `HEAD` and against `MERGE_HEAD` and intersect — a file byte-identical to either parent is inherited.

      Caveat that must be handled: a conflict resolved by taking one parent's version verbatim ("take theirs") is byte-identical to that parent and would be wrongly excluded, yet Test C requires it to count as authored. `.git/MERGE_MSG` retains a `# Conflicts:` block after `git add` clears the unmerged index entries; union that conflict set into the authored set. Verify against real git behavior before relying on it; if unreliable, find a mechanism that is.

      Detect merge state via `MERGE_HEAD`, **worktree-aware**: this repo runs lanes in `git worktree`s where the git dir is NOT `.git/`. Resolve with `git rev-parse --git-dir`.

      ## Regression tests (build real throwaway git repos in a temp dir; do not mock git)

      * **Test A — inherited-only proof.** main contains `docs/06_status/proof/OLD/evidence.json` (invalid, e.g. missing `ci_sentinels`). Topic branched before that file existed and changes only unrelated lane-owned content. Merge main into topic. Expect: OLD present in the merge result, topic never authored it, hook does not validate it, commit allowed when topic-authored proof is valid.
