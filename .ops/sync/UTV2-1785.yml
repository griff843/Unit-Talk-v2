      * **Test C — conflict resolution.** Both parents change the same proof path. Expect: resolution counts as authored and is validated. Must cover the "resolved to exactly one parent's bytes" case.
      * **Test D — ordinary topic proof.** Topic adds/changes its own evidence.json on a normal non-merge commit. Expect: current validation still runs.
      * **Test E — exact PR #1453 class.** Topic behind main; main carries a closed historical proof bundle the topic never touched; the only real conflict is an unrelated shared file (`package.json`). Old selection logic MUST fail; new selection logic MUST allow the merge while still validating actually-authored files.

