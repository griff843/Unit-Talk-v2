      ## Discovery completed by orchestrator (2026-08-30) — do not redo, do not widen

      Mechanically located the real implementation and its source of truth:

      * `git config --show-origin --get core.hooksPath` -> `file:.git/config` -> `/home/griff843/code/Unit-Talk-v2/.git/hooks`
