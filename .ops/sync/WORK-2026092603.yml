    description: >-
      # WORK-2026092603 — Declare WORK-2026092602's diff summary and
      verification as expected proof


      Repo-owned work order (tracker independence, ratified 2026-09-05). No
      Linear issue exists for this identity by design. Same shape as
      WORK-2026092601 (#1653).


      ## Objective


      - In `docs/06_status/lanes/WORK-2026092602.json`, set
      `expected_proof_paths` to the three proof artifacts already on `main`:
      `diff-summary.md`, `evidence.json` and `verification.md` under
      `docs/06_status/proof/WORK-2026092602/`.


      ## Why


      - PR #1655 merged as `e019642a8176a51397ea85768c6e8e0b7c293469`, but
      closeout run `36222273175` refuses:
        - `P11 proof must include a diff summary file`
      - For T2, truth-check P11 reads only the files listed in
      `expected_proof_paths` (`scripts/ops/truth-check-lib.ts`, `proofFiles`).
      The manifest lists only `evidence.json`, although `diff-summary.md` and
      `verification.md` are committed on `main`. WORK-2026092407, which closed,
      declares all three.


      ## Acceptance Criteria


      - `docs/06_status/lanes/WORK-2026092602.json` on `main` lists exactly
      `diff-summary.md`, `evidence.json` and `verification.md` in
      `expected_proof_paths`.

      - No other field of that manifest changes (`status`, `commit_sha`,
      `pr_url` untouched).

      - The lane is NOT closed by this PR. Closing still goes through
      `post-merge-lane-close.yml` and a passing `ops:truth-check`.


      ## Guardrails


      - No product code, no proof file and no work-order content for
      WORK-2026092602 is changed.

      - No weakening of closeout, truth-check or merge controls.


      ## Exit Criteria


      - PR merged on green CI. Then `post-merge-lane-close.yml -f
      issue_id=WORK-2026092602` is dispatched.
