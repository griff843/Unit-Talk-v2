task_contract:
  schema_version: 1
  issue_id: UTV2-1838
  objective: "Closeout safe to repeat: unmask the finalize ENOENT halt without
    unmasking the --force JSON overwrite, and stop main-checkout pollution"
  acceptance_criteria:
    - |-
      Staffed by PM ratification 2026-09-05 — "making closeout safe to repeat" is one of the three named priorities of the workflow-simplification workstream.

      `post-merge-lane-close.yml` is **not** one of the four required checks: it triggers only on `push: branches: [main]` and `workflow_dispatch` (`:38-52`), so it can never be a required PR status context. Its job name is `Auto-close merged lane`, matching none of `verify` / `Executor Result Validation` / `Merge Gate` / `P0 Protocol`.

      ## The coupled pair — this is the reason this issue exists

      **Failure observed twice (**[UTV2-1835](https://linear.app/unit-talk-v2/issue/UTV2-1835/deploy-retry-overwrites-the-configuration-snapshot-for-the-still)**,** [UTV2-1836](https://linear.app/unit-talk-v2/issue/UTV2-1836/carry-forward-trusted-evidence-collector-merge-gate-integration-diff)**):** `ops:lane-finalize <ID> --pr <n>` halts at `generate_t2_proof_bundle`.

      Root cause: `readOptionalFile` (`scripts/ops/t2-proof-bundle.ts:162-167`) is misnamed — it calls `fs.readFileSync` with no existence guard. `lane-finalize.ts:216` unconditionally passes `--verification-log docs/06_status/proof/<ID>/runtime-verification.md`, but `ops:proof-generate` only ever produces `verification.md` (`proof-generate.ts:197` `STANDARD_PROOF_FILES`). A static-proof lane therefore always throws ENOENT, the step is `required: true`, and finalize halts (`lane-finalize.ts:451-469`).

      **That crash is currently the only thing preventing a data-loss bug.** `lane-finalize.ts:203-217` always passes `--force`. With `--force`, `t2-proof-bundle.ts:134-147` writes the same markdown blob to **every** path in `manifest.expected_proof_paths`. **27 T2-eligible lane manifests declare a** `.json` **artifact there** (`model-routing.json` / `evidence.json`). Because `readOptionalFile` is evaluated as an *argument* at `t2-proof-bundle.ts:176-181`, it throws before `generateT2ProofBundle` runs — which is the sole reason those 27 sidecars are still valid JSON.

      **Fixing the ENOENT alone unmasks the overwrite.** They must land together, overwrite-guard first.

      ## Other non-idempotent steps, measured

      * `truth-check-lib.ts:1875-1881` — `truth_check_history` grows unboundedly on every non-`done` run; the guard at `:1860-1864` only covers `done`. An infra-error early return (`:986`, `:1045`, `:1062`) permanently records a `fail` entry for what was a token blip.
      * `lane-close.ts:2400-2409` — `guardRepairAgainstMainCheckout` sits **inside** `if (repairMerged)`. A plain `pnpm ops:lane-close <ID>` from the root checkout while on `main` reaches `runTruthCheck` (history append + heartbeat write) and `finalizeLaneCloseManifest` (`:381-385`, writes `status: done`) with **no main-checkout guard at all**, dirtying tracked files on `main`. `completeIdempotentReclose` (`:2137-2140`) likewise deletes the tracked `.ops/sync/<ID>.yml` from whatever checkout runs it.
      * `lease-registry.ts:523-531` — reclaim is purely TTL-gated and the `claude` TTL is 48h (`:133`), so a provably-terminal lane's lease cannot be reclaimed for two days. Observed live on [UTV2-1830](https://linear.app/unit-talk-v2/issue/UTV2-1830/mission-intent-record-the-continuous-orchestration-correction-in): merged `1cb31a43e`, truth-closed, lease still `active` with a dead owning PID. `releaseLease` (`:562-638`) has no expiry check and is the working escape via `ops:lease release`, but reclaim should not require knowing that.
      * `.ops/leases/` is gitignored (`.gitignore:67`), so the hosted closeout's release is discarded with the runner and the local lease always survives. Detection exists (truth-check M8, `truth-check-lib.ts:265-276`) but does not mutate.

      ## Replay evidence parity — the real asymmetry

      The previously recorded "dispatch binds 2 of 3, push binds 3 of 3" claim is **refuted**: `2466dd56b` ([UTV2-1828](https://linear.app/unit-talk-v2/issue/UTV2-1828/merge-sha-rebinders-skip-diff-summarymd-so-no-bundle-carrying-one-can), #1490) fixed it, and both `rebindRepairedLaneProof` branches now bind `diff-summary.md` (`lane-close.ts:1281-1295` attested, `:1316-1325` tolerant).

      The remaining asymmetry is evidence *content*. `autoHarvestCiDbProofIntoEvidence` (`proof-generate.ts:1912-1926`) and `autoPopulateStaticProofFromVerifyRun` (`:1938-1950`) live only in `proof-generate`'s `main()`. `post-merge-lane-close.yml:332-335` short-circuits the whole proof step on `workflow_dispatch` and delegates to `rebindRepairedLaneProof`, which calls neither. A dispatch replay therefore binds SHAs correctly but leaves `static_proof` / `runtime_proof` unpopulated, so P7/R1/R2 fail on a replay that would have passed on a push.

      ## Scope

      1. `t2-proof-bundle.ts:134-147` — restrict the write set to markdown artifacts (or refuse any path whose basename is `evidence.json` / `model-routing.json`). **Land this first.**
      2. `t2-proof-bundle.ts:162-167` — make `readOptionalFile` actually optional: return `''` when the path is absent.
      3. `lane-finalize.ts:216` — point `--verification-log` at the file `proof-generate` actually produces, or make the flag conditional on existence.
      4. `lane-close.ts:2400-2409` — hoist the main-checkout guard above `:2427` so the plain path is covered too.
      5. `truth-check-lib.ts:1855`, `:1875-1881` — do not append a `truth_check_history` entry for infra-error exits.
      6. `lease-registry.ts:523-531` — allow reclaim when the lane manifest is terminal, reusing `findLeasesHeldByTerminalLanes` (`:769-800`) rather than the clock.
      7. `lane-close.ts:1326` — call the two harvesters from `rebindRepairedLaneProof` (or extract a shared helper) so a dispatch replay produces the same evidence a push does.

      ## Acceptance

      1. `ops:lane-finalize <ID> --pr <n>` completes on a static-proof lane whose bundle has no `runtime-verification.md`.
      2. **Inversion, required:** with the overwrite guard removed, a test proving `--force` no longer overwrites a `.json` artifact must fail. Assert on the file's content, not on the exit code.
      3. Running `ops:lane-close <ID>` twice on the same lane produces identical manifest content the second time — no new `truth_check_history` entry, no heartbeat bump.
      4. A plain `ops:lane-close` from a checkout on `main` refuses rather than writing.
      5. A terminal lane's lease can be reclaimed without waiting out the 48h TTL, and a **non**-terminal lane's still cannot.
      6. A `workflow_dispatch` replay produces `static_proof` populated identically to the push path.

      ## Out of scope

      * `post-merge-lane-close.yml:304`, `:332` — do **not** widen the binding step's `if:` to include `workflow_dispatch`. The in-file comment at `:203-232` states this is the wrong fix and would deadlock `model-routing.json`'s immutable `closeout_binding`. [UTV2-1673](https://linear.app/unit-talk-v2/issue/UTV2-1673/allow-safe-workflow-dispatch-merge-sha-binding-after-identity) owns that.
      * No change to `verify`, `Executor Result Validation`, `Merge Gate`, or `P0 Protocol`.
