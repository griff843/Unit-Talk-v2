    title: WORK-2026092706 — Serialize every job that writes the staging CI database
    description: >-
      # WORK-2026092706 — Serialize every job that writes the staging CI
      database


      Tier: T1 · Lane type: governance · Executor: claude


      Repo-owned work order (tracker independence, ratified 2026-09-05). No
      Linear issue exists for this identity by design.


      ## Objective


      Every CI job that binds `environment: staging-ci` writes the same staging
      database. `ci.yml`'s `Writable DB proof (staging only)` begins with
      `scripts/ci/seed-staging-fixtures.ts`, which deletes every row of
      `system_runs`, `distribution_outbox` and `distribution_receipts`. Nothing
      stops two such jobs overlapping: `ci.yml`'s concurrency group is per PR or
      ref, and the job has none of its own. A job that starts while another is
      mid-proof deletes the other's in-flight `system_runs` row. The victim's
      grading pass then fails with `Failed to complete system run: Cannot coerce
      the result to a single JSON object`, and the required `verify` context
      fails closed on a PR whose diff is unrelated.


      Measured 2026-09-27 on one PR, twice:

      - run 36331464602 attempt 1 failed at 16:06:02, 25 s after another PR's
      staging job started (16:05:37);

      - attempt 2 failed at 16:23:29, 45 s after `main`'s push run started its
      staging job (16:22:44), which logged `reset system_runs: 6 row(s)
      deleted`.


      A PR whose staging job ran alone passed.


      ## Acceptance Criteria


      - Every job that binds `environment: staging-ci`, in every workflow,
      declares job-level `concurrency: { group: staging-ci-db,
      cancel-in-progress: false }`, so staging writers run one at a time across
      PRs, `main` and dispatches.

      - A test in `scripts/ops/workflow-hardening.test.ts` parses every workflow
      and fails when a `staging-ci` job lacks that group. The rule is enforced
      mechanically, not only in prose.

      - A mutation drill (removing the group from one job) turns that test red.

      - The workflow-level `cancel-in-progress` behaviour per PR is unchanged.
      No required-check name, job name, credential binding, merge-gate input or
      branch-protection setting changes.

      - Known trade-off, stated in the workflow comment: GitHub keeps at most
      one pending job per group. A third concurrent writer cancels the older
      pending one, so that `verify` fails closed visibly and is rerun, instead
      of corrupting a running proof.


      ## File scope


      - `.github/workflows/ci.yml`

      - `.github/workflows/staging-db-proof.yml`

      - `.github/workflows/proof-gate.yml`

      - `.github/workflows/proof-regression.yml`

      - `.github/workflows/t1-proof-gate.yml`

      - `scripts/ops/workflow-hardening.test.ts`

      - `.ops/work/WORK-2026092706.md`


      ## Guardrails


      - T1 by the mechanical floor: the scope edits `.github/workflows/**`.
      Merge needs Griff's `t1-approved` label and a `pm-verdict/v1` APPROVED
      comment on the final head.


      - No change to what any proof asserts, to seed/reset behaviour, or to
      merge authority.


      ## Exit Criteria


      - PR merged on green CI, and the lane closed through
      `post-merge-lane-close.yml`.
