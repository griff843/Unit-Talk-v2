  objective: WORK-2026102804 — Final-score check when settling a game-line pick in
    Command Center
  acceptance_criteria:
    - A pure function in `apps/command-center/src/lib/settlement-score-check.ts`
      takes the pick's market, selection, line and side, plus an entered final
      score (away and home), and returns the implied result (`win`, `loss` or
      `push`), or `unsupported` with a reason.
    - It covers moneyline, spread, game total over/under and team total
      over/under. A team total is resolved to the named team.
    - Player props and anything ambiguous return `unsupported`. It never guesses.
    - The pick page passes the pick's event name, market, selection, line and
      odds into `SettlementForm`, and the form shows them above the result
      buttons.
    - For supported markets, the form asks for the final score. If the entered
      score implies a result that differs from the one the operator chose, the
      form blocks submission. The operator can still proceed by giving an
      explicit override reason, which is carried in the settlement notes.
    - The entered score is included in the attestation (`outcomeBasis` or
      notes), so the settlement record shows what it was based on. No API or
      schema change.
    - For unsupported markets the form behaves exactly as it does today.
    - The new `SettlementForm` props are optional. `SettlementWorkbench` (the
      `/settlement?pickId=` page) also renders `SettlementForm`, is not in this
      lane's scope and must keep compiling unchanged. Without pick context, the
      form behaves as it does today; that page already shows a target summary
      above the form.
    - "Unit tests cover:"
    - each supported market, both sides and a push;
    - a team total resolved to the correct team when the named team is home and
      when it is away;
    - unsupported markets;
    - the blocked-mismatch and override paths.
    - "Fixtures include the real cases:"
    - Ducks team total over 3.5 with Canucks 6, Ducks 5 is a win.
    - Game total over 6.5 with Kings 1, Devils 3 is a loss.
  guardrails:
    - No change to `settle.ts`, the API settle contract, authentication,
      operator identity, `settled_by` attribution, corrections, schema, delivery
      or containment.
    - "No external fetch: the operator enters the score."
    - No new dependency.
