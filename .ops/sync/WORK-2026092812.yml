    description: >-
      # WORK-2026092812 — Command Center shows the truth already stored for a
      governed pick


      Tier: T2 · Lane type: delivery-ui (app: command-center) · Executor: codex


      Repo-owned work order (tracker independence, ratified 2026-09-05). No
      Linear issue exists for this identity by design.


      Required reading before any change:
      `docs/03_product/COMMAND_CENTER_PRODUCT_CONTRACT.md` (sole authority for
      Command Center).


      ## Objective


      An operator looking at a governed pick (one with
      `metadata.distributionMode`) in Command Center sees what the database
      already records about it, without SQL. **Display only: no new API route,
      no new DB read path, no write, no change outside `apps/command-center/`.**
      Every field is read from the pick row (and its metadata) that the pick
      detail and list already load.


      ## Why


      Griff's production Track Only acceptance on 2026-09-28 (pick `92789b58`)
      showed Command Center rendering the pick and its verified non-delivery. It
      did **not** show the delivery-authorization record, the requested vs
      persisted mode, participant resolution or the edge-scope reason. Its list
      row showed `unrouted / SUPPRESSED` in place of capper, units and a Track
      Only badge. `docs/mission/plan.md` §4.2 records the gap; Milestone 2
      condition 5 depends on it.


      ## Acceptance Criteria


      Pick detail (`apps/command-center/src/app/picks/[id]/page.tsx` and the
      components it uses):


      - **Delivery authorization.** Render `metadata.deliveryAuthorization`
      using `readHumanCapperDeliveryAuthorization` from `@unit-talk/contracts`
      (`packages/contracts/src/smart-form.ts`). Show the decision (`authorized`
      / `refused`), the refusal `reason` when present, `authority`, and
      `decidedAt`. A missing or malformed record renders as "No delivery
      authorization recorded". It must never render as authorized.

      - **Submission mode.** Show the persisted `distributionMode`. Where
      metadata records the mode the capper requested, show it as well, so a
      refusal reads as "requested X, persisted Y".

      - **Participant resolution / provenance.** Show how each participant was
      resolved (canonical vs manual / `canonical-coverage-gap`) from what
      metadata records. If nothing is recorded, say so; do not infer.

      - **Edge-scope reason.** Show the edge fallback / scope reason already
      stored (see the existing edge section near `page.tsx:590-599`).

      - **Eventless pick.** When the pick has no event link, show a note:
      automated grading skips it at `event_link_not_found`, and it settles by
      operator action.

      - **Voided pick.** Show a clear voided banner.


      Picks list (`apps/command-center/src/components/PicksExplorerClient.tsx`):


      - For a governed pick, the row shows capper, units, and a **Track Only**
      badge when `distributionMode === 'track-only'`, in place of `unrouted /
      SUPPRESSED`. Ungoverned rows are unchanged.


      Tests and proof:


      - Extend the **existing** Command Center test files (for example
      `apps/command-center/src/app/command-center-pages.test.tsx`). Do not
      create a new test file: `package.json` is held by another lane's
      file-scope lock. Cover:
        - a refused Track Only record
        - an authorized record
        - a malformed record (not rendered as authorized)
        - a governed list row with the Track Only badge
        - an ungoverned row unchanged
      - The T2 proof bundle goes under `docs/06_status/proof/WORK-2026092812/`:
      `verification.md` with the `## Verification` heading, `diff-summary.md`,
      and a schema-v2 `evidence.json` with `proof_profile: "static"`. Bind
      `pr_url` in `docs/06_status/lanes/WORK-2026092812.json` inside this PR.


      ## Guardrails


      - Only `apps/command-center/**` source changes, plus this lane's own proof
      and manifest files.

      - No kill-switch, delivery, containment, auth or bridge change.

      - Do not touch `picks` data, the two voided sample picks, or any
      production row.


      ## Exit Criteria


      - PR merged on green CI per the Merge Gate's T2 path, after Claude's diff
      review, then closed through `post-merge-lane-close.yml` without `pr`.
