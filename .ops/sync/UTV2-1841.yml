      {"node":"v20.20.2"})` repeatedly.

      * `.github/workflows/ci.yml` uses `node-version: 22` at both call sites
      (`:55`, `:196`).

      * Every production image is Node 22: `Dockerfile` (`node:22-alpine` for
      builder/api/worker/ingestor/discord-bot),
      `deploy/production/Dockerfile.nextjs` (`ARG NODE_VERSION=22-alpine`),
      `apps/command-center/Dockerfile`.


      So the release gate ran on a runtime production does not run, and it is
