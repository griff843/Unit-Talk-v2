    - >-
      Impact — measured

      Deploy run `34031708984` (candidate
      `391d4345c499f75255a749f73ce26cae7d44cce7`) failed at `verify` → `pnpm
      verify:static`. `build`, `Canary deploy`, `Promote production` and the
      post-deploy smoke all skipped, so production stayed at `e48106fc`. 479/480
      tests passed; the single failure was
      `apps/command-center/src/lib/data/client-cache-auth.test.ts:55`, "cached
      service-role client reauthenticates every request".


      **This blocks the Milestone 1 Smart Form pilot**, because the deploy that
      ships the canonical-identity fix (#1488) and the authenticated `GET
      /api/picks/:id/trace` (#1501) cannot get past its own gate.
    - |-
      Root cause — reproduced on both runtimes, not inferred
      The test asserts that `getDataClient()` rejects with `PrivilegedAccessDeniedError` / `COMMAND_CENTER_AUTH_REQUIRED` when the request carries no authorization header. Instrumented probe:

      ```
      Node 20.20.2: threw PrivilegedAccessDeniedError  code=COMMAND_CENTER_AUTH_REQUIRED  instanceof=false  -> FAIL
      Node 22.22.1: threw PrivilegedAccessDeniedError  code=COMMAND_CENTER_AUTH_REQUIRED  instanceof=true   -> pass
      ```

      **This is not a fail-open.** The authentication guard fires correctly on both runtimes, throwing the correct error type with the correct code. What differs is class identity: under Node 20's loader `../request-auth` resolves to two distinct module instances, so `error instanceof PrivilegedAccessDeniedError` compares against a different copy of the same class and is false. The assertion is correctly reporting an unsupported runtime.
    - >-
      Required change

      One line — `.github/workflows/deploy.yml:48`, `node-version: 20` ->
      `node-version: 22`.
