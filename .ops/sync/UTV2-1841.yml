    - >-
      Defect

      `.github/workflows/deploy.yml:48` pins `node-version: 20` for the `verify`
      job. Nothing else in the deploy path uses Node 20:


      * `package.json` `engines.node` is `">=22.0.0"` — the run logs `WARN
