      * **Lane type: **`data-canonical` — admits `scripts/**` plus the lane/proof directories. Note its `required_proof_artifacts` includes `canonical-diff.json`; the lane must produce it or closeout will fail.
      * File scope verified: `scripts/run-canonical-reference-bootstrap.ts` **exists on main**.
      * Concurrency: `data-canonical` is a **singleton** — no second data-canonical lane may run concurrently. No forbidden combination with runtime / modeling / verification / governance / hygiene. **Not Tier C** — dispatchable now, concurrent with [UTV2-1699](https://linear.app/unit-talk-v2/issue/UTV2-1699/lane-maximizer-discovery-repair-bare-invocation-returns-an-empty-board).
