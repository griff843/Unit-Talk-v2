    title: "Canonical reference bootstrap: populate teams and prove idempotent
      reference truth"
    description: |-
      ## Objective

      Populate the canonical reference data required by the live resolution path, especially `teams`, without inventing mappings or introducing a second source of truth.

      ## Why

      Current recovery evidence reports `teams = 0`, which starves game-line/event resolution and contributes to missing event context in CLV. An existing bootstrap script is believed to be idempotent, but no current issue owns running/validating it as a governed recovery step.

      ## Where to look

      * `scripts/run-canonical-reference-bootstrap.ts`
      * canonical aliases/sportsbooks/leagues/teams tables and their constraints
      * the consumers that resolve event/team identity for grading/CLV
      * [UTV2-1745](https://linear.app/unit-talk-v2/issue/UTV2-1745/pick-trustworthiness-audit-can-this-system-currently-produce-a) and [UTV2-1425](https://linear.app/unit-talk-v2/issue/UTV2-1425/grading-heartbeat-proof-p3-data-gate-verdict-refresh) findings for product-truth consequences

      ## Acceptance Criteria

      1. Re-derive the exact empty/missing canonical reference population from read-only production evidence.
      2. Validate the existing bootstrap in a non-production target before any live use.
      3. Prove idempotency by executing twice and showing the second run makes no unintended mutation.
      4. Fail closed on ambiguous aliases, duplicate canonical identity, or conflicting source data; do not guess a mapping.
      5. Return the exact governed production mutation packet and rollback/verification plan before any live bootstrap is authorized.

      ## File scope

      * `scripts/run-canonical-reference-bootstrap.ts`
      * `docs/06_status/lanes/UTV2-1773.json`
      * `docs/06_status/proof/UTV2-1773/`

      Exactly the scope already established in the ratified dispatch preparation below: `lane_type: data-canonical`, file scope verified to exist on `main`. The production bootstrap run is OUT of scope for this lane — validation happens in a non-production target only. Declare that fence in `file_scope_lock` at lane-start.

      ## Definition of done

      * Canonical reference population is complete enough for the intended game-line resolution path or remaining gaps are explicitly enumerated.
      * Idempotency and conflict refusal are execution-proven.
      * After an authorized application, CLV/event-resolution coverage can be remeasured against the same baseline population.

      ## Guardrails

      No provider resubscription, ingestion restart, member delivery, or silent production mutation. PM approval is required before live data-canonical writes.

      ---

