      Dispatch preparation — 2026-09-01 (PM-ratified Ready)
      Reverified against live Linear and `main` @ `e48106fc` before promotion. **GO-WITH-FIX** — two things must be nailed down before the executor starts.

      ### 1. "Complete enough" is not measurable — fix this first

      The DoD reads *"canonical reference population is complete enough for the intended game-line resolution path"*. That names no target row count, no league/team set, and no coverage threshold, so no executor can honestly declare it met and no reviewer can honestly refute it. **The lane's first deliverable is a measurable completeness criterion** — an explicit per-table target (leagues, teams, sportsbooks, aliases) with a stated coverage percentage or enumerated required set — recorded in the proof bundle before any population work begins.

      ### 2. Scope fence — no production write in this lane

      Requirement 5 correctly defers the live bootstrap to a separately PM-approved packet. Make that fence mechanical, not just narrative: validation happens in a non-production target only, and the production bootstrap run is **out of scope for this lane**. Declare the fence in `file_scope_lock` at lane-start so the executor cannot drift into a live write.

      ### Mechanical classification

      * **Tier:** declared T1, `mechanical_minimum: T3`, `derived_tier: T1`, `escalated: false`. T1 is above the floor — acceptable.
      * **Lane type: **`data-canonical` — admits `scripts/**` plus the lane/proof directories. Note its `required_proof_artifacts` includes `canonical-diff.json`; the lane must produce it or closeout will fail.
      * File scope verified: `scripts/run-canonical-reference-bootstrap.ts` **exists on main**.
      * Concurrency: `data-canonical` is a **singleton** — no second data-canonical lane may run concurrently. No forbidden combination with runtime / modeling / verification / governance / hygiene. **Not Tier C** — dispatchable now, concurrent with [UTV2-1699](https://linear.app/unit-talk-v2/issue/UTV2-1699/lane-maximizer-discovery-repair-bare-invocation-returns-an-empty-board).
      * Dependencies: `blockedBy: []`. Blocks [UTV2-1774](https://linear.app/unit-talk-v2/issue/UTV2-1774/june-offline-replay-harness-prove-end-to-end-pipeline-before-provider) (which PM has explicitly held out of Ready) and — newly modelled — **blocks **[UTV2-1775](https://linear.app/unit-talk-v2/issue/UTV2-1775/staging-canonical-reference-parity-seed-aliases-sportsbooks-leagues), which seeds the same canonical reference tables and would otherwise bake fixture mappings this lane may contradict.

      ### Containment

      Passes as scoped. Non-production target only; production bootstrap deferred to separate PM authorization.
