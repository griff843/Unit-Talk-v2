      ### 2. Scope fence — no production write in this lane

      Requirement 5 correctly defers the live bootstrap to a separately PM-approved packet. Make that fence mechanical, not just narrative: validation happens in a non-production target only, and the production bootstrap run is **out of scope for this lane**. Declare the fence in `file_scope_lock` at lane-start so the executor cannot drift into a live write.

      ### Mechanical classification

