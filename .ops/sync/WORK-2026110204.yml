  unmapped_sections:
    - >-
      WORK-2026110204 — the Codex child records phases into the parent's
      checkpoint directory

      Tier: T2

      Lane type: governance

      Executor: codex-cli


      Repo-owned work order. Admitted by Production Claude under Griff's
      "OPERATING-MODEL CLAUDE — ADOPT HYBRID CODEX EXECUTION" directive
      (2026-11-02):

      - "Claude can admit and launch bounded Codex jobs from registered
      worktrees automatically."

      - "Missing telemetry fails honestly rather than generating a fabricated
      value."


      This lane follows the codex-exec observed-routing lane, merged as
      f4843d8d8. It changes no approval artifact, merge authority, branch
      protection, checkpoint schema or production authorization.


      ## Problem


      - `EXECUTION_CHECKPOINT_DIR` is `<git toplevel of the
      process>/.out/ops/execution-checkpoints`
      (`scripts/ops/execution-checkpoint.ts:36`).

      - `codex-exec` begins the attempt in the checkpoint under the *launch*
      checkout's root.

      - The Codex child records its phases by running `pnpm ops:exec-checkpoint
      phase-complete` inside the lane worktree. The CLI resolves its directory
      at `scripts/ops/execution-checkpoint.ts` `runCli()` (`getFlag(flags,
      'dir') ?? EXECUTION_CHECKPOINT_DIR`), so those records land under the
      *worktree's* root.

      - From a control checkout the two roots differ. The run then ends
      `INCOMPLETE_PHASE_PROGRESSION` even when the work is complete.

      - On 2026-11-02 this hit two of the first four hybrid-model wrapper runs.
      One recovered only because Codex improvised `--dir`.

      - As a stopgap, the previous lane added a refusal:
      `checkpointRootMismatch` and its `PRECONDITION_FAILED` exit in `main()` of
      `scripts/ops/codex-exec.ts`.


      ## Change (smallest)


      1. `buildCodexChildEnv` in `scripts/ops/codex-exec.ts` also sets
      `UNIT_TALK_EXECUTION_CHECKPOINT_DIR` to the parent's resolved checkpoint
      directory, as an absolute path. This follows the existing
      `UNIT_TALK_EXECUTION_EPOCH_ID`, `_ATTEMPT` and `_MINIMUM_REVISION`
      pattern. Pass the directory in as a parameter; do not recompute it inside
      the function.

      2. `runCli()` in `scripts/ops/execution-checkpoint.ts` resolves its
      directory in this order:
         - `--dir`;
         - then `process.env.UNIT_TALK_EXECUTION_CHECKPOINT_DIR`, when it is set and non-empty;
         - then `EXECUTION_CHECKPOINT_DIR`.
      3. Remove the launch-root refusal from `main()` in
      `scripts/ops/codex-exec.ts`, together with `checkpointRootMismatch` and
      its tests. A control-checkout launch must now work, because the child
      writes to the same checkpoint the parent reads.


      ## File Scope


      - `scripts/ops/codex-exec.ts`

      - `scripts/ops/codex-exec.test.ts`

      - `scripts/ops/execution-checkpoint.ts`

      - `scripts/ops/execution-checkpoint.test.ts`

      - `.ops/work/WORK-2026110204.md`


      ## PR opening is sequenced (overrides any generic "open a draft PR" step)


      Every pull request, including a draft, runs the shared `staging-ci-db`
      job. That job holds one running and one pending slot, and a third arrival
      cancels the pending proof of another lane. So:


      - Commit and push the lane branch as normal.

      - **Do not open a pull request.** When implementation and local
      verification are complete, write
      `.out/ops/ready-for-pr/WORK-2026110204.md` in the lane worktree. List the
      head SHA, the commands and their results, and the observed model and
      effort.

      - Production Claude opens the PR when the staging slot is free.


      ## Rollback


      Revert the PR. That restores the launch-root refusal, which is the safe
      prior behaviour.
