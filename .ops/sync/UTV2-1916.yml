  objective: |-
    A refusal is rendered at the leg it belongs to — adjacent to the offending row, associated with it programmatically (`aria-describedby` or equivalent), not only by position.
    The slip-level region remains for refusals that are genuinely slip-scoped (nothing belongs to one leg), so a slip-scoped message is never attached to an arbitrary leg to satisfy this change.
    Existing entries still survive a refusal — the behaviour [UTV2-1895](https://linear.app/unit-talk-v2/issue/UTV2-1895/smart-form-mobile-capper-ui-brand-sportsbook-style-selection-to-slip) established and [UTV2-1915](https://linear.app/unit-talk-v2/issue/UTV2-1915/lane-a1-ui-smart-form-multi-leg-bet-slip-add-remove-reorder-and-review)'s tests pin. That assertion must keep failing if the survival is broken.
    The refusal still blocks review completion; the submit control still refuses a slip of more than one leg. This lane does not change what can be submitted.
  acceptance_criteria:
    - A unit test asserts a refusal carries the identity of the leg it refers
      to, and fails when the refusal is emitted without it.
    - A unit test asserts a slip-scoped refusal is *not* attributed to a leg.
