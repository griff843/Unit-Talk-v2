      the ratified reference-data policy, and `docs/mission/intent.md` says Milestone 1 step 4 does not
      require canonical coverage. Populating the canonical tables is [UTV2-1773](https://linear.app/unit-talk-v2/issue/UTV2-1773/canonical-reference-bootstrap-populate-teams-and-prove-idempotent) and is a different decision.
      This issue makes the two search methods read the data the rest of the system already reads.
    - >-
