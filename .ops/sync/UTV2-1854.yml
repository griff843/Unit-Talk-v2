      | `handlers/reference-data.ts:70-83` `handleSearchTeams(eventId)` |
      filters results against `event.participants[].participantId` — a
      **participants** id |

      | `handlers/reference-data.ts:104-121` `handleSearchPlayers(eventId)` |
      same |

      | `handlers/reference-data.ts:106` `handleSearchPlayers(teamId)` |
      `result.teamId === params.teamId`, where the client's `teamId` came from a
      team selection |

      | `smart-form-validation.ts:346` | `row.participantId ===
      identity.participantId` |

      | `runtime-repositories.ts` `getCatalog` | reads `participants` where
      `participant_type='team'` |
    - >-
      The player relationship

      `participants` has **no** `team_id` **column**. The player->team edge is

      `participants(player).metadata->>'team_external_id'` ->
      `participants(team).external_id`.

      Measured: 1497 of 1523 players carry the key and **all 1497 resolve**; 26
      carry none; 0 team

      participants have a null `external_id`. The 26 get `teamId: null` — honest
      partial coverage.

      Never fabricate a team.
    - >-
      Not in scope

      `getEventBrowse` / `searchBrowse` pass **participant** ids to
      `loadCurrentAssignments`, which queries

      `player_team_assignments.player_id` — a canonical player id. That key
      mismatch is real and separate;

      it changes `EventParticipantBrowseResult.teamId`'s id space, which is a
      contract question. The browse

      path already degrades honestly to `null` (`loadParticipantsMap` reads
      `participants`, so

      `participantId` and `displayName` are correct), so it does not block the
      pilot. Record it; do not

      bundle it here.
    - |-
      Tier
      `packages/db/src/runtime-repositories.ts` is on `TIER_C_EXACT_PATHS` in `scripts/ops/merge-risk.ts`,
      so `classifyMechanicalMinimum` returns **T1** (`rule_id: tier-c-exact`). Lane type: runtime.
      Needs `pnpm test:db` + `Writable DB proof (staging only)` green on the merge SHA. Staging only —
