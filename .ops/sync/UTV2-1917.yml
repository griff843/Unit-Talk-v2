      fails the test.
    - "Two roots (`operator` + `grading`, both `corrects_id: null`) produce an
      `excluded` entry naming `MULTIPLE_ROOT_RECORDS`, contributing to neither
      `record` nor `pending`."
    - A second capper's picks cannot contaminate the first's cohort.
    - The six 2026-05-29 fixtures are proven excluded by the cohort predicate,
      not by a filter added here.
    - "[UTV2-1911](https://linear.app/unit-talk-v2/issue/UTV2-1911/per-capper-s\
      tatistics-and-recap-correctness-finish-the-metadatacapper) AC8 carries
      over verbatim: the lane must not present a statistic it cannot source.
      With one capper and zero real settled Track Only picks, an explicitly-zero
      surface is the correct output."
