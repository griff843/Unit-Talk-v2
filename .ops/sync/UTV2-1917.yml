    description: |-
      Third slice of [UTV2-1911](https://linear.app/unit-talk-v2/issue/UTV2-1911/per-capper-statistics-and-recap-correctness-finish-the-metadatacapper), and the only one executable today. C1a is blocked on the `runtime` singleton (held by [UTV2-1907](https://linear.app/unit-talk-v2/issue/UTV2-1907/c1a-pipeline-capper-attribution-must-read-pickscapper-id-not) / [griff843/Unit-Talk-v2#1581](https://linear.app/unit-talk-v2/review/utv2-1907-resolve-capper-attribution-from-pickscapper-id-never-from-08ac75d6352d)) and C1b is blocked on the `delivery-ui` slot for `apps/command-center/**` (held by [UTV2-1802](https://linear.app/unit-talk-v2/issue/UTV2-1802/command-center-remove-or-fail-closed-gate-the-management-api-arbitrary) / [griff843/Unit-Talk-v2#1513](https://linear.app/unit-talk-v2/review/utv2-1802-make-the-command-center-management-token-unable-to-run-5dc8704a2e42), `in_review`).

