    description: >-
      # WORK-2026110306 — Make the WORK-2026110301 diff summary bindable so its
      merged lane can close


      Tier: T3

      Lane type: governance

      Executor: claude


      Repo-owned work order (tracker independence, ratified 2026-09-05). No
      Linear issue exists for this identity by design.


      ## Objective


      WORK-2026110301 merged as PR #1824 (merge
      bb1947e317679d573e00f3b1d2fcd350873b4345), and main CI on that SHA passed.
      Its post-merge closeout (run 41672372626) refused with
      `unbindable_proof_artifact`:
      `docs/06_status/proof/WORK-2026110301/diff-summary.md` ends with `Merge
      SHA: pending governed merge; post-merge binding remains for the authorized
      closeout path.`, which is not a placeholder the rebinder recognizes. Its
      `verification.md` already uses the recognized `Merge SHA: pending merge`
      placeholder.


      Replace only that line with `Merge SHA: pending merge`, so the closeout
      rebinder binds the real merge SHA itself. Then re-dispatch
      `post-merge-lane-close.yml` for WORK-2026110301 without the `pr` input.


      ## Acceptance Criteria


      - Exactly one line changes in
      `docs/06_status/proof/WORK-2026110301/diff-summary.md`. No proof
      assertion, evidence, result or other file of that bundle is changed.

      - No merge SHA is hand-written into the proof. The rebinder binds it
      during closeout.

      - WORK-2026110301 then passes `ops:truth-check` through
      `post-merge-lane-close.yml`, or the exact remaining blocker is named.


      ## Guardrails


      - No bypass of direct-main, review, CI, proof or merge controls. No lane
      identity or evidence field is edited.
