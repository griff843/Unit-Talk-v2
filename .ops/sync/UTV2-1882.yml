  objective: Executor Result Validator rejects the WORK-### repository-minted namespace
  acceptance_criteria:
    - Both copies admit `WORK-###` / `work-` alongside the existing namespaces,
      and the drift tests still bind them byte-identically.
    - A test asserts a valid `WORK-###` issue ID and a `codex/work-###-*` branch
      **pass**.
    - "Tests assert malformed identifiers are **still rejected** — shown failing
      on the condition each names, not merely passing: a bare `WORK`, a `WORK-`
      with no digits, a wrong-namespace `FOO-123`, and a branch whose namespace
      segment does not match."
    - The three existing controls (head-ref mismatch, PR mismatch, stale head
      SHA) still fail on the conditions they name.
    - No change to required-check configuration, branch protection, or any
      bypass.
