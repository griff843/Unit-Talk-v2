    description: >-
      # WORK-2026102602 — Land the WORK-2026102501 and WORK-2026102506 contracts
      on main and record the staging picks indexes


      Tier: T2

      Lane type: governance

      Executor: claude


      Source: PM direction (2026-10-26): "Land the necessary WORK-2026102506 and
      WORK-2026102501 contracts through one properly scoped governance PR with
      normal controls", and the staging-only DDL authorization for
      `xskgrzbteyqdufktjrjx`.


      ## Objective


      Two open Smart Form lanes cannot finish. A delivery-ui lane may not
      declare its own contract (`deriveDeliveryUiApp` refuses any scope path
      outside an app root) and the file-scope guard does not exempt
      `.ops/work/<ID>.md`, so a lane carrying its own contract fails `File scope
      lock`. Readmission (`PL1`) also reads the contract from `main`. Landing
      both contracts here, as a documentation-only governance change, removes
      the contract from each lane PR's diff and makes supported readmission
      possible. Each contract is added exactly as the lane uses it, plus one
      appended "Executor note" that records the provenance correction. Scope,
      acceptance criteria and tiers are unchanged.


      The proof also records the two staging-only indexes created on
      `xskgrzbteyqdufktjrjx` under the same PM direction, with before and after
      plans and the rollback statements. No repo migration, no production
      change.


      ## Acceptance Criteria


      - `.ops/work/WORK-2026102501.md` and `.ops/work/WORK-2026102506.md` exist
      on `main`, each carrying its original text plus the appended Executor
      note.

      - The proof records the exact index definitions, EXPLAIN (ANALYZE,
      BUFFERS) before and after, and the rollback statements, and states that
      this is staging-only drift.

      - No change to any script, workflow, gate, hook, CLAUDE.md, migration,
      containment, kill switch, delivery setting or reserved decision.


      ## File Scope


      - .ops/work/WORK-2026102501.md

      - .ops/work/WORK-2026102506.md

      - .ops/work/WORK-2026102602.md
