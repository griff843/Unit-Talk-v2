  issue_id: WORK-2026092308
  objective: WORK-2026092308 — model-performance report counts the effective
    settlement, not the superseded original
  acceptance_criteria:
    - >-
      # WORK-2026092308 — model-performance report counts the effective
      settlement, not the superseded original


      Tier: T1 · Lane type: runtime · Executor: claude


      ## Problem


      `apps/api/src/model-performance-service.ts` builds its pick → settlement
      map by skipping every

      settlement row whose `corrects_id` is set, keeping only the chain root.
      Settlement corrections

      (`corrects_id` → prior record) are already written by the delivery plane
      and, after the evidence-plane

      correction repair, by operator grading. A corrected pick is therefore
      reported with its **superseded**

      result and CLV, so the calibration report disagrees with the settlement
      plane it reads.


      ## Outcome


      - Group each pick's settlement rows and resolve the effective record with
      the domain's
        `resolveEffectiveSettlement` (root → tip via `corrects_id`).
      - A chain that is incomplete inside the 30-day read window is completed
      from `listByPick` before
        resolution — a correction whose root is older than the window is not dropped.
      - A chain that still cannot be resolved (orphan correction, multiple
      roots, cycle) fails closed: the
        pick is not counted as settled, and the report states how many were excluded
        (`unresolvedSettlementPickCount`), never silently.
      - A pick whose effective record is `manual_review` is not counted as
      settled.


      ## Acceptance


      - WIN → LOSS correction reports the loss and the correction's CLV.

      - Correction whose root is outside the window resolves to the correction.

      - Orphan correction is excluded and counted.

      - Mutation: restoring the root-only filter turns the correction test red.
