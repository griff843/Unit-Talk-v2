  objective: Post-merge migration-profile validation still reads
    verified_source_sha as merge authority, so no schema-v2 migration bundle can
    truth-close
  acceptance_criteria:
    - A schema-v2 migration bundle whose `merge_sha` is the attested merge SHA
      and whose `verified_source_sha` is a PR-contributed commit passes
      post-merge validation.
    - A bundle whose declared `merge_sha` is not the GitHub-recorded merge SHA
      still fails, and the failure names `sha_binding.merge_sha`.
    - A bundle whose `verified_source_sha` is neither the merge SHA nor
      contributed by the attested PR still fails.
    - A bundle that declares no merge slot behaves exactly as before.
    - "A mutation control proves the fix: reverting the authority field to
      `verified_source_sha` makes the regression fail."
    - "[UTV2-1822](https://linear.app/unit-talk-v2/issue/UTV2-1822/reconcile-12\
      7-remote-migration-versions-into-baseline-safe-local) then truth-closes
      through the sanctioned `post-merge-lane-close` path with no hand-edit of
      `main` and no admin bypass."
  guardrails:
    - Proof/gate tooling only. No production DDL, database mutation, deployment,
      ingestion, delivery, implementation-code, or branch-protection change. Do
      not solve it by loosening the attestation requirement or by allowing a
      branch SHA in an authoritative merge field.
