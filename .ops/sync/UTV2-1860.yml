      Scope of this lane: update `docs/mission/plan.md` only — record Milestone
      1 complete, reconcile current truth (deployed SHA, open PRs, readiness),
      and restate the board as Milestone 2.


      Findings to record rather than act on in this lane:


      1. Promotion force-promote: the pick carries promotion_status=qualified /
      promotion_target=best-bets via override_action=force_promote, reason
      "smart-form submissions route directly to best-bets", promoting score
      64.02 against policy minimumScore 70. Harmless under track-only; under
      delivery-eligible it would queue a below-threshold pick to a member
      channel. Milestone 2 item.

      2. `governance.awaiting-approval-drift` has failed 12,634 times, latest
      2026-09-09T03:30Z, on a static backlog of 14,984 stale awaiting_approval
      picks with countIncreased=false. A permanently-red monitor cannot signal
      genuine new drift. Repair belongs in the monitor's classification, not in
      the data (production data deletion is reserved).

      3. Grading is alive in production — `UNIT_TALK_GRADING_CRON_AUTORUN=true`
      is hardcoded at deploy.yml:540 and not gated by containment; 13,720
      successful `grading.run` rows, latest 2026-09-09T02:49Z. Cadence is
      irregular (~90-150 min gaps), which Milestone 2 condition 3 ("on their
      intended schedule") should measure.
