    description: >-
      # WORK-2026092304 — Command Center: show the API's refusal message when a
      settlement is refused


      Repo-owned work order (tracker independence, ratified 2026-09-05). No
      Linear issue exists for this identity by design. Companion to PR #1589
      (UTV2-1919), which makes the API refuse a settlement race with `409
      SETTLEMENT_ALREADY_RECORDED`.


      ## Objective


      - The settle server action reads the operator-facing message from the
      API's actual error shape, `{ ok: false, error: { code, message } }`,
      instead of a top-level `message` the API never sets.


      ## Acceptance Criteria


      - `apps/command-center/src/app/actions/settle.ts` returns the API's
      `error.message` on a failed settlement, and `API error <status>` only when
      no message is readable.

      - A pure helper `readApiErrorMessage` in
      `apps/command-center/src/lib/api-error.ts` carries the parsing, with tests
      in `api-error.test.ts` (picked up by the existing `src/lib/*.test.ts`
      glob, so no package.json change).

      - Mutation drills: removing the nested read turns the nested-message tests
      red; removing the empty-string guard turns the fallback test red.


      ## Guardrails


      - No API, domain, DB, migration or delivery change. No production write.
      No containment change.


      ## Non-goals


      - Changing other actions (`review.ts` and `board.ts` already read
      `error.message`).

      - The settlement read-side `corrects_id IS NULL` readers recorded on
      #1589.


      ## Required Evidence


      - `docs/06_status/proof/WORK-2026092304/diff-summary.md`

      - `docs/06_status/proof/WORK-2026092304/verification.md`

      - Command Center unit suite output and the two mutation drills.


      ## Exit Criteria


      - PR merged on green CI with the evidence above bound to the merge SHA.
