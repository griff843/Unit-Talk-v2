    description: >-
      # WORK-2026092305 — Record WORK-2026092304's PR binding from GitHub merge
      state


      Repo-owned work order (tracker independence, ratified 2026-09-05). No
      Linear issue exists for this identity by design. Same shape as
      WORK-2026092302 (#1629).


      ## Objective


      - Land the manifest mutation computed by `pnpm ops:lane-manifest
      record-merge WORK-2026092304 --pr
      https://github.com/griff843/Unit-Talk-v2/pull/1632`. It sets `pr_url`,
      sets `commit_sha` to the merge commit
      `36de9b57b64de0df7257d6e577b0925873ff758f` read from GitHub, and sets
      `status: merged`.


      ## Why


      - PR #1632 merged, but its manifest on `main` carries `pr_url: null`,
      because `lane-pr-binding` does not bind WORK-### ids.

      - `post-merge-lane-close.yml` resolves the merge SHA only from
      `manifest.pr_url` (step `Resolve merge SHA`), and it does so before the
      optional `pr` input is consulted. So closeout run `35867096340` refused,
      and no dispatch can close the lane until the binding exists on `main`.


      ## Acceptance Criteria


      - `docs/06_status/lanes/WORK-2026092304.json` on `main` carries `pr_url`
      #1632, the GitHub merge commit as `commit_sha`, and `status: merged`.

      - The lane is NOT closed by this PR. Closing still goes through
      `post-merge-lane-close.yml` and a passing `ops:truth-check`.


      ## Guardrails


      - No product code, and no proof content for WORK-2026092304 is changed.

      - No weakening of closeout, truth-check or merge controls.


      ## Exit Criteria


      - PR merged on green CI. Then `post-merge-lane-close.yml -f
      issue_id=WORK-2026092304` is dispatched.
