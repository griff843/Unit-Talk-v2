    description: >-
      # WORK-2026092704 — Complete WORK-2026092701's proof bundle so its
      closeout can pass


      Tier: T3 · Lane type: governance · Executor: claude


      Repo-owned work order (tracker independence, ratified 2026-09-05). No
      Linear issue exists for this identity by design. Same shape as
      WORK-2026092702.


      ## Objective


      - Add the proof content that `ops:truth-check` requires and that
      WORK-2026092701's merged bundle lacks. Closeout run `36330822487` refused
      on it:
        - P1–P4: `docs/06_status/proof/WORK-2026092701/evidence.json` is missing.
        - P13: the verification log does not reference `pnpm verify`.
        - P14: the verification log does not reference `scripts/ci/r-level-check.ts`.

      ## Why


      - PR #1666 merged, and its binding is on `main` (#1668). A proof fix for a
      merged lane cannot be a PR on that lane, so it lands under this separate
      identity. Closeout is then dispatched with the original PR.


      ## Acceptance Criteria


      - `evidence.json` exists as a schema-v2 static bundle.
        - `verified_source_sha` is `47b6af7e2e19a57b4df2367962fb9f71cdf7eecf`, the last non-proof commit of the lane, which is already the `MERGE_SHA` row.
        - `merge_sha` is null until the rebinder sets it.
        - Every value in it is copied from the existing verification log.
      - `verification.md` cites the real records only:
        - the `verify` job of CI run `36325879684` (success) on PR head `cbc478602`;
        - a `scripts/ci/r-level-check.ts` run against the exact merged diff (`83538008f..a6677a96f`, PASS).
      - Existing assertions and evidence are unchanged. Nothing is re-measured
      or re-worded.

      - The lane is not closed by this PR. Closing still goes through
      `post-merge-lane-close.yml` and a passing `ops:truth-check`.


      ## File scope


      - `docs/06_status/proof/WORK-2026092701/evidence.json`

      - `docs/06_status/proof/WORK-2026092701/verification.md`

      - `.ops/work/WORK-2026092704.md`


      ## Guardrails


      - No product code. No weakening of closeout, truth-check or merge
      controls.


      ## Exit Criteria


      - PR merged on green CI. Then `post-merge-lane-close.yml -f
      issue_id=WORK-2026092701 -f pr=1666` is dispatched.
