    description: >-
      # WORK-2026092816 — Record PR #1685's lane binding so WORK-2026092812 can
      close


      Tier: T3 · Lane type: governance · Executor: claude


      Repo-owned work order (tracker independence, ratified 2026-09-05). No
      Linear issue exists for this identity by design. Same shape as
      WORK-2026092803 (#1676).


      ## Objective


      - Land the manifest mutation computed by `pnpm ops:lane-manifest
      record-merge WORK-2026092812 --pr
      https://github.com/griff843/Unit-Talk-v2/pull/1685`. It sets `commit_sha`
      to the merge commit `617ceb93c26c13cbea597971306b4a9a5609a8f1` read from
      GitHub, and sets `status: merged`.


      ## Why


      - PR #1685 merged, but its manifest on `main` carries `status: pr_open`, a
      hand-written value outside the lane lifecycle. `post-merge-lane-close.yml`
      treats it as not closeable and skips.

      - The repair PR #1690 cannot merge: it runs on the merged lane's own
      branch identity, so Executor Result Validation reads WORK-2026092812's
      post-merge bundle as pre-merge and refuses. No PR for a merged lane can
      pass it.


      ## Acceptance Criteria


      - `docs/06_status/lanes/WORK-2026092812.json` on `main` carries `status:
      merged` and the GitHub merge commit as `commit_sha`.

      - The lane is NOT closed by this PR. Closing still goes through
      `post-merge-lane-close.yml` and a passing `ops:truth-check`.


      ## Guardrails


      - No product code, and no proof content for WORK-2026092812, is changed.

      - No weakening of closeout, truth-check or merge controls.


      ## Exit Criteria


      - PR merged on green CI. Then `post-merge-lane-close.yml -f
      issue_id=WORK-2026092812` is dispatched, and #1690 is closed unmerged.
