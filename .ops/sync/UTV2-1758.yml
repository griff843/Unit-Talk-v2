  schema_version: 1
  issue_id: UTV2-1758
  objective: "P0: reconciliation classification correctness and authoritative
    in-flight manifest resolution"
  acceptance_criteria:
    - |-
      ## Why

      `pnpm ops:orchestration-reconcile --current --json` is the fifth Phase 0 dispatch gate. It currently exits nonzero on conditions that are not dispatch risks, and it cannot distinguish a permanently deleted Linear entity from a transient network failure. The result is that Phase 0 is unconditionally red and no lane can be dispatched, while genuinely blocking conditions are buried among hundreds of non-blocking findings.

      Measured on `main` @ `b667c702`, 2026-08-27 — 1538 checks, verdict FAIL:

      | Check | Count | Actually dispatch-blocking? |
      | -- | -- | -- |
      | `ORCH-HISTORICAL-DECAY` | 624 | No — deleted Linear issues referenced by historical artifacts |
      | `ORCH-GITHUB-CHECK` | 94 | No — warnings |
      | `ORCH-MERGED-PR-LINEAR-DONE` | 20 | No — closeout debt on terminal lanes |
      | `ORCH-CLOSED-LANE-BRANCH-CLEANUP` | 11 | No — cleanup candidates |
      | `ORCH-OPEN-PR-MANIFEST-URL` | 7 | **No — all 7 are false positives** |
      | `ORCH-LINEAR-ACTIVE-RECORD` | 3 | Partly |
      | `ORCH-LEASE-EXPIRY` | 3 | Yes, until reclaimed |
      | `ORCH-INFRA` | 1 | Yes, but misclassified |
      | `ORCH-MERGED-PR-ACTIVE-MANIFEST` | 1 | Yes |

      ### Defect 1 — in-flight manifests are read from the wrong place

      All 7 `ORCH-OPEN-PR-MANIFEST-URL` failures are false positives. The reconciler resolves a lane's manifest from `main`'s manifest directory (and from the root working tree), but an in-flight lane's manifest correctly lives on its **own branch** until merge. Verified for every one:

      | Issue | Branch manifest at PR head | `pr_url` | Reconciler says |
      | -- | -- | -- | -- |
      | [UTV2-1744](https://linear.app/unit-talk-v2/issue/UTV2-1744/outbox-dead-letter-and-stuck-claim-triage-make-the-delivery-queue-safe) | `in_review` | `.../pull/1452` | "missing the matching PR URL" |
      | [UTV2-1745](https://linear.app/unit-talk-v2/issue/UTV2-1745/pick-trustworthiness-audit-can-this-system-currently-produce-a) | `in_review` | `.../pull/1453` | "missing the matching PR URL" |
      | [UTV2-1729](https://linear.app/unit-talk-v2/issue/UTV2-1729/proof-producing-contract-is-broken-repair-the-canonical-generator-so) | `in_review` | `.../pull/1436` | "missing the matching PR URL" |
      | [UTV2-1736](https://linear.app/unit-talk-v2/issue/UTV2-1736/offer-history-partitions-provision-current-and-forward-with-pre-expiry) | `in_review` | `.../pull/1451` | "the matching lane manifest is missing" |
      | [UTV2-1652](https://linear.app/unit-talk-v2/issue/UTV2-1652/safe-worktree-branch-and-scratch-state-retirement-preserve-unique-work) | present on branch | — | "the matching lane manifest is missing" |

      For [UTV2-1744](https://linear.app/unit-talk-v2/issue/UTV2-1744/outbox-dead-letter-and-stuck-claim-triage-make-the-delivery-queue-safe)/1745/1729 the reconciler is reading a **stale untracked root working-tree copy** (`status: started`, `pr_url: null`) in preference to the authoritative branch manifest.

      ### Defect 2 — deleted Linear entities are conflated with transient failures

      Two consecutive reconcile runs, same commit, no state change between them, classified **the same entity differently**:

      * Run 1: `ORCH-INFRA` — `Linear issue query failed for UTV2-1432: The operation was aborted due to timeout`
      * Run 2: `ORCH-HISTORICAL-DECAY` — `Linear issue query failed for UTV2-1432: Entity not found: Issue`

      UTV2-1432 was then independently verified through a separate MCP OAuth session as genuinely **deleted**. So a permanent deletion was masked as a transient timeout on one run, and a timeout would equally be masked as permanent deletion on another. Classification is currently decided by network luck.

      This matters because deletion is widespread and real: **623 issue identifiers referenced by repository artifacts no longer resolve**, spanning UTV2-570 through UTV2-1566. Deletion is confirmed, not archival — archived issues resolve in full (positive control: [UTV2-1683](https://linear.app/unit-talk-v2/issue/UTV2-1683/repair-ci-db-proof-harvest-so-runtime-evidence-binds-to-the-merge-sha), archived 2026-08-11).

      ## Required behavior

      1. A valid open PR whose matching manifest exists **at the exact PR head** must not produce `ORCH-OPEN-PR-MANIFEST-URL` merely because that manifest is not yet on `main`. Resolve the authoritative manifest from the PR head commit, and prefer it over any root working-tree copy.
      2. A deleted Linear entity must be distinguished from: an archived issue; a transient API/network failure; an authentication failure. These are four distinct classifications, not one.
      3. Deleted Linear + **active** manifest must produce an actionable, PM-required **orphan** finding.
      4. Deleted Linear + **terminal historical** manifest may produce historical debt or a warning — but must never fabricate a done/pass state.
      5. Transient API, authentication, and rate-limit failures remain **blocking** infra errors.
      6. Merged-PR / Linear-closeout debt remains reported, but must not halt dispatch when the lane holds no active lease, no lock, no capacity, no conflicting authority, and no production risk.
      7. Reconciliation output must explicitly separate four buckets:
         * `dispatch_blocking_failures`
         * `closeout_debt`
         * `warnings`
         * `infra_errors`
      8. Exit nonzero **only** when `dispatch_blocking_failures` or unresolved `infra_errors` exist. **Do not implement a hard-coded issue allowlist** — classification must follow from lane state, not from an identifier list.

      ## Required regression fixtures

      Each must be a real fixture with an asserted classification:

      1. **UTV2-1512** — deleted Linear entity holding an active manifest → PM-required orphan finding (requirement 3)
      2. [UTV2-1736](https://linear.app/unit-talk-v2/issue/UTV2-1736/offer-history-partitions-provision-current-and-forward-with-pre-expiry) — valid on-branch manifest at the exact PR head → no `ORCH-OPEN-PR-MANIFEST-URL` (requirement 1)
      3. [UTV2-1652](https://linear.app/unit-talk-v2/issue/UTV2-1652/safe-worktree-branch-and-scratch-state-retirement-preserve-unique-work) — valid on-branch manifest → no `ORCH-OPEN-PR-MANIFEST-URL` (requirement 1)
      4. **A genuinely missing active manifest** → still reported as blocking (requirement 1 must not over-suppress)
      5. **A transient Linear timeout** → blocking infra error, never demoted to historical debt (requirements 2, 5)
      6. **A merged terminal lane with Linear closeout debt** → `closeout_debt`, non-blocking (requirements 4, 6)

      Fixture 4 is the anti-regression control for fixture 2/3: the suppression must be driven by "manifest verified present at the PR head", never by "PR is open".

      ## Verification standard

      Each control must be validated by making it **fail on the condition it names** — a green run proves nothing. Specifically: mutate the fixture so the classification must flip, and assert that it does.

      ## Non-goals

      * No change to lane lifecycle, lease, or merge-gate semantics.
      * No production surface, DB contract, or runtime execution change.
      * No weakening of any genuinely blocking check.
      * Does not restore UTV2-1512's manifests — that is [UTV2-1757](https://linear.app/unit-talk-v2/issue/UTV2-1757/recover-and-formally-retire-the-deleted-linear-issue-utv2-1512), gated behind [UTV2-1756](https://linear.app/unit-talk-v2/issue/UTV2-1756/scheduled-reconciler-overwrites-root-lane-manifests-with-parked-copy).

      ## Tier

      T2. Governance/reconciliation tooling only; no DB, contract, or lifecycle surface.

      ## Related

      * [UTV2-1756](https://linear.app/unit-talk-v2/issue/UTV2-1756/scheduled-reconciler-overwrites-root-lane-manifests-with-parked-copy) — root manifest write-path fix (independent defect, same subsystem)
      * [UTV2-1757](https://linear.app/unit-talk-v2/issue/UTV2-1757/recover-and-formally-retire-the-deleted-linear-issue-utv2-1512) — deleted UTV2-1512 successor record; depends on this lane's orphan classification
