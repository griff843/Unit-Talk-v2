  schema_version: 1
  issue_id: WORK-2026110302
  objective: "WORK-2026110302 — Discord shared artwork: verified headshots/logos
    only, honest branded fallback"
  acceptance_criteria:
    - "**Domain host guard (path 1).** `mediaUrl` accepts only `https` URLs
      whose host is in a pure-constant allowlist: `cdn.nba.com`,
      `img.mlbstatic.com`, `a.espncdn.com` and `assets.nhle.com`.
      `cms.nhl.bamgrid.com` is excluded. A URL with credentials, an `http` URL,
      a foreign host or a malformed URL yields no thumbnail. Every embed builder
      goes through this guard, including the result recap."
    - "**Worker gate (path 3).** Change only `buildDiscordMessagePayload`
      (`:736-763`): pass a thumbnail only when `metadata.thumbnailVerified ===
      true`. Reviewers reject any hunk outside that function. Routing, targets
      and kill switches are untouched."
    - "**Resolver binds by identity, never by selection text (path 5).** The
      signature takes the participant ID that submission already resolved.
      Selection-text matching is removed."
    - "**Player:** the thumbnail is verified only when a fresh #1822
      `resolveHeadshot` for that participant (display name, sport, team) returns
      exactly the stored URL. A timeout (5s), ambiguity, mismatch or null gives
      no thumbnail."
    - "**Team:** use `logo_url` only when the identified participant *is* that
      team."
    - "**Game totals and two-team selections:** no thumbnail."
    - Return `{ url, verified }`. **The `updateMetadata` write-back is removed.**
    - "**Submission (path 7).** Pass the resolved participant ID at both call
      sites. Set `metadata.thumbnailVerified` only from the resolver. Strip any
      caller-supplied `thumbnailUrl` and `thumbnailVerified` before persisting.
      Submission is otherwise unchanged: same validation, lifecycle, promotion
      and response."
    - "**Honest branded fallback.** Unresolved, unverified, shared, dead-host or
      legacy imagery gives an embed with **no thumbnail** that keeps the
      existing text brand. It never shows a broken image or another person's
      photo. Old picks lacking `thumbnailVerified` get no thumbnail, and their
      stored metadata is not rewritten."
    - "**Tests run under verify (path 9).** Register paths 2, 4 and 6 in their
      existing root `package.json` test scripts. Prove they are executed by
      `pnpm verify`."
    - "**Regression tests first.** Show each failing on unmodified main, then
      passing:"
    - an ambiguous name;
    - a last-name-only match;
    - an unrelated player;
    - a shared stored URL;
    - a dead NHL host;
    - a two-team total;
    - a provider timeout;
    - "a caller-supplied `thumbnailVerified: true`;"
    - no `updateMetadata` call;
    - an unverified thumbnail dropped by the worker while the embed still sends.
    - Record mutations that restore (a) selection-text matching, (b) an
      unconditional worker thumbnail and (c) an any-host `mediaUrl`. Each must
      fail a test.
    - "**Rendered-embed proof.** Produce before/after rendered embed payload
      fixtures in the proof dir. Each pair must show that a shared, unverified
      or dead-host image yields no thumbnail, that the embed still sends, and
      that a verified image renders."
    - "**No delivery authorization change.** No change to targets, kill
      switches, outbox, receipts, audience, entitlement, delivery timing or
      Track Only gating. No member delivery."
    - "**T1 verification:**"
    - "`pnpm verify` green at the exact head;"
    - the CI `Writable DB proof (staging only)` job green at the exact head;
    - if pick metadata persistence changes shape, a staging live test showing
      that a submitted pick persists `thumbnailVerified` correctly and that
      caller-supplied values are stripped;
    - an evidence bundle v1 tied to the merge SHA.
    - Merge requires Griff's `t1-approved` label and a `pm-verdict/v1` APPROVED
      comment at the exact head.
  guardrails:
    - No schema change, no new media host, no hosted brand image and no
      production data write.
    - Staging only for any DB write, through CI.
    - "`apps/api/src/player-enrichment-service.ts` is not edited; it is
      WORK-2026110301's scope. Import from it only."
  non_goals:
    - Rewriting stored production headshots (Griff's separate decision).
