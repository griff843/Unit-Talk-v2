  schema_version: 1
  issue_id: UTV2-1885
  objective: "Outcome-first instruction revision: /verification and /three-brain"
  acceptance_criteria:
    - |-
      Apply the outcome-first instruction revisions to the two skill files that sit outside PR [griff843/Unit-Talk-v2#1556](https://linear.app/unit-talk-v2/review/work-2026091001-tracker-free-execution-and-trusted-evaluator-2a4ab78a3309)'s `file_scope_lock`:

      * `.claude/commands/verification.md`
      * `.claude/commands/three-brain.md`

      **Why these two only.** Every other file in the proposal (`CLAUDE.md`, `AGENTS.md`, `.claude/commands/lane-recovery.md`, `.claude/commands/dispatch.md`, `.agents/skills/dispatch/SKILL.md`, `.claude/hooks/session-start.sh`) is inside PR [griff843/Unit-Talk-v2#1556](https://linear.app/unit-talk-v2/review/work-2026091001-tracker-free-execution-and-trusted-evaluator-2a4ab78a3309)'s pinned `file_scope_lock` at status `in_review`, so `ops:lane-start` refuses them with `file_scope_conflict`, which has no override. Those revisions are carried in [griff843/Unit-Talk-v2#1556](https://linear.app/unit-talk-v2/review/work-2026091001-tracker-free-execution-and-trusted-evaluator-2a4ab78a3309) itself, which already rewrites the same files.

      **What changes.**

      `verification.md` — replaces session-freshness as the verification criterion with evidence provenance and head binding. Adds a "Verification scope" section that selects behavioral checks from changed paths and concrete failure risks, and states explicitly that it grants no waiver of tier, R-level, CI or proof obligations.

      `three-brain.md` — replaces the hardcoded Haiku subagent routing table with a policy-referencing statement about supported model profiles; replaces the "more than 3 files" mechanical delegation trigger with a substance-based one; and corrects the escalation rule so a reserved gate pauses only its dependent work rather than all work, matching `docs/mission/intent.md` § "Stop conditions".

      **Acceptance criteria.**

      1. Both files carry the revised text.
      2. No tier, R-level, CI, proof, lane-admission, P0 or merge-authority obligation is waived or weakened anywhere in the diff.
      3. The escalation change matches `intent.md` § "Stop conditions" rather than introducing a new rule.
      4. `pnpm verify` green on the branch.
      5. Green CI on the merge SHA.

      **File scope:** `.claude/commands/verification.md`, `.claude/commands/three-brain.md`

      **Verification:** `pnpm verify`; diff review against `intent.md` stop conditions and against `docs/05_operations/OPERATING_MODEL_SONNET5.md` for the model-routing claim.

      **Dependencies:** none. Complements PR [griff843/Unit-Talk-v2#1556](https://linear.app/unit-talk-v2/review/work-2026091001-tracker-free-execution-and-trusted-evaluator-2a4ab78a3309); does not depend on it.
