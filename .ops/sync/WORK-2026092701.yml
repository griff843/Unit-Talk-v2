  objective: >-
    `pipeline-health-monitor.yml` has concluded `failure` on every daily run
    since at least 2026-09-19, and its report gets three verdicts wrong:

    **It evaluates the wrong worker.** The workflow passes
    `vars.UNIT_TALK_DISTRIBUTION_TARGETS`, which does not exist (deploy reads a
    *secret* of that name, and `human-capper` mode forces the worker to
    `discord:official-picks` regardless). `scripts/pipeline-health.ts` therefore
    falls back to `discord:canary`, a worker configuration that is not deployed.
    The live `worker.heartbeat` row records `details.targets =
    ["discord:official-picks"]` (measured 2026-09-27 13:58Z).

    **It tells the operator to bypass the kill switch.** Pick `2cc92f4b` is
    `pending` on `discord:official-picks` *because*
    `delivery_kill_switch.official-picks` is `killed = true` — containment
    working. The report classes it `target_mismatch` / critical with remediation
    "Add the target to worker configuration or reroute/remove the unsupported
    pending row".

    **It fails on rows no deployed worker can claim.** 32 `processing` rows on
    `utv2-1497-canary-*` targets are reported as critical `processing_stale`,
    although `readiness-refresh.ts` (UTV2-1933) already classifies them as
    unclaimable data hygiene.

    A monitor that is red every day for these reasons conveys nothing when a
    real failure arrives.
  acceptance_criteria:
    - The monitor resolves worker targets from the newest `worker.heartbeat`
      whose `details.targets` is a non-empty string array and whose age is
      within the heartbeat window. An explicitly set
      `UNIT_TALK_DISTRIBUTION_TARGETS` is used only when no such heartbeat
      exists, and the report states which source was used. With neither, the
      report raises a **critical** "deployed worker target set unknown" — the
      silent `discord:canary` default is removed.
    - "A `pending` row on a target the worker polls, whose kill-switch key (the
      worker's own mapping: `discord:X` → `X`, `discord:canary` exempt) is
      `killed = true` **or has no row** (the worker's fail-closed rule), is
      reported as a **warning** \"held by kill switch\", with remediation
      stating that release is an operator/owner decision and the row must not be
      rerouted. It is excluded from the rows that raise stranding, mismatch or
      stale-delivery criticals."
    - "If the kill-switch table cannot be read, no row is classified as held
      (fail closed: those rows stay critical) and the read failure is itself
      reported."
    - "`processing` rows on targets the resolved worker does not poll are
      reported as a **warning** naming the unclaimable targets and counts, and
      do not raise `processing_stale`. They are never discarded from the
      report."
    - "Genuine failures stay critical: stranded `pending` rows on targets no
      worker polls, true dead letters, stale processing on polled targets,
      missing heartbeat."
    - The classification is pure and unit-tested, including each fail-closed
      direction; `pnpm type-check` and `pnpm test` pass.
    - No database write, no containment change, no change to
      `packages/observability`, the worker, or any delivery path.
  guardrails:
    - Read-only against production. The monitor stays red while real stranded
      rows and dead letters exist; this work makes it red for the right reasons,
      and does not make it green by hiding rows.
    - "Out of scope: clearing or dead-lettering any outbox row (production data
      change, reserved), the workflow's Linear issue creation, and
      `packages/observability`'s `evaluateQueueHealth` semantics."
