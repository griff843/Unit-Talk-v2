    description: >-
      # WORK-2026102701 — Compact mission card in CLAUDE.md


      Tier: T2

      Lane type: governance

      Executor: claude


      Source: PM final operating-model execution directive (2026-10-27): land
      the compact mission-context improvement measured in the 2026-10-25 trial.
      Instruction-loading change only. No policy, merge-authority, tier, gate,
      hook, containment or reserved-decision change.


      ## Objective


      Replace the three eager `@` imports of `docs/mission/intent.md`, `spec.md`
      and `plan.md` in `CLAUDE.md` with a compact mission card plus an explicit
      read-first instruction, keeping
      `@docs/05_operations/STANDING_GUARDRAILS.md` imported. The trial measured
      start-of-session context falling from about 45.9k to about 27.9k tokens
      (about 18.0k saved; 18.1k after compaction) with no loss of mission
      recovery or safety behaviour.


      ## Acceptance Criteria


      - `CLAUDE.md` "Mission — mandatory context" carries: the mission and
      current quantity-first goal; all eight reserved decisions, matching
      `docs/mission/intent.md` "Reserved decisions and actions"; the standing
      holds from `docs/mission/plan.md` section 1; the full stop-condition and
      non-stop list from `intent.md` "Stop conditions"; a read-first instruction
      for `intent.md` and `plan.md` (and `spec.md` for contract questions); a
      pointer to `docs/mission/plan-readings.md`; and a statement that the files
      win over the card on any disagreement.

      - `@docs/05_operations/STANDING_GUARDRAILS.md` remains an import.

      - No other section of `CLAUDE.md` changes, and no other file changes
      except this lane's own metadata and proof.

      - `intent.md`, `spec.md`, `plan.md`, hooks, settings, CI and merge
      requirements are unchanged.


      ## File Scope


      - CLAUDE.md

      - .ops/work/WORK-2026102701.md


      ## Rollback


      Revert the single squash commit; `CLAUDE.md` returns to the eager imports.
