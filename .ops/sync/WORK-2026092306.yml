  issue_id: WORK-2026092306
  objective: WORK-2026092306 — intelligence form windows read the effective
    settlement, not the superseded original
  acceptance_criteria:
    - >-
      # WORK-2026092306 — intelligence form windows read the effective
      settlement, not the superseded original


      Tier: T2 · Lane type: delivery-ui · Executor: claude


      ## Problem


      `getIntelligenceData` in `apps/command-center/src/lib/data/analytics.ts`
      reads

      `settlement_records` with `.is('corrects_id', null)`, which selects each
      pick's chain **root**.

      Settlement corrections (`corrects_id` → prior record) are written by the
      delivery plane and by

      operator grading, so every corrected pick's recent-form, score-band and
      CLV figures show the

      superseded result.


      ## Outcome


      - Read recent settlement rows and each such pick's full history, then
      reduce to one effective row
        per pick with the domain's `resolveEffectiveSettlement` (root → tip).
      - A chain that does not resolve (orphan correction, multiple roots, cycle,
      branch) is excluded and
        counted, never guessed. A `manual_review` tip is not a settlement.
      - Form windows stay ordered by the chain root's `settled_at`, so a late
      correction does not move an
        old game to the front.

      ## Acceptance


      - WIN → LOSS correction yields the loss and the correction's payload.

      - Orphan correction and two-root chain are excluded and counted.

      - Mutation: reducing to the root instead of the tip turns the correction
      test red.
