      ## Tier rationale


      T2: a bounded change to one app-level loop
      (`apps/api/src/grading-cron.ts`) and its test. It touches no Tier C
      sensitive path in `DELEGATION_POLICY.md` (no migration, no
      contracts/domain, no `runtime-repositories.ts`, no
      distribution/auth/settlement code, no env or default change, no delivery
      routing). "Scheduled jobs / cron / retention (`pg_cron`, cleanup jobs)" in
      the sensitive-path matrix refers to database-scheduled jobs and data
      lifecycle; this change touches neither pg_cron nor any data. It writes
      only the existing local liveness marker file. If a reviewer reads that row
      as covering the app-level grading loop, re-tier to T1 before merge
      (re-tiering up is always permitted).


      ## Production observations (read-only, 2026-11-08T17:45Z)


      - `grading.cron.heartbeat` cycles 1-8 landed at 15:39:51, 15:56:40,
      16:13:47, 16:30:53, 16:47:58, 17:05:14, 17:22:20, 17:39:23 UTC: a period
      of about 17.1 min.

      - Each `grading.run` takes about 12 min (rows_scanned 22,296, all skipped,
      `degraded_stale_input`), followed by the 5 min poll.

      - Not observed from this session: container health states (no host
      access).


      ## Code findings


      - `startGradingCronLoop` (`apps/api/src/grading-cron.ts`) calls
      `refreshLiveness()` only at the end of a successful cycle (after the
      health evaluation).

      - The compose healthcheck and `isGradingCronFresh` treat the marker as
      stale when older than 3 x `UNIT_TALK_GRADING_CRON_POLL_MS` (default
      300000) = 15 min.

      - With a ~17.1 min cycle the marker is stale for about 2 min per cycle, so
      the container can flap `unhealthy` (interval 60s, retries 3) with no
      actual fault.


      ## Allowed file scope


      - `apps/api/src/grading-cron.ts` (liveness refresh at cycle start only)

      - `apps/api/src/grading-cron.test.ts`

      - `.ops/work/WORK-2026110801.md`, `docs/06_status/proof/WORK-2026110801/`


      Out of scope: `grading-cron-health.ts`,
      `deploy/production/docker-compose.yml`, the poll interval, any in-pass
      timer or heartbeat (it would mask a hung await), and the 12-minute
      stale-input rescan itself (separate follow-up).


      ## Required regression proof (named tests)


      1. Liveness is refreshed before the grading pass runs, in every cycle.

      2. A failing pass still has the start-of-cycle refresh recorded.

      3. Mutation check: with the start refresh removed, test 1 fails.
