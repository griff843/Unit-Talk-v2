  objective: Repair production warehouse verifier libpq connection and CLI ledger parsing
  acceptance_criteria:
    - Parse the identity-validated PostgreSQL URI into libpq child env PGHOST,
      PGPORT, PGUSER, PGPASSWORD, PGDATABASE from the URL path, and applicable
      secure SSL parameters. No DSN/password in argv/logs/fixtures/proof.
      Preserve mandatory PGOPTIONS read-only and statement timeout. Remove
      SUPABASE_ACCESS_TOKEN and original UNIT_TALK_WAREHOUSE_SOURCE_DSN from
      child env; refuse malformed/noncanonical DSNs before psql. Do not weaken
      assertProductionIdentity or substitute a broader DB identity.
    - Parse ledger version cells allowing whitespace and exactly one matching
      pair of Markdown backticks. Require exactly 12–14 numeric digits after
      normalization. Preserve exact equality of repository, CLI Local and CLI
      Remote sets and require 20260928131714. Arbitrary malformed text must
      refuse, not silently align.
    - Regression coverage for canonical pooler decomposition, decoded
      username/password, preserved production host, secret-free argv, stripped
      broad token/source DSN, enforced read-only options, malformed/noncanonical
      input refusal; bare and actual-production backtick ledger formats,
      expected version detection, missing/mismatched Remote and malformed
      wrapped text refusal.
    - Focused tests directly executable via tsx --test; full pnpm verify and
      applicable R-level; exact-head CI, scope, lane, proof and review/merge
      controls. No gate bypass. Named proof
      docs/06_status/proof/<issue>/verification.md.
    - After normal merge resume
      [UTV2-1370](https://linear.app/unit-talk-v2/issue/UTV2-1370/hot-db-retention-execution-wave-1)
      verification with fresh current-main production read-only verifier,
      independently inspect immutable receipt, then authoritative Live Schema
      Parity PASS and governed closeout. This repair does not itself assert
      production acceptance.
