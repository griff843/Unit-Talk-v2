      WORK-2026103007 — Live staging proof of the human-capper delivery path
      Tier: T1
      Lane type: verification
      Executor: codex-cli

      Repo-owned work order (tracker independence, ratified 2026-09-05). Part of Griff's 2026-10-30 private-canary preparation. No production mutation is authorized. **Staging only** (`xskgrzbteyqdufktjrjx`, the CI `Writable DB proof (staging only)` job).

      ## Gap

      Human-capper delivery is proven only in memory (`apps/api/src/t1-proof-utv2-1923-human-capper-delivery.test.ts`). In production it ran once, on 2026-09-18, and those records were deleted on 2026-10-28. No live-DB test covers allowlist authorization → release → outbox → claim → atomic confirm → receipt → dispatch ledger.

      ## Required proof (real persistence, real contracts)

      Against the staging database, using the real Database repository bundle and the real RPCs (`processSubmissionAtomic`, `enqueueDistributionAtomic`, `claimNextAtomic` / `claim_next_outbox`, `confirmDeliveryAtomic` / `confirm_delivery_atomic`):

      1. A run-namespaced capper with a valid `cappers.metadata.discord` routing record is seeded by the test, on the server allowlist the test configures. It submits a `delivery-eligible` pick through the real submission path.
         - Assert `metadata.deliveryAuthorization.decision = 'authorized'`, the pinned destination, `capper_id`, and lifecycle `validated → queued`.
      2. Exactly one `distribution_outbox` row exists for the pick, with target `discord:official-picks` and the pinned channel in its payload.
      3. A **Track Only** pick by the same capper creates **no** outbox row (negative control).
      4. **The worker side: claim, deliver, confirm.**
         - Use the worker's real claim/confirm code path with a **stub Discord adapter**, label it simulated in the test name and the proof, and use a run-namespaced target so no live worker or real channel can pick it up.
         - Assert: one receipt (`receipt_type 'discord.message'`, `status 'sent'`, `external_id` = the stub's message ID, `channel` and `payload.channelId` = the pinned channel); lifecycle `queued → posted`; and `distribution.dispatch_started` / `dispatch_delivered` audit rows.
      5. **Exactly once:** a second claim cycle posts nothing, and the adapter call count stays 1.
      6. **Kill switch:** with the switch killed for the run-namespaced target, the row is not claimed and the adapter is not called.
         - Remember that `delivery_kill_switch` reads a missing row as killed.
         - The run-namespaced target must be released by a test-owned row, never by touching `official-picks` or any real target row.
         - Clean up only the test's own kill-switch row.

      Apps must not import from other apps. If the API and worker halves cannot share one test file, split it into an `apps/api` live test (steps 1–3) and an `apps/worker` live test (steps 4–6) that pick up the persisted row by its run-namespaced pick id. Explain the split in the proof.

      **Do not claim a Discord delivery.** The adapter is a stub, and the proof must say so in plain words.

      ## Constraints

      - Never write to production. Never touch the real `official-picks`, `best-bets`, `trader-insights`, `exclusive-insights` or `human-capper-recaps` kill-switch rows, even on staging.
      - No timeout increases. Find fixtures through indexed columns (`capper_id`, `pick_id`), never `selection`. Staging statement timeout is 8 s; see WORK-2026103001.
      - No schema change.

      ## File Scope

      - apps/api/src/t1-proof-work-2026103007-human-capper-delivery-live.test.ts
      - apps/worker/src/t1-proof-work-2026103007-human-capper-delivery-live.test.ts (if split)
      - package.json (root): register the new live test file(s) in `test:t1-proof:live`. This lane owns that line; no concurrent lane edits it.
      - scripts/ci/db-writer-inventory.ts: only if the DB-writer inventory requires listing the new test file(s)
