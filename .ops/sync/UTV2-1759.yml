task_contract:
  schema_version: 1
  issue_id: UTV2-1759
  objective: Post-merge S1 scope evaluation rejects the lane's own required
    lifecycle metadata, making truthful closeout structurally impossible
  acceptance_criteria:
    - |-
      ## Why

      A lane cannot truthfully close itself. The dispatch protocol **requires** every lane to commit its own manifest and sync file to its branch. `ops:lane-start` creates `docs/06_status/lanes/<ISSUE>.json` **after **`file_scope_lock` has already become immutable, so those paths can never appear in the lock. `record-merge` then truthfully records the manifest in `files_changed` from the merged diff. Post-merge `evaluateScopeDiff` (S1) compares the two and fails.

      The pre-merge scope system already recognizes lifecycle metadata and grants these paths unconditionally. The post-merge guard does not. The two guards carry divergent definitions of the same invariant, and the divergence makes truthful closeout impossible for any lane whose `files_changed` was honestly populated.

      ### Observed

      [UTV2-1758](https://linear.app/unit-talk-v2/issue/UTV2-1758/p0-reconciliation-classification-correctness-and-authoritative-in), merged at `1fdd7fc8133da12786466c5b733030aee8dcf841` (PR #1454), all merge-SHA CI green. `ops:lane-close` fails on exactly one check, both locally and in the `post-merge-lane-close` workflow:

      ```
      [FAIL] S1 files_changed outside file_scope_lock: docs/06_status/lanes/UTV2-1758.json
      ```

      `ops:lane-close --repair-merged` produced a repair packet whose `proposed_manifest` is byte-identical to the input — the repair path has no remedy. There is no scope-override flag on `lane-close`.

      Earlier lanes did not hit this only because their `files_changed` was empty ([UTV2-1722](https://linear.app/unit-talk-v2/issue/UTV2-1722/closeout-recovery-profile-aware-non-destructive-proof-binding-p10r3)) or hand-set equal to the lock ([UTV2-1752](https://linear.app/unit-talk-v2/issue/UTV2-1752/executor-packet-finalization-correct-readmission-timing-t1-proof-and)). Honest recording is what exposes the gap.

      ### Where to look

      * `scripts/ops/truth-check-lib.ts` — `evaluateScopeDiff`, currently around line 727. It grants an unconditional exemption to `docs/06_status/proof/` but nothing for lifecycle metadata.
      * The pre-merge scope guard that already recognizes these paths — locate it and reuse its definition rather than writing a second one.
      * `scripts/ops/truth-check-lib.test.ts` — existing S1 coverage.

      ## Required behavior

      1. Post-merge S1 must recognize **only the current lane's exact required lifecycle-generated paths**:
         * `docs/06_status/lanes/<CURRENT_ISSUE>.json`
         * `.ops/sync/<CURRENT_ISSUE>.yml`
      2. Do **not** exempt the `docs/06_status/lanes/` or `.ops/sync/` directories, and do not add any prefix or glob exemption over them.
      3. Another issue's manifest or sync file must still fail S1.
      4. Arbitrary lifecycle files, source files, configuration files, and unrelated documentation outside `file_scope_lock` must still fail.
      5. Prefer one shared lifecycle-scope policy/helper used by **both** the pre-merge and post-merge guards, provided this can be done without expanding the lane beyond this single invariant. The two guards must not continue carrying divergent definitions.

      ## Definition of done

      * `evaluateScopeDiff` accepts the current lane's exact manifest and sync paths and nothing broader.
      * Pre-merge and post-merge guards derive the exemption from one shared definition, or the PR states explicitly why sharing could not be done within this invariant.
      * All regression tests below pass, including the mutation control.
      * `pnpm verify` green.
      * [UTV2-1758](https://linear.app/unit-talk-v2/issue/UTV2-1758/p0-reconciliation-classification-correctness-and-authoritative-in) closes truthfully afterward via the sanctioned post-merge closeout workflow against its **original** PR #1454 and merge SHA `1fdd7fc8133da12786466c5b733030aee8dcf841` — no second [UTV2-1758](https://linear.app/unit-talk-v2/issue/UTV2-1758/p0-reconciliation-classification-correctness-and-authoritative-in) PR.

      ## Required regression tests

       1. The current lane's exact manifest path passes.
       2. The current lane's exact sync file path passes.
       3. Another lane's manifest fails.
       4. Another lane's sync file fails.
       5. An unrelated source file fails.
       6. An arbitrary file under `docs/06_status/lanes/` fails.
       7. An arbitrary file under `.ops/sync/` fails.
       8. Existing proof-path behavior is unchanged.
       9. [UTV2-1758](https://linear.app/unit-talk-v2/issue/UTV2-1758/p0-reconciliation-classification-correctness-and-authoritative-in)'s actual `files_changed` / `file_scope_lock` fixture passes after the correction.
      10. **Mutation control:** removing the exact-lane exemption makes the [UTV2-1758](https://linear.app/unit-talk-v2/issue/UTV2-1758/p0-reconciliation-classification-correctness-and-authoritative-in) fixture fail again.

      ## Verification standard

      Each control must be validated by making it fail on the condition it names. A green run proves nothing; test 10 is the required inversion.

      ## Non-goals

      * No broad prefix exemptions.
      * No change to lane lifecycle, lease, merge-gate, or reconciler semantics.
      * No production, DB, contract, or runtime surface.
      * No weakening of any genuinely blocking check.
      * Does not fold in the two separately-recorded defects (Executor Result Validation evidence selection; CLAUDE.md T2 merge-authority documentation).

      ## Tier

      T2. Governance tooling only.

      ## Recovery target

      [UTV2-1758](https://linear.app/unit-talk-v2/issue/UTV2-1758/p0-reconciliation-classification-correctness-and-authoritative-in) is this lane's merged-but-unclosed recovery target, not parallel feature work.
