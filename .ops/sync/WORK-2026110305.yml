  unmapped_sections:
    - |-
      WORK-2026110305 — Live staging proof of the human-capper delivery path (supersedes WORK-2026103022 and WORK-2026103007)
      Tier: T1
      Lane type: runtime
      Executor: codex-cli

      Repo-owned work order (tracker independence, ratified 2026-09-05). **Supersedes WORK-2026103022**, which was admitted as a verification lane whose execution authority excludes the API live-test path, so its checkpoint failed at plan. Its lease was reclaimed on 2026-11-03 and it has no PR. The contract below is otherwise unchanged. WORK-2026103022 in turn **superseded WORK-2026103007**, whose immutable scope lacked `docs/05_operations/db-writer-classification.json`. `scripts/ci/db-writer-inventory.ts` fails on an unclassified credentialed test **and** on a classification whose path does not exist, so the classification must land in the same PR as the tests. Carry the 3007 work over by cherry-picking its WIP commit `80670e87765f770410702c62210f622d08791115` (branch `codex/work-2026103007-human-capper-delivery-live-proof`). Part of Griff's 2026-10-30 private-canary preparation. No production mutation is authorized. **Staging only** (`xskgrzbteyqdufktjrjx`, the CI `Writable DB proof (staging only)` job).

      ## Gap

      Human-capper delivery is proven only in memory (`apps/api/src/t1-proof-utv2-1923-human-capper-delivery.test.ts`). In production it ran once, on 2026-09-18, and those records were deleted on 2026-10-28. No live-DB test covers allowlist authorization → release → outbox → claim → atomic confirm → receipt → dispatch ledger.

      ## Required proof (real persistence, real contracts)

      Against the staging database, using the real Database repository bundle and the real RPCs (`processSubmissionAtomic`, `enqueueDistributionAtomic`, `claimNextAtomic` / `claim_next_outbox`, `confirmDeliveryAtomic` / `confirm_delivery_atomic`):

      1. A run-namespaced capper with a valid `cappers.metadata.discord` routing record is seeded by the test, on the server allowlist the test configures. It submits a `delivery-eligible` pick through the real submission path.
         - Assert `metadata.deliveryAuthorization.decision = 'authorized'`, the pinned destination, `capper_id`, and lifecycle `validated → queued`.
      2. Exactly one `distribution_outbox` row exists for the pick, with target `discord:official-picks` and the pinned channel in its payload.
      3. A **Track Only** pick by the same capper creates **no** outbox row (negative control).
      4. **The worker side: claim, deliver, confirm.**
         - Use the worker's real claim/confirm code path with a **stub Discord adapter**, label it simulated in the test name and the proof, and use a run-namespaced target so no live worker or real channel can pick it up.
         - Assert: one receipt (`receipt_type 'discord.message'`, `status 'sent'`, `external_id` = the stub's message ID, `channel` and `payload.channelId` = the pinned channel), and lifecycle `queued → posted`.
         - **Ledger boundary (Production Claude decision, 2026-10-30):** the dispatch ledger is written only for governed human-delivery targets (`apps/worker/src/distribution-worker.ts:67`, `isLedgerGovernedTarget`). A run-namespaced target is not governed, and using `discord:official-picks` would mean touching its kill-switch row, which is forbidden.
           - Assert the **real** contract for this target instead: **zero** `distribution.dispatch_*` ledger rows for the run's pick.
           - The proof states plainly that the governed-target ledger path is not proven here. It is covered by the existing in-memory ledger tests and will be evidenced by the production canary.
           - Do not remap the target or fabricate ledger rows.
      5. **Exactly once:** a second claim cycle posts nothing, and the adapter call count stays 1.
      6. **Kill switch:** with the switch killed for the run-namespaced target, the row is not claimed and the adapter is not called.
         - Remember that `delivery_kill_switch` reads a missing row as killed.
         - The run-namespaced target must be released by a test-owned row, never by touching `official-picks` or any real target row.
         - Clean up only the test's own kill-switch row.

      Apps must not import from other apps. If the API and worker halves cannot share one test file, split it into an `apps/api` live test (steps 1–3) and an `apps/worker` live test (steps 4–6) that pick up the persisted row by its run-namespaced pick id. Explain the split in the proof.

      **Do not claim a Discord delivery or a governed-ledger proof.** The adapter is a stub, and the proof must say so in plain words.

      ## Constraints

      - Never write to production. Never touch the real `official-picks`, `best-bets`, `trader-insights`, `exclusive-insights` or `human-capper-recaps` kill-switch rows, even on staging.
      - No timeout increases. Find fixtures through indexed columns (`capper_id`, `pick_id`), never `selection`. Staging statement timeout is 8 s; see WORK-2026103001.
      - No schema change.

      ## File Scope

      - apps/api/src/t1-proof-work-2026103007-human-capper-delivery-live.test.ts
      - apps/worker/src/t1-proof-work-2026103007-human-capper-delivery-live.test.ts (if split)
      - package.json (root): register the new live test file(s) in `test:t1-proof:live`. This lane owns that line; no concurrent lane edits it.
      - scripts/ci/db-writer-inventory.ts: only if the inventory code itself must change (it should not)
      - docs/05_operations/db-writer-classification.json: add the classification entries for the new live test file(s), in the existing `credentialed_tests` shape

      ## PR opening is sequenced (overrides any generic "open a draft PR" step)

      Every pull request runs the shared `staging-ci-db` job. Commit and push the lane branch, but **do not open a pull request**. When implementation and local verification are complete, write `.out/ops/ready-for-pr/<this issue id>.md` in the lane worktree. List the head SHA, the focused test commands and their results, and the observed model and effort. Production Claude opens the PR when the staging slot is free.
