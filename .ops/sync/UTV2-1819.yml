  source:
    kind: linear-issue-snapshot
    issue_url: https://linear.app/unit-talk-v2/issue/UTV2-1819/lane-maximizer-candidate-discovery-fails-closed-on-every-bare
    title: "lane-maximizer candidate discovery fails closed on every bare
      invocation: page size 100 exceeds Linear's query complexity budget"
    description: |-
      **Severity: factory-stopping. **`/dispatch`, `/dispatch-board` and `/loop-dispatch` all route through `ops:lane-maximizer`, which currently cannot read the board at all on `main`.

      ## Symptom

      ```
      pnpm ops:lane-maximizer
      [lane-maximizer] candidate_discovery_failed: ... Cause: Linear candidate query failed: Linear HTTP 400 Bad Request
      ```

      Exit 1. The fail-closed envelope is **correct behaviour** ([UTV2-1699](https://linear.app/unit-talk-v2/issue/UTV2-1699/lane-maximizer-discovery-repair-bare-invocation-returns-an-empty-board) AC3 working as designed — an unknown board is never reported as empty). The defect is the query underneath it.

      ## Root cause (measured, not inferred)

      `LINEAR_CANDIDATE_PAGE_SIZE = 100` (`scripts/ops/lane-maximizer.ts:846`) is passed as `first:` on the `LaneCandidates` query. With the full node selection — which includes two nested connections, `labels { nodes { name } }` and `relations { nodes { type relatedIssue { identifier } } }` — Linear rejects it:

      ```json
      {"message":"Query too complex","extensions":{"code":"INPUT_ERROR","statusCode":400,
       "userPresentableMessage":"The query is too complex. Complexity: 11601.000000000002. Maximum allowed complexity: 10000."}}
      ```

      Measured boundary against the live API with the exact production query and the real team id:

      | `first:` | result |
      | -- | -- |
      | 100 | **HTTP 400** — complexity 11601 / 10000 |
      | 75 | OK |
      | 60 | OK |
      | 50 | OK |
      | 40 | OK |
      | 25 | OK |

      ## Why it did not surface before [UTV2-1699](https://linear.app/unit-talk-v2/issue/UTV2-1699/lane-maximizer-discovery-repair-bare-invocation-returns-an-empty-board)

      Before the repair, `--linear-limit` defaulted to `10` and was clamped to `Math.min(limit, 50)`, so `first:` never exceeded 50 and stayed under the complexity budget. [UTV2-1699](https://linear.app/unit-talk-v2/issue/UTV2-1699/lane-maximizer-discovery-repair-bare-invocation-returns-an-empty-board) correctly removed that hard cap (it was silently truncating the candidate population — the actual bug being fixed), which let the page size reach its declared constant of 100 for the first time. The complexity ceiling was always there; the old cap masked it.

      [UTV2-1699](https://linear.app/unit-talk-v2/issue/UTV2-1699/lane-maximizer-discovery-repair-bare-invocation-returns-an-empty-board)'s own regressions did not catch it because the fake transport in the test suite does not model Linear's complexity budget.

      ## Current workaround

      `pnpm ops:lane-maximizer --linear-limit 50` works and returns the full 43-candidate board. This is a manual flag, so it does not restore the dispatch family, which invokes the tool bare.

      ## Acceptance criteria

      1. `pnpm ops:lane-maximizer` with no flags completes successfully against the live Linear API and returns a candidate report.
      2. `LINEAR_CANDIDATE_PAGE_SIZE` is set to a value provably under Linear's complexity budget for the full `LaneCandidates` node selection, with margin below the measured 75 boundary.
      3. Pagination still walks the entire candidate population — the page size is a transport detail, never a cap on discovery. The [UTV2-1699](https://linear.app/unit-talk-v2/issue/UTV2-1699/lane-maximizer-discovery-repair-bare-invocation-returns-an-empty-board) pagination regressions continue to pass unchanged (75/75).
      4. A regression asserts the constant stays within budget, so raising it again, or adding another nested connection to the node selection, fails a test rather than the production factory.
      5. No change to ranking, admission, or business policy. That remains [UTV2-1769](https://linear.app/unit-talk-v2/issue/UTV2-1769/production-first-dispatch-ranking-tier-is-risk-not-urgency-cap-support).

      ## File scope

      * `scripts/ops/lane-maximizer.ts`
      * `scripts/ops/lane-maximizer.test.ts`
      * `docs/06_status/proof/<issue>/` (proof bundle)
      * `docs/06_status/lanes/<issue>.json` (lane manifest)
      * `.ops/sync/<issue>.yml`

      ## Related

      Regression introduced by [UTV2-1699](https://linear.app/unit-talk-v2/issue/UTV2-1699/lane-maximizer-discovery-repair-bare-invocation-returns-an-empty-board) (merged `e0c21c40e4173161f61e7f4aac10b288ce269bda`, PR #1476). Discovered on the first production run of the repaired tool immediately after that merge.
