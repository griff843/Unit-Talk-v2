task_contract:
  schema_version: 1
  issue_id: UTV2-1927
  objective: Remove stale human-approval language from INTERNAL_PICK_APPROVAL_PROTOCOL.md
  acceptance_criteria:
    - >-
      PM-directed follow-up, deliberately kept out of the Human Capper
      official-picks delivery PR.


      `docs/05_operations/INTERNAL_PICK_APPROVAL_PROTOCOL.md` reads as though
      every internal pick must pass through `awaiting_approval` before delivery.
      That is no longer true and was never intended for human capper
      submissions.


      PM ratification carried into this lane:


      * Approval is reserved for SYSTEM-GENERATED / AUTOMATED picks
      (`model-driven`, `board-construction`, `system-pick-scanner`,
      `alert-agent`).

      * A human capper submission must not enter `awaiting_approval` merely
      because it is delivery-eligible.

      * If official-picks is killed or disabled, delivery must fail closed. That
      must not be reinterpreted as "needs operator approval."


      Scope: documentation only. No code, no contract semantics change, no gate
      change.
