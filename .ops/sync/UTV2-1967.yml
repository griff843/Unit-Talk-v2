    description: |-
      PM authorization: [https://github.com/griff843/Unit-Talk-v2/pull/1678#issuecomment-5958314005](<https://github.com/griff843/Unit-Talk-v2/pull/1678#issuecomment-5958314005>)

      ## Objective

      Finish only the historical [UTV2-1370](https://linear.app/unit-talk-v2/issue/UTV2-1370/hot-db-retention-execution-wave-1) warehouse closeout reconciliation. Existing production verifier run 37036085802/job 110934527512/artifact 11240555923 and Live Schema Parity run 37036445782/job 110935763319/artifact 11241490211 PASS at SHA 41d659c36cec45c622cbcaaa16fa5ae28bdb1b27. Preserve original migration merge 400c2962c5d51d2d2f7c5d4b228f5a891bd10930 / PR1678.

      ## Acceptance Criteria

      * Persist real post-deploy production PASS receipts without inventing original-head checks.
      * Bounded historical required-check compatibility uses authoritative merge-time history/attestation and cannot apply to current/future PRs.
      * External verifier/original-head compatibility remains independently attested.
      * G5 admits only canonical repo-owned WORK follow-ups proved by repository work-order/lane evidence, not arbitrary text.
      * Missing merged historical ephemeral token recovery derives only from immutable trusted evidence; no dispatch-auto or fabricated authority; active/new lanes unchanged.
      * Regression/mutation tests prove refusal boundaries and legitimate historical recovery.
      * Normal governed PR/check/review/merge controls; final original lane truth-check PASS and persisted status=done.

      ## File Scope

      * scripts/ops/historical-closeout.ts
      * scripts/ops/truth-check-lib.ts and truth-check-lib.test.ts
      * scripts/ops/lane-close.ts and lane-close.test.ts
      * scripts/ops/shared.ts and shared.test.ts
      * scripts/ops/proof-schema.ts and proof-schema.test.ts
      * docs/06_status/proof/[UTV2-1370](https://linear.app/unit-talk-v2/issue/UTV2-1370/hot-db-retention-execution-wave-1)/\*\*
      * normal repair lane metadata/proof

      ## Verification

      Focused tsx --test suites, pnpm verify, exact-head CI, staging pnpm test:db, mutation tests, independent review, normal merge and authoritative closeout replay.

      ## Non-goals

      No production DDL, migrations/schema, credentials, privilege changes, retention plan/execute/recover, canary, pruning/deletion, containment/delivery changes, direct-main writes, guard weakening or historical GitHub PASS fabrication. No additional production dispatch unless immutable receipt binding strictly requires it.
