  issue_id: UTV2-1833
  objective: "Record ratified mission direction: post-M1 internal operating
    history, Claude orchestration ownership, reserved-decision presentation"
  acceptance_criteria:
    - >-
      Governance lane. Record in `docs/mission/intent.md` the direction Griff
      ratified on 2026-09-05:


      1. **Product ordering.** Deliver Unit Talk as a trustworthy,
      production-ready, revenue-generating product. Milestone 1 (contained Smart
      Form Track Only pilot) first. Immediately afterward, establish reliable
      ongoing internal pick submission, persistence, grading/settlement and
      statistics, so a real performance history exists before member-facing
      Discord delivery launches.

      2. **Operating authority.** Claude owns decomposition, sequencing, agent
      allocation, implementation coordination, verification, integration and
      continuation. Product priorities come from this mission and live
      production evidence; Linear records the work.

      3. **Reserved-decision presentation.** Reserved decisions are surfaced
      with preparation already complete and a concrete recommended action. A
      reserved decision blocks only dependent work.


      Scope: `docs/mission/intent.md` only, plus the lane's own proof artifacts.
      No gate, tier, or merge-authority change.
