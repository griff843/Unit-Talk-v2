task_contract:
  schema_version: 1
  issue_id: UTV2-1898
  objective: "Edge provenance: an offer may back a pick only on exact
    sport/event/market/participant match inside the freshness window"
  acceptance_criteria:
    - >-
      ## Defect (confirmed in production)


      Two picks submitted four days apart — different sports, different events,
      different selections — both carry `marketProbability: 0.478261` to six
      decimal places, both claiming `realEdgeSource: "sgo"`,
      `providerCoverageState: "sgo"`, `method: "market-devigged"`, `bookCount:
      1`.


      The cause: `findLatestByMarketKey(key, provider?, participant?)` treated
      an omitted argument as "no filter" rather than "no match". A September NFL
      moneyline was therefore priced off a 75-day-old June MLB moneyline offer —
      the only rows with a matching market key, since production ingestion has
      been parked since 2026-06-30.


      Harm reached beyond display: `kellySizing.recommended_units` of 40 and 50,
      and a `strongly-contrarian` `contrarySignal` asserting divergence from a
      market that was never read.


      ## Repair


      * `ProviderOfferRepository.findLatestByMarketKey` becomes
      `findLatestScopedOffer(criteria)`, where every discriminating predicate is
      required and `undefined` is inadmissible rather than unfiltered.

      * A 6-hour provider freshness window (`PROVIDER_OFFER_MAX_AGE_MS`).

      * Participant scope derived from `classifyMarketFamilyForGrading` — the
      repository's single existing definition of which markets name a
      participant — rather than a second private string heuristic. An
      unrecognised market key fails closed.

      * When no valid offer exists the pick is preserved and edge is recorded as
      unavailable with a specific reason (`no-sport-scope`, `no-event-scope`,
      `no-fresh-offer`, `offer-participant-unattributed`, `no-provider-offer`).
      No value is ever manufactured.


      ## Acceptance


      * No stale, cross-sport, cross-event or cross-participant offer can
      influence a pick.

      * Regression coverage for each of those dimensions plus the missing-offer
      case, with a passing control so the suite cannot pass by matching nothing.

      * A mutation battery proving each control fails on the condition it names.


      ## Out of scope


      The two existing production records carrying fabricated values. Their
      correction is prepared separately and is owner-authorized; this lane
      writes no production data.
