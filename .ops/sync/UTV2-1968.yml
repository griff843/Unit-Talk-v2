task_contract:
  schema_version: 1
  issue_id: UTV2-1968
  objective: Isolate production guild registration from the live bot memory budget
  acceptance_criteria:
    - |-
      Bounded production-acceptance repair under Griff's instruction to finish the existing Discord guild-registration milestone. Deployment run [https://github.com/griff843/Unit-Talk-v2/actions/runs/37104514009](<https://github.com/griff843/Unit-Talk-v2/actions/runs/37104514009>) promoted SHA 7836199435064179eab4a341d5fd4f1e403d98f8, but mandatory registration exited 137. Docker events confirm OOM and bot restart; live bot container limit is 128 MiB. Production recovered healthy, registry remains five old commands, official-picks and recaps remain stopped, zero official receipt/message delta.

      Scope: .github/workflows/deploy.yml and scripts/ci/deploy-discord-commands.test.ts, plus only canonical lane/sync/proof lifecycle artifacts. Named proof docs/06_status/proof/<issue>/verification.md. T1 runtime lane; use current remote main and preserve all existing promotion controls and test wiring. No broad WORK/governance repairs.

      Acceptance: run the existing hardened guild registrar in a disposable process/container with a separate bounded memory budget (target 256 MiB), rather than docker compose exec inside the live 128 MiB bot. Preserve actual promoted SHA/image verification, production Compose configuration/network/environment, guild-only application identity/full replace/read-back, no global/canary registry mutations, no credentials/raw REST logs. Do not start dependencies, publish ports, restart existing services, or alter live bot resource limits. Temporary override/container must clean up on success/failure, and registration exit code must fail promotion/smoke visibly. Add executable shell regression coverage for isolation, bounded memory, cleanup, correct image/configuration, stale release/image refusal and registration failures; retain existing focused test gates. Full pnpm verify, applicable R-level, T1 staging DB proof, lane/scope controls and truthful admitted CLI/model provenance required. Return exact-head T1 PR for independent PM approval before deployment.

      No bot source changes, package changes, Compose service configuration changes, delivery activation, watched pick, role changes, Whop/Stripe, SGO, Black Label, or system/provider unpark. Persona slash-command retests wait for successful governed registration. Preserve current production containment; do not call failed deployment accepted or rerun the same OOM path.

      ## Where to look

      * .github/workflows/deploy.yml: mandatory production registration step after containment confirmation and before cleanup; preserve source/ref identity guards.
      * scripts/ci/deploy-discord-commands.test.ts: existing executable extracted remote-shell tests and fake Docker harness; extend rather than replace coverage.
      * deploy/production/docker-compose.yml: read-only reference; discord-bot limit 128 MiB, env_file .env.production, production network. Do not edit it.
      * Existing hardened apps/discord-bot/scripts/deploy-commands.ts: consume unchanged; it alone owns guild-only registration/full replacement/read-back.
      * .out/discord-wave1/registration-oom-production-evidence.txt and registration-deploy-failure.log in control checkout hold observed OOM evidence.

      ## Definition of done

      * A minimal T1 PR changes only the two named substantive files and required own lane/proof artifacts.
      * Executable isolation/cleanup/failure-path regression tests, package wiring guard, full applicable pnpm verify and staging DB proof pass.
      * Genuine admitted executor/model provenance and exact-head verification.md proof; required Lane Authority and File Scope Lock are green.
      * Return exact PR/head for independent T1 PM approval. Do not self-approve, merge, deploy, register commands, mutate roles, or activate delivery in this implementation lane.

      ## Implementation plan within approved product direction

      Keep production registration in the same governed promote step. Prefer a transient Compose override used only by a --rm --no-deps -T one-off registration container, with a 256 MiB resource limit, the promoted image tag, inherited production env/network and explicit registrar entrypoint. Use trap cleanup of the temporary override on success/failure. Do not publish service ports or run dependencies. Existing running bot must not be exec target or restarted. Preserve and test release/image checks, cleanup, exit-code propagation and production-only placement. If this cannot preserve the exact promoted config/image safely, report the concrete constraint rather than widening scope.
