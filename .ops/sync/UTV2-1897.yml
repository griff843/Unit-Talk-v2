  objective: Reference-data coverage audit, provider coverage record, and mission
    plan reconciliation
  acceptance_criteria:
    - |-
      Governance/docs lane. Lands three measured records into the repository; authorizes no write and changes no gate.

      1. `docs/05_operations/REFERENCE_DATA_AUDIT_2026-09-13.md` — the read-only production coverage audit measured 2026-09-13: participants by sport (MLB 30 teams/951 players, NBA 30/254, NHL 32/318, NFL 32 teams/0 players, NCAAF 0/0), events max date 2026-07-02 with zero future rows, 840 sgo:player aliases and zero team aliases, no `player_team_assignments`. Records the two routes by which NFL players and NCAAF teams could exist (ingestor entity resolver needing an active SGO key; an authored governed static seed) and the prepared `participants`-only INSERT ... ON CONFLICT DO NOTHING authorization request with its staging two-pass proof. The write itself is reserved decision 1 and is NOT requested by merging this document.
      2. `docs/05_operations/PROVIDER_KNOWLEDGE_BASE.md` — one short section recording what the shipped code supports today: leagues NBA/NFL/MLB/NHL only (`ingestor-runner.ts` SUPPORTED_SGO_LEAGUES), player-prop odd-id patterns for MLB and NBA only so NFL and NHL are game-lines only in live cycles, NCAAF/NCAAB not ingestable, and the key available to tooling returning 403 Inactive as of 2026-09-13 so live coverage is UNVERIFIED rather than assumed.
      3. `docs/mission/plan.md` — reconcile against current `main`: [UTV2-1889](https://linear.app/unit-talk-v2/issue/UTV2-1889/prepare-and-prove-the-sgo-backed-track-only-result-journey) closed, [UTV2-1893](https://linear.app/unit-talk-v2/issue/UTV2-1893/reconcile-the-mission-plan-against-main-abe364761-1567-merged-the)/1894 merged, [UTV2-1895](https://linear.app/unit-talk-v2/issue/UTV2-1895/smart-form-mobile-capper-ui-brand-sportsbook-style-selection-to-slip) merged and closed, the 2026-09-13 Deploy dispatch, and the measured concurrency finding that the SGO server lane ([UTV2-1896](https://linear.app/unit-talk-v2/issue/UTV2-1896/sgo-assisted-smart-form-picks-gamemarket-browse-provenance-offer)) cannot open while [UTV2-1892](https://linear.app/unit-talk-v2/issue/UTV2-1892/admit-repo-minted-work-identities-in-the-trusted-merge-gate-issue)/#1570 holds the singleton `runtime` type.

      No production write, no SGO request, no containment change, no gate change.
