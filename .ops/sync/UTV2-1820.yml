  note: 'PM FACTORY GO promoted UTV2-1820 to Ready for Claude as the single
    production-unlocking factory-support lane. Objective only: correct the
    dependency direction so outgoing "blocks" relations are not treated as
    prerequisites, while genuine incoming blockers remain fail-closed.'
