      * `.github/workflows/deploy.yml` never mentions it (`grep -ni command.center` → no matches).

      **It must not be described as usable.** It has no routed production URL.

      ## The gap this lane closes

      An operator can, in principle, settle a pick — but only by hand-crafting an authenticated POST. There is no surface for **viewing** picks, choosing one, and inspecting audit history. The read side that does exist is `GET /api/picks/:id/trace` (authenticated since [UTV2-1823](https://linear.app/unit-talk-v2/issue/UTV2-1823/authenticate-get-apipicksidtrace-close-the-unauthenticated-canonical); returns the full lifecycle aggregate — PickRecord, submission events, promotion history, outbox entries, distribution receipts, settlement records, audit log, lifecycle events). It is a JSON endpoint, not an operator surface.

      ## Acceptance criteria

      1. An authenticated operator can **list** the governed cohort (`metadata ? 'distributionMode'`) through a deployed surface, not by writing SQL.
      2. From that list, an operator can open one pick and see its trace — lifecycle, promotion history, settlement records and audit entries — reusing `/api/picks/:id/trace` rather than re-deriving it.
      3. From that view, an operator can **manually settle** a pick, and the form requires all three `OperatorGradingContext` fields, refusing closed when any is absent.
      4. The refusal ordering established by [UTV2-1904](https://linear.app/unit-talk-v2/issue/UTV2-1904/b1-operator-manual-settlement-of-track-only-picks-via-the-evidence) is preserved and tested: a `manual_review` request on a Track Only pick still fails exactly as it does today.
      5. The surface is reachable at a routed production URL with authentication, and the role gate is exercised: a `settler` can settle, a non-settler/non-operator is 403'd.
      6. Zero member delivery from any of it; Track Only containment unchanged.
      7. **Deployment is a separate, reserved step.** This lane is not done because code merged — but it may not claim the surface is usable until a deploy has happened and been observed.

      ## Decisions this lane surfaces but does not take

      * Whether the surface is the existing `apps/command-center` (needs a compose service, a Caddy route, a hostname and `COMMAND_CENTER_*` secrets — secrets are reserved decision 4) or a smaller operator view added to an already-routed app (`web` or `smart-form`). The second avoids every reserved input and is the recommendation.
      * Dispatching `Deploy` (reserved decision 8).

