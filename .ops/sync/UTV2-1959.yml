    title: Preserve T1 live-DB deferral in active-lane preflight recovery
    description: |-
      ## Objective

      Repair the sanctioned `ops:lane-link-pr` missing-token recovery so an active T1 lane retains its already-governed `t1_live_db_precondition: deferred_to_ci` obligation when ephemeral preflight state is independently reconstructed.

      ## Scope

      * Update only `scripts/ops/lane-link-pr.ts` and its focused node:test coverage.
      * Copy the existing manifest obligation into the recovered token after all current ownership, PR-head, dependency, cleanliness, and scope-lock checks pass.
      * Do not add a new way to assert a deferral, weaken manifest/token agreement, waive live-DB proof, or change warehouse/runtime behavior.

      ## Acceptance criteria

      * Recovered token carries `deferred_to_ci` exactly when the authoritative active T1 manifest carries it.
      * Ordinary recovery remains unchanged and does not manufacture a deferral.
      * Regression proves the reconstructed token and manifest remain in agreement.
      * Existing fail-closed recovery tests remain green.
      * `pnpm verify` and R-level checks pass.
      * This governance repair is merged before retrying PR [griff843/Unit-Talk-v2#1698](https://linear.app/unit-talk-v2/review/utv2-1957-production-safe-retention-post-migration-verifier-830da4624e7f) lane linkage.
