  objective: Post-merge rebinder cannot bind the pre-merge placeholder the
    pre-merge contract mandates, stranding every closeout that uses it
  acceptance_criteria:
    - "A bundle whose top-level row is exactly `MERGE_SHA: pending merge`
      rebinds to the merge SHA post-merge, proven by a test that starts from the
