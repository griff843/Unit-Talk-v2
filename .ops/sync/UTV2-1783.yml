      * `.ops/sync/UTV2-1783.yml`
      * `docs/06_status/lanes/UTV2-1783.json`
      * `docs/06_status/proof/UTV2-1783/**`

      The executor should use the smallest subset necessary. Do not edit branch protection, merge-gate policy, unrelated workflows, application/runtime code, DB code, or production configuration. If the fix genuinely requires another path, stop for PM scope disposition rather than widening silently.

      ### Sequencing update

      [UTV2-1783](https://linear.app/unit-talk-v2/issue/UTV2-1783/pre-merge-merge-sha-contract-is-contradictory-between-executor-result) now directly blocks [UTV2-1822](https://linear.app/unit-talk-v2/issue/UTV2-1822/reconcile-127-remote-migration-versions-into-baseline-safe-local) / PR #1482. [UTV2-1822](https://linear.app/unit-talk-v2/issue/UTV2-1822/reconcile-127-remote-migration-versions-into-baseline-safe-local) must not merge by selecting a `MERGE_SHA` value that knowingly leaves either validator red. If Tier-C/concurrency mechanics prevent these lanes from coexisting, park [UTV2-1822](https://linear.app/unit-talk-v2/issue/UTV2-1822/reconcile-127-remote-migration-versions-into-baseline-safe-local) via the sanctioned path, preserve its PR/proof, complete and truth-close this lane, then resume/sync/re-anchor [UTV2-1822](https://linear.app/unit-talk-v2/issue/UTV2-1822/reconcile-127-remote-migration-versions-into-baseline-safe-local).
