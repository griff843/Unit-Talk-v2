  unmapped_sections:
    - |-
      Incident
      [UTV2-1744](https://linear.app/unit-talk-v2/issue/UTV2-1744/outbox-dead-letter-and-stuck-claim-triage-make-the-delivery-queue-safe) / PR #1452 exposed a gate-set contradiction that is non-blocking for ordinary static/app-runtime lanes but structurally blocks migration lanes such as [UTV2-1736](https://linear.app/unit-talk-v2/issue/UTV2-1736/offer-history-partitions-provision-current-and-forward-with-pre-expiry) / PR #1451.

      Current pre-merge consumers require mutually exclusive values in the same top-level `verification.md` field:

      * `scripts/ci/proof-binding-validator.ts::validatePreMergeVerificationBinding` requires exactly one top-level `MERGE_SHA:` row whose value is the literal `pending merge`; any real SHA is rejected because a branch/execution SHA is not merge authority.
      * Required `Executor Result Validation` parses the same top-level `MERGE_SHA:` row as a git identity and requires it to be a real ancestor SHA; `pending merge` is rejected as `Proof MERGE_SHA is not a valid git SHA`.

      PR #1452 can pass only because `proof-binding-validator` is reached through `migration-reversibility-gate.yml`, whose path filter does not include #1452's files. [UTV2-1736](https://linear.app/unit-talk-v2/issue/UTV2-1736/offer-history-partitions-provision-current-and-forward-with-pre-expiry) changes `supabase/migrations/**`, so both consumers apply and the lane cannot satisfy both simultaneously.

      This is a consumer-contract defect, not a reason to weaken merge authority or put a branch SHA into `sha_binding.merge_sha`.
    - >-
      Authoritative identity model

      Schema-v2 already separates:


      * `sha_binding.merge_sha` — merge authority; must remain `null` before
      merge and become the GitHub merge SHA only post-merge.

      * `sha_binding.verified_source_sha` — execution/source identity; a real
      commit SHA before merge.


      The fix must make every pre-merge consumer read the correct identity
      rather than overloading top-level `MERGE_SHA` with two meanings.
    - >-
      Required contract

      1. Pre-merge merge authority remains `sha_binding.merge_sha: null`.

      2. Execution/source provenance is validated from
      `sha_binding.verified_source_sha` (or another explicitly named
      execution-identity field), not by pretending it is merge authority.

      3. `proof-binding-validator` and Executor Result Validation must accept
      the same structurally valid schema-v2 pre-merge bundle.

      4. No consumer may require a branch/execution SHA in an authoritative
      merge field.

      5. Post-merge rebinding must still populate authoritative merge identity
      and leave verified source identity truthful.

      6. Historical compatibility must be narrow and explicit; do not broaden
      legacy shapes silently.

      7. Migration lanes must exercise both consumers in one integration
      regression so this contradiction cannot recur behind path filters.
