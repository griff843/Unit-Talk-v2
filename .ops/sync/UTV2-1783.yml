  objective: Pre-merge MERGE_SHA contract is contradictory between Executor Result
    Validation and proof-binding-validator
  acceptance_criteria:
    - "Exact schema-v2 pre-merge fixture with `sha_binding.merge_sha: null` and
      real `verified_source_sha` passes BOTH proof-binding-validator and
      Executor Result Validation."
    - Literal `pending merge` is accepted only where it is a presentation
      placeholder and is never treated as a git SHA.
    - Branch/execution SHA in `sha_binding.merge_sha` fails.
    - Non-null authoritative merge SHA before merge fails.
    - Missing/invalid verified source SHA fails execution provenance.
    - Post-merge rebind regression remains green.
    - Mutation controls independently restore each old contradictory rule and
      make the integration regression fail.
    - "[UTV2-1736](https://linear.app/unit-talk-v2/issue/UTV2-1736/offer-histor\
      y-partitions-provision-current-and-forward-with-pre-expiry) / PR #1451 can
      run the migration gate and ERV on the same exact head without changing its
      production/migration semantics."
  guardrails:
    - Proof/gate contract only. No production DDL, database mutation,
      deployment, ingestion, delivery, SGO, retention, or branch-protection
      weakening. Do not solve by exempting migration PRs from either gate.
