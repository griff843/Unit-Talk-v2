    description: >-
      # WORK-2026101201 — Repair #1740 member-tier sync: Trial expiry and full
      mapped-tier set


      Tier: T2

      Lane type: runtime

      Executor: codex


      Repo-owned work order (tracker independence, ratified 2026-09-05). No
      Linear issue exists for this identity by design. Follow-up repair of
      merged PR #1740 (WORK-2026101104); main is under PM deployment hold until
      this merges.


      ## Objective


      - Correct two defects on main from #1740: a bot-created Trial never
      expires, and the bot's tier sync refuses capper and operator, two of the
      configured Discord-mapped tiers.


      ## Why


      - `POST /api/member-tiers` from the bot writes Trial rows with no
      `effective_until`, so Trials never expire.

      - `BOT_SYNCABLE_TIERS` in `apps/api/src/routes/member-tiers.ts` is
      `['trial','vip','vip-plus']`, so capper/operator role syncs are refused.


      ## Acceptance Criteria


      - A bot-created Trial persists `effectiveUntil = now +
      TRIAL_DURATION_DAYS` using `computeTrialEffectiveUntil` from
      `apps/api/src/trial-expiry-service.ts`; the default is 7 days and a
      configured duration is honored.

      - VIP and VIP+ syncs are unchanged and carry no `effectiveUntil`.

      - The bot sync accepts trial, vip, vip-plus, capper and operator; `free`
      is still rejected.

      - Recording capper/operator state grants the API caller no capper/operator
      authorization: the caller's auth role is unchanged and a generic submitter
      key is still refused (403).

      - Focused tests cover each point above, including that no caller
      authorization is elevated.


      ## Reference material


      - Local branch `backup/other-session-eab90e32f-bot-trial-expiry` is
      REFERENCE ONLY. Compare it against current main and reproduce the approved
      repair selectively. Do not cherry-pick or overwrite newer main changes.
      Its extra changes beyond the two defects are not approved.


      ## Guardrails


      - No repository interface or runtime-repository redesign; no tier/audit
      transactional atomicity; no repeat-Trial concurrency redesign; no auth-key
      identity redesign; no edit to `apps/api/src/auth.ts`; no unrelated Discord
      changes.

      - No migration, secret, env var, production write, deploy or un-kill.


      ## File Scope


      - .ops/work/WORK-2026101201.md

      - apps/api/src/routes/member-tiers.ts

      - apps/api/src/member-picks.test.ts

      - apps/discord-bot/src/api-client.ts

      - apps/discord-bot/src/handlers/member-tier-sync-handler.ts

      - apps/discord-bot/src/discord-bot-foundation.test.ts


      ## Exit Criteria


      - PR open on exact-head green CI with proof, returned for PM review.
      Merge, deploy and production validation are Griff's.
