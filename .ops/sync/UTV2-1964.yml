  objective: Harden guild-only Discord command registration before governed deploy
    integration
  acceptance_criteria:
    - "PM-approved split A of
      [UTV2-1963](https://linear.app/unit-talk-v2/issue/UTV2-1963/register-auth\
      oritative-discord-guild-commands-in-governed-production) / PR
      [griff843/Unit-Talk-v2#1705](https://linear.app/unit-talk-v2/review/fixdi\
      scord-utv2-1963-register-guild-commands-during-production-376b01712d5e),
      disposition
      [https://github.com/griff843/Unit-Talk-v2/pull/1705#issuecomment-59430309\
      48](<https://github.com/griff843/Unit-Talk-v2/pull/1705#issuecomment-5943\
      030948>). Delivery-ui lane, mechanically correct tier T2, current main.
      Reproduce the accepted registration hardening from commit
      2c56becfe8ff1be9dfbc2313c78d637962522bda under the actual admitted
      codex-cli executor/profile, preserving implementation rather than
      fabricating desktop/CLI provenance. Exact source scope:
      apps/discord-bot/scripts/deploy-commands.ts and
      apps/discord-bot/scripts/deploy-commands.test.ts; own generated
      lifecycle/proof/sync metadata. A request to PM for
      apps/discord-bot/package.json minimal test-script wiring is pending; do
      not edit that additional file without explicit response. Preserve existing
      guild-only full-replace, token application identity validation, read-back
      count/names/application/guild/all-authored-definition verification,
      empty-manifest refusal, safe failure exit without raw REST
      errors/credentials. No command redesign or global registry; no deployment
      workflow/package root changes; no production registration, role mutation,
      picks, receipts or delivery switches. Run focused tests directly using tsx
      --test, strict script TypeScript, lint, pnpm verify and R-level/lane
      authority checks. Writable DB proof only through sanctioned staging CI.
      Return reviewable PR with actual CLI-generated routing evidence and
      truthful gate results; no selfapproval or merge without independent
      review. New test must satisfy executable-wiring guard, report precise
      scope blocker if wiring authorization is still pending. Acceptance
      evidence named docs/06_status/proof/<assigned issue>/verification.md plus
      generated proof files. This PR must merge before T1 runtime/deploy
      continuation of
      [griff843/Unit-Talk-v2#1705](https://linear.app/unit-talk-v2/review/fixdi\
      scord-utv2-1963-register-guild-commands-during-production-376b01712d5e)."
