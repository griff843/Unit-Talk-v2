    description: >-
      # WORK-2026102202 — Env-gated VIP checkout CTA on the public website


      Tier: T2

      Lane type: delivery-ui

      Executor: codex-cli


      Source: PM verdict 2026-10-22 (Workstream C1: approved for T2
      implementation behind an OFF-by-default gate; enabling or publishing
      requires explicit approval).


      ## Acceptance Criteria


      - A VIP checkout CTA for the verified $49.99/month plan
      (https://whop.com/checkout/plan_pf6AQQgGbIRZg/) exists in code but renders
      only when an explicit public env gate is on; the gate defaults to OFF and
      unset/invalid values mean OFF.

      - With the gate off, the site renders exactly as today (no checkout href,
      "checkout unavailable" state preserved).

      - External link handling (rel noopener, target) is correct; no other tier
      gets a checkout link; Trial and VIP+ links remain unset.

      - The site-config test that forbids checkout hrefs is updated to assert
      the gated behavior in both states.

      - No env value is set in any deployment; nothing is published or enabled.


      ## File Scope


      - apps/web/src/lib/site-config.ts

      - apps/web/src/lib/site-config.test.ts

      - apps/web/src/components/CTAButton.tsx

      - apps/web/src/components/PlanCard.tsx

      - apps/web/src/components/PricingTable.tsx

      - apps/web/src/app/pricing/page.tsx

      - .ops/work/WORK-2026102202.md
