  objective: WORK-2026092310 — reconcile the mission plan against live truth
  acceptance_criteria:
    - >-
      # WORK-2026092310 — reconcile the mission plan against live truth


      Tier: T3 · Lane type: governance · Executor: claude


      ## Problem


      `docs/mission/plan.md` was last reconciled 2026-09-18 against `3a07f41b0`.
      It is startup context

      for every session, and it has gone false: the deployed release, the drift,
      the governed cohort

      (7 → 9 picks, two new delivery-eligible), the readiness ledger's blocking
      dimensions, the open PR

      count, the active lanes, and a deploy run left waiting on approval at a
      SHA older than the

      running release.


      ## Outcome


      - `docs/mission/plan.md` is rebuilt from live GitHub, runtime and database
      measurement taken
        2026-09-23, not edited forward.
      - Every figure it states was measured this session; the ones that move are
      marked re-measure.

      - Decisions surfaced to Griff are current, each with a recommendation.


      ## Acceptance


      - Docs-only; one file changed.

      - No figure is quoted that was not measured against `origin/main`, the
      GitHub API or production
        (read-only) during this lane.
