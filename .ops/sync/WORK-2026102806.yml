  acceptance_criteria:
    - "### A. Result filter with correct totals (`/picks`)"
    - "`/picks` accepts a `result` URL parameter: `win`, `loss`, `push`, `void`
      or `pending` (unsettled). It round-trips through `picks-explorer-query.ts`
      like the existing filters, and appears as a control on the page."
    - "The filter uses the **current effective result**: a corrected pick
      filters by its corrected result, not by the original."
    - "**The total must match the rows shown.**"
    - "`settlement_result` is a view-derived column (`VIEW_DERIVED_COLUMNS` in
      `lib/data/queues.ts`)."
    - The existing count runs on `picks`, so naively adding the filter would
      return a total that ignores it.
    - Use a sound counting strategy, for example counting on
      `picks_current_state` only when a view-derived filter is active.
    - Extend `queues-count-relation.test.ts` so that a view-derived filter
      counted on `picks` fails the test.
    - Unit tests show that, for a result filter, the total equals the size of
      the filtered population, including on page 2 or later.
    - The result filter combines with the existing capper, sport, date,
      ID-fragment and population filters. `pending` must not include voided
      picks.
    - "### B. Correction confirmation shows current → proposed"
    - "Before a correction is submitted, the confirmation step in
      `CorrectionForm` shows the pick's **current effective result** and the
      **proposed result** side by side (\"Current: win → Proposed: loss\"). It
      also states that the original settlement record is kept and a correcting
      record is appended."
    - A proposed result equal to the current one is blocked with a clear
      message. A no-op correction must not be submittable.
    - The current effective result comes from the settlement chain
      (`pick-identity.ts`, the same source as `SettlementTargetSummary`), not
      from `picks.status`.
    - The logic lives in a pure, tested function (new
      `lib/correction-confirmation.ts` and its test). The component only renders
      it.
    - "### C. Contextual governed pick discovery"
    - 'From the command palette, an operator can find a pick by ID fragment,
      capper handle or event-name text. Each result shows its context: capper,
      sport, event, market, selection, line, status, and settlement result or
      "pending".'
    - "Results come only from the **governed operator population**: the same
      population `searchPicks` and the Track Only settlement queue use
      (`applyOperatorPickPopulation`). Fixture and test rows must never appear."
    - If this needs a server-side lookup, put it in the new server action
      `app/actions/pick-lookup.ts`.
    - The action must call the shared authentication guard
      (`resolveActorOrRefusal`, `requireAuthenticatedActor` or
      `assertPrivilegedRequestAuthenticated`) before any data I/O.
    - Add a behavioural pin to `lib/server-action-guard.test.ts` proving an
      unauthenticated call is refused before outbound I/O.
    - The palette must not import a module that pulls `node:crypto` or
      `@unit-talk/contracts` into the client bundle. This broke Wave 1;
      `client-bundle-boundary.test.ts` must stay green and should pin it.
    - The input is bounded (minimum and maximum length, result limit ≤ 12). The
      ID fragment keeps using `pickIdPrefixRange`.
    - "### D. Browser-confirmed settlement and performance-label defects"
    - Fix the defects in settlement and performance labeling that you observe in
      the browser on `/settlement`, `/picks/[id]`, `/performance` and
      `/intelligence/roi`.
    - "Each fix is listed in the PR body with:"
    - the page,
    - what was shown,
    - why it was wrong,
    - what is shown now,
    - before and after screenshots.
    - "The required labeling truths:"
    - Track Only results are labeled as internal and Track Only. They are never
      shown as published performance.
    - An empty published cohort reads as "no published record" with its
      exclusion note, never as a 0% ROI or 0-0 record.
    - Every rate carries its sample size.
    - A corrected settlement shows its effective result marked "(corrected)".
    - Attribution is by canonical `capper_id`.
    - Changes to `analytics.ts` or `operator-performance.ts` are limited to
      labels and display fields. A change to cohort membership, Track Only
      exclusion or stat computation needs a failing unit test that demonstrates
      the defect first.
