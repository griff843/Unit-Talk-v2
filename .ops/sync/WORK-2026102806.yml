      - **Append-only corrections:**
        - No update or delete of `settlement_records`.
        - A correction still goes through the existing `app/actions/settle.ts` path, which is out of scope and unchanged, as are the API settle contract, auth and operator identity.
      - No schema, migration, API or worker change. No new dependency. No change
