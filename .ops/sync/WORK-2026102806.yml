      owns the remaining Command Center UI/UX work as of 2026-10-28)


      This is a repo-owned work order (tracker independence, ratified
      2026-09-05), and Griff directed this lane on 2026-10-28. Production runs
      `913235ce7` (deploy run 40727467544), which includes Wave 1 (#1798) and
      the final-score check (#1799). This lane closes the remaining operator
      gaps that block Private Capper Operations V1 acceptance in Command Center.


      Real production shapes to design and test against (read-only, 2026-10-28):

      - Picks from Smart Form, Track Only: `capper_id` is lowercase
