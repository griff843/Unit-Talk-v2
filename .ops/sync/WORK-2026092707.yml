    description: >-
      # WORK-2026092707 — reconcile the mission plan against live truth


      Tier: T3 · Lane type: governance · Executor: claude


      Repo-owned work order (tracker independence, ratified 2026-09-05). No
      Linear issue exists for this identity by design.


      ## Objective


      `docs/mission/plan.md` was last reconciled on 2026-09-23 against
      `df071f24b`. Since then more than forty PRs have merged (#1570–#1672),
      including #1589, #1636 and UTV2-1954's replay fidelity (#1654). Drift from
      the deployed release has grown to over a hundred commits, and several of
      the plan's decisions are resolved. Rebuild the plan from live GitHub,
      ledger and production evidence.


      ## Acceptance Criteria


      - Every fact in §1 is re-measured on 2026-09-27 against `origin/main`, the
      GitHub API, the readiness ledger and read-only production SQL.

      - Resolved decisions (#1589, #1636) are removed. New PM-gated items
      (#1671's T1 pair) are added.

      - Findings from this session are recorded as findings, not filed issues.

      - The change is documentation-only: no code, gate, tier or containment
      change.


      ## File scope


      - `docs/mission/plan.md`

      - `.ops/work/WORK-2026092707.md`


      ## Exit Criteria


      - PR merged on green CI, and the lane closed through
      `post-merge-lane-close.yml`.
