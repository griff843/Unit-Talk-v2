      # WORK-2026100601 — merged-lane closeout recovery admission

      Tier: T1
      Lane type: governance
      Executor: codex-cli

      ## Objective

      Implement the narrow admission recovery authorized by Griff on merged PR #1718 in https://github.com/griff843/Unit-Talk-v2/pull/1718#issuecomment-6007640817. WORK-2026100501 is stranded in_review after fail-closed post-merge closeout rejected a legacy evidence field. This lane repairs admission only; the subsequent same-WORK recovery will correct the proof and workflow privilege boundary.

      ## Acceptance Criteria

      - Admit a merged same-WORK recovery only with fresh GitHub-attested original merged PR, matching identity/branch, real merge SHA on main, and a failed canonical post-merge closeout run bound to that merge and identity. Refuse ordinary active lanes, missing/mismatched/stale authority, successful closeout, unrelated PRs and unavailable evidence.
      - Preserve file-scope isolation, concurrency, T1 review, exact-HEAD CI/proof, provenance, merge mutex and all existing fail-closed gates. Do not fabricate history, silently release ownership or directly edit main. Preserve the original PR/merge relationship and record recovery provenance explicitly.
      - Use node:test/assert deterministic positive and negative regression coverage in existing directly runnable tests. Run focused tests, pnpm verify, R-level and protected writable staging/T1 checks.
      - Execute actual implementation through ops:codex-exec. A sanctioned child must not invoke ops:codex-exec recursively. Open a draft tier:T1 PR and obtain genuine exact-HEAD PM approval before normal governed merge.
      - Keep #1715, production Shadow and #1714 on hold until both authorized repairs land and original closeout succeeds. C6 runtime proof already passes; do not regenerate or fabricate it.

      ## Invariants

      No general admission bypass, direct-main changes, admin merge, invented checks or provenance, scope-lock weakening, approval weakening, or Discord/product/settlement/scoring/routing/provider/activation/schema changes.

      ## File Scope

      - scripts/ops/preflight.ts
      - scripts/ops/preflight.test.ts
      - scripts/ops/lane-start.ts
      - scripts/ops/lane-start.test.ts
      - scripts/ops/merged-lane-recovery.ts
