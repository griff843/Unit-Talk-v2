      - .ops/sync/WORK-2026100601.yml
      - docs/06_status/lanes/WORK-2026100601.json
      - docs/06_status/proof/WORK-2026100601/**

      ## Proof

      Named work proof only: authorization, admission design, deterministic regressions, actual executor provenance, exact-HEAD verification/staging, PM approval and governed merge. No unrelated documentation or status edits.

      ## Engineering guidance

      Prefer an explicit recovery request that identifies the original WORK, merged PR, actual merge SHA and failed canonical closeout run. A separately identified recovery lane may own its new repair PR while remaining bound to that original WORK; do not overwrite the original lane's PR, branch, history or proof provenance to manufacture admission. Record that relationship in a durable admission receipt. Permit only the otherwise-blocked overlap with the attested merged source lane, after fresh verification at both preflight and lane-start. Keep all other overlap checks, lease checks and concurrency accounting unchanged, including counting the source lane until truthful closeout. This is a proposal for implementation, not authority to bypass any unchanged control before this repair merges.
