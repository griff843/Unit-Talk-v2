task_contract:
  schema_version: 1
  issue_id: UTV2-1796
  objective: Restore non-vacuous multi-bookmaker closing-line marking and truthful
    affected-row counts
  acceptance_criteria:
    - |-
      ## Why this is a child, and what the parent still owns

      Diagnosing [UTV2-1772](https://linear.app/unit-talk-v2/issue/UTV2-1772/ingest-write-throughput-eliminate-provider-offer-history-statement)'s write-path bottleneck surfaced a separate and more serious defect in the same file: `markClosingLines` has been marking nothing since 2026-04-26 and reporting success every time. That is a data-truth failure in the closing-line input CLV depends on, and it is bounded, so it is carried here rather than inside the parent.

      **The parent is not complete and must not be described as such. **[UTV2-1772](https://linear.app/unit-talk-v2/issue/UTV2-1772/ingest-write-throughput-eliminate-provider-offer-history-statement) still owns the June replay at the historical ingestion rate and the `db_statement_timeout` elimination criteria. Those resume after this child merges.

      ## Measured state on production (read-only, 2026-09-01)

      | table | rows | span | distinct events | providers |
      | -- | -- | -- | -- | -- |
      | `provider_offer_history` | 14,456,685 | 2026-05-11 → 06-30 | many | sgo |
      | `provider_offer_history_compact` | 3,139 | **2026-04-24 → 04-26** | **1** | 1 |

      The two tables do not overlap in time at all. `markClosingLines` reads only the compact table, so for every event in the operating window the SELECT returns zero rows, the loop continues, and the function returns 0 with no error. One recent event alone carries 165,414 eligible unmarked rows in `provider_offer_history` and zero in compact.

      **The premise of the UTV2-1366 source switch is false on current main.** That change moved the read to compact because `provider_offer_history`'s event index was believed to be `ON ONLY` the parent and therefore not inherited by the child partitions. All 60 child partitions carry a `(provider_event_id, snapshot_at)` index, and the bounded query plans as `Append` over three pruned partitions with `Index Scan Backward`:

      ```
      Limit  (actual time=2.027..81.476 rows=5000)
        ->  Append
              ->  Index Scan Backward using ..._p20260630_provider_event_id_snapshot_a_idx59
      Execution Time: 81.943 ms
      ```

      The same query against compact runs in 1.1 ms and returns 0 rows. It was never a fast path; it was an empty one.

      Second defect, independent of the first: `totalUpdated += count ?? chunk.length` never asked PostgREST for a count, so the fallback fired on every batch and the returned figure was the batch size rather than rows affected.

      Third defect: `apps/ingestor/src/ingest-odds-api.ts` calls `markClosingLines` without `includeBookmakerKey`, collapsing 1,318 offers to 264 dedupe keys for a single observed event. Six of seven bookmakers never receive a closing line on that path. `apps/ingestor/src/ingest-league.ts` passes it correctly.

      ## Definition of done

      * `provider_offer_history` is the bounded, partition-pruned source, chosen on executed query-plan evidence rather than on the assumption UTV2-1366 recorded.
      * The affected-row count is requested explicitly and a result carrying no count is **refused**, never substituted with the batch size.
      * The operation fails closed when eligible unmarked rows were selected for an event and none of them was marked.
      * `provider_offer_current.identity_key` is reconstructed correctly from the five components the database concatenates, since `provider_offer_history` has no `identity_key` column.
      * `apps/ingestor/src/ingest-odds-api.ts` passes `includeBookmakerKey` so every bookmaker's closing line is preserved.
      * Proof exercises the **actual ingest caller path**, not only a direct call to the repository function. A repository-level test cannot show that the caller passes the right options.

      ## Staging proof controls (authorized)

      Staging writes are authorized under all of the following. Any one of them unmet is a stop condition.

      * Assert the staging project identity **before** writing anything.
      * Use synthetic, production-shaped fixtures. Do not copy production rows.
      * Include one event with multiple bookmakers, preferably the observed seven-bookmaker shape.
      * Prove the pre-count, the returned count, the post-update delta, and one closing line per expected bookmaker identity.
      * Prove the incorrect collapsed-key behaviour **fails** — an inversion, not a passing run.
      * Clean up only the uniquely namespaced fixtures.
      * Prove no fixture residue remains.
      * Zero production writes. No provider calls.

      ## Out of scope

      * The June replay at historical rate and the `db_statement_timeout` acceptance criteria. Those stay with parent [UTV2-1772](https://linear.app/unit-talk-v2/issue/UTV2-1772/ingest-write-throughput-eliminate-provider-offer-history-statement) and resume after this merges.
      * Any provider resubscription, production unpark, member delivery or retention deletion.

      ## Stop conditions

      Return to PM if the staging identity assertion cannot be made before the first write; if a fixture cannot be built without copying production rows; if the collapsed-key inversion cannot be made to fail; or if fixture residue cannot be proven absent after cleanup.

      ## Guardrails

      Production and paid ingestion remain parked.
