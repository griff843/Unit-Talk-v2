task_contract:
  schema_version: 1
  issue_id: UTV2-1750
  objective: >-
    Land the drafted operational skills and make them load at the point of need.
    This is the one bounded governance lane allowed alongside production work;
    it must not become a broader autonomy project.

    **Claude owns this control-plane lane. Start from current main and recover
    the existing uncommitted drafts only after diffing them.**
  acceptance_criteria:
    - |-
      ## Objective

      Land the drafted operational skills and make them load at the point of need. This is the one bounded governance lane allowed alongside production work; it must not become a broader autonomy project.

      **Claude owns this control-plane lane. Start from current main and recover the existing uncommitted drafts only after diffing them.**

      ## In scope

      * `.claude/commands/lane-recovery.md`
      * `.claude/commands/pr-unblock.md`
      * `.claude/commands/proof-authoring.md`
      * `.claude/commands/mutation-test.md`
      * The existing `/dispatch` command and the smallest CLAUDE.md routing-table changes needed to invoke them
      * Focused tests or deterministic dry-run checks for routing
      * This lane's manifest, sync, and proof files

      ## Required routing behavior

      Before implementation dispatch, the orchestrator must produce three explicit packet sections:

      1. **Where to look** — exact repository paths, preserved refs/artifacts, relevant live state surfaces, and authoritative source.
      2. **Definition of done** — measurable acceptance criteria, proof artifacts, stop conditions, and mutation boundary.
      3. **Self-check and verification** — focused tests, full required verification, mutation/inversion checks where applicable, exact-head independent review, and proof figures derived from named commands.

      Then classify and load the applicable operational skill:

      * broken/ghost/parked/merged-but-unclosed lane → `/lane-recovery`
      * required-context, head-binding, or merge-gate mismatch → `/pr-unblock`
      * proof bundle creation or correction → `/proof-authoring`
      * a control claimed by tests → `/mutation-test`

      Multiple skills may be selected when their triggers genuinely overlap. If none applies, say so explicitly and continue.

      ## Definition of done

      * All four skill files are committed and indexed.
      * `/dispatch` performs deterministic skill discovery before executor launch and records selected skills in the execution packet.
      * The packet refuses with `INSUFFICIENT_TASK_CONTRACT` when where-to-look, definition-of-done, or verification/self-check content is missing.
      * At least one positive and one negative routing fixture exists for each skill.
      * A production lane fixture ([UTV2-1736](https://linear.app/unit-talk-v2/issue/UTV2-1736/offer-history-partitions-provision-current-and-forward-with-pre-expiry)) retains its complete objective, constraints, mutation boundary, and proof requirements.
      * A recovery fixture selects `/lane-recovery`; an ordinary narrow implementation does not.
      * No skill may mutate lane state merely by being selected.
      * Focused checks plus `pnpm verify:static` pass.
      * Independent review is bound to the exact final head.

      ## Non-goals

      * No autonomous multi-agent launch.
      * No `ops:parallelism-advisor` implementation; that remains [UTV2-1748](https://linear.app/unit-talk-v2/issue/UTV2-1748/opsparallelism-advisor-recommend-multi-agent-fan-out-in-dispatch-never).
      * No changes to lane capacity, tier rules, lifecycle status semantics, production runtime, database, deploy workflows, ingestion, or delivery.
      * No cleanup of drifted lanes inside this implementation lane.

      ## Sequencing

      Do not staff this ahead of [UTV2-1747](https://linear.app/unit-talk-v2/issue/UTV2-1747/executor-packet-transport-executing-dry-run-coverage-for-both). Once [UTV2-1747](https://linear.app/unit-talk-v2/issue/UTV2-1747/executor-packet-transport-executing-dry-run-coverage-for-both) lands, run this as the single governance lane **in parallel with** the authorized production lane. It must never block [UTV2-1736](https://linear.app/unit-talk-v2/issue/UTV2-1736/offer-history-partitions-provision-current-and-forward-with-pre-expiry), [UTV2-1749](https://linear.app/unit-talk-v2/issue/UTV2-1749/scheduled-alert-workflow-cannot-boot-or-self-report-wire-required), [UTV2-1744](https://linear.app/unit-talk-v2/issue/UTV2-1744/outbox-dead-letter-and-stuck-claim-triage-make-the-delivery-queue-safe), or [UTV2-1745](https://linear.app/unit-talk-v2/issue/UTV2-1745/pick-trustworthiness-audit-can-this-system-currently-produce-a).
  guardrails: []
  non_goals:
    - No autonomous multi-agent launch.
    - No `ops:parallelism-advisor` implementation; that remains
      [UTV2-1748](https://linear.app/unit-talk-v2/issue/UTV2-1748/opsparallelism-advisor-recommend-multi-agent-fan-out-in-dispatch-never).
    - No changes to lane capacity, tier rules, lifecycle status semantics,
      production runtime, database, deploy workflows, ingestion, or delivery.
    - No cleanup of drifted lanes inside this implementation lane.
