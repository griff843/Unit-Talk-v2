      'SMART_FORM_RELATIONSHIP_INVALID')`, so the guardrails reuse 422 for one
      consistent taxonomy on this path — but under a sibling `failGuardrail()`
      emitting `SMART_FORM_GUARDRAIL_INVALID`, because a numeric bound is not a
      relationship failure and the client should be able to distinguish them.
    - Non-capper sources (system picks, alert agent, board-pick-writer,
      candidate-pick-scanner) are **unaffected** — asserted by a test that
      submits an out-of-range system pick and expects success.
    - "Duplication is unavoidable here: `apps/smart-form` cannot import from
      `apps/api` (core invariant 8 — apps never import from apps), and hoisting
      the constants into `packages/contracts` would re-floor the lane at T1 on a
      Tier C prefix. So the literals are duplicated and a **drift test asserts
      the two copies agree**, following the pattern
      [UTV2-1688](https://linear.app/unit-talk-v2/issue/UTV2-1688/executor-resu\
      lt-validator-rejects-the-bootstrap-branch-namespace) established for the
      executor-result regexes."
    - "Mutation-tested: removing each bound turns a distinct test red."
  guardrails:
    - No containment change. No change to `packages/contracts`. No change to
