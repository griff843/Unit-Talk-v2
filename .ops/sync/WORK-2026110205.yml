      on unmodified main. Record the failing output in the proof, then make them
      pass. If the prepared tests already exist in a Codex worktree or session,
      reuse them verbatim and cite their source. A mutation that restores the
      old NHL `data[0]` or NFL first-hit selection fails a test."
    - "**Branded fallback for unverified assets.** When no approved,
      identity-verified image is available, or the image fails to load, Smart
      Form renders the approved Smart Form emblem. Use the same geometry as
      `apps/smart-form/app/submit/components/BrandLogo.tsx`, with no app-to-app
      import, and the participant's name as accessible text. The approved-host
      and identity checks in `apps/smart-form/lib/participant-media.ts` stay at
      least as strict as today."
    - "**Revalidate the currently stored headshots, read-only.** The input is a
      read-only snapshot of every production `participants` row with
      `participant_type='player'` and a `metadata.headshot_url` (MLB, NBA, NHL;
      NFL has none stored). Production Claude supplies it at
      `.out/media-0205/stored-headshots-snapshot.json` in the lane worktree,
      with its SQL in `.out/media-0205/snapshot-query.sql`. Use that file and
      cite its row count. Never connect to production yourself. Re-run each row
      through the new matcher against the live provider endpoint. Produce
      `docs/06_status/proof/WORK-2026110205/stored-headshots-revalidated.json`,
      which lists participant id, sport, stored URL, the new-matcher URL or
      null, a verdict (`confirmed`, `mismatch`, `ambiguous` or `unresolved`) and
      the reason. Label it \"revalidation of stored headshots\" and never call
