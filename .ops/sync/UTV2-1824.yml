  unmapped_sections:
    - >-
      Defect (measured on current main)

      `apps/smart-form/lib/auth-allowlist.ts::deriveCapperIdFromEmail` derives
      the canonical capper identity from the **email local-part**:


      ```

      const [localPart] = normalized.split('@');

      return (localPart ?? '').replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g,
      '');

      ```


      `parseAllowedCapperEmails` splits `ALLOWED_CAPPER_EMAILS` on `,` and
      applies that derivation to every entry. There is no `email=capperId`
      parser anywhere in the file.


      Consequence on the Smart Form critical path: Griff's authorized login
      `griffadavi@gmail.com` resolves to capper ID `griffadavi`, **not**
      canonical `griff843`.


