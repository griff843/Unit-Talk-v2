      mapping**, never from an email local-part.

      2. Fail closed: an allowlist entry with no explicit canonical mapping
      admits nobody. An empty or unset `ALLOWED_CAPPER_EMAILS` continues to
      admit nobody.

      3. `ALLOWED_CAPPER_EMAILS` remains server-authoritative and is never
      exposed to the browser bundle.

      4. Griff's authorized login must deterministically resolve to canonical
      `griff843`.

      5. No credential value is invented, printed, or committed. The mapping
      value is owner-supplied through the sanctioned secret path at deploy time.
    - >-
      Why this is small

      One file plus its test. It is deliberately not an auth project:
      authorization, session handling, and the JWT contract are unchanged.
  source:
    kind: linear-issue-snapshot
    issue_url: https://linear.app/unit-talk-v2/issue/UTV2-1824/smart-form-identity-resolve-authorized-login-to-a-canonical-capper-id
    title: "Smart Form identity: resolve authorized login to a canonical capper ID
      by explicit server-side mapping, never email local-part"
    description: |-
      ## Defect (measured on current main)

      `apps/smart-form/lib/auth-allowlist.ts::deriveCapperIdFromEmail` derives the canonical capper identity from the **email local-part**:

      ```
      const [localPart] = normalized.split('@');
      return (localPart ?? '').replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '');
      ```

      `parseAllowedCapperEmails` splits `ALLOWED_CAPPER_EMAILS` on `,` and applies that derivation to every entry. There is no `email=capperId` parser anywhere in the file.

      Consequence on the Smart Form critical path: Griff's authorized login `griffadavi@gmail.com` resolves to capper ID `griffadavi`, **not** canonical `griff843`.

      That value is not cosmetic. `apps/smart-form/auth.ts` puts it in the session JWT as `capperId`, and `apps/api/src/handlers/submit-pick.ts` uses the JWT `capperId` in preference to whatever `submittedBy` the form sent. So the derived value becomes the persisted identity of a real pick.

      The rest of the repository already assumes the canonical value:

      * `apps/smart-form/test/form-utils.test.ts:295` asserts `payload.submittedBy === 'griff843'`
      * `apps/smart-form/e2e/real-reference.spec.ts:11` signs a capper JWT with `capperId: 'griff843'`

      ## Required contract (PM-approved 2026-09-02)

      1. Canonical capper identity comes from an **explicit server-side mapping**, never from an email local-part.
      2. Fail closed: an allowlist entry with no explicit canonical mapping admits nobody. An empty or unset `ALLOWED_CAPPER_EMAILS` continues to admit nobody.
      3. `ALLOWED_CAPPER_EMAILS` remains server-authoritative and is never exposed to the browser bundle.
      4. Griff's authorized login must deterministically resolve to canonical `griff843`.
      5. No credential value is invented, printed, or committed. The mapping value is owner-supplied through the sanctioned secret path at deploy time.

      ## Acceptance criteria

      * An entry carrying an explicit canonical mapping resolves to exactly that ID.
      * An entry with no explicit mapping is rejected — it does not silently fall back to the local-part, and it does not admit the login.
      * Empty / unset / whitespace-only config admits nobody.
      * An authorized login for Griff resolves to `griff843`, proven by an executed test rather than by inspection.
      * A mutation control proves the fix: restoring local-part derivation makes the canonical-identity test fail.
      * No change to `apps/api/src/auth.ts`, to the API's source/distributionMode pinning, or to any other auth surface.

      ## Out of scope

      The API-side capper JWT contract (already correct — `capperId` is an explicit claim and validation fails closed without it), production deployment configuration ([UTV2-1795](https://linear.app/unit-talk-v2/issue/UTV2-1795/shared-nextjs-production-deployment-appsweb-and-appssmart-form-on)), and any change to who is authorized. This lane changes only how an already-authorized login maps to a canonical ID.

      ## Why this is small

      One file plus its test. It is deliberately not an auth project: authorization, session handling, and the JWT contract are unchanged.
