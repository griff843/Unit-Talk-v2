task_contract:
  schema_version: 1
  issue_id: UTV2-1903
  objective: "B0: admit game spreads to grading as a dedicated, fail-closed market family"
  acceptance_criteria:
    - >-
      `normalizeMarketKey` already canonicalizes `spread`, `game_spread` and
      `game-spread` to `spread` (`packages/domain/src/market-key.ts:3-5`). The
      defect is entirely in `classifyMarketFamilyForGrading`
      (`apps/api/src/grading-service.ts:512-558`), which has no spread family
      and returns `family: 'unsupported', gradeable: false`.


      Proven by `apps/api/src/grading-service.test.ts:1867-1888`, which asserts
      `market: 'spread'` yields `skipped: 1`, `reason:
      'unsupported_market_family'`.


      **Two of the four production Track Only picks are spreads**, including the
      newest acceptance pick `04174f12` (NFL, Chiefs -2.5). They are
      structurally ungradeable today.


      ## Scope


      `apps/api/src/grading-service.ts` and
      `apps/api/src/grading-service.test.ts` only. No change to
      `packages/domain/src/market-key.ts` — its mapping is already correct, and
      touching it would force the lane into `modeling` and block B1.


      ## Design — mirror the moneyline precedent exactly


      Add a `game_spread` family (`participantRequirement: required`,
      `participantType: team`, `gradeable: true`, `usesLine: true`) and a
      dedicated outcome branch that refuses any `game_results.market_key` but a
      dedicated spread result key, exactly as the moneyline branch refuses
      anything but `MONEYLINE_RESULT_MARKET_KEY` (`grading-service.ts:364`).


      That guard is load-bearing, not defensive: existing `-sp` game-line rows
      carry an unattributed raw score, so grading a spread off them would invent
      a side. Spread picks become classified gradeable and then skip by name
      until a properly attributed result row exists — honest and observable,
      which is what the moneyline change did.


      ## Bounds


      No SGO activation, no provider credential access, no production write, no
      containment change, no member delivery.
