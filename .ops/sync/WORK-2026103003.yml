  objective: >-
    Since #1807, a push-triggered closeout waits for `ci.yml` on the merge SHA
    before `lane-close` runs. `lane-close` still checks out `github.sha`, which
    on a push is the merge SHA. Any commit that lands on `main` during the wait
    therefore makes the checkout stale, and the final guarded push is rejected
    as non-fast-forward. The guard is correct to refuse a rebase, but the lane
    then needs a manual replay, which is the outcome #1807 set out to remove.

    Observed on #1807's own closeout:

    | Merge | Push closeout | Wait | Main moved during the wait | Result |
    Replay | |---|---|---|---|---|---| | `ee8c4bfff` (#1807) | 41055315520 |
    12:26:13 to 12:51:42, ended when ci.yml 41055315588 succeeded | `773b9f309`
    readiness refresh at 12:28:05 | every gate passed, G6 included; push
    rejected, "Main advanced while the closeout merge mutex was held" |
    41058773012 |

    Before #1807 the closeout pushed about 30 seconds after the merge, so this
    window was rare. With a wait of 13 to 50 minutes, any other lane's close
    commit, merge or the 6-hourly readiness refresh landing in that window
    triggers it.
  acceptance_criteria:
