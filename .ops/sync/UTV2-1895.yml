task_contract:
  schema_version: 1
  issue_id: UTV2-1895
  objective: Smart Form mobile capper UI — brand, sportsbook-style
    selection-to-slip flow, verified manual Track Only submission
  acceptance_criteria:
    - >-
      Griff directed on 2026-09-13: deliver a working visual preview first, then
      the earliest verified manual capper submission. Purpose: let Unit Talk
      cappers record picks quickly, accurately and comfortably from their
      phones, using the existing application, authentication, contracts and
      approved brand assets.


      Scope (delivery-ui, `apps/smart-form/**` only):


      * Apply the Unit Talk brand (`docs/03_product/brand/README.md`: angular UT
      monogram, UNIT TALK wordmark, near-black `#151619`, warm gold `#C7A34B`,
      soft white `#F5F4EF`), consistent typography and spacing.

      * Sportsbook-style selection-to-slip flow: sport → matchup/participants →
      market → selection → line → odds → stake, each easy to understand; one
      shared bet slip.

      * Track Only obvious on the slip and receipt; entries preserved after
      validation errors; accidental duplicate submission prevented (disabled
      submit while in flight + session duplicate guard); clear saved
      confirmation showing the persisted pick id and Track Only state.

      * Manual (DB-backed participant, no canonical event) submission path
      verified through the browser against the local isolated API, and the
      persisted pick asserted.

      * Preserve the existing live-offer browse mode and
      `EventOfferBrowseResult` provenance so the SGO-assisted path can plug in
      without a contract change.


      Out of scope: `apps/api`, `packages/contracts`, deployment, live SGO
      requests, production writes. Submission contract (`POST /api/submissions`,
      Track Only pin) is unchanged.


      Evidence: desktop and mobile screenshots (delivery-ui required proof),
      `pnpm --filter @unit-talk/smart-form verify` green, Playwright
      manual-submission case green locally.
