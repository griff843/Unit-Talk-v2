task_contract:
  schema_version: 1
  issue_id: UTV2-1839
  objective: "Approval carry-forward C5/C6: distinguish unchanged reviewed content
    from incoming main changes, and refuse evil merges"
  acceptance_criteria:
    - |-
      Successor to [UTV2-1836](https://linear.app/unit-talk-v2/issue/UTV2-1836/carry-forward-trusted-evidence-collector-merge-gate-integration-diff), which shipped `scripts/ops/approval-carry-forward.ts` (C1-C4) and `scripts/ops/carry-forward-collect.ts` with the Merge Gate integration deliberately excluded.

      **PM authorization 2026-09-05 is to PREPARE AND VERIFY, NOT TO ACTIVATE.** `.github/workflows/merge-gate.yml` is not modified by this issue. The proposed integration hunk is delivered as a reviewed written proposal in the proof bundle, for a separate reserved architecture decision.

      ## Why C1-C4 are not yet sufficient — measured, not argued

      The only comparison the collector performs is a **two-dot whole-tree diff of the PR head against itself at two points in time** (`carry-forward-collect.ts:165-167`, `git diff --name-only approvedSha headSha`). That set contains PR-authored changes and main-originated changes **indistinguishably**. Nothing computes `git diff base...head` at either point, and nothing compares two such diffs. The current claim is a structural proxy — "no new authored commit, all first-parent merges, every moved path on a 5-pattern allowlist" — not "the reviewed content is unchanged".

      **C1 is blind to a merge's own content.** `approval-carry-forward.ts:211,223` inspects only `parents.length` and `parents[1]`; it never looks at a merge's tree. `grep -rn -- "log --cc|diff-tree -c|\^2" scripts .github` returns **zero hits** across the repo.

      **The gap is already reachable on this repository.** Measured read-only on `main`:

      ```
      $ git diff-tree --cc -r --name-only c31b8ee191e1704a5ebca70e60e178b97a433d99
      c31b8ee191e1704a5ebca70e60e178b97a433d99
      docs/06_status/lanes/UTV2-1514.json
      $ git log -1 --format=%s c31b8ee1
      Merge remote-tracking branch 'origin/main'
      ```

      That is an evil merge — content in neither parent — on a path `ALLOW_PATTERNS[0]` (`docs/06_status/lanes/UTV2-*.json`) admits. Across the 20 most recent merges on `main`, 19 have empty `--cc` output and this one does not, so the check is cheap, near-always-empty and discriminating. Wiring the current C1-C4 into merge authority would admit exactly this shape.

      ## Scope

      1. **C5 — conflict resolution.** For every merge `M` on the first-parent chain, `git diff-tree --cc -r --name-only M` must emit only the SHA line. Any further line is content in neither parent; refuse.
      2. **C6 — incoming content is literally main's.** For every path `p` in `git diff --name-only A H`, `git rev-parse H:p` must equal `git rev-parse origin/main:p` (or both must be absent). Any inequality means content exists in neither the approved head nor main; refuse. This is the enforcement half and it subsumes C5 at path granularity — keep both, `--cc` is the cheaper primary.
      3. **Widen C1's ancestry check** from `parents[1]` only to every commit in `A..H` off the first-parent chain: `git rev-list A..H --not origin/main` must contain nothing but the first-parent merge commits themselves. A merge whose second parent is on main can still carry, through *its* ancestry, commits that are not.
      4. **PR-own-diff identity as the headline statement.** `git patch-id --stable` over `git diff $(git merge-base origin/main X) X` at both `A` and `H`; equal ids mean the PR's contribution relative to its base is byte-identical. Use as the reported claim, with C6 as the enforcement — `patch-id` normalizes rename/mode-only changes away.
      5. **Withdrawal gaps.** `carry-forward-collect.ts:204` requires `r.state === 'CHANGES_REQUESTED'`, so a **dismissed** review silently removes the withdrawal signal (`merge-gate.yml:44` already triggers on `pull_request_review: [dismissed]`, so the event is visible). Only `created_at` is read (`:190`), never `updated_at`, so a `CHANGES_REQUIRED` comment predating the approval but edited afterwards is ignored. Decide both explicitly rather than leaving them implicit.
      6. **Policy-path completeness.** `.github/CODEOWNERS` designates `/packages/db/**` and `/apps/api/src/controllers/**` as owned surfaces; they are caught today only by C2 and C3's deny-by-default, not by the explicit deny list. Add them to `denyPatternsFor()` (`approval-carry-forward.ts:122-144`) so the deny list and CODEOWNERS agree by construction.
      7. **Write the merge-gate integration as a proposal, not a change.** Record in the proof bundle: the gate job is `actions/checkout@v4` at `base.sha` with no `fetch-depth` (`merge-gate.yml:88-91`) and `permissions: contents: read`, so it has no git history, no head commit and no `origin/main` ref; the base-SHA pin is a deliberate privilege boundary and must not move; a port to CJS beside `merge-gate-verdict.cjs` avoids a `pnpm install` in the gate job; and the call site must fire only when `errors.length === 1 && /^PM verdict is stale: /` and `t1-approved` is still present, failing closed on any throw.

      ## Acceptance

      1. C5 refuses `c31b8ee191e1704a5ebca70e60e178b97a433d99` when it appears on a chain, and admits the 19 measured merges that carry no evil-merge content.
      2. C6 refuses a path whose blob at the resulting head differs from `origin/main`, and admits one whose blob is identical.
      3. The widened C1 refuses a chain carrying a nested-merge commit that is not an ancestor of `origin/main`.
      4. **Inversion, required:** remove C5 and the evil-merge case must pass. Remove C6 and the divergent-blob case must pass. A condition that is merely present and green proves nothing.
      5. The accept direction is re-measured over real `origin/main` first-parent windows, so the extended condition set is demonstrably not an always-refuse control.
      6. `grep -rl 'carry-forward' .github/ | wc -l` is **0** — no workflow, and therefore no gate, references any of this.
      7. A previously posted receipt is never read back as evidence; every value is recomputed.

      ## Out of scope

      * `.github/workflows/merge-gate.yml` — reserved. Not edited.
      * Branch protection, CODEOWNERS, required-check configuration — reserved.
      * Activating carry-forward in merge authority — a separate PM architecture decision this issue does not pre-empt.
