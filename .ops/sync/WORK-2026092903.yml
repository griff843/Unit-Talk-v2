    description: >-
      # WORK-2026092903 — Production-safe post-migration verification


      Tier: T1 · Lane type: governance · Executor: codex-cli


      Repo-owned work order (tracker independence, ratified 2026-09-05). No
      Linear issue exists for this identity by design. This repair is required
      to close UTV2-1370 without running the staging-only writable DB proof
      suites against production.


      ## Objective


      Align the canonical migration workflow with the repository's existing
      staging-only execution guard by adding a sanctioned, production-bound,
      read-only post-apply verifier. Preserve production Live Schema Parity and
      the staging refusal gate without changing warehouse-retention behavior.


      ## Acceptance Criteria


      - `pnpm test:db` and the writable/live DB suites remain staging-only and
      continue to refuse production.

      - A dedicated production post-migration verifier proves its target is the
      canonical production project, observes PostgreSQL read-only transaction
      state, and uses only bounded catalog/SELECT probes.

      - The verifier checks migration-ledger alignment, required schema objects
      and RPCs, the warehouse-retention phase-role privilege boundaries, and
      affected schema/runtime smoke.

      - Production Live Schema Parity remains a separate mandatory exact-run
      receipt before migration lane close.

      - Automated tests reject write-capable verifier SQL and reject staging or
      unbound environment evidence as production truth.

      - The authoritative migration and DB operator policies describe the
      executable staging/production split accurately.

      - No migration, retention plan, canary, prune, deletion, or UTV2-1370
      runtime behavior change is included.


      ## Guardrails


      - No change under `supabase/migrations/**` or to warehouse-retention
      runtime behavior.

      - No production DDL or data mutation.

      - No weakening of `ci:assert-staging` or Live Schema Parity.


      ## Exit Criteria


      - Exact-head T1 checks and mechanical tests are green.

      - PR receives PM exact-head approval and merges through the normal Merge
      Gate.

      - Only after merge may UTV2-1370 use the sanctioned production-safe
      verifier; generated-types reconciliation remains separately dispositioned.
