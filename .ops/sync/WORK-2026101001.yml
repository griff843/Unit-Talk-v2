    description: >-
      # WORK-2026101001 — ratify participants as canonical for the Smart Form /
      team-selection phase


      Tier: T2

      Lane type: governance

      Executor: claude


      ## Objective


      Correct a contradiction between canonical authorities, per PM direction on
      PR #1730 (PM_DECISION: BLOCKED, head 2ca2f0aeb):
      `T1_CANONICAL_MIGRATION_AND_COMPATIBILITY_CONTRACT.md` §2 rules 2 and 5
      make `teams` canonical for reference-data browsing, while shipped runtime
      (`DatabaseReferenceDataRepository.searchTeams`, UTV2-1854/#1535,
      UTV2-1856/#1536) reads `participants` and returns `participants.id`.
      Ratify `participants` as canonical for this phase; `teams` stays
      untouched; a future `teams` cutover stays separate.


      ## Acceptance Criteria


      - The contract carries one bounded amendment to §2 that supersedes rules 2
      and 5 for the Smart Form / team-selection phase only, citing the shipped
      runtime as evidence.

      - The amendment states `participants` canonical for this phase,
      `teams`/`players`/`player_team_assignments`/`provider_entity_aliases`
      untouched, and the future `teams` cutover separate and unauthorized.

      - No other rule, file, code, migration, runtime setting or PR (including
      #1730) is changed.


      ## Invariants


      Documentation only. No schema, runtime, containment, delivery, provider,
      migration, merge-authority or governance-mechanics change. #1730 is not
      modified.


      ## File Scope


      - docs/05_operations/T1_CANONICAL_MIGRATION_AND_COMPATIBILITY_CONTRACT.md

      - .ops/work/WORK-2026101001.md

      - .ops/sync/WORK-2026101001.yml

      - docs/06_status/lanes/WORK-2026101001.json

      - docs/06_status/proof/WORK-2026101001/**


      ## Proof


      Diff of the single contract edit plus a verification log; PM review of the
      amendment.
