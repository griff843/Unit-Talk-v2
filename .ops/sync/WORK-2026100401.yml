      WORK-2026100401 — canonical Shadow Parity settlement count repair

      Tier: T1

      Lane type: governance

      Executor: codex-cli


      ## Invariants


      - No Discord presentation edits, scoring/grading/settlement behavior,
      provider activation, routing, kill switches, schema additions, or new
      feature/runtime triggers.

      - Do not change packages/contracts, domain, db implementation, workers,
      application services or package/dependency files.

      - Do not claim admission model proves desktop execution model. Preserve
      actual CLI provenance.

      - Do not alter merge authority or fabricate a UTV2 work identity.


      ## File Scope


      - scripts/shadow-scoring-runner.ts

      - scripts/shadow-scoring-runner.test.ts

      - .ops/work/WORK-2026100401.md

      - .ops/sync/WORK-2026100401.yml

      - docs/06_status/lanes/WORK-2026100401.json

      - docs/06_status/proof/WORK-2026100401/**


      ## Proof


      Canonical query explanation, deterministic tests, safe read-only grant
      before/after and zero-write catalog evidence, exact-HEAD staging/CI
      results, actual model-routing attestation, Shadow result and
      trusted/candidate source identity; final repair merge SHA and resynced PR
      1714 SHA/check table. No global program/status/mission edits.


      ## Measured schema and query guidance


      Live catalog shows pick_candidates.pick_id has no foreign key, so a
      PostgREST embedded join from candidates to picks does not exist. Read
      candidate id/pick_id links in stable paginated batches, then query
      canonical settlement_records joined through its real picks foreign key for
      those pick IDs. Require result in win/loss/push, status settled,
      evidence_ref not null, non-voided picks and a non-null submission_id
      (picks has an enforced submissions FK). Apply the canonical
      reporting.pick_fixture_reason exclusions to the pick's
      metadata/selection/market/source and exclude shadow source records where
      applicable. Do not conflate a candidate's shadow_mode with a synthetic
      pick's is_shadow. Current picks schema has no is_shadow column, which the
      vocabulary explicitly permits. Paginate settlements too, so
      duplicate/correction rows cannot truncate observations; count each
      qualifying candidate once, not each settlement row. Preserve query errors
      and absent data as failures, never zero-success substitutes.


      This follow-up needs only SELECT on public.picks and
      public.settlement_records beyond the three current shadow-reader table
      grants. Independently measured canonical SQL over reporting.picks returned
      1,412 candidate links to 1,182 qualifying picks on 2026-10-05;
      observations can change and this historical count is not an expected
      hard-coded value. The canonical metric is candidate links backed by at
      least one qualifying evidence-settled record, not current win rate, raw
      settlement row count or CLV-path count.
