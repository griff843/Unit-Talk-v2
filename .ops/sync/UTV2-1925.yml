task_contract:
  schema_version: 1
  issue_id: UTV2-1925
  objective: Smart Form receipt must display server delivery truth, not client form state
  acceptance_criteria:
    - >-
      The Smart Form receipt asserts a containment outcome from client-side form
      state.


      `SuccessReceipt.tsx:39` renders "Track Only — no member delivery" from
      `submittedValues.trackOnly`, which is a client form value defaulting to
      `true` (`form-schema.ts:70`). It never reads what the server actually did.


      The server already returns the truth. `SubmitPickControllerResult` carries
      `lifecycleState`, `promotionStatus`, `promotionTarget` and
      `outboxEnqueued`, and the Track Only branch returns `outboxEnqueued:
      false` explicitly. The Smart Form's own `SubmitPickResult` type
      (`api-client.ts:101`) keeps only three of those fields and discards the
      rest.


      Consequence: a server-authorized capper whose submission enters the
      approval-for-delivery path is still shown "Track Only — no member
      delivery". The UI states a delivery fact it did not receive and cannot
      know.


      Acceptance:


      * the receipt renders from the server response, never from
      `submittedValues.trackOnly`

      * absence of a server determination is rendered as "not confirmed", never
      as "no member delivery" — fail closed in the truthfulness direction

      * the UI displays server truth and controls no delivery authorization

      * existing Track Only behaviour for unauthorized cappers is unchanged and
      stays mutation-proven


      Scope: `apps/smart-form/**`. Independent of the human-capper delivery
      branch — it needs no new server field.
