  schema_version: 1
  issue_id: UTV2-1931
  objective: Reconcile mission plan and record the Human Capper V1 lifecycle hand-off
  acceptance_criteria:
    - >-
      `docs/mission/plan.md` is startup context and is measurably stale.
      Re-measured against production `zfzdnfwdarxucxtaojxm` and `origin/main`
      `17b3f964f` on 2026-09-18:


      * Governed pick cohort (`metadata ? 'distributionMode'`) is **7**, not 4.

      * **Six** of those picks carry a `settlement_records` row, all `source =
      operator`, `confidence = confirmed`, with real ESPN `evidence_ref`.
      plan.md records 0.

      * `UNIT_TALK_COMMAND_CENTER_ENABLED` is already `true` and the Command
      Center is deployed. plan.md records it as `false` and lists it as decision
      2.

      * Deployed release is `961f17c64` (Deploy run `35289985486`), not
      `40968bf80`.

      * One `distribution_outbox` row exists since 2026-09-01 — `684ba33f…`,
      `discord:official-picks`, `sent` — the accepted Human Capper canary.
      plan.md records the newest outbox row repo-wide as 2026-07-30.


      Also record the Human Capper V1 lifecycle position and the two owner
      decisions it is now blocked on: deploying `961f17c64..main` (the recap
      channel-resolution repair), and the results/reference-data supply.


      Governance lane, T3, docs only. No code behaviour change.
