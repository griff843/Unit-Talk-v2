      - apps/command-center/src/components/PicksExplorerClient.tsx

      - apps/command-center/src/lib/data/queues-count-relation.test.ts

      - apps/command-center/src/lib/data/operations-home.test.ts


      The scope is immutable once the lane starts. Only
      `docs/06_status/proof/WORK-2026102807/*` may be added outside it.


