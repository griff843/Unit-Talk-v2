      This is a repo-owned work order (tracker independence, ratified
      2026-09-05), directed on 2026-10-29 as a bounded follow-up to
      WORK-2026102806 (#1800).


      ## Defect


      `searchPicks` (`apps/command-center/src/lib/data/queues.ts`) resolves the
      effective settlement result from the full settlement chain only when a
      `result` filter is active. That is the `truth` / `effectiveResults` path
      WORK-2026102806 added. Without a filter, `/picks` renders the view's
      `settlement_result`, which comes from the newest timestamp and is not
      necessarily the chain tip. So after an append-only correction, the
      unfiltered list can still show the **original** result. The filtered list
      and the pick page show the corrected one, so the same pick reads
      differently depending on whether a filter is set.


      ## Attempted patch


      The attempted patch is preserved at
      `.out/work-orders/WORK-2026102807-attempted.patch` (a copy of
      `/tmp/cc-2806-unfiltered-correction.patch`).

      - For each page, it fetches the complete `settlement_records` history of
      the page's pick IDs, paginated with a count-stability check that fails
      closed.

      - It resolves each row through `mapPickIdentityRead` and sets
      `settlement_result` to the effective result, plus `settlement_corrected`.

      - If a result filter is active and the page re-resolution disagrees with
      the filter's effective result, it throws instead of rendering an
      inconsistent page.

      - `PicksExplorerClient` renders "(corrected)" next to the badge.


      It could not land in #1800 because the new per-page `settlement_records`
      request breaks the fetch mock in `operations-home.test.ts`, which is
      outside WORK-2026102806's immutable scope.


