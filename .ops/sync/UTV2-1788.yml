    description: |-
      ## Objective

      Turn the existing Command Center from several overlapping dashboard concepts into one coherent, honest, buildable internal operator workflow.

      Command Center is an **internal operator/admin control plane. It is not customer-facing.**

      This lane is **consolidation and stabilization** — not deployment, API expansion, database work, or new feature development.

      Griff authorized this bounded app-only stabilization objective. That authorization does **not** permit touching shared runtime authority, migrations, production configuration, delivery behavior, or production data.

      Successor to the canceled [UTV2-1672](https://linear.app/unit-talk-v2/issue/UTV2-1672/nfl-command-center-launch-workbench-live-approval-exception-grading) (duplicated and incorrectly framed umbrella issue). [UTV2-1672](https://linear.app/unit-talk-v2/issue/UTV2-1672/nfl-command-center-launch-workbench-live-approval-exception-grading) must not be reopened or reused.

      ---

      ## Tier classification (mechanical, not asserted)

      Run 2026-08-30 via `npx tsx scripts/ops/tier-classifier.ts --declared-tier T2 --files <lane scope>`:

      ```
      declared_tier: T2
      mechanical_minimum: T3
      derived_tier: T2
      escalated: false
      matches: []
      advisory: success — "declared T2 matches the mechanical tier floor"
      ```

      Zero Tier C path matches. `docs/governance/LANE_TAXONOMY.md` §7 (Delivery/UI) sets **T2 default, T3 for isolated non-member-facing scaffolding**; `apps/command-center/**` is an explicitly listed Delivery/UI allowed path. **T2 is the correct tier. T1 is not applicable** — no migration, no new API write path, no delivery adapter, no lifecycle FSM change, no `packages/contracts` change (the seven T1 triggers in `docs/05_operations/CC_UNIFICATION_TIER_CLASSIFICATION.md`).

