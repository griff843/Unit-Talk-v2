      1. **Line 13 **`pnpm install --frozen-lockfile` — the build context copies only `apps/command-center`, but `pnpm-workspace.yaml` globs `apps/*` + `packages/*` and `pnpm-lock.yaml` holds ~20 importers → `ERR_PNPM_OUTDATED_LOCKFILE`. Even unfrozen, the five declared `workspace:*` deps aren't in context → `ERR_PNPM_WORKSPACE_PKG_NOT_FOUND`. Three of them are genuinely imported, so this is a real dependency, not a stale manifest entry.
      2. **Line 26 **`COPY … /repo/apps/command-center/public` — there is **no **`public/` **directory**.

      Also: CC pins `node:20-alpine` while every other service uses `node:22-alpine`. **No workflow builds this image.**

