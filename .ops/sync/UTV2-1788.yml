      **But **`explicitMode` **is checked BEFORE the environment (**`:309-310`**).** Setting `COMMAND_CENTER_AUTH_MODE=fail_open` (or `UNIT_TALK_COMMAND_CENTER_AUTH_MODE`, or `UNIT_TALK_OPERATOR_RUNTIME_MODE=fail_open`) **overrides production**, returns `required=false`, and with no token configured `server-api.ts:212-215` authenticates **every request as a full operator** (`role:'operator'`, `method:'dev_bypass'`), which `middleware.ts:53-59` then logs as a legitimate privileged action. The same override satisfies the service-role DB gate at `src/lib/data/client.ts:55-57`.

      `apps/command-center/.env.example:5` **ships **`COMMAND_CENTER_AUTH_MODE=fail_open` **with no warning comment.** Root `.env.example:217` does the same (out of this lane's scope — report only).

      ### Database authority — VERIFIED

      CC reads **directly from Supabase with service-role credentials** via `getDataClient()` (`src/lib/data/client.ts:74-81`), used across ~20 files in `src/lib/data/`. One page bypasses the data layer entirely: `src/app/intel/teams/page.tsx:31` calls `getDataClient()` inside the page. `src/lib/data/storage-health.ts:147-155` calls the Supabase Management API `POST /v1/projects/{ref}/database/query` (arbitrary SQL).

