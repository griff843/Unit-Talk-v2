  acceptance_criteria:
    - |-
      PM APPROVE PLAN received from Griff in the current Codex conversation on 2026-10-10. Plan approval only; PM exact-head merge approval remains required. No production apply/deployment/provider activation/delivery release authorized.

      Approved scope: one additive supabase/migrations/\*\_ncaaf_participant_catalog.sql; packages/db/src/canonical-reference-schema.test.ts; one reviewed roster fixture packages/db/src/ncaaf-participant-roster.json; issue-owned lane/proof artifacts.

      Acceptance criteria:

      * participants is canonical; no teams writes.
      * Freeze current NCAA Division I football FBS+FCS membership from authoritative membership evidence, reconciling standings and transitions/independents.
      * School-qualified names prevent mascot collisions.
      * Stable UUIDs; repeat application creates no duplicates or UUID churn. No invented provider IDs. Preserve existing IDs/references.
      * No event/odds/grading/provider/worker/routing/delivery/schema replacement changes.
      * Focused tsx schema tests, pnpm verify, R-level artifacts, sanctioned T1 staging DB and exact-head CI proof. Do not defeat local staging guard.

      Current main e2ac5dbf93f1de634400d3b310c5badf5699d067. Read-only production NCAAF participant count 0. Official NCAA directory capture 2026-10-10: 138 FBS + 128 FCS (academicYear 2027). Standings reconciliation required; known stale FCS standings include Saint Francis (now DIII) and omit New Haven/West Florida.

      WNBA is separately approved manual-support lane and will be admitted only after singleton/file locks permit. Capitals pick and containment remain untouched.

      2026-10-10 executor scope finding: implementation not started. Current migration CI requires db/migrations-rollback/<basename>.down.sql (outside approved substantive paths). Its DDL-specific precondition drill cannot prove a data-only seed; the existing NO-PRECONDITION-REQUIRED branch skips the seed but then fails when DRILLED=0. A narrow rollback/proof-runner scope amendment is required. No guard bypass, fabricated schema object, production write or deployment performed. Current-head preflight is running; baseline from old local main is not claimed current-head evidence.

