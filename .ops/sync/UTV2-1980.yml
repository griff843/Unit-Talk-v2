    description: |-
      # UTV2-1980 — Revoke anonymous and authenticated access to v_governed_pick_performance

      Tier: T1
      Lane type: migration
      Executor: codex-cli

      Supersedes WORK-2026102204 (PR #1774, closed) and WORK-2026102201 (PR #1773, cancelled). WORK-2026102204 carried the repo-minted WORK identity, which migration-reversibility-gate.yml (proof-binding step) refuses: migration PRs must have a UTV2-NNN id in the branch name. PM (Griff) authorized UTV2-1980 as the issue identity and carried the A1 approval (T1 implementation + STAGING proof only) over provided migration security behavior and scope are unchanged. The migration and down script are byte-identical to PR #1774 head 8a46cc1bd.

      Source: PM verdict 2026-10-22 (Workstream A1: approved for T1 implementation and staging proof; production DDL NOT authorized). Production read-only measurement 2026-10-22: `anon` and `authenticated` hold SELECT, INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER on `public.v_governed_pick_performance`; the view has no `security_invoker`.

      ## Objective

      Make `public.v_governed_pick_performance` service-role-only and reversible, without applying any production DDL.

      ## Acceptance Criteria

      - One migration revokes ALL on the view from `anon`, `authenticated` and PUBLIC, grants SELECT to `service_role` only, and sets `security_invoker = true`. The migration `supabase/migrations/20261022090000_revoke_governed_pick_performance_anon.sql` is carried over unchanged from WORK-2026102201/WORK-2026102204.
      - A down script `db/migrations-rollback/20261022090000_revoke_governed_pick_performance_anon.down.sql` restores the measured pre-change posture: anon and authenticated hold all privileges, service_role holds all privileges, PUBLIC holds none, and the view has no `security_invoker` option (RESET). It is executable SQL and survives the migration-reversibility round trip (up, down, up gives an identical schema hash).
      - Effective privileges verified via `has_table_privilege` for anon/authenticated/service_role before and after, on staging.
      - Every reader (apps/api board route, market-family-trust-service, command-center board data, phase6 proof script) still works under the service-role key.
      - No production DDL is applied by this lane. Production apply remains a separate Griff authorization.

      ## Exit Criteria

      PR open as draft with migration, down script, and T1 proof; migration-reversibility-gate green.

      ## Guardrails

      No production access, no deploy, no merge. Do not edit any file outside the File Scope below.

      ## Non-Goals

      Production apply, other views, any app code change.

      ## Required Evidence

      Staging has_table_privilege snapshots (before, after, recovered, reapplied) and reader verification; blocked staging evidence is recorded honestly, never fabricated.

      ## File Scope

      - supabase/migrations/20261022090000_revoke_governed_pick_performance_anon.sql
      - db/migrations-rollback/20261022090000_revoke_governed_pick_performance_anon.down.sql
      - .ops/work/UTV2-1980.md
