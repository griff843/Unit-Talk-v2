  objective: "Participant catalog: truthful data-seed CI refusal and reversibility proof"
  acceptance_criteria:
    - |-
      PM plan approved 2026-10-10 in Codex chat. Support slice must precede [UTV2-1971](https://linear.app/unit-talk-v2/issue/UTV2-1971/ncaaf-canonical-participants-additive-2026-division-i-football-catalog) and [UTV2-1972](https://linear.app/unit-talk-v2/issue/UTV2-1972/wnba-canonical-participants-and-manual-human-submission-support). Scope ONLY .github/workflows/migration-reversibility-gate.yml; new scripts/ci/participant-catalog-seed-drill.ts and participant-catalog-seed-drill.test.ts; issue-owned lane/proof metadata. No merge approval yet.

      Acceptance criteria: route only recognized NCAAF/WNBA catalog migration basenames to meaningful disposable Postgres seed proof. Count only passing seed proof. All other migrations retain unchanged DDL refusal path/tests. No arbitrary marker/exemption/counter-only workaround/schema objects.
      Seed proof captures baseline; conflicts refuse atomically; clean apply matches frozen identities; repeat no UUID/count/data churn; existing matching canonical ID preserved; paired rollback removes only inserted IDs and refuses referenced rows; exact baseline restored; reapply stable; no writes to teams/picks/provider/delivery/event data.
      Only ephemeral or sanctioned staging DB. No production credentials or writes/deploy/Discord/delivery activation. NCAAF rollback separately approved exact path 20261010170000_ncaaf_participant_catalog.down.sql; WNBA one frozen matching down file in its later lane. Support slice does not implement catalogs.
