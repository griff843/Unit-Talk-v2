      Source: PM directive of 2026-11-07 (grading-cron reliability is a genuine
      production-readiness issue). Evidence, read-only, 2026-11-07:
      `grading.cron.heartbeat` last written 2026-11-05 11:33Z and `grading.run`
      last 2026-11-05 11:21Z (72 failed runs in the preceding window); container
      `unit-talk-grading-cron-1` still reports `healthy`; its last log line
      (2026-11-05 11:38Z) is `Failed to start system run: TypeError: fetch
      failed`.


      ## Tier rationale


      Declared T1, above the mechanical floor (T3 for every file in scope).
      `DELEGATION_POLICY.md` ("Scheduled jobs / cron / retention") classifies
      scheduled jobs as Tier C, and the change alters runtime health semantics
      and the production compose healthcheck. PM to confirm or lower.


      ## Root cause (code, `apps/api/src/grading-cron.ts`)


      `startGradingCronLoop` awaits the per-cycle bookkeeping
      (`runs.startRun`/`completeRun` heartbeat, `runs.listByType` staleness
      read) outside any try/catch. One transient network rejection leaves the
      `while (true)` loop; the top-level `.catch` logs and sets
      `process.exitCode = 1` but does not exit, so the process lives on doing
      nothing. The compose healthcheck is `pgrep -f 'grading-cron'`, which only
      proves the process exists. `restart: unless-stopped` can recover an exit,
      never a zombie.


      ## Allowed file scope


      - `apps/api/src/grading-cron.ts`, `apps/api/src/grading-cron.test.ts`

      - new `apps/api/src/grading-cron-health.ts` and its test (liveness marker
      write and freshness check; no new dependency)

      - `deploy/production/docker-compose.yml`: the `grading-cron` service
      `healthcheck` block only

      - `.ops/work/WORK-2026110704.md`, `docs/06_status/proof/WORK-2026110704/`


      ## Required Evidence (T1)


      - `pnpm type-check`, `pnpm test`, `pnpm test:db`, and an evidence bundle
      v1 tied to the merge SHA.

      - Mutation proof: reverting the try/catch makes the transient-failure test
      fail.

      - A transcript of the failure-injection tests.
