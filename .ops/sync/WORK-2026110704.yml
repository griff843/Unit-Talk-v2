  objective: >-
    Transient failures in cycle bookkeeping (heartbeat write, staleness read,
    run start) never terminate the loop. They are caught, logged, and retried
    with bounded exponential backoff.

    A permanent failure (consecutive-failure budget exhausted) is visible and
    actionable: an error log with a stable event name, an ops alert through the
    existing `onStalenessAlert` path, and a non-zero process exit so `restart:
    unless-stopped` recovers it.

    Heartbeat freshness is monitored: each successful cycle refreshes a local
    liveness marker; the container healthcheck fails when the marker is older
    than a bounded multiple of the poll interval.

    Failure-injection tests prove recovery after N transient failures and
    detection (exit, alert, stale marker) after the budget is exhausted.
  acceptance_criteria:
