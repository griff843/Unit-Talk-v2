      ## Objective


      1. Transient failures in cycle bookkeeping (heartbeat write, staleness
      read, run start) never terminate the loop. They are caught, logged, and
      retried with bounded exponential backoff.

      2. A permanent failure (consecutive-failure budget exhausted) is visible
