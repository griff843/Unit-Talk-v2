  objective: Wire hardened guild command registration into governed production promotion
  acceptance_criteria:
    - Production promote runs already-merged
      apps/discord-bot/scripts/deploy-commands.ts from the actual promoted bot
      container after health/containment checks; verifies release tag and image
      identity before registering.
    - Canary and global Discord command registration are never invoked. Existing
      guild-only application-identity validation, full replacement, safe error
      reporting and manifest read-back remain authoritative.
    - Registration failure propagates and blocks successful promotion/smoke
      acceptance; no credentials or raw REST errors logged.
    - Focused node:test executes real extracted remote shell against fake
      docker, covering success, registry failure, stale release/image refusal
      and production-only placement. New test wired into required package
      verification without removing existing tests.
    - Focused tests, type-check/lint/static verification, pnpm verify,
      applicable R-level, T1 staging test:db, normal lane/scope/receipt/proof
      gates. Named proof docs/06_status/proof/<this issue>/verification.md;
      genuine admitted executor/model provenance.
    - Return exact-head T1 PR for independent PM review. Record
      [griff843/Unit-Talk-v2#1705](https://linear.app/unit-talk-v2/review/fixdiscord-utv2-1963-register-guild-commands-during-production-376b01712d5e)/[UTV2-1963](https://linear.app/unit-talk-v2/issue/UTV2-1963/register-authoritative-discord-guild-commands-in-governed-production)
      predecessor provenance and supersede through sanctioned path once
      replacement is safely captured.
