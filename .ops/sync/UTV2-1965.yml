    title: Wire hardened guild command registration into governed production promotion
    description: |-
      PM-authorized second split of PR [griff843/Unit-Talk-v2#1705](https://linear.app/unit-talk-v2/review/fixdiscord-utv2-1963-register-guild-commands-during-production-376b01712d5e), after [UTV2-1964](https://linear.app/unit-talk-v2/issue/UTV2-1964/harden-guild-only-discord-command-registration-before-governed-deploy)/#1706 merged at 35f9db79e85f5f67692b5ffb29ad471408c7361d and its ownership is released. T1 mechanical risk floor from deploy.yml. Clean runtime lane on current main; preserve predecessor accepted deployment behavior from commit 2c56becfe8ff1be9dfbc2313c78d637962522bda, reconcile current workflow instead of overwriting it.

      ## Scope

      * .github/workflows/deploy.yml
      * package.json (root; append focused tests to existing verification scripts)
      * scripts/ci/deploy-discord-commands.test.ts
      * Only canonical lane/proof/sync artifacts required for this issue.

      ## Acceptance Criteria

      * Production promote runs already-merged apps/discord-bot/scripts/deploy-commands.ts from the actual promoted bot container after health/containment checks; verifies release tag and image identity before registering.
      * Canary and global Discord command registration are never invoked. Existing guild-only application-identity validation, full replacement, safe error reporting and manifest read-back remain authoritative.
      * Registration failure propagates and blocks successful promotion/smoke acceptance; no credentials or raw REST errors logged.
      * Focused node:test executes real extracted remote shell against fake docker, covering success, registry failure, stale release/image refusal and production-only placement. New test wired into required package verification without removing existing tests.
      * Focused tests, type-check/lint/static verification, pnpm verify, applicable R-level, T1 staging test:db, normal lane/scope/receipt/proof gates. Named proof docs/06_status/proof/<this issue>/verification.md; genuine admitted executor/model provenance.
      * Return exact-head T1 PR for independent PM review. Record [fix(discord): UTV2-1963 register guild commands during production promotion](https://linear.app/unit-talk-v2/review/fixdiscord-utv2-1963-register-guild-commands-during-production-376b01712d5e)/[UTV2-1963](https://linear.app/unit-talk-v2/issue/UTV2-1963/register-authoritative-discord-guild-commands-in-governed-production) predecessor provenance and supersede through sanctioned path once replacement is safely captured.
      * Address review discussion_r4166300610 within the existing workflow/test scope: require a valid production DISCORD_GUILD_ID in early preflight before activation, refuse missing/invalid guild configuration before any production mutation, and extend executable focused coverage for those refusal paths. Preserve guild-only registration and delivery containment.

      ## Boundaries

      No bot source changes, lane-policy changes, production deployment or command registration, role changes, delivery activation, watched pick, Whop/Stripe, SGO, Black Label, system picks or unrelated scope. Delivery containment remains untouched. Actual production deployment/registry acceptance require separate authorization.

      ## Where to look

      * Current main .github/workflows/deploy.yml production promote job and downstream smoke dependency; registration must follow existing production health/containment confirmation and precede image cleanup.
      * Already merged apps/discord-bot/scripts/deploy-commands.ts and deploy-commands.test.ts: consume this guild-only mechanism without modifying bot files.
      * Root package.json test:ops and test:apps-rest; append focused test wiring, retain all existing tests.
      * Predecessor [griff843/Unit-Talk-v2#1705](https://linear.app/unit-talk-v2/review/fixdiscord-utv2-1963-register-guild-commands-during-production-376b01712d5e) accepted implementation commit 2c56becfe8ff1be9dfbc2313c78d637962522bda, reconcile deployment/test changes on current main. [UTV2-1964](https://linear.app/unit-talk-v2/issue/UTV2-1964/harden-guild-only-discord-command-registration-before-governed-deploy) merge 35f9db79e85f5f67692b5ffb29ad471408c7361d plus trusted terminal closeout 5051245de0b4d92d59caffbe464fb09b419ab120 are provenance.

      ## Checkpoint recovery facts

      The genuine admitted CLI rework implemented review correction at f8fa8d4b49da78e8ca801390aa785c8c85410d50. Focused tests passed 5/5, combined deployment tests 39/39, pnpm verify:static passed 3569/3569, and pnpm verify ran with only the expected local staging-target refusal. Hosted CI run 37019165731 passed writable staging DB proof and dependent verify/receipt validation on that implementation. Proof-only commit c446cf44f5e0f4d0b76f426c32458b3eb73dbb29 records this evidence. The executor watchdog timed out during its final metadata-only CI wait before recording phase checkpoints. On resume, recover completed orientation/plan/implementation/verification from the actual transcript .out/discord-wave1/[UTV2-1965](https://linear.app/unit-talk-v2/issue/UTV2-1965/wire-hardened-guild-command-registration-into-governed-production)-cli-review-rework.log in the main checkout and the measured CI receipt; record truthful canonical checkpoint summaries rather than repeat completed tests or change source. Finish closeout, exact-head verification handoff and truthful executor receipt. Do not claim final metadata-head CI green until measured. No production changes are authorized.

      ## Definition of done

      * Exact three substantive files implement mandatory production-only promoted-image registration; meaningful shell failure-path tests and executable wiring pass.
      * Required verification and T1 staging DB CI proof pass; exact-head proof and truthful admitted executor/model receipt are posted.
      * A clean T1 PR, normal lane/scope checks and predecessor provenance are ready for independent PM review; no self-approval or production mutation.
      * Production deployment, registry acceptance, persona retest and watched delivery remain outside this PR execution and require their separately reserved authorization.

      ## Bounded review correction

      GitHub review on PR [griff843/Unit-Talk-v2#1707](https://linear.app/unit-talk-v2/review/featops-utv2-1965-wire-hardened-guild-command-registration-into-d1396db03e01), discussion_r4166300610, identified a valid P2 within the existing deployment workflow scope: DISCORD_GUILD_ID is not required by the early secret inventory/preflight, and the current fallback writes 0. The new mandatory registrar can therefore fail after production activation. Require a valid configured production guild ID before activation; retain the same guild-only registration, exact promoted image checks, safe errors and containment. Extend scripts/ci/deploy-discord-commands.test.ts to exercise missing/invalid guild preflight refusal before activation. Reverify and return a fresh exact-head T1 review packet. This changes no scope or production authorization.
