      Named lane proof only: measured before/after reproductions of both
      defects, focused regression output,

      exact-head CI and protected staging receipts, the self-closure result on
      merge, and then the trusted

      closeout of WORK-2026100801 with full truth-check PASS. Proof binding rows
      use the pre-merge contract

      (`Merge SHA: pending merge`, no trailing markup). If a genuinely necessary
      file falls outside this scope,

      stop before editing it and report the concrete requirement.
