    - "Preserved unchanged: GitHub-backed PR identity, authoritative merge SHA,
      merge-SHA reachability and"
    - ownership, push/PR merge-SHA divergence refusal (cross-merge replay),
      immutable model-routing `closeout_binding`, merge mutex, branch
