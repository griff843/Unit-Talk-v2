      Repo-owned work order (tracker independence, ratified 2026-09-05).


      Griff's PM canary decision (2026-10-30) approved one private human-capper
      delivery-to-recap canary as the next bounded product acceptance objective.
      He asked for "a narrow canonical intent amendment permitting exactly one
      controlled, private E2E canary while preserving Track Only as the default
      and keeping broad member delivery disabled."


      `docs/mission/intent.md` is Griff-owned, so this PR merges only with
      Griff's pm-verdict/v1 APPROVED. The amendment grants nothing by itself:
      every production mutation still waits for his explicit authorization of
      the final canary packet.


      ## Change


      Add a subsection to `docs/mission/intent.md` § "Current intent", after
      item 8, recording the bounded exception:

      - exactly one canary;

      - private, staff-only audience;

      - Track Only stays the default;

      - broad member delivery stays disabled and reserved;

      - every mutation is gated on a separately authorized packet;

      - the canary is excluded from member reads;

      - what does **not** change.


      ## File Scope


      - docs/mission/intent.md
