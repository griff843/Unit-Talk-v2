      the distribution mode

      Tier: T1

      Lane type: runtime

      Executor: codex-cli


      Repo-owned work order (tracker independence, ratified 2026-09-05).
      Admitted by Production Claude on 2026-11-03 under Griff's PM product
      decision of that date:


      - "Different authenticated cappers submitting the same wager must receive
      separate canonical picks."

      - "Same-capper retries of the same wager and same distribution mode should
      deduplicate."

      - "Same capper submitting Track Only and then explicitly delivery-eligible
      should create separate, immutable records. Never silently promote a Track
      Only pick."

      - "Preserve existing records and historical keys; verify impacts on
      grading, performance, outbox and authorization."

      - "Admit a bounded T1 runtime fix when singleton ownership allows."


      ## Defect (measured at main ba359b36b)


      1. `computeSubmissionIdempotencyKey`
      (`apps/api/src/submission-service.ts:83`) hashes `source | market |
      selection | line | odds | eventName` only. It has no submitter and no
      distribution mode.

      2. `processSubmission` (`:149-195`) looks up `findPickByIdempotencyKey`.
      On a match it returns the existing row as an idempotent success
      (`duplicate: true`) and creates no rows. A second capper's identical wager
      is therefore answered with the first capper's pick, and the second
      capper's pick is never recorded. Found on staging by WORK-2026110305 CI
      run 41671267309.

      3. A capper who submits Track Only and then the same wager
      delivery-eligible hits the same key. `submit-pick-controller.ts` then
      refuses with 409 `TRACK_ONLY_CONFLICT` or
      `DELIVERY_AUTHORIZATION_CONFLICT` (the UTV2-1672 and UTV2-1923 integrity
      guards). That refusal is safe: nothing is promoted. But the explicit
      delivery-eligible submission is never recorded either.

      4. The canonical capper attribution is `picks.capper_id`. It is derived
      from `metadata.capper ?? metadata.submittedBy ?? payload.submittedBy`
      (`packages/db/src/pick-foreign-keys.ts:46-56`). The distribution mode is
      `metadata.distributionMode` (`'track-only' | 'delivery-eligible'`,
      `packages/contracts/src/smart-form.ts`).


      ## Sequencing


      Lane start waits until `package.json` is free: WORK-2026110305 (#1826)
      holds it until it merges. This lane and WORK-2026110302 both touch
      `apps/api/src/submission-service.ts`, so they run one after the other.
      This lane goes first.
