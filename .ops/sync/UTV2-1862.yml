  unmapped_sections:
    - >-
      (description preamble)

      Reconcile `docs/mission/plan.md` against measurements taken 2026-09-09
      that change Milestone 2's stated position in three ways.


      1. **The grading population contains no real pick and never has.** Of the
      5,151 unsettled `posted` picks with a line, 5,147 are `nba-spread` (an
      unsupported market family) and the remaining 2 are `db-smoke-*` fixtures.
      So the settlement drought since 2026-07-30 is not evidence grading is
      broken, and 13,720 succeeded `grading.run` rows are not evidence it works.

      2. **Containment is binary, so "unpark the ingestor" is not an available
      action.** `deploy.yml:440-483` admits only `active|parked`; `active` also
      starts the outbox worker and releases `UNIT_TALK_ENABLED_TARGETS` from the
      forced `none` to `best-bets`. The readiness assertion that delivery is off
      runs *only* in parked mode (`:1475-1480`).

      3. **A results supply does not require an unpark.** `events` and
      `game_results` each have exactly one repository writer, both ingestor-only
      — but several operator CLI scripts reach them in-process without the
      daemon. The remaining dependency is the provider key (403 Inactive for
      tooling; the production secret is unreadable), not containment.


      Together these replace the plan's open question ("does settlement need
      provider ingestion unparked?") with a measured answer, and replace the
      implied reserved request (decision 6, containment) with a smaller and more
      honest pair (decision 4 key confirmation, then a bounded governed write
      under `DB_ENVIRONMENT_OPERATOR_POLICY.md`).
    - |-
      File scope
      * `docs/mission/plan.md`
