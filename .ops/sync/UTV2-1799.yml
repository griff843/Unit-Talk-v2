  objective: >-
    `provider_offers.updated_at` does not exist. Two live operator paths query
    it and throw on every invocation against real Supabase. Repoint both at
    `provider_offer_current`, and replace the single-file regression regex with
    a repo-wide guard.

    `scripts/ops/ingestor-health-check.ts:117-127` —
    `readLatestProviderOfferUpdatedAt()`: change `.from('provider_offers')` to
    `.from('provider_offer_current')`. Live via `pnpm ingestor:health-check`
    (`package.json:192`), called from `collectIngestorHealthCheck()` (line 195)
    inside `main()` (line 211).

    `scripts/ingestor-supervisor.ts:382-395` — `readDatabaseStatus()` carries
    its **own independent copy** of the same bad query. Same fix. Live via `pnpm
    ingestor:start/stop/restart` (`package.json:29,32,34`).

    Verified column truth (`packages/db/src/database.types.ts:3809-3826`):
    `provider_offers` Row is `bookmaker_key, created_at, devig_mode, id,
    idempotency_key, is_closing, is_opening, line, over_odds, provider_event_id,
    provider_key, provider_market_key, provider_participant_id, snapshot_at,
    sport_key, under_odds` — no `updated_at`.
    `provider_offer_current.updated_at` is non-null.
    `scripts/runtime-health.ts:196-215` and
    `scripts/stage-freshness-checks.ts:153` already use the correct table;
    follow their pattern.
  acceptance_criteria:
    - "`pnpm ingestor:health-check` returns valid JSON with a non-null
