      two sites.
    - "**Inversion (required):** revert either call site to `provider_offers`
      and demonstrate the guard test goes red. A guard that is merely present
      and green proves nothing."
  guardrails:
    - Production stays parked. Read-only `SELECT` against staging only. No SGO
      call, no ingestion restart, no delivery unpark, no production mutation, no
      secret access.
