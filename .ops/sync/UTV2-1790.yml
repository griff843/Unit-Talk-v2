  objective: ops-merge-wrapper git-merge-main executes --ff-only and cannot
    perform the history-preserving merge it recommends
  acceptance_criteria:
    - "`git-merge-main` performs a history-preserving merge that **succeeds on a
      genuinely diverged test repository** — a fixture with real divergent
      commits on both sides, not a mocked runner."
    - "Negative control: a conflicting diverged repository still fails, with an
      actionable message and the mutex released."
