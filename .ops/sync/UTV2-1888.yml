      only `{picksGraded, failed}` and discards the per-pick `outcome:
      'skipped'` + `reason` it already computes. A pass that examined 22,290
      picks and graded none is byte-identical to one that examined zero.


      So the only way to answer "why has my pick not settled" today is ad hoc
