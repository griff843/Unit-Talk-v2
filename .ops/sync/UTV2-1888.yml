      It does not duplicate `classifyMarketFamilyForGrading` or `TRUSTED_GRADING_EVENT_PROVIDERS`. Those are not exported and `apps/api/src/grading-service.ts` is currently inside another lane's `file_scope_lock`. Duplicating them here would create exactly the two-copies-of-one-rule defect [UTV2-1688](https://linear.app/unit-talk-v2/issue/UTV2-1688/executor-result-validator-rejects-the-bootstrap-branch-namespace) and [UTV2-1856](https://linear.app/unit-talk-v2/issue/UTV2-1856/event-browse-resolves-participant-identity-from-the-empty-canonical) are both recorded instances of. When the grading trust gate is next edited, the predicate is exported and this report imports it; recorded here so the follow-up is not rediscovered.
