      # WORK-2026101202 — Record the merge bindings of UTV2-1971 (#1730) and
      WORK-2026101201 (#1742)


      Tier: T3

      Lane type: governance

      Executor: claude


      Repo-owned work order (tracker independence, ratified 2026-09-05). No
      Linear issue exists for this identity by design. Same shape as the prior
      record-merge repair lane (WORK-2026101105).


      ## Objective


      - Land the manifest mutations computed by `pnpm ops:lane-manifest
      record-merge UTV2-1971 --pr 1730` (GitHub merge commit
      `b8650081606c7a07a432854bd898a93b3ffb4ddb`) and `pnpm ops:lane-manifest
      record-merge WORK-2026101201 --pr 1742` (merge commit
      `cdbd8d654b4b96b595d6a4480cefaf1ba53ecd17`). Each sets `commit_sha` and
      `status: merged`.


      ## Why


      - UTV2-1971 sits at `parked` on `main`, which `post-merge-lane-close.yml`
      treats as not closeable, so its auto-close skipped.

      - WORK-2026101201 carries `commit_sha: null` and `in_review`, so its
      closeout hard-gate failed.


      ## Acceptance Criteria


      - Both manifests on `main` carry their PR url, GitHub merge commit and
      `status: merged`.

      - Neither lane is closed by this PR. Closing goes through
      `post-merge-lane-close.yml` dispatch and a passing `ops:truth-check`.


      ## Guardrails


      - No product code, no proof content, no migration change. No weakening of
      closeout, truth-check or merge controls. No direct-main write.


      ## File Scope


      - .ops/work/WORK-2026101202.md

      - docs/06_status/lanes/UTV2-1971.json

      - docs/06_status/lanes/WORK-2026101201.json


      ## Exit Criteria


      - PR merged on green CI. Then both lanes are closed through
      `post-merge-lane-close.yml` and their leases released.
