      # WORK-2026111101 — PROVIDER_AUTHORITY_LOCK Amendment A1 (game-score evaluation, engineering and staging only)

      Tier: T2 · Lane type: governance · Executor: claude

      Repo-owned work order (tracker independence, ratified 2026-09-05). No Linear issue exists for this identity by design.

      ## Authority

      - Griff ratified Amendment A1 as written on 2026-11-11 ("Approve D2 and D3", where D2 = "Ratify PROVIDER_AUTHORITY_LOCK Amendment A1 ... engineering and staging only?"). This is the reserved paid-provider / provider-authority decision.
      - PM recommendation, 2026-11-11: ratify "strictly for final-game-score engineering and staging use. ... No purchase, production key, production ingestion or deployment is authorized."
      - Content source: `.out/consolidation/provider-authority-lock-odds-api-amendment-draft-2026-11-10.md` (prepared 2026-11-10 under the PM directive of that date).

      ## Objective

      Land Amendment A1 through the Provider Change Protocol in `docs/05_operations/PROVIDER_AUTHORITY_LOCK.md`: the amendment block, the wording edits to the existing lock text, the two companion documents the protocol names, and one narrowly matched audit allow-list entry so the planned A1 game-score CLI is not classified as drift.

      ## Acceptance Criteria

      - The A1 block is inserted directly after "Canonical Authority Statement", with "Ratified: 2026-11-11 by Griff". Every SGO row and the SGO integration reference are unchanged.
      - The wording edits from draft section 2 are applied to the canonical statement, its explanatory paragraph, the Fail-Closed Rule and "What Constitutes Stale Drift".
      - `docs/06_status/PROGRAM_STATUS.md` carries the Provider row from draft section 3.1.
      - `docs/05_operations/PROVIDER_DATA_DECISION_RECORD.md` carries a dated decision entry with Griff's ratification, the PM recommendation, the rationale and the cost envelope from the draft.
      - `scripts/audit-provider-scope.ts` gains exactly one `ALLOWED_HISTORICAL_PATTERNS` entry, matched narrowly to A1 files (`/odds-api-scores/`). No other code changes.
      - `tsx scripts/audit-provider-scope.ts` exits 0 on the branch.
      - Nothing here authorizes a purchase, subscription, API key, production key, ingestion, scheduler, workflow, deployment or production action.

      ## File scope

      - `docs/05_operations/PROVIDER_AUTHORITY_LOCK.md`
      - `docs/05_operations/PROVIDER_DATA_DECISION_RECORD.md`
      - `docs/06_status/PROGRAM_STATUS.md`
      - `scripts/audit-provider-scope.ts`
      - `.ops/work/WORK-2026111101.md`

      ## Exit Criteria

      - PR open with exact-head CI green and an `executor-result/v1` comment. Merge is not part of this lane's executor scope.
