# .codex/config.toml — Unit Talk V2
# Codex CLI project configuration.
# See: https://developers.openai.com/codex/config-reference

# Keep project instructions and tool transcripts bounded. Task-specific skills and
# targeted reads can still load deeper context when a lane actually needs it.
project_doc_max_bytes = 32_768
tool_output_token_limit = 6_000

# Current Codex config keys. Headless lane execution overrides the sandbox explicitly.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false

[skills]
max_context_tokens = 4_000

# Automated Unit Talk lanes use shell and the explicitly configured MCP servers.
# Keep unrelated discoverable connector catalogs out of their default context.
[apps._default]
enabled = false
